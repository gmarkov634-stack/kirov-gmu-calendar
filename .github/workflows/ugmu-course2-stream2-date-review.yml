name: UGMU course2 stream2 date review

on:
  pull_request:
    paths:
      - "api/tools/ugmu-course2-stream2-*.py"
      - "api/tools/requirements-ugmu.txt"
      - "api/src/adapters/ugmu/**"
      - ".github/workflows/ugmu-course2-stream2-date-review.yml"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install PDF parser dependency
        run: python3 -m pip install -r tools/requirements-ugmu.txt

      - name: Discover official UGMU medicine sources
        run: node tools/ugmu-discover.mjs --program=medicine --output=data/imports/course2-source-manifest.json

      - name: Download official autumn PDFs
        run: node tools/ugmu-download.mjs --manifest=data/imports/course2-source-manifest.json --semester=autumn --output=data/imports/course2-pdfs

      - name: Extract, reconcile and expand only course2 stream II
        run: |
          set -euo pipefail
          report='data/imports/course2-pdfs/download-report.json'
          item="$(jq -c '.files[] | select(.status == "downloaded" and .course == 2 and .stream == "2" and .part == "combined")' "$report" | head -n 1)"
          test -n "$item"
          filename="$(jq -r '.filename' <<<"$item")"
          source_url="$(jq -r '.url' <<<"$item")"
          sha="$(jq -r '.sha256' <<<"$item")"
          test "$sha" = '07675a77bdb80080ea018a73750f00f458cc100fcd01a63ecaf142430bca94bd'
          python3 tools/ugmu-course2-stream2-raw.py \
            --input="data/imports/course2-pdfs/$filename" \
            --source="$source_url" \
            --output=data/imports/course2-stream2/raw.json
          python3 tools/ugmu-course2-stream2-semantic.py \
            --raw=data/imports/course2-stream2/raw.json \
            --pdf="data/imports/course2-pdfs/$filename" \
            --output=data/imports/course2-stream2/semantic.json
          python3 tools/ugmu-course2-stream2-expand.py \
            --semantic=data/imports/course2-stream2/semantic.json \
            --output=data/imports/course2-stream2/dated-review.json
          jq -e '
            .mode == "dated-events-review-only" and
            .course == 2 and .stream == 2 and
            .summary.groupCount == 12 and
            .summary.semanticPatternCount == 206 and
            .summary.eventCount == 2779 and
            .summary.duplicateCount == 0 and
            .summary.invalidIntervalCount == 0 and
            .summary.overlapCount == 32 and
            .summary.approvedSourceOverlapCount == 32 and
            .summary.unresolvedOverlapCount == 0 and
            .summary.reviewRequired == false and
            .review.approvedSourceOverlapPolicy.sourceSha256 == "07675a77bdb80080ea018a73750f00f458cc100fcd01a63ecaf142430bca94bd" and
            .review.approvedSourceOverlapPolicy.expectedOverlapCount == 32 and
            .review.approvedSourceOverlapPolicy.newSourceShaRequiresReview == true and
            .summary.canonicalizationPerformed == false and
            .summary.storageWritesPerformed == false and
            .summary.icsGenerated == false and
            .summary.publicationAllowed == false
          ' data/imports/course2-stream2/dated-review.json >/dev/null
          jq '{source, effectivePeriod, weekAnchors, summary, approvedOverlapPolicy:.review.approvedSourceOverlapPolicy, approvedOverlaps:.review.approvedSourceOverlaps[:6], unresolvedOverlaps:.review.unresolvedOverlaps}' data/imports/course2-stream2/dated-review.json

      - name: Upload read-only date review evidence
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-course2-stream2-date-review
          path: api/data/imports/course2-stream2/
          retention-days: 14
