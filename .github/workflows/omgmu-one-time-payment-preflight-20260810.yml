name: One-time preflight ОмГМУ payment endpoint safely

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/omgmu-one-time-payment-preflight-20260810.yml"

permissions:
  contents: write

jobs:
  preflight:
    if: github.event.head_commit.message == 'Preflight ОмГМУ payment endpoint safely'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run no-payment preflight
        env:
          REPORT_PATH: ops/reports/omgmu-payment-preflight-20260810.json
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          api = 'https://kgmu-calendar-api.containerapps.ru'
          origin = 'https://gmarkov634-stack.github.io'
          config_url = f'{origin}/kirov-gmu-calendar/omgmu/config.js'
          errors = []

          def request(url, method='GET', body=None, headers=None):
              data = None if body is None else json.dumps(body).encode('utf-8')
              request = urllib.request.Request(url, data=data, method=method, headers=headers or {})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, dict(response.headers.items()), response.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as error:
                  return error.code, dict(error.headers.items()), error.read().decode('utf-8', errors='replace')

          config_status = 0
          config_body = ''
          for attempt in range(20):
              config_status, _, config_body = request(config_url, headers={'User-Agent': 'omgmu-preflight/1.0'})
              if (
                  config_status == 200
                  and 'https://kgmu-calendar-api.containerapps.ru' in config_body
                  and re.search(r'checkoutEnabled\s*:\s*false', config_body)
              ):
                  break
              time.sleep(15)
          if config_status != 200:
              errors.append(f'live config returned HTTP {config_status}')
          if 'https://kgmu-calendar-api.containerapps.ru' not in config_body:
              errors.append('live config does not contain Cloud.ru API URL')
          checkout_disabled = bool(re.search(r'checkoutEnabled\s*:\s*false', config_body))
          if not checkout_disabled:
              errors.append('checkout is not disabled during preflight')

          options_status, options_headers, options_body = request(
              f'{api}/api/v2/payments',
              method='OPTIONS',
              headers={
                  'Origin': origin,
                  'Access-Control-Request-Method': 'POST',
                  'Access-Control-Request-Headers': 'content-type',
                  'User-Agent': 'omgmu-preflight/1.0',
              },
          )
          allow_origin = options_headers.get('Access-Control-Allow-Origin') or options_headers.get('access-control-allow-origin')
          if options_status != 204:
              errors.append(f'CORS preflight returned HTTP {options_status}')
          if allow_origin != origin:
              errors.append(f'CORS allow-origin is {allow_origin!r}')

          payload = {
              'email': 'invalid-email-by-design',
              'university': 'omgmu',
              'program': 'medicine-international',
              'course': 1,
              'stream': '1',
              'groupCode': '1101',
              'groupId': 'omgmu:medicine-international:1:stream-1:1101',
              'timezone': 'Asia/Omsk',
          }
          post_status, post_headers, post_body = request(
              f'{api}/api/v2/payments',
              method='POST',
              body=payload,
              headers={
                  'Content-Type': 'application/json',
                  'Origin': origin,
                  'User-Agent': 'omgmu-preflight/1.0',
              },
          )
          try:
              post_json = json.loads(post_body)
          except Exception:
              post_json = {}
          payment_configured = post_status == 400 and post_json.get('error') == 'invalid_checkout'
          payment_created = post_status == 201 or bool(post_json.get('confirmationUrl'))
          if payment_created:
              errors.append('unexpected payment creation during invalid-email preflight')
          if not payment_configured:
              errors.append(f'payment service preflight returned HTTP {post_status}: {post_json or post_body[:200]}')

          report = {
              'version': 1,
              'university': 'omgmu',
              'operation': 'payment-preflight-without-payment-creation',
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'liveConfig': {
                  'httpStatus': config_status,
                  'apiConfigured': 'https://kgmu-calendar-api.containerapps.ru' in config_body,
                  'checkoutDisabled': checkout_disabled,
                  'bodyPreview': config_body[:500],
              },
              'cors': {
                  'httpStatus': options_status,
                  'allowOrigin': allow_origin,
              },
              'paymentEndpoint': {
                  'httpStatus': post_status,
                  'response': post_json or post_body[:500],
                  'paymentConfigured': payment_configured,
                  'paymentCreated': payment_created,
                  'testEmailWasIntentionallyInvalid': True,
              },
              'errors': errors,
              'validationStatus': 'success' if not errors else 'failure',
          }
          output = Path(os.environ['REPORT_PATH'])
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False))
          if errors:
              raise SystemExit(2)
          PY

      - name: Record preflight result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p ops/reports
          if [ ! -f ops/reports/omgmu-payment-preflight-20260810.json ]; then
            printf '{"version":1,"university":"omgmu","operation":"payment-preflight-without-payment-creation","validationStatus":"failure","errors":["preflight report was not generated"]}\n' > ops/reports/omgmu-payment-preflight-20260810.json
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('ops/reports/omgmu-payment-preflight-20260810.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['jobStatus'] = os.environ['JOB_STATUS']
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/reports/omgmu-payment-preflight-20260810.json
          git commit -m "Record ОмГМУ payment preflight result" || true
          git push
