name: Build dentistry 591-594 normalized draft

on:
  workflow_dispatch:
  push:
    branches:
      - feat/dentistry-591-594-2026-27-s1
    paths:
      - 'fixtures/tools/build_dentistry_591_594_candidate.py'
      - 'fixtures/tools/finalize_dentistry_591_594_draft.py'
      - 'fixtures/2026-2027-semester-1/dentistry-591-594.source.json'
      - 'fixtures/2026-2027-semester-1/dentistry-591-594.parsing-job.json'
      - 'fixtures/2026-2027-semester-1/dentistry-591-594.source-probe.json'
      - 'catalog/2026-2027-semester-1.json'
      - 'test/dentistry-591-594-normalized.test.js'
      - '.github/workflows/build-dentistry-591-594-draft.yml'

permissions:
  contents: write

jobs:
  build-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dentistry-591-594-2026-27-s1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install XLSX parser dependency
        run: python -m pip install 'openpyxl==3.1.5'
      - name: Build deterministic normalized draft and QA evidence
        run: python fixtures/tools/finalize_dentistry_591_594_draft.py
      - name: Commit deterministic evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            fixtures/2026-2027-semester-1/normalized/dentistry-591-594.normalized.compact.json \
            fixtures/2026-2027-semester-1/dentistry-591-594.source-artifact.json \
            qa/2026-2027-semester-1/dentistry-591-594.parsing-result.json \
            qa/2026-2027-semester-1/dentistry-591-594.normalized-draft.json \
            qa/2026-2027-semester-1/dentistry-591-594.semantic-review.json \
            qa/2026-2027-semester-1/dentistry-591-594.qa-report.json
          if git diff --cached --quiet; then
            echo 'draft/QA evidence unchanged'
            exit 0
          fi
          git commit -m 'Record dentistry 591-594 normalized draft QA'
          git push origin HEAD:feat/dentistry-591-594-2026-27-s1
