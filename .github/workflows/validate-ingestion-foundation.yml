name: Validate KGMU ingestion foundation

on:
  push:
    branches:
      - kgmu-ingestion-fixture-foundation

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
