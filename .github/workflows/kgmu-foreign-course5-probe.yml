name: KGMU foreign course 5 probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'api/tools/kgmu-probe-foreign-c-course5.mjs'
      - 'api/tools/kgmu-probe-foreign-c-course5-ru.mjs'
      - 'api/src/adapters/kgmu/**'
      - '.github/workflows/kgmu-foreign-course5-probe.yml'

permissions:
  contents: read

jobs:
  probe-russian:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect official Russian 5 course FIO XLSX
        run: node api/tools/kgmu-probe-foreign-c-course5-ru.mjs

  probe-english:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe official English 5 course FIO XLSX
        run: node api/tools/kgmu-probe-foreign-c-course5.mjs
