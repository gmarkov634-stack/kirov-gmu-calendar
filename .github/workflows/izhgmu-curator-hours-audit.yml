name: IzhGMU curator-hours source audit

on:
  push:
    branches:
      - agent/izhgmu-batch-acquisition
    paths:
      - ".github/workflows/izhgmu-curator-hours-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF inspection tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Fetch exact official curator-hours PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/izhgmu-curator
          url='https://www.igma.ru/images/avtors/ovr/%D0%9A%D1%83%D1%80%D0%B0%D1%82.%D1%87%D0%B0%D1%81%D1%8B_%D0%B2%D0%B5%D1%81%D0%BD%D0%B0_2026.pdf'
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors "$url" -o /tmp/izhgmu-curator/curator-hours-spring-2026.pdf
          test "$(head -c 5 /tmp/izhgmu-curator/curator-hours-spring-2026.pdf)" = '%PDF-'
          sha256sum /tmp/izhgmu-curator/curator-hours-spring-2026.pdf | tee /tmp/izhgmu-curator/sha256.txt
          pdfinfo /tmp/izhgmu-curator/curator-hours-spring-2026.pdf | tee /tmp/izhgmu-curator/pdfinfo.txt
      - name: Extract layout-preserving text
        shell: bash
        run: |
          set -euo pipefail
          pdftotext -layout -enc UTF-8 /tmp/izhgmu-curator/curator-hours-spring-2026.pdf /tmp/izhgmu-curator/curator-hours-spring-2026.txt
          test -s /tmp/izhgmu-curator/curator-hours-spring-2026.txt
          echo '=== FULL EXTRACT ==='
          cat /tmp/izhgmu-curator/curator-hours-spring-2026.txt
          echo '=== GROUP 101-130 LINES ==='
          grep -nE '(^|[^0-9])(10[1-9]|11[0-9]|12[0-9]|130)([^0-9]|$)' /tmp/izhgmu-curator/curator-hours-spring-2026.txt || true
          echo '=== TIME-LIKE LINES ==='
          grep -nE '([01]?[0-9]|2[0-3])[.:][0-5][0-9]' /tmp/izhgmu-curator/curator-hours-spring-2026.txt || true
          echo '=== EXPLICIT TIME INTERVALS ==='
          intervals="$(grep -Eo '([01]?[0-9]|2[0-3])[.:][0-5][0-9][[:space:]]*[-–][[:space:]]*([01]?[0-9]|2[0-3])[.:][0-5][0-9]' /tmp/izhgmu-curator/curator-hours-spring-2026.txt || true)"
          if [ -n "$intervals" ]; then printf '%s\n' "$intervals"; else echo 'NONE'; fi
      - name: Upload exact source and extraction
        uses: actions/upload-artifact@v4
        with:
          name: izhgmu-curator-hours-spring-2026
          path: /tmp/izhgmu-curator
          if-no-files-found: error
          retention-days: 14
