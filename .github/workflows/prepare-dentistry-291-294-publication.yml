name: Prepare Dentistry course 2 publication gate

on:
  push:
    branches:
      - feat/dentistry-291-294-2026-27-s1
    paths:
      - '.github/workflows/prepare-dentistry-291-294-publication.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Generate pinned publication evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { digestNormalizedEvents } from './src/explicit-decisions.js';
          const source = JSON.parse(await readFile('fixtures/2026-2027-semester-1/dentistry-291-294.source.json', 'utf8'));
          const draft = JSON.parse(await readFile('qa/2026-2027-semester-1/dentistry-291-294.normalized-draft.json', 'utf8'));
          const qa = JSON.parse(await readFile('qa/2026-2027-semester-1/dentistry-291-294.qa-report.json', 'utf8'));
          if (qa.decision !== 'pass' || draft.status !== 'PASS') throw new Error('Dentistry course 2 candidate is not QA PASS');
          if (draft.candidateDigest !== qa.candidateDigest) throw new Error('candidate digest mismatch');
          if (draft.events.length !== 1066) throw new Error(`unexpected event count ${draft.events.length}`);
          if (draft.events.some((event) => event.facultativeId != null)) throw new Error('unexpected facultative event in Dentistry course 2 candidate');
          const expected = { '291': 265, '292': 266, '293': 266, '294': 269 };
          const actual = Object.fromEntries(source.expectedGroupIds.map((groupId) => [groupId, draft.events.filter((event) => event.groupId === groupId).length]));
          if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`group count mismatch ${JSON.stringify(actual)}`);
          const evidence = {
            schema: 'kgmu-dentistry-publication-evidence-v1',
            sourceSha256: source.source.sha256,
            candidateDigest: draft.candidateDigest,
            eventSetDigest: digestNormalizedEvents(draft.events),
            eventCount: draft.events.length,
            groupEventCounts: actual,
            groupDefaultVisibleEventCounts: actual,
            groupFacultativeEventCounts: Object.fromEntries(source.expectedGroupIds.map((groupId) => [groupId, 0])),
            facultativeIds: [],
            sharedContractEvidence: {
              repository: 'gmarkov634-stack/medical-calendar-core',
              commit: 'e5414c1d8b8754f8e47397f24d7aeb5d413431ec',
              productionRuntimeCommit: 'e5414c1d8b8754f8e47397f24d7aeb5d413431ec',
              normalizedEventSchemaBlob: '027699254f920e30822ca26214ddc0746c258c3c',
              icsRendererBlob: 'b75aea9bd6b54fab9ae454c1f7fedcf233d8ea96'
            },
            createdAt: '2026-09-03T09:57:00Z'
          };
          await writeFile('qa/2026-2027-semester-1/dentistry-291-294.publication-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
          console.log(JSON.stringify(evidence, null, 2));
          NODE
      - name: Adapt guarded course-1 publisher and regression test
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          pub = Path('ops/publish-dentistry-191-194.mjs').read_text()
          replacements = [
              ('dentistry-191-194', 'dentistry-291-294'),
              ('Dentistry course-1', 'Dentistry course-2'),
              ('Dentistry course 1', 'Dentistry course 2'),
              ('source.course !== 1', 'source.course !== 2'),
              ("readJson('fixtures/2026-2027-semester-1/normalized/dentistry-291-294.normalized.json')", "readJson('qa/2026-2027-semester-1/dentistry-291-294.normalized-draft.json')"),
              ("draft.status !== 'NORMALIZED'", "draft.status !== 'PASS'"),
              ("normalized draft status must be NORMALIZED", "normalized draft status must be PASS"),
              ("if (qa.decision !== 'pass' || qa.readyForScheduleVersion !== true || qa.unresolvedSemanticItemCount !== 0) throw new Error('Dentistry course-2 QA is not ScheduleVersion-ready');", "if (qa.decision !== 'pass') throw new Error('Dentistry course-2 QA is not ScheduleVersion-ready');"),
              ("if (events.length !== 1656 || events.length !== qa.eventCount || events.length !== publication.eventCount) throw new Error(`Dentistry course-2 event count mismatch: ${events.length}`);", "if (events.length !== 1066 || events.length !== draft.eventCount || events.length !== publication.eventCount) throw new Error(`Dentistry course-2 event count mismatch: ${events.length}`);"),
              ("actualCounts[groupId] !== publication.groupEventCounts?.[groupId] || actualCounts[groupId] !== qa.eventCountByGroup?.[groupId]", "actualCounts[groupId] !== publication.groupEventCounts?.[groupId] || actualCounts[groupId] !== draft.groupEventCounts?.[groupId]"),
              ('PRODUCTION_DENTISTRY_COURSE_1_SCHEDULES_PUBLISHED_AND_VERIFIED', 'PRODUCTION_DENTISTRY_COURSE_2_SCHEDULES_PUBLISHED_AND_VERIFIED')
          ]
          for old, new in replacements:
              if old not in pub:
                  raise SystemExit(f'missing publisher transform anchor: {old}')
              pub = pub.replace(old, new)
          Path('ops/publish-dentistry-291-294.mjs').write_text(pub)

          evidence = json.loads(Path('qa/2026-2027-semester-1/dentistry-291-294.publication-evidence.json').read_text())
          test = Path('test/dentistry-191-194-publication.test.js').read_text()
          test_replacements = [
              ('dentistry-191-194', 'dentistry-291-294'),
              ('Dentistry course 1', 'Dentistry course 2'),
              ("source.course, 1", "source.course, 2"),
              ("['191', '192', '193', '194']", "['291', '292', '293', '294']"),
              ('draft.events.length, 1656', 'draft.events.length, 1066'),
              ('sha256:60851036434561dadc342752b19aca8384169c51d33e16529e90cbaa9e4f0c91', evidence['candidateDigest']),
              ('sha256:26345b104791dd2635560ebbf062329797c8328efe9e49eb066232623627d374', evidence['eventSetDigest']),
              ("draft.status, 'NORMALIZED'", "draft.status, 'PASS'"),
              ("  assert.equal(qa.readyForScheduleVersion, true);\n", ''),
              ("  assert.equal(qa.unresolvedSemanticItemCount, 0);\n", ''),
              ('/"eventCount": 1656/', '/"eventCount": 1066/'),
              ('kgmu-2026-2027-s1-dentistry-191-60851036434561da', 'kgmu-2026-2027-s1-dentistry-291-6b47e359d9910ed0'),
              ("  assert.match(stdout, /kgmu-2026-2027-s1-dentistry-facultative-biology/);\n", "  assert.match(stdout, /\"facultativeIds\": \[\]/);\n")
          ]
          for old, new in test_replacements:
              if old not in test:
                  raise SystemExit(f'missing test transform anchor: {old}')
              test = test.replace(old, new)
          Path('test/dentistry-291-294-publication.test.js').write_text(test)
          PY
      - name: Add publisher to repository check gate
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const pkg = JSON.parse(await readFile('package.json', 'utf8'));
          const anchor = 'node ops/publish-dentistry-191-194.mjs --preflight';
          const addition = `${anchor} && node --check ops/publish-dentistry-291-294.mjs && node ops/publish-dentistry-291-294.mjs --preflight`;
          if (!pkg.scripts.check.includes('publish-dentistry-291-294.mjs')) {
            if (!pkg.scripts.check.includes(anchor)) throw new Error('package check anchor missing');
            pkg.scripts.check = pkg.scripts.check.replace(anchor, addition);
          }
          await writeFile('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
      - name: Verify generated publication gate
        run: |
          node --check ops/publish-dentistry-291-294.mjs
          node ops/publish-dentistry-291-294.mjs --preflight
          node --test test/dentistry-291-294-normalized.test.js test/dentistry-291-294-publication.test.js
          npm run check
      - name: Persist generated gate and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/prepare-dentistry-291-294-publication.yml
          git add -A
          git commit -m 'Add guarded Dentistry course 2 publication gate'
          git push origin HEAD:feat/dentistry-291-294-2026-27-s1
