name: UGMU fix staging S3 credentials one-shot

on:
  push:
    branches:
      - main
    paths:
      - universities/ugmu/fix-staging-s3-credentials-execute.json

permissions:
  contents: write
  issues: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/ugmu-course1-staging-s3-credentials-20260822
          fetch-depth: 0

      - name: Switch staging to proven protected S3 secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          authority_path = Path('universities/ugmu/course1-production-staging-authority.json')
          stage_path = Path('api/tools/ugmu-course1-production-storage-stage.mjs')
          test_path = Path('api/test/ugmu-course1-production-storage-stage.test.js')
          workflow_path = Path('.github/workflows/ugmu-course1-production-storage-stage.yml')

          authority = authority_path.read_text(encoding='utf-8')
          old = '"credentialPath": "cloudru-runtime-container-env"'
          new = '"credentialPath": "github-actions-s3-secrets"'
          if authority.count(old) != 1:
              raise SystemExit(f'authority stale path count={authority.count(old)}')
          authority = authority.replace(old, new)
          authority_path.write_text(authority, encoding='utf-8')
          authority_sha = hashlib.sha256(authority.encode('utf-8')).hexdigest()

          stage = stage_path.read_text(encoding='utf-8')
          old_stage = 'credentialPath: authority?.credentialPath === "cloudru-runtime-container-env",'
          new_stage = 'credentialPath: authority?.credentialPath === "github-actions-s3-secrets",'
          if stage.count(old_stage) != 1:
              raise SystemExit(f'stage stale path count={stage.count(old_stage)}')
          stage_path.write_text(stage.replace(old_stage, new_stage), encoding='utf-8')

          test = test_path.read_text(encoding='utf-8')
          old_test = 'credentialPath: "cloudru-runtime-container-env",'
          new_test = 'credentialPath: "github-actions-s3-secrets",'
          if test.count(old_test) != 1:
              raise SystemExit(f'test stale path count={test.count(old_test)}')
          test_path.write_text(test.replace(old_test, new_test), encoding='utf-8')

          workflow = workflow_path.read_text(encoding='utf-8')
          workflow = re.sub(r'EXPECTED_AUTHORITY_SHA256: [a-f0-9]{64}', f'EXPECTED_AUTHORITY_SHA256: {authority_sha}', workflow, count=1)
          old_workflow_path = '.credentialPath == "cloudru-runtime-container-env" and'
          new_workflow_path = '.credentialPath == "github-actions-s3-secrets" and'
          if workflow.count(old_workflow_path) != 1:
              raise SystemExit(f'workflow stale path count={workflow.count(old_workflow_path)}')
          workflow = workflow.replace(old_workflow_path, new_workflow_path)

          start = workflow.index('      - name: Resolve production S3 credentials\n')
          end = workflow.index('      - name: Stage and verify 50 groups\n', start)
          access_ref = '$' + '{{ secrets.S3_ACCESS_KEY_ID }}'
          secret_ref = '$' + '{{ secrets.S3_SECRET_ACCESS_KEY }}'
          replacement = f'''      - name: Use protected production S3 credentials\n        working-directory: .\n        env:\n          DIRECT_S3_ACCESS_KEY_ID: {access_ref}\n          DIRECT_S3_SECRET_ACCESS_KEY: {secret_ref}\n        shell: bash\n        run: |\n          set -euo pipefail\n          test -n "$DIRECT_S3_ACCESS_KEY_ID"\n          test -n "$DIRECT_S3_SECRET_ACCESS_KEY"\n          echo "::add-mask::$DIRECT_S3_ACCESS_KEY_ID"\n          echo "::add-mask::$DIRECT_S3_SECRET_ACCESS_KEY"\n          echo "S3_ACCESS_KEY_ID=$DIRECT_S3_ACCESS_KEY_ID" >> "$GITHUB_ENV"\n          echo "S3_SECRET_ACCESS_KEY=$DIRECT_S3_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"\n          echo "S3_BUCKET=kgmu-calendar-data-gmarkov634" >> "$GITHUB_ENV"\n          echo "S3_ENDPOINT=https://s3.cloud.ru" >> "$GITHUB_ENV"\n          echo "S3_REGION=ru-central-1" >> "$GITHUB_ENV"\n          echo "UGMU_COURSE1_STORAGE_WRITE_CREDENTIAL_PATH_SAFE"\n\n'''
          workflow = workflow[:start] + replacement + workflow[end:]
          workflow_path.write_text(workflow, encoding='utf-8')
          print(f'authority_sha={authority_sha}')
          PY
          git diff --check
          cd api
          npm ci
          node --test test/ugmu-course1-production-storage-stage.test.js test/ugmu-course1-production-storage-verify.test.js

      - name: Commit and push feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gmarkov634-stack"
          git config user.email "gmarkov634@gmail.com"
          git add -- universities/ugmu/course1-production-staging-authority.json api/tools/ugmu-course1-production-storage-stage.mjs api/test/ugmu-course1-production-storage-stage.test.js .github/workflows/ugmu-course1-production-storage-stage.yml
          git diff --cached --check
          git commit -m "Use proven protected S3 credentials for UGMU staging"
          git push origin HEAD:fix/ugmu-course1-staging-s3-credentials-20260822
          git rev-parse HEAD > /tmp/sha

      - name: Report patch result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(cat /tmp/sha)"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "UGMU staging S3 fix ready $sha" --body "Staging now uses the same protected S3 secrets path as the proven production read-back workflow. Authority, validator and digest pin were updated together. Focused staging tests passed."
