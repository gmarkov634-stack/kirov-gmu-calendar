name: Repair Dentistry course 2 publication prep

on:
  push:
    branches:
      - feat/dentistry-291-294-2026-27-s1
    paths:
      - '.github/workflows/repair-dentistry-291-294-publication.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove invalid optional transform anchor and self-delete
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/prepare-dentistry-291-294-publication.yml')
          text = path.read_text()
          anchor = "              ('Dentistry course 1', 'Dentistry course 2'),\n"
          if anchor not in text:
              raise SystemExit('expected transform anchor missing')
          path.write_text(text.replace(anchor, '', 1))
          PY
          rm .github/workflows/repair-dentistry-291-294-publication.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair Dentistry course 2 publication preparation'
          git push origin HEAD:feat/dentistry-291-294-2026-27-s1
