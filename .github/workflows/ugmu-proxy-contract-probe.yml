name: UGMU proxy contract probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ugmu-proxy-contract-probe.yml"
      - ".github/workflows/ugmu-controlled-pages-main-v2.yml"
      - "ugmu/**"

permissions:
  contents: read

concurrency:
  group: ugmu-proxy-contract-probe
  cancel-in-progress: false

env:
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru
  UGMU_SITE_URL: https://gmarkov634-stack.github.io/kirov-gmu-calendar/ugmu/

jobs:
  probe:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed backend and Pages are activation-safe
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 "$PRODUCTION_BASE_URL/health")"
          meta="$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 "$PRODUCTION_BASE_URL/api/v2/meta")"
          python3 - "$health" "$meta" <<'PY'
          import json,sys
          health=json.loads(sys.argv[1]); meta=json.loads(sys.argv[2])
          assert health == {'status':'ok','service':'medical-calendar-api'}, health
          assert meta.get('trials') == 'closed', meta
          assert meta.get('universityTrials',{}).get('ugmu') == 'open', meta
          print('UGMU_PRODUCTION_BACKEND_READY_SAFE', {
              'trials': meta.get('trials'),
              'ugmuTrials': meta.get('universityTrials',{}).get('ugmu'),
          })
          PY

          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 \
            --output /tmp/ugmu-index.html "$UGMU_SITE_URL?probe=${GITHUB_RUN_ID}"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 \
            --output /tmp/ugmu-app.js "${UGMU_SITE_URL}app.js?probe=${GITHUB_RUN_ID}"
          grep -q 'id="trial-start"' /tmp/ugmu-index.html
          grep -q 'Попробовать бесплатно' /tmp/ugmu-index.html
          grep -q 'meta.universityTrials?.ugmu === "open"' /tmp/ugmu-app.js
          if grep -q 'meta.trials === "open"' /tmp/ugmu-app.js; then
            echo 'Legacy global trial metadata must not authorize UGMU CTA' >&2
            exit 1
          fi
          echo 'UGMU_PRODUCTION_PAGES_READY_SAFE trial-ui=present gate=open'

      - name: Verify proxy contract without exposing addresses
        env:
          KGMU_ADMIN_TOKEN: ${{ secrets.KGMU_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KGMU_ADMIN_TOKEN"

          expected_client="$(curl --fail --silent --show-error --retry 3 https://api.ipify.org)"
          test -n "$expected_client"
          probe_sentinel="192.0.2.123"

          observation="$(curl --fail --silent --show-error --retry 3 \
            --header "X-Admin-Token: $KGMU_ADMIN_TOKEN" \
            --header "X-Real-IP: $probe_sentinel" \
            --header "X-Forwarded-For: $probe_sentinel" \
            --header "X-Proxy-Probe-Expected-Client: $expected_client" \
            --header "X-Proxy-Probe-Sentinel: $probe_sentinel" \
            "$PRODUCTION_BASE_URL/api/v1/admin/proxy-contract")"

          python3 - "$observation" <<'PY'
          import json, sys
          body=json.loads(sys.argv[1])
          assert body.get('version') == 2, body
          assert body.get('expectedClientProvided') is True, body
          assert body.get('probeSentinelProvided') is True, body

          trusted_real_ip=(
              body.get('policyResolution') == 'x-real-ip' and
              body.get('xRealIpEqualsExpectedClient') is True and
              body.get('xRealIpEqualsProbeSentinel') is False
          )
          trusted_single_xff=(
              body.get('policyResolution') == 'single-x-forwarded-for' and
              body.get('xForwardedForHopCount') == 1 and
              body.get('firstXffEqualsExpectedClient') is True and
              body.get('firstXffEqualsProbeSentinel') is False
          )
          assert trusted_real_ip or trusted_single_xff, body

          print('UGMU_PROXY_CONTRACT_SAFE', {
              'policyResolution': body.get('policyResolution'),
              'xRealIpPresent': body.get('xRealIpPresent'),
              'xForwardedForHopCount': body.get('xForwardedForHopCount'),
              'trustedRealIp': trusted_real_ip,
              'trustedSingleXff': trusted_single_xff,
          })
          PY
