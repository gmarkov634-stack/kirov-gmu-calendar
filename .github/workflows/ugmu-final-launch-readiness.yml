name: UGMU final launch readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "api/**"
      - "site/ugmu/**"
      - "universities/ugmu/**"
      - "index.html"
      - "styles.css"
      - "landing-v1.css"
      - "data.js"
      - "app.js"
      - "app-utils.js"
      - ".github/workflows/ugmu-*.yml"
      - ".github/workflows/cross-university-historical-regression.yml"
      - ".github/workflows/omgmu-pages.yml"
      - ".github/workflows/deploy-api-cloudru.yml"

permissions:
  contents: read

jobs:
  final-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd api
          npm ci
          python3 -m pip install -r tools/requirements-ugmu.txt

      - name: Test final readiness contract
        run: |
          cd api
          node --test test/ugmu-final-launch-readiness.test.js test/ugmu-api-routing.test.js test/cloudru-deploy-workflow.test.js test/ugmu-pages-build-gate.test.js test/ugmu-live-checkout-ui.test.js
          python3 tools/ugmu-parse-first-stream-pdf.py --self-test

      - name: Rebuild live structural readiness evidence
        run: |
          set -euo pipefail
          cd api
          rm -rf data/imports/ugmu-final-readiness
          mkdir -p data/imports/ugmu-final-readiness
          npm run discover:ugmu -- --program=medicine --output=data/imports/ugmu-final-readiness/source-manifest.json
          npm run download:ugmu -- --manifest=data/imports/ugmu-final-readiness/source-manifest.json --semester=autumn --output=data/imports/ugmu-final-readiness/watched-pdfs
          npm run watch:ugmu -- --manifest=data/imports/ugmu-final-readiness/source-manifest.json --download=data/imports/ugmu-final-readiness/watched-pdfs/download-report.json --config=../universities/ugmu/source-watch.json --output=data/imports/ugmu-final-readiness/source-watch-report.json
          item="$(jq -c '.files[] | select(.status == "downloaded" and .course == 1 and .stream == "1" and .part == "combined")' data/imports/ugmu-final-readiness/watched-pdfs/download-report.json | head -n 1)"
          test -n "$item"
          filename="$(jq -r '.filename' <<<"$item")"
          source_url="$(jq -r '.url' <<<"$item")"
          sha="$(jq -r '.sha256' <<<"$item")"
          test "$sha" = "34612248bba201096d6566cacb37c53be01d3f84eddc214bda2a594b46fb24f8"
          mkdir -p data/imports/ugmu-final-readiness/raw
          for number in $(seq 101 112); do
            npm run parse:ugmu:first-stream -- --input="data/imports/ugmu-final-readiness/watched-pdfs/$filename" --group="ОЛД $number" --source="$source_url" --sha256="$sha" --output="data/imports/ugmu-final-readiness/raw/OLD-$number.json"
          done
          npm run qa:ugmu:first-stream -- --input-dir=data/imports/ugmu-final-readiness/raw --output-dir=data/imports/ugmu-final-readiness/qa
          npm run regression:ugmu:first-stream -- --input-dir=data/imports/ugmu-final-readiness/raw --fixture=test/fixtures/ugmu/first-stream-2026-autumn.json --output=data/imports/ugmu-final-readiness/regression/first-stream-regression.json
          UGMU_SOURCE_WATCH_REPORT=data/imports/ugmu-final-readiness/source-watch-report.json \
          UGMU_FIRST_STREAM_QA_REPORT=data/imports/ugmu-final-readiness/qa/first-stream-qa.json \
          UGMU_FIRST_STREAM_REGRESSION_REPORT=data/imports/ugmu-final-readiness/regression/first-stream-regression.json \
          UGMU_LAUNCH_READINESS_REPORT=data/regression/ugmu-launch-readiness-report.json \
          npm run readiness:ugmu

      - name: Re-run purchase lifecycle E2E gates
        run: |
          set -euo pipefail
          cd api
          npm run e2e:ugmu:payment
          npm run e2e:ugmu:purchased-update
          npm run e2e:ugmu:revoke
          jq -e '.passed == true' data/regression/ugmu-payment-e2e-report.json >/dev/null
          jq -e '.passed == true' data/regression/ugmu-purchased-update-e2e-report.json >/dev/null
          jq -e '.passed == true' data/regression/ugmu-subscription-revoke-e2e-report.json >/dev/null

      - name: Re-run incumbent historical regression
        run: |
          set -euo pipefail
          cd api
          npm run regression:cross-university:historical
          jq -e '.status == "PASS" and .allPassed == true' data/regression/cross-university-historical-regression-report.json >/dev/null

      - name: Build production-identical Pages artifact without deploy
        env:
          API_URL: https://kgmu-calendar-api.containerapps.ru
        run: |
          set -euo pipefail
          rm -rf dist/site
          mkdir -p dist/site/omgmu dist/site/ugmu
          cp index.html styles.css landing-v1.css data.js app.js app-utils.js dist/site/
          cp -R site/omgmu/. dist/site/omgmu/
          cp -R site/ugmu/. dist/site/ugmu/
          touch dist/site/.nojekyll
          node - <<'NODE'
          const fs = require('fs');
          const apiUrl = process.env.API_URL;
          const targets = [
            { path: 'dist/site/data.js', pattern: /apiBase:\s*"https:\/\/[^\"]+"/, replacement: `apiBase: "${apiUrl}"` },
            { path: 'dist/site/omgmu/config.js', pattern: /apiBaseUrl:\s*"https:\/\/[^\"]+"/, replacement: `apiBaseUrl: "${apiUrl}"` },
            { path: 'dist/site/ugmu/config.js', pattern: /apiBaseUrl:\s*"https:\/\/[^\"]+"/, replacement: `apiBaseUrl: "${apiUrl}"` },
          ];
          for (const target of targets) {
            const source = fs.readFileSync(target.path, 'utf8');
            if (!target.pattern.test(source)) throw new Error(`API base setting missing: ${target.path}`);
            fs.writeFileSync(target.path, source.replace(target.pattern, target.replacement));
          }
          NODE
          grep -q "apiBaseUrl: \"$API_URL\"" dist/site/ugmu/config.js
          grep -q 'paymentPath: "/api/v2/payments"' dist/site/ugmu/config.js
          grep -q 'defaultPlan: "semester"' dist/site/ugmu/config.js
          grep -q '34612248bba201096d6566cacb37c53be01d3f84eddc214bda2a594b46fb24f8' dist/site/ugmu/config.js
          grep -q 'name="robots" content="noindex,follow"' dist/site/ugmu/index.html
          grep -q 'type="submit" disabled' dist/site/ugmu/index.html
          grep -q '/api/v2/meta' dist/site/ugmu/app.js
          grep -q 'config.paymentPath' dist/site/ugmu/app.js
          grep -q 'runtime.sales === "open"' dist/site/ugmu/app.js
          grep -q 'runtime.paymentMode === "live"' dist/site/ugmu/app.js
          ! grep -q 'previewOnly' dist/site/ugmu/config.js
          ! grep -q 'checkoutEnabled' dist/site/ugmu/config.js
          ! grep -q 'publicIcsEnabled' dist/site/ugmu/config.js
          ! grep -R '/api/v2/catalog/ugmu' dist/site/ugmu
          ! grep -R '/api/v2/schedules/ugmu' dist/site/ugmu

      - name: Run final launch readiness aggregator and live Cloud.ru smoke
        env:
          UGMU_PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru
          UGMU_SITE_ORIGIN: https://gmarkov634-stack.github.io
          UGMU_FINAL_LAUNCH_READINESS_REPORT: data/regression/ugmu-final-launch-readiness-report.json
        run: |
          set -euo pipefail
          cd api
          npm run readiness:ugmu:final
          jq -e '
            .launchReady == true and
            .status == "READY_FOR_CONTROLLED_LAUNCH_ACTIVATION_FAIL_CLOSED" and
            .scope.sourceSha256 == "34612248bba201096d6566cacb37c53be01d3f84eddc214bda2a594b46fb24f8" and
            ([.checks[] | select(.status != "PASS")] | length) == 0 and
            .launchAuthority.controlledActivationEligible == true and
            .launchAuthority.automaticActivationAllowed == false and
            .launchAuthority.activationPerformedByThisGate == false and
            .launchAuthority.publicationActivatedByThisGate == false and
            .launchAuthority.salesActivatedByThisGate == false and
            .launchAuthority.trialsActivatedByThisGate == false and
            .launchAuthority.catalogVisibilityActivatedByThisGate == false and
            .launchAuthority.nextRequiredBoundary == "validate-live-yookassa-mode"
          ' data/regression/ugmu-final-launch-readiness-report.json >/dev/null

      - name: Write summary
        if: always()
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const file = 'api/data/regression/ugmu-final-launch-readiness-report.json';
          console.log('## UGMU final launch readiness');
          console.log('');
          if (!fs.existsSync(file)) { console.log('Final report was not generated.'); process.exit(0); }
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          const checks = Object.entries(report.checks || {});
          console.log(`Status: **${report.status}**`);
          console.log(`Checks: **${checks.filter(([, v]) => v.status === 'PASS').length}/${checks.length} PASS**`);
          console.log(`Scope: **Лечебное дело · 1 курс · I поток · ОЛД 101–112**`);
          console.log(`Controlled activation eligible: **${report.launchAuthority.controlledActivationEligible ? 'yes' : 'no'}**`);
          console.log('Activation performed by this gate: **no**');
          console.log(`Live production: schedule **${report.production.scheduleStatus}/${report.production.scheduleError}**, checkout **${report.production.checkoutStatus}/${report.production.checkoutError}**`);
          console.log(`Next boundary: **${report.launchAuthority.nextRequiredBoundary}**`);
          NODE

      - name: Upload final readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-final-launch-readiness
          path: |
            api/data/regression/ugmu-final-launch-readiness-report.json
            api/data/regression/ugmu-launch-readiness-report.json
            api/data/regression/ugmu-payment-e2e-report.json
            api/data/regression/ugmu-purchased-update-e2e-report.json
            api/data/regression/ugmu-subscription-revoke-e2e-report.json
            api/data/regression/cross-university-historical-regression-report.json
            api/data/imports/ugmu-final-readiness/source-watch-report.json
            api/data/imports/ugmu-final-readiness/qa/first-stream-qa.json
            api/data/imports/ugmu-final-readiness/regression/first-stream-regression.json
            dist/site
          if-no-files-found: error
          retention-days: 90
