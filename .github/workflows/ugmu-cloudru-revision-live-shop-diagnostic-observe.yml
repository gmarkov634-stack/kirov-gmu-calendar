name: UGMU Cloud.ru revision live shop diagnostic observe

on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/ugmu-cloudru-revision-live-shop-diagnostic-observe.yml"]

permissions:
  contents: read
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: c1d8c18625c972e8796a25311bdec58f7923f78b
      TARGET_WORKFLOW: UGMU Cloud.ru revision live shop diagnostic
    steps:
      - name: Wait for exact diagnostic
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=50"
          run='';status='';conclusion=''
          for i in $(seq 1 120); do
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api" >/tmp/runs.json
            readarray -t x < <(python3 - <<'PY'
          import json,os
          a=[r for r in json.load(open('/tmp/runs.json')).get('workflow_runs',[]) if r.get('name')==os.environ['TARGET_WORKFLOW']]
          if a:r=a[0];print(r['id']);print(r['status']);print(r.get('conclusion') or '')
          else:print('');print('');print('')
          PY
          )
            run="${x[0]}";status="${x[1]}";conclusion="${x[2]}"
            if [ -n "$run" ] && [ "$status" = completed ]; then break; fi
            sleep 5
          done
          echo "UGMU_LIVE_SHOP_DIAGNOSTIC_RUN_SAFE run=$run conclusion=$conclusion"
          test -n "$run"
          test "$conclusion" = success
