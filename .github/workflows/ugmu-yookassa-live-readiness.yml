name: UGMU YooKassa live readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ugmu-yookassa-live-readiness.yml"
      - "universities/ugmu/controlled-activation-plan.json"

permissions:
  contents: read

env:
  CONTAINER_NAME: kgmu-calendar-api
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru
  YOOKASSA_SECRET_NAME: yookassa-secret-key

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Verify read-only safety contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/ugmu-yookassa-live-readiness.yml').read_text(encoding='utf-8')
          forbidden = [
              '--request ' + 'PATCH',
              'containers.api.cloud.ru/' + 'v2/',
              'aws ' + 's3',
              'Put' + 'Object',
              'Delete' + 'Object',
              'UGMU_SALES_ENABLED=' + 'true',
              'COMMERCIAL_SALES_ENABLED=' + 'true',
              'https://api.yookassa.ru/v3/payments' + "' -d",
              'https://api.yookassa.ru/v3/payments' + ' --data',
          ]
          for marker in forbidden:
              assert marker not in text, marker
          assert 'https://api.yookassa.ru/v3/payments?limit=1' in text
          assert 'http.MethodGet' in text
          assert 'paymentCreated' in text
          print('READ_ONLY_CONTRACT_SAFE')
          PY

      - name: Inspect production and verify YooKassa with runtime secret
        env:
          CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
          CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          auth_payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({'keyId': os.environ['CLOUDRU_KEY_ID'], 'secret': os.environ['CLOUDRU_KEY_SECRET']}))
          PY
          )"
          test "$(curl --silent --show-error --output /tmp/cloud-token.json --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data "$auth_payload" \
            'https://iam.api.cloud.ru/api/v1/auth/token')" = "200"

          readarray -t auth < <(python3 - <<'PY'
          import base64, json
          body=json.load(open('/tmp/cloud-token.json', encoding='utf-8'))
          token=body.get('access_token')
          assert isinstance(token, str) and token
          parts=token.split('.')
          assert len(parts) == 3
          payload=parts[1] + '='*((4-len(parts[1])%4)%4)
          claims=json.loads(base64.urlsafe_b64decode(payload.encode()).decode())
          project_id=claims.get('project_id')
          assert isinstance(project_id, str) and project_id
          print(token)
          print(project_id)
          PY
          )
          token="${auth[0]}"
          project_id="${auth[1]}"
          rm -f /tmp/cloud-token.json
          echo "::add-mask::$token"

          get_url="https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$project_id"
          test "$(curl --silent --show-error --output /tmp/current-container.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $token" --header 'Accept: application/json' "$get_url")" = "200"

          python3 - <<'PY'
          import json
          app=json.load(open('/tmp/current-container.json', encoding='utf-8'))
          assert app.get('name') == 'kgmu-calendar-api', app.get('name')
          assert app.get('status') == 'running', app.get('status')
          containers=app.get('template',{}).get('containers',[])
          assert len(containers) == 1, len(containers)
          env={item.get('name'):item for item in containers[0].get('env',[]) if isinstance(item,dict) and item.get('name')}
          shop=str(env.get('YOOKASSA_SHOP_ID',{}).get('value') or '')
          secret_env=env.get('YOOKASSA_SECRET_KEY',{})
          assert secret_env.get('type') == 'secret', secret_env.get('type')
          if shop:
              print(f'::add-mask::{shop}')
          open('/tmp/yookassa-shop-id','w',encoding='utf-8').write(shop)
          state={
              'containerStatus': app.get('status'),
              'globalSalesEnabled': env.get('COMMERCIAL_SALES_ENABLED',{}).get('value') == 'true',
              'ugmuSalesEnabled': env.get('UGMU_SALES_ENABLED',{}).get('value') == 'true',
              'trialsEnabled': env.get('TRIALS_ENABLED',{}).get('value') == 'true',
              'testModeEnv': env.get('YOOKASSA_TEST_MODE',{}).get('value'),
              'shopIdPresent': bool(shop),
              'secretType': secret_env.get('type'),
          }
          json.dump(state, open('/tmp/runtime-state.json','w',encoding='utf-8'))
          print('CLOUD_RUNTIME_SAFE', {
              'containerStatus': state['containerStatus'],
              'globalSalesEnabled': state['globalSalesEnabled'],
              'ugmuSalesEnabled': state['ugmuSalesEnabled'],
              'trialsEnabled': state['trialsEnabled'],
              'testModeEnv': state['testModeEnv'],
              'shopIdPresent': state['shopIdPresent'],
              'secretType': state['secretType'],
          })
          PY
          rm -f /tmp/current-container.json

          shop="$(cat /tmp/yookassa-shop-id)"
          test -n "$shop"

          meta="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "$PRODUCTION_BASE_URL/api/v2/meta")"
          printf '%s' "$meta" > /tmp/public-meta.json

          mkdir /tmp/verify && cd /tmp/verify
          cat > go.mod <<'EOF'
          module verifier
          go 1.23.0
          require (
            github.com/cloudru-tech/secret-manager-sdk v1.1.1
            google.golang.org/grpc v1.70.0
          )
          EOF
          cat > main.go <<'EOF'
          package main
          import("context";"encoding/json";"fmt";"io";"net/http";"os";"strings";"time"; sm "github.com/cloudru-tech/secret-manager-sdk"; v2 "github.com/cloudru-tech/secret-manager-sdk/api/v2";"google.golang.org/grpc/metadata")
          func e(n string)string{v:=os.Getenv(n);if v==""{panic("missing env")};return v}
          func main(){
            cl,err:=sm.New(&sm.Config{Host:"secretmanager.api.cloud.ru:443"});if err!=nil{panic(err)};defer cl.Close()
            ctx,cancel:=context.WithTimeout(context.Background(),30*time.Second);defer cancel();ctx=metadata.AppendToOutgoingContext(ctx,"authorization","Bearer "+e("TOKEN"))
            sr,err:=cl.V2.SecretService.Search(ctx,&v2.SearchSecretRequest{ProjectId:e("PROJECT"),Depth:-1});if err!=nil{panic(err)}
            target:=e("SECRET_NAME");matches:=[]string{};for _,s:=range sr.GetSecrets(){p:=s.GetPath();if p==target||strings.HasSuffix(p,"/"+target){matches=append(matches,p)}}
            if len(matches)!=1{fmt.Printf("SECRET_MATCH_COUNT=%d\n",len(matches));os.Exit(3)}
            s,err:=cl.V2.SecretService.Access(ctx,&v2.AccessSecretRequest{ProjectId:e("PROJECT"),Path:matches[0]});if err!=nil{panic(err)}
            key:=s.GetPayload().GetValue();if len(key)==0{panic("empty resolved secret")}
            req,_:=http.NewRequest(http.MethodGet,"https://api.yookassa.ru/v3/payments?limit=1",nil);req.SetBasicAuth(e("SHOP"),string(key));hc:=&http.Client{Timeout:20*time.Second};r,err:=hc.Do(req);if err!=nil{panic(err)};defer r.Body.Close();raw,_:=io.ReadAll(io.LimitReader(r.Body,1<<20));var b map[string]any;_ = json.Unmarshal(raw,&b)
            safe:=map[string]any{"secretResolved":true,"secretMatchCount":len(matches),"httpCode":r.StatusCode,"paymentCreated":false,"providerAuthenticated":r.StatusCode==200,"providerModeEvidence":"unknown"}
            if r.StatusCode==200{items,_:=b["items"].([]any);safe["itemCount"]=len(items);flags:=map[bool]bool{};for _,x:=range items{if m,ok:=x.(map[string]any);ok{if f,ok:=m["test"].(bool);ok{flags[f]=true}}};if flags[false]&&!flags[true]{safe["providerModeEvidence"]="live"}else if flags[true]&&!flags[false]{safe["providerModeEvidence"]="test"}else if len(items)==0{safe["providerModeEvidence"]="empty-list"}}else{safe["type"]=b["type"];safe["code"]=b["code"]}
            out,_:=json.Marshal(safe);os.WriteFile("/tmp/provider-state.json",out,0600);fmt.Println("YOOKASSA_PROVIDER_SAFE",string(out));if r.StatusCode!=200{os.Exit(4)}
          }
          EOF
          go mod tidy
          TOKEN="$token" PROJECT="$project_id" SECRET_NAME="$YOOKASSA_SECRET_NAME" SHOP="$shop" go run .
          cd /

          python3 - <<'PY'
          import json, os
          runtime=json.load(open('/tmp/runtime-state.json', encoding='utf-8'))
          meta=json.load(open('/tmp/public-meta.json', encoding='utf-8'))
          provider=json.load(open('/tmp/provider-state.json', encoding='utf-8'))
          checks={
              'containerRunning': runtime['containerStatus'] == 'running',
              'globalSalesClosed': runtime['globalSalesEnabled'] is False,
              'ugmuSalesClosed': runtime['ugmuSalesEnabled'] is False,
              'trialsClosed': runtime['trialsEnabled'] is False,
              'shopIdPresent': runtime['shopIdPresent'] is True,
              'secretManaged': runtime['secretType'] == 'secret',
              'explicitLiveEnv': runtime['testModeEnv'] == 'false',
              'publicMetaLive': meta.get('paymentMode') == 'live',
              'publicSalesClosed': meta.get('sales') == 'closed',
              'publicTrialsClosed': meta.get('trials') == 'closed',
              'secretResolved': provider.get('secretResolved') is True,
              'singleSecretMatch': provider.get('secretMatchCount') == 1,
              'providerAuthenticated': provider.get('providerAuthenticated') is True,
              'providerLiveEvidence': provider.get('providerModeEvidence') == 'live',
              'paymentNotCreated': provider.get('paymentCreated') is False,
          }
          ready=all(checks.values())
          report={
              'version': 2,
              'university': 'ugmu',
              'mode': 'production-yookassa-live-readiness-read-only',
              'status': 'PASS' if ready else 'BLOCKED',
              'ready': ready,
              'runtime': {
                  'testModeEnv': runtime['testModeEnv'],
                  'shopIdPresent': runtime['shopIdPresent'],
                  'secretType': runtime['secretType'],
              },
              'publicMeta': {
                  'sales': meta.get('sales'),
                  'trials': meta.get('trials'),
                  'paymentMode': meta.get('paymentMode'),
              },
              'provider': {
                  'authenticated': provider.get('providerAuthenticated'),
                  'modeEvidence': provider.get('providerModeEvidence'),
                  'httpCode': provider.get('httpCode'),
                  'itemCount': provider.get('itemCount'),
                  'secretResolved': provider.get('secretResolved'),
                  'secretMatchCount': provider.get('secretMatchCount'),
              },
              'checks': checks,
              'productionMutationPerformed': False,
              'paymentCreated': False,
              'nextRequiredBoundary': 'controlled-launch-activation' if ready else 'configure-live-yookassa-with-sales-closed',
          }
          os.makedirs('api/data/imports/ugmu-yookassa-live-readiness', exist_ok=True)
          json.dump(report, open('api/data/imports/ugmu-yookassa-live-readiness/report.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)
          print('YOOKASSA_READINESS_SAFE', json.dumps({
              'status': report['status'],
              'paymentMode': report['publicMeta']['paymentMode'],
              'testModeEnv': report['runtime']['testModeEnv'],
              'providerAuthenticated': report['provider']['authenticated'],
              'providerModeEvidence': report['provider']['modeEvidence'],
              'providerHttpCode': report['provider']['httpCode'],
              'paymentCreated': False,
          }, ensure_ascii=False))
          PY

          rm -rf /tmp/verify /tmp/yookassa-shop-id /tmp/runtime-state.json /tmp/public-meta.json /tmp/provider-state.json

      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-yookassa-live-readiness-${{ github.sha }}
          path: api/data/imports/ugmu-yookassa-live-readiness/report.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce live readiness
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          report=json.load(open('api/data/imports/ugmu-yookassa-live-readiness/report.json', encoding='utf-8'))
          assert report['productionMutationPerformed'] is False
          assert report['paymentCreated'] is False
          assert report['ready'] is True, report
          print('UGMU_YOOKASSA_LIVE_READY')
          PY
