name: Patch R69 MED3 regression

on:
  push:
    paths:
      - ".github/workflows/r69-med3-test-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r69-med3
          fetch-depth: 0
      - name: Align overlap regression with R69
        shell: python
        run: |
          from pathlib import Path
          p = Path('api/test/kgmu-medicine-course3-unseen-patterns.test.js')
          text = p.read_text()
          old = '''test("R-MED3 keeps new unconfirmed explicit overlaps fail-closed", () => {
            const workbook = workbookWithRows([
              cell("A4", 4, 1, "ПН"),
              cell("B4", 4, 2, "8.00-10.00 Фармакология 02.02"),
              cell("C4", 4, 3, "8.00-9.00 Фармакология 02.02"),
              cell("A5", 5, 1, "ПН"),
              cell("B5", 5, 2, "9.00-11.00 Общая хирургия 02.02"),
              cell("C5", 5, 3, "10.00-11.00 Фармакология 02.02"),
            ], 6);

            const result = parseMedicineCourse3RWorkbookReviewed(workbook, {
              university: "kgmu",
              program: "medicine",
              course: 3,
              academicYear: "2025/26",
              semester: 2,
            });

            assert.equal(result.qa.status, "REVIEW_REQUIRED");
            assert.ok((result.qa.remainingOverlaps || []).length > 0);
            assert.equal((result.qa.confirmedOverlaps || []).length, 0);
          });'''
          new = '''test("R-MED3 keeps new explicit overlaps as non-blocking diagnostics under R69", () => {
            const workbook = workbookWithRows([
              cell("A4", 4, 1, "ПН"),
              cell("B4", 4, 2, "8.00-10.00 Фармакология 02.02"),
              cell("C4", 4, 3, "8.00-9.00 Фармакология 02.02"),
              cell("A5", 5, 1, "ПН"),
              cell("B5", 5, 2, "9.00-11.00 Общая хирургия 02.02"),
              cell("C5", 5, 3, "10.00-11.00 Фармакология 02.02"),
            ], 6);

            const result = parseMedicineCourse3RWorkbookReviewed(workbook, {
              university: "kgmu",
              program: "medicine",
              course: 3,
              academicYear: "2025/26",
              semester: 2,
            });

            assert.equal(result.qa.status, "PASS");
            assert.deepEqual(result.qa.uncovered, []);
            assert.deepEqual(result.qa.normalizationFailures, []);
            assert.deepEqual(result.qa.extraLessonFailures, []);
            assert.ok((result.qa.remainingOverlaps || []).length > 0);
            assert.equal((result.qa.confirmedOverlaps || []).length, 0);
          });'''
          if old not in text:
              raise SystemExit('target regression block not found')
          p.write_text(text.replace(old, new))
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/test/kgmu-medicine-course3-unseen-patterns.test.js
          git rm .github/workflows/r69-med3-test-patch.yml
          git commit -m 'test: apply R69 to medicine course3 overlap regression'
          git push origin HEAD:fix/r69-med3
