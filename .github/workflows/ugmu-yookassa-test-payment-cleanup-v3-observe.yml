name: UGMU YooKassa test payment cleanup v3 observe

on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/ugmu-yookassa-test-payment-cleanup-v3-observe.yml"]

permissions:
  contents: read
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 4e69b3fdcec8b8ce476b73b6dc6928a880952f1b
      TARGET_WORKFLOW: UGMU YooKassa test payment cleanup v3
    steps:
      - name: Wait for exact cleanup v3 run
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=50"
          run_id='';conclusion=''
          for attempt in $(seq 1 180);do
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api" >/tmp/runs.json
            readarray -t s < <(python3 - <<'PY'
          import json,os
          rows=json.load(open('/tmp/runs.json')).get('workflow_runs',[]);h=[r for r in rows if r.get('name')==os.environ['TARGET_WORKFLOW'] and r.get('head_sha')==os.environ['TARGET_SHA']]
          if not h:print('');print('');print('')
          else:r=h[0];print(r['id']);print(r.get('status',''));print(r.get('conclusion') or '')
          PY
          )
            run_id="${s[0]}";if [ -n "$run_id" ] && [ "${s[1]}" = completed ];then conclusion="${s[2]}";break;fi;sleep 5
          done
          test -n "$run_id";echo "UGMU_TEST_PAYMENT_CLEANUP_V3_RUN_SAFE run=$run_id conclusion=$conclusion";test "$conclusion" = success
