name: Temporary VK community photo patch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/_tmp-vk-community-photo-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.actor == 'gmarkov634-stack' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/vk-community-message-photo-import'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact source patch and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('api/src/vk-control.js')
          text = path.read_text()

          old_tokens = 'const COMMUNITY_TOKEN_ACTIONS = new Set(["wall.post", "group.info", "group.edit"]);'
          new_tokens = 'const COMMUNITY_TOKEN_ACTIONS = new Set(["wall.post", "group.info", "group.edit", "photo.importMessages"]);'
          if new_tokens not in text:
              if old_tokens not in text:
                  raise SystemExit('community token action anchor not found')
              text = text.replace(old_tokens, new_tokens, 1)

          helper_anchor = 'function bestPhotoUrl(photo) {'
          helper = r'''async function importMessagePhoto({ sourceUrl, token, apiVersion, fetchImpl }) {
            const sourceResponse = await fetchImpl(sourceUrl, {
              method: "GET",
              headers: { Accept: "image/jpeg,image/png" },
              redirect: "error",
            });
            if (!sourceResponse.ok) throw new Error("photo_source_unavailable");
            const bytes = Buffer.from(await sourceResponse.arrayBuffer());
            if (!bytes.length || bytes.length > MAX_PHOTO_BYTES) throw new Error("invalid_photo_source_content");
            const contentType = photoContentType(bytes, sourceResponse.headers?.get?.("content-type"));

            const uploadServer = await vkMethod({
              method: "photos.getMessagesUploadServer",
              token,
              apiVersion,
              fetchImpl,
              params: {},
            });
            let uploadUrl;
            try {
              uploadUrl = new URL(String(uploadServer?.upload_url || ""));
            } catch {
              throw new Error("vk_photo_upload_failed");
            }
            if (uploadUrl.protocol !== "https:") throw new Error("vk_photo_upload_failed");

            const form = new FormData();
            form.append("photo", new Blob([bytes], { type: contentType }), contentType === "image/png" ? "post.png" : "post.jpg");
            const uploadResponse = await fetchImpl(uploadUrl.toString(), { method: "POST", body: form });
            if (!uploadResponse.ok) throw new Error("vk_photo_upload_failed");
            const uploaded = await uploadResponse.json();
            const server = String(uploaded?.server ?? "").trim();
            const photo = typeof uploaded?.photo === "string" ? uploaded.photo : JSON.stringify(uploaded?.photo ?? "");
            const hash = String(uploaded?.hash ?? "").trim();
            if (!/^-?\d+$/.test(server) || !photo || photo.length > 20000 || !hash || hash.length > 2048) {
              throw new Error("vk_photo_upload_failed");
            }

            const saved = await vkMethod({
              method: "photos.saveMessagesPhoto",
              token,
              apiVersion,
              fetchImpl,
              params: { server, photo, hash },
            });
            const photos = Array.isArray(saved) ? saved : (Array.isArray(saved?.photos) ? saved.photos : []);
            const item = photos[0];
            const id = Number(item?.id || 0);
            const ownerId = Number(item?.owner_id || 0);
            const accessKey = String(item?.access_key || "").trim();
            if (!Number.isInteger(id) || id <= 0 || !Number.isInteger(ownerId) || ownerId === 0) throw new Error("vk_photo_save_failed");
            if (accessKey && (accessKey.length > 512 || !/^[A-Za-z0-9_-]+$/.test(accessKey))) throw new Error("vk_photo_save_failed");
            return {
              attachment: `photo${ownerId}_${id}${accessKey ? `_${accessKey}` : ""}`,
              photo: { id, ownerId, imageUrl: bestPhotoUrl(item) },
            };
          }

          '''
          if 'async function importMessagePhoto(' not in text:
              if helper_anchor not in text:
                  raise SystemExit('photo helper anchor not found')
              text = text.replace(helper_anchor, helper + helper_anchor, 1)

          command_anchor = '''  if (command.action === "photo.importWall") {
            const sourceUrl = cleanPhotoSourceUrl(command.payload?.sourceUrl);
            return importWallPhoto({ sourceUrl, groupId, token, apiVersion, fetchImpl });
          }
          '''
          command_replacement = '''  if (command.action === "photo.importMessages") {
            const sourceUrl = cleanPhotoSourceUrl(command.payload?.sourceUrl);
            return importMessagePhoto({ sourceUrl, token, apiVersion, fetchImpl });
          }

          ''' + command_anchor
          if 'if (command.action === "photo.importMessages")' not in text:
              if command_anchor not in text:
                  raise SystemExit('photo command anchor not found')
              text = text.replace(command_anchor, command_replacement, 1)

          path.write_text(text)

          test_path = Path('api/test/vk-control-community-message-photo.test.js')
          test_path.write_text(r'''import assert from "node:assert/strict";
          import test from "node:test";
          import { createVkControlHandler } from "../src/vk-control.js";

          const now = Date.parse("2026-08-16T14:35:00.000Z");
          const sourceUrl = "https://raw.githubusercontent.com/gmarkov634-stack/kirov-gmu-calendar/53cd2dbac2ab09a9bcb66dcd5d6c9fb70a959e8c/ops/vk/assets/post66-study-day-approved-20260816.jpg";

          function fakeRequest(command) {
            return {
              method: "POST",
              headers: { authorization: "Bearer test-oidc" },
              async *[Symbol.asyncIterator]() { yield Buffer.from(JSON.stringify(command)); },
            };
          }

          function fakeResponse() {
            return {
              statusCode: null,
              body: "",
              writeHead(statusCode) { this.statusCode = statusCode; },
              end(body = "") { this.body = String(body); },
            };
          }

          function command() {
            return {
              id: "vk-photo-community-message-test-0001",
              action: "photo.importMessages",
              createdAt: "2026-08-16T14:34:00.000Z",
              payload: { sourceUrl },
            };
          }

          test("photo.importMessages uses only community token and returns a wall-compatible photo attachment", async () => {
            let managedTokenCalls = 0;
            const apiMethods = [];
            let uploadCalls = 0;
            const response = fakeResponse();
            const handler = createVkControlHandler({
              VK_CALLBACK_GROUP_ID: "191574528",
              VK_ACCESS_TOKEN: "community-token",
              VK_API_VERSION: "5.199",
            }, {
              nowFactory: () => now,
              verifyOidcToken: async () => ({}),
              tokenManager: {
                configured: true,
                async getAccessToken() {
                  managedTokenCalls += 1;
                  return "managed-user-token-must-not-be-used";
                },
              },
              fetchImpl: async (url, options = {}) => {
                const value = String(url);
                if (value === sourceUrl) {
                  return {
                    ok: true,
                    headers: { get: () => "image/jpeg" },
                    async arrayBuffer() { return Uint8Array.from([0xff, 0xd8, 0xff, 0xd9]).buffer; },
                  };
                }
                if (value === "https://pu.vk.com/upload-message-photo") {
                  uploadCalls += 1;
                  assert.equal(options.method, "POST");
                  assert.ok(options.body instanceof FormData);
                  return {
                    ok: true,
                    async json() { return { server: 123, photo: "[]", hash: "upload-hash" }; },
                  };
                }
                if (value.startsWith("https://api.vk.com/method/")) {
                  const method = value.slice("https://api.vk.com/method/".length);
                  apiMethods.push(method);
                  assert.equal(options.body.get("access_token"), "community-token");
                  if (method === "photos.getMessagesUploadServer") {
                    return { ok: true, async json() { return { response: { upload_url: "https://pu.vk.com/upload-message-photo" } }; } };
                  }
                  if (method === "photos.saveMessagesPhoto") {
                    assert.equal(options.body.get("server"), "123");
                    assert.equal(options.body.get("photo"), "[]");
                    assert.equal(options.body.get("hash"), "upload-hash");
                    return {
                      ok: true,
                      async json() {
                        return { response: [{
                          id: 777,
                          owner_id: -191574528,
                          access_key: "safe_access_key",
                          sizes: [{ width: 1200, height: 1200, url: "https://sun.vk.com/photo.jpg" }],
                        }] };
                      },
                    };
                  }
                }
                throw new Error(`unexpected fetch ${value}`);
              },
            });

            await handler(fakeRequest(command()), response);

            assert.equal(response.statusCode, 200);
            assert.equal(managedTokenCalls, 0);
            assert.equal(uploadCalls, 1);
            assert.deepEqual(apiMethods, ["photos.getMessagesUploadServer", "photos.saveMessagesPhoto"]);
            assert.deepEqual(JSON.parse(response.body).result, {
              attachment: "photo-191574528_777_safe_access_key",
              photo: { id: 777, ownerId: -191574528, imageUrl: "https://sun.vk.com/photo.jpg" },
            });
          });

          test("photo.importMessages fails closed without community token and never requests managed token", async () => {
            let managedTokenCalls = 0;
            let fetchCalls = 0;
            const response = fakeResponse();
            const handler = createVkControlHandler({
              VK_CALLBACK_GROUP_ID: "191574528",
              VK_API_VERSION: "5.199",
            }, {
              nowFactory: () => now,
              verifyOidcToken: async () => ({}),
              tokenManager: {
                configured: true,
                async getAccessToken() {
                  managedTokenCalls += 1;
                  return "managed-user-token";
                },
              },
              fetchImpl: async () => {
                fetchCalls += 1;
                throw new Error("VK must not be called");
              },
            });

            await handler(fakeRequest(command()), response);

            assert.equal(response.statusCode, 503);
            assert.equal(managedTokenCalls, 0);
            assert.equal(fetchCalls, 0);
            assert.deepEqual(JSON.parse(response.body), { error: "vk_control_not_configured" });
          });
          ''').replace('\n          ', '\n').lstrip()
          PY

      - name: Commit patch to PR branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/src/vk-control.js api/test/vk-control-community-message-photo.test.js
          if git diff --cached --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git commit -m "VK: add community message-photo import boundary"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
