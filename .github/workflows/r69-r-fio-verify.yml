name: Verify R69 R-FIO
on:
  push:
    branches: [fix/r69-r-fio]
    paths: [.github/workflows/r69-r-fio-verify.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r69-r-fio
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm test
        working-directory: api
      - name: Self-delete after successful tests
        run: |
          rm .github/workflows/r69-r-fio-verify.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/r69-r-fio-verify.yml
          git commit -m 'chore: remove R-FIO verification workflow'
          git push origin HEAD:fix/r69-r-fio
