name: R69 R-FIO patch
on:
  push:
    branches: [fix/r69-r-fio]
    paths: [.github/workflows/r69-r-fio-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r69-r-fio
      - name: Patch overlap gates
        run: |
          python - <<'PY'
          from pathlib import Path
          changes = {
            'api/src/adapters/kgmu/foreign-r-parser.mjs': [("status:uncovered.length||extraLessonFailures.length||sourceConflicts.length?'REVIEW_REQUIRED':'PASS'", "status:uncovered.length||extraLessonFailures.length?'REVIEW_REQUIRED':'PASS'")],
            'api/src/adapters/kgmu/foreign-r-generic.mjs': [("status:uncovered.length||extraLessonFailures.length||sourceConflicts.length?'REVIEW_REQUIRED':'PASS'", "status:uncovered.length||extraLessonFailures.length?'REVIEW_REQUIRED':'PASS'")],
            'api/src/adapters/kgmu/foreign-r-safe.mjs': [('qa.status = (qa.uncovered?.length || qa.extraLessonFailures?.length || conflicts.length || outOfPeriodSources.length || altRangeFixups.skipped.length)', 'qa.status = (qa.uncovered?.length || qa.extraLessonFailures?.length || outOfPeriodSources.length || altRangeFixups.skipped.length)')],
            'api/src/adapters/kgmu/foreign-r-reviewed.mjs': [('    qa.remainingOverlaps?.length ||\n', '')],
          }
          for filename, replacements in changes.items():
            path = Path(filename)
            text = path.read_text()
            for old, new in replacements:
              if text.count(old) != 1:
                raise SystemExit(f'{filename}: expected one match for {old!r}, got {text.count(old)}')
              text = text.replace(old, new, 1)
            path.write_text(text)
          PY
      - name: Add regression contract
        run: |
          cat > api/test/kgmu-r69-r-fio-policy.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');
          const read = (p) => fs.readFileSync(path.join(root, p), 'utf8');
          test('R69: R-FIO overlap reports do not participate in publishability', () => {
            assert.doesNotMatch(read('src/adapters/kgmu/foreign-r-parser.mjs'), /extraLessonFailures\.length\|\|sourceConflicts\.length\?['"]REVIEW_REQUIRED/);
            assert.doesNotMatch(read('src/adapters/kgmu/foreign-r-generic.mjs'), /extraLessonFailures\.length\|\|sourceConflicts\.length\?['"]REVIEW_REQUIRED/);
            assert.doesNotMatch(read('src/adapters/kgmu/foreign-r-safe.mjs'), /qa\.status[^\n]*conflicts\.length/);
            const reviewed = read('src/adapters/kgmu/foreign-r-reviewed.mjs');
            const status = reviewed.slice(reviewed.indexOf('qa.status = ('), reviewed.indexOf('parsed.qa = qa;'));
            assert.doesNotMatch(status, /remainingOverlaps/);
            assert.match(status, /ambiguousLectureTimeCounts/);
            assert.match(status, /choiceDisciplineAmbiguities/);
          });
          EOF
      - name: Commit clean diff
        run: |
          rm .github/workflows/r69-r-fio-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/src/adapters/kgmu/foreign-r-parser.mjs api/src/adapters/kgmu/foreign-r-generic.mjs api/src/adapters/kgmu/foreign-r-safe.mjs api/src/adapters/kgmu/foreign-r-reviewed.mjs api/test/kgmu-r69-r-fio-policy.test.js .github/workflows/r69-r-fio-patch.yml
          git commit -m 'fix: apply R69 to R-FIO QA'
          git push origin HEAD:fix/r69-r-fio
