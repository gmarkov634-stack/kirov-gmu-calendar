name: UGMU course-2 canonical package QA

on:
  pull_request:
    paths:
      - ".github/workflows/ugmu-course2-canonical-package.yml"
      - "api/src/adapters/ugmu/**"
      - "api/tools/ugmu-*.mjs"
      - "api/tools/ugmu-*.py"
      - "api/tools/requirements-ugmu.txt"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and self-test parser
        run: |
          set -euo pipefail
          npm ci
          python3 -m pip install -r tools/requirements-ugmu.txt
          python3 tools/ugmu-parse-course2-stream.py --self-test

      - name: Discover and download current official autumn PDFs
        run: |
          set -euo pipefail
          npm run discover:ugmu -- --program=medicine --output=data/imports/ugmu-course2/source-manifest.json
          npm run download:ugmu -- \
            --manifest=data/imports/ugmu-course2/source-manifest.json \
            --semester=autumn \
            --output=data/imports/ugmu-course2/watched-pdfs

      - name: Verify exact course-2 source set
        run: |
          set -euo pipefail
          report='data/imports/ugmu-course2/watched-pdfs/download-report.json'
          test "$(jq '[.files[] | select(.status=="downloaded" and .course==2 and .part=="combined")] | length' "$report")" = '4'
          declare -A expected_sha=(
            [1]='8b81f37b517dd037c090b0d980ba4d916557f36c872fe0fc37031d4ae8808c6a'
            [2]='07675a77bdb80080ea018a73750f00f458cc100fcd01a63ecaf142430bca94bd'
            [3]='b6cc586f29a20bd008b5da89129809db7fbed8b2a9224a9f2d4cd3e3a77a9b85'
            [4]='6b5f87dc7f565169105245a397996e61e94794dfe580529cc5f7398a62e21517'
          )
          for stream in 1 2 3 4; do
            item="$(jq -c --arg stream "$stream" '.files[] | select(.status=="downloaded" and .course==2 and .stream==$stream and .part=="combined")' "$report")"
            test -n "$item"
            test "$(jq -r '.sha256' <<<"$item")" = "${expected_sha[$stream]}"
            jq -c '{course,stream,filename,sha256,url}' <<<"$item"
          done

      - name: Parse all 48 course-2 groups fail-closed
        run: |
          set -euo pipefail
          report='data/imports/ugmu-course2/watched-pdfs/download-report.json'
          for stream in 1 2 3 4; do
            item="$(jq -c --arg stream "$stream" '.files[] | select(.status=="downloaded" and .course==2 and .stream==$stream and .part=="combined")' "$report")"
            filename="$(jq -r '.filename' <<<"$item")"
            source_url="$(jq -r '.url' <<<"$item")"
            sha="$(jq -r '.sha256' <<<"$item")"
            python3 tools/ugmu-parse-course2-stream.py \
              --input="data/imports/ugmu-course2/watched-pdfs/$filename" \
              --stream="$stream" \
              --all-groups \
              --source="$source_url" \
              --sha256="$sha" \
              --output="data/imports/ugmu-course2/raw/stream-$stream"
          done

      - name: Summarize semantic review boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          summaries=[]
          for stream in '1234':
              path=Path(f'data/imports/ugmu-course2/raw/stream-{stream}/summary.json')
              summary=json.loads(path.read_text(encoding='utf-8'))
              summaries.append(summary)
              print(json.dumps({
                  'stream': stream,
                  'groups': summary['groupCount'],
                  'structurallyValidGroups': summary['structurallyValidGroups'],
                  'patterns': summary['weeklyPatterns'],
                  'events': summary['events'],
                  'warnings': summary['warnings'],
                  'unresolvedReferences': summary['unresolvedReferences'],
                  'overlaps': summary['overlaps'],
                  'validationErrors': summary['validationErrors'],
              }, ensure_ascii=False))
              for group, details in summary['groups'].items():
                  if details['unresolvedReferences'] or details['overlaps'] or details['validationErrors']:
                      print(json.dumps({
                          'group': group,
                          'unresolvedReferences': details['unresolvedReferences'],
                          'overlapCount': len(details['overlaps']),
                          'validationErrors': details['validationErrors'],
                      }, ensure_ascii=False))

          totals={
              'groups': sum(s['groupCount'] for s in summaries),
              'structurallyValidGroups': sum(s['structurallyValidGroups'] for s in summaries),
              'patterns': sum(s['weeklyPatterns'] for s in summaries),
              'events': sum(s['events'] for s in summaries),
              'warnings': sum(s['warnings'] for s in summaries),
              'unresolvedReferences': sum(s['unresolvedReferences'] for s in summaries),
              'overlaps': sum(s['overlaps'] for s in summaries),
              'validationErrors': sum(s['validationErrors'] for s in summaries),
              'publicationAllowed': False,
          }
          assert totals['groups'] == 48, totals
          assert totals['structurallyValidGroups'] == 48, totals
          assert totals['validationErrors'] == 0, totals
          out=Path('data/imports/ugmu-course2/raw/summary.json')
          out.write_text(json.dumps(totals, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps({'course2Totals': totals}, ensure_ascii=False))
          PY

      - name: Upload course-2 parsing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-course2-raw-qa
          path: |
            api/data/imports/ugmu-course2/source-manifest.json
            api/data/imports/ugmu-course2/watched-pdfs/download-report.json
            api/data/imports/ugmu-course2/raw
          if-no-files-found: warn
          retention-days: 30
