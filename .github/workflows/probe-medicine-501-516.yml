name: Probe medicine 501-516 official source

on:
  push:
    branches:
      - feat/medicine-5-course-2026-27-sem1-normalization
    paths:
      - 'fixtures/tools/probe_medicine_501_516_source.py'
      - '.github/workflows/probe-medicine-501-516.yml'
  pull_request:
    branches: [main]
    paths:
      - 'fixtures/tools/probe_medicine_501_516_source.py'
      - '.github/workflows/probe-medicine-501-516.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Fetch and mechanically dump official workbook
        run: python fixtures/tools/probe_medicine_501_516_source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medicine-501-516-source-probe
          path: medicine-501-516-source-probe.json
          if-no-files-found: error
