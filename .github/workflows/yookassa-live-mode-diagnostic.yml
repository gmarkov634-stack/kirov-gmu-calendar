name: YooKassa live mode diagnostic

on:
  push:
    paths:
      - ".github/workflows/yookassa-live-mode-diagnostic.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare a live current-offer intent with KGMU archive test
        env:
          KGMU_ADMIN_TOKEN: ${{ secrets.KGMU_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          base='https://kgmu-calendar-api.containerapps.ru'

          echo '== Discover a live current-offer group =='
          selected=''
          for university in omgmu kgmu; do
            programs_status="$(curl --silent --show-error --output /tmp/programs.json --write-out '%{http_code}' "$base/api/v2/catalog/$university/programs")"
            echo "CATALOG_PROGRAMS university=$university http=$programs_status"
            [ "$programs_status" = '200' ] || continue
            while IFS=$'\t' read -r program course; do
              [ -n "$program" ] || continue
              groups_status="$(curl --silent --show-error --output /tmp/groups.json --write-out '%{http_code}' "$base/api/v2/catalog/$university/$program/$course/groups")"
              [ "$groups_status" = '200' ] || continue
              group_code="$(jq -r '.groups[0].groupCode // empty' /tmp/groups.json)"
              group_id="$(jq -r '.groups[0].groupId // empty' /tmp/groups.json)"
              if [ -n "$group_code" ] && [ -n "$group_id" ]; then
                selected="$(jq -nc --arg u "$university" --arg p "$program" --argjson c "$course" --arg g "$group_code" --arg gid "$group_id" '{university:$u,program:$p,course:$c,groupCode:$g,groupId:$gid}')"
                break 2
              fi
            done < <(jq -r '.programs[]? as $p | $p.courses[]? | [$p.program, tostring] | @tsv' /tmp/programs.json)
          done

          live_status='000'
          if [ -n "$selected" ]; then
            echo "LIVE_TARGET=$(printf '%s' "$selected" | jq -c '{university,program,course,groupCode}')"
            payload="$(printf '%s' "$selected" | jq -c '. + {email:"yookassa-diagnostic@example.com",plan:"semester"}')"
            live_status="$(curl --silent --show-error --output /tmp/live.json --write-out '%{http_code}' \
              -X POST "$base/api/v2/payments" \
              -H 'Content-Type: application/json' \
              --data "$payload")"
            echo "LIVE_PAYMENT_HTTP=$live_status"
            if [ "$live_status" = '201' ]; then
              access="$(jq -r '.accessToken // empty' /tmp/live.json)"
              order="$(jq -r '.orderId // empty' /tmp/live.json)"
              test -n "$access" && echo "::add-mask::$access"
              test -n "$order" && test -n "$access"
              order_status="$(curl --silent --show-error --output /tmp/live-order.json --write-out '%{http_code}' \
                -H "X-Order-Token: $access" "$base/api/v1/orders/$order")"
              echo "LIVE_ORDER_HTTP=$order_status"
              jq '{status,testMode,university,program,course,groupCode,amount}' /tmp/live-order.json
            else
              jq '{error}' /tmp/live.json || cat /tmp/live.json
            fi
          else
            echo 'LIVE_TARGET=none'
          fi

          echo '== KGMU archive payment intent =='
          kgmu_status="$(curl --silent --show-error --output /tmp/kgmu.json --write-out '%{http_code}' \
            -X POST "$base/api/v1/admin/payments/test-archive" \
            -H "X-Admin-Token: $KGMU_ADMIN_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"program":"medicine","course":4,"groupCode":"401","academicYear":"2025/2026","semester":2,"email":"yookassa-diagnostic@example.com"}')"
          echo "KGMU_ARCHIVE_HTTP=$kgmu_status"
          jq '{error,testMode,archive}' /tmp/kgmu.json || cat /tmp/kgmu.json

          if [ "$live_status" = '201' ] && [ "$kgmu_status" = '503' ]; then
            echo 'DIAGNOSIS_SCOPE=kgmu_archive_specific'
          elif [ "$live_status" = '201' ] && [ "$kgmu_status" = '201' ]; then
            echo 'DIAGNOSIS_SCOPE=all_payment_intents_healthy'
          elif [ -z "$selected" ]; then
            echo 'DIAGNOSIS_SCOPE=no_current_offer_group_for_control'
          else
            echo 'DIAGNOSIS_SCOPE=current_offer_or_yookassa_unhealthy'
          fi
