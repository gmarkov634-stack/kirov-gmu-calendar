name: Deploy API to Cloud.ru

on:
  workflow_run:
    workflows:
      - Publish API image
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_sha:
        description: Exact main commit SHA whose API image is already published
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kgmu-production-api-deploy
  cancel-in-progress: false

env:
  IMAGE: kgmu-calendar-api.cr.cloud.ru/api
  CONTAINER_NAME: kgmu-calendar-api
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact published image digest
        id: image
        env:
          CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
          CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
          AUTO_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.image_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            target_sha="$AUTO_SHA"
          else
            target_sha="$MANUAL_SHA"
          fi
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "TARGET_SHA_SAFE=$target_sha"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Log in to Cloud.ru Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: kgmu-calendar-api.cr.cloud.ru
          username: ${{ secrets.EVO_CR_LOGIN }}
          password: ${{ secrets.EVO_CR_PWD }}

      - name: Resolve immutable image URI
        id: digest
        env:
          TARGET_SHA: ${{ steps.image.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          inspect="$(docker buildx imagetools inspect "${IMAGE}:${TARGET_SHA}")"
          digest="$(printf '%s\n' "$inspect" | awk '/^Digest:/ {print $2; exit}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          target_image="${IMAGE}@${digest}"
          echo "TARGET_IMAGE_SAFE=$target_image"
          echo "target_image=$target_image" >> "$GITHUB_OUTPUT"

      - name: Patch only production image and wait for active revision
        env:
          CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
          CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
          TARGET_IMAGE: ${{ steps.digest.outputs.target_image }}
        shell: bash
        run: |
          set -euo pipefail

          auth_payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({"keyId": os.environ["CLOUDRU_KEY_ID"], "secret": os.environ["CLOUDRU_KEY_SECRET"]}))
          PY
          )"
          auth_code="$(curl --silent --show-error --output /tmp/token.json --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data "$auth_payload" \
            'https://iam.api.cloud.ru/api/v1/auth/token')"
          test "$auth_code" = "200"

          readarray -t auth < <(python3 - <<'PY'
          import base64, json
          body=json.load(open('/tmp/token.json', encoding='utf-8'))
          token=body.get('access_token')
          assert isinstance(token, str) and token
          parts=token.split('.')
          assert len(parts)==3
          payload=parts[1] + '='*((4-len(parts[1])%4)%4)
          claims=json.loads(base64.urlsafe_b64decode(payload.encode()).decode())
          project_id=claims.get('project_id')
          subject_id=claims.get('sub_id') or claims.get('sub')
          assert isinstance(project_id, str) and project_id
          assert isinstance(subject_id, str) and subject_id
          print(token)
          print(project_id)
          print(subject_id)
          PY
          )
          token="${auth[0]}"
          project_id="${auth[1]}"
          subject_id="${auth[2]}"
          rm -f /tmp/token.json
          echo "::add-mask::$token"

          permissions_url="https://iam.api.cloud.ru/api/v1/permissions?subjectId=$subject_id&resourceId=$project_id"
          test "$(curl --silent --show-error --output /tmp/permissions.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $token" --header 'Accept: application/json' "$permissions_url")" = "200"
          python3 - <<'PY'
          import json
          body=json.load(open('/tmp/permissions.json', encoding='utf-8'))
          rows=body if isinstance(body,list) else body.get('permissions') or body.get('data') or body.get('items') or []
          roles={row.get('role'):row.get('enabled') for row in rows if isinstance(row,dict)}
          assert roles.get('serverless-containers.admin') is True, 'Cloud.ru admin role is required by the current write API'
          print('CLOUD_RBAC_SAFE', {'serverless-containers.admin': True})
          PY
          rm -f /tmp/permissions.json

          get_url="https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$project_id"
          patch_url="https://containers.api.cloud.ru/v2/containers/${CONTAINER_NAME}?projectId=$project_id"
          revisions_url="https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}/revisions?projectId=$project_id"

          test "$(curl --silent --show-error --output /tmp/current.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $token" --header 'Accept: application/json' "$get_url")" = "200"
          test "$(curl --silent --show-error --output /tmp/revisions-before.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $token" --header 'Accept: application/json' "$revisions_url")" = "200"

          TARGET_IMAGE="$TARGET_IMAGE" python3 - <<'PY'
          import json, os
          app=json.load(open('/tmp/current.json', encoding='utf-8'))
          assert app.get('name') == 'kgmu-calendar-api', app.get('name')
          assert app.get('status') == 'running', app.get('status')
          containers=app.get('template',{}).get('containers',[])
          assert len(containers)==1, len(containers)
          container=containers[0]
          current_image=container.get('image')
          assert isinstance(current_image,str) and current_image.startswith('kgmu-calendar-api.cr.cloud.ru/api'), current_image
          env={item.get('name'):item.get('value') for item in container.get('env',[]) if isinstance(item,dict)}
          for gate in ('FUNNEL_ANALYTICS_ENABLED','TRIALS_ENABLED','COMMERCIAL_SALES_ENABLED'):
              assert env.get(gate) != 'true', f'{gate} unexpectedly open; auto-deploy is intentionally fail-closed while launch gates are closed'
          rows=json.load(open('/tmp/revisions-before.json', encoding='utf-8')).get('data') or []
          active=[row for row in rows if isinstance(row,dict) and row.get('status')=='active']
          assert len(active)==1, active
          state={
              'oldRevision': active[0].get('name'),
              'oldImage': current_image,
              'targetImage': os.environ['TARGET_IMAGE'],
              'needsPatch': current_image != os.environ['TARGET_IMAGE'],
          }
          assert state['oldRevision']
          json.dump(state, open('/tmp/deploy-state.json','w', encoding='utf-8'))
          if state['needsPatch']:
              container['image']=os.environ['TARGET_IMAGE']
              json.dump(app, open('/tmp/patch.json','w',encoding='utf-8'), ensure_ascii=False, separators=(',',':'))
          print('DEPLOY_PRECHECK_SAFE', state | {'gates':'closed_or_unset'})
          PY

          needs_patch="$(python3 -c "import json; print('true' if json.load(open('/tmp/deploy-state.json'))['needsPatch'] else 'false')")"
          old_revision="$(python3 -c "import json; print(json.load(open('/tmp/deploy-state.json'))['oldRevision'])")"

          if [ "$needs_patch" = "true" ]; then
            patch_code="$(curl --silent --show-error --output /tmp/patch-response.json --write-out '%{http_code}' \
              --request PATCH --header "Authorization: Bearer $token" --header 'Content-Type: application/json' \
              --data-binary @/tmp/patch.json "$patch_url")"
            echo "CLOUD_PATCH_HTTP=$patch_code"
            if [ "$patch_code" != "200" ]; then
              python3 - <<'PY'
          import json
          try:
              body=json.load(open('/tmp/patch-response.json', encoding='utf-8'))
              print('CLOUD_PATCH_ERROR_SAFE', {k:body.get(k) for k in ('code','message','error','status') if k in body})
          except Exception:
              print('CLOUD_PATCH_ERROR_SAFE unreadable')
          PY
              exit 1
            fi
            rm -f /tmp/patch.json /tmp/patch-response.json

            new_revision=''
            for attempt in $(seq 1 60); do
              sleep 5
              test "$(curl --silent --show-error --output /tmp/revisions-now.json --write-out '%{http_code}' \
                --header "Authorization: Bearer $token" --header 'Accept: application/json' "$revisions_url")" = "200"
              new_revision="$(python3 - <<'PY'
          import json
          rows=json.load(open('/tmp/revisions-now.json', encoding='utf-8')).get('data') or []
          active=[row for row in rows if isinstance(row,dict) and row.get('status')=='active']
          print(active[0].get('name','') if len(active)==1 else '')
          PY
              )"
              echo "REVISION_POLL_SAFE attempt=$attempt active=${new_revision:-none}"
              if [ -n "$new_revision" ] && [ "$new_revision" != "$old_revision" ]; then
                break
              fi
            done
            test -n "$new_revision"
            test "$new_revision" != "$old_revision"
          else
            new_revision="$old_revision"
            echo "DEPLOY_SKIP_SAFE target image already active"
          fi

          ready='false'
          for attempt in $(seq 1 30); do
            test "$(curl --silent --show-error --output /tmp/after.json --write-out '%{http_code}' \
              --header "Authorization: Bearer $token" --header 'Accept: application/json' "$get_url")" = "200"
            if TARGET_IMAGE="$TARGET_IMAGE" python3 - <<'PY'
          import json, os, sys
          app=json.load(open('/tmp/after.json', encoding='utf-8'))
          containers=app.get('template',{}).get('containers',[])
          ok=(app.get('status')=='running' and len(containers)==1 and containers[0].get('image')==os.environ['TARGET_IMAGE'])
          sys.exit(0 if ok else 1)
          PY
            then
              ready='true'
              break
            fi
            sleep 3
          done
          test "$ready" = "true"

          TARGET_IMAGE="$TARGET_IMAGE" NEW_REVISION="$new_revision" python3 - <<'PY'
          import json, os
          app=json.load(open('/tmp/after.json', encoding='utf-8'))
          container=app['template']['containers'][0]
          assert container.get('image') == os.environ['TARGET_IMAGE']
          env={item.get('name'):item.get('value') for item in container.get('env',[]) if isinstance(item,dict)}
          for gate in ('FUNNEL_ANALYTICS_ENABLED','TRIALS_ENABLED','COMMERCIAL_SALES_ENABLED'):
              assert env.get(gate) != 'true', f'{gate} unexpectedly open after deploy'
          print('DEPLOY_RESULT_SAFE', {
              'revision': os.environ['NEW_REVISION'],
              'status': app.get('status'),
              'image': container.get('image'),
              'gates': 'closed_or_unset',
          })
          PY

          health="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 3 "${PRODUCTION_BASE_URL}/health")"
          meta="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 3 "${PRODUCTION_BASE_URL}/api/v2/meta")"
          python3 - "$health" "$meta" <<'PY'
          import json, sys
          health=json.loads(sys.argv[1])
          meta=json.loads(sys.argv[2])
          assert health == {'status':'ok','service':'medical-calendar-api'}, health
          assert meta.get('sales') == 'closed', meta
          assert meta.get('trials') == 'closed', meta
          print('DEPLOY_MINIMAL_SMOKE_SAFE', {'sales':meta.get('sales'),'trials':meta.get('trials'),'paymentMode':meta.get('paymentMode')})
          PY

  production-smoke:
    needs: deploy
    uses: ./.github/workflows/kgmu-production-smoke.yml
    secrets: inherit
