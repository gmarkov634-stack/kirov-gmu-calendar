name: ОмГМУ structural launch readiness

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "api/src/adapters/omgmu/**"
      - "api/src/schedule/**"
      - "api/src/app.js"
      - "api/src/config.js"
      - "api/src/order-context.js"
      - "api/src/year-aware-store.js"
      - "api/src/university-store.js"
      - "api/src/universities/**"
      - "api/src/vk-control-tenant-env.js"
      - "api/test/omgmu-*.test.js"
      - "api/test/omgmu-*.test.mjs"
      - "api/test/vk-omgmu-tenant-wiring.test.js"
      - "api/test/schedule-*.test.js"
      - "api/test/multi-university-flow.test.js"
      - "api/test/university-registry.test.js"
      - "api/test/fixtures/omgmu-*"
      - "api/tools/omgmu-historical-regression.mjs"
      - "api/tools/omgmu-launch-readiness.mjs"
      - "api/package.json"
      - "site/omgmu/**"
      - "omgmu/**"
      - "universities/omgmu/**"
      - ".github/workflows/omgmu-source-watch.yml"
      - ".github/workflows/omgmu-vk-control.yml"
      - ".github/workflows/omgmu-launch-readiness.yml"
  pull_request:
    paths:
      - "api/src/adapters/omgmu/**"
      - "api/src/schedule/**"
      - "api/src/app.js"
      - "api/src/config.js"
      - "api/src/order-context.js"
      - "api/src/year-aware-store.js"
      - "api/src/university-store.js"
      - "api/src/universities/**"
      - "api/src/vk-control-tenant-env.js"
      - "api/test/omgmu-*.test.js"
      - "api/test/omgmu-*.test.mjs"
      - "api/test/vk-omgmu-tenant-wiring.test.js"
      - "api/test/schedule-*.test.js"
      - "api/test/multi-university-flow.test.js"
      - "api/test/university-registry.test.js"
      - "api/test/fixtures/omgmu-*"
      - "api/tools/omgmu-historical-regression.mjs"
      - "api/tools/omgmu-launch-readiness.mjs"
      - "api/package.json"
      - "site/omgmu/**"
      - "omgmu/**"
      - "universities/omgmu/**"
      - ".github/workflows/omgmu-source-watch.yml"
      - ".github/workflows/omgmu-vk-control.yml"
      - ".github/workflows/omgmu-launch-readiness.yml"

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run structural readiness gate
        env:
          OMGMU_HISTORICAL_REPORT: data/regression/omgmu-historical-regression-report.json
          OMGMU_LAUNCH_READINESS_REPORT: data/regression/omgmu-launch-readiness-report.json
        run: npm run readiness:omgmu

      - name: Upload readiness reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omgmu-launch-readiness
          path: |
            api/data/regression/omgmu-historical-regression-report.json
            api/data/regression/omgmu-launch-readiness-report.json
          if-no-files-found: error
          retention-days: 90
