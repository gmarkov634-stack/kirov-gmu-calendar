name: UGMU one-shot trial secret dispatch

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ugmu-trial-secret-provision-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch guarded production secret provisioning and verify completion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(
            --header "Authorization: Bearer $GH_TOKEN"
            --header 'Accept: application/vnd.github+json'
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )

          before="$(curl --silent --show-error "${headers[@]}" \
            "$api/actions/workflows/ugmu-trial-secret-provision.yml/runs?event=workflow_dispatch&branch=main&per_page=10")"
          before_id="$(BEFORE="$before" python3 - <<'PY'
          import json, os
          data=json.loads(os.environ['BEFORE'])
          runs=data.get('workflow_runs', [])
          print(max((int(r['id']) for r in runs), default=0))
          PY
          )"

          code="$(curl --silent --show-error --output /tmp/dispatch.out --write-out '%{http_code}' \
            --request POST "${headers[@]}" \
            --data '{"ref":"main","inputs":{"confirm":"PROVISION_UGMU_TRIAL_SECRET"}}' \
            "$api/actions/workflows/ugmu-trial-secret-provision.yml/dispatches")"
          if [ "$code" != "204" ]; then
            cat /tmp/dispatch.out
            exit 1
          fi
          rm -f /tmp/dispatch.out

          run_id=''
          for attempt in $(seq 1 30); do
            runs="$(curl --silent --show-error "${headers[@]}" \
              "$api/actions/workflows/ugmu-trial-secret-provision.yml/runs?event=workflow_dispatch&branch=main&per_page=10")"
            run_id="$(RUNS="$runs" BEFORE_ID="$before_id" python3 - <<'PY'
          import json, os
          data=json.loads(os.environ['RUNS'])
          before=int(os.environ['BEFORE_ID'])
          ids=[int(r['id']) for r in data.get('workflow_runs', []) if int(r['id']) > before]
          print(max(ids) if ids else '')
          PY
          )"
            [ -n "$run_id" ] && break
            sleep 2
          done
          test -n "$run_id"

          conclusion=''
          for attempt in $(seq 1 80); do
            run="$(curl --silent --show-error "${headers[@]}" "$api/actions/runs/$run_id")"
            readarray -t state < <(RUN="$run" python3 - <<'PY'
          import json, os
          r=json.loads(os.environ['RUN'])
          print(r.get('status') or '')
          print(r.get('conclusion') or '')
          PY
          )
            if [ "${state[0]}" = 'completed' ]; then
              conclusion="${state[1]}"
              break
            fi
            sleep 3
          done
          test "$conclusion" = 'success'
          echo "UGMU_TRIAL_SECRET_PROVISION_COMPLETED_SAFE run_id=$run_id conclusion=$conclusion"
