name: UGMU one-shot trial secret dispatch

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ugmu-trial-secret-provision-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch guarded production secret provisioning
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/dispatch.out --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data '{"ref":"main","inputs":{"confirm":"PROVISION_UGMU_TRIAL_SECRET"}}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ugmu-trial-secret-provision.yml/dispatches")"
          if [ "$code" != "204" ]; then
            cat /tmp/dispatch.out
            exit 1
          fi
          rm -f /tmp/dispatch.out
          echo "UGMU_TRIAL_SECRET_PROVISION_DISPATCHED_SAFE"
