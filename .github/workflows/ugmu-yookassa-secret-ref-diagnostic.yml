name: UGMU YooKassa secret reference diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ugmu-yookassa-secret-ref-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
      CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
      CONTAINER_NAME: kgmu-calendar-api
      LIVE_SECRET: yookassa-secret-key
      TEST_SECRET: yookassa-test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Resolve safe metadata and reference mapping
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          auth_payload="$(python3 - <<'PY'
          import json,os
          print(json.dumps({'keyId':os.environ['CLOUDRU_KEY_ID'],'secret':os.environ['CLOUDRU_KEY_SECRET']}))
          PY
          )"
          test "$(curl -sS -o /tmp/cloud-token.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data "$auth_payload" https://iam.api.cloud.ru/api/v1/auth/token)" = 200
          readarray -t auth < <(python3 - <<'PY'
          import base64,json
          t=json.load(open('/tmp/cloud-token.json'))['access_token'];p=t.split('.')[1];p+='='*((4-len(p)%4)%4);c=json.loads(base64.urlsafe_b64decode(p.encode()));print(t);print(c['project_id'])
          PY
          )
          token="${auth[0]}"; project="${auth[1]}"; rm -f /tmp/cloud-token.json
          echo "::add-mask::$token"
          get="https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$project"
          test "$(curl -sS -o /tmp/container.json -w '%{http_code}' -H "Authorization: Bearer $token" "$get")" = 200
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/container.json')); c=a['template']['containers'][0]
          e={x.get('name'):x for x in c.get('env',[]) if isinstance(x,dict)}
          s=e.get('YOOKASSA_SECRET_KEY',{})
          assert s.get('type')=='secret' and s.get('value')
          open('/tmp/current-ref','w').write(str(s['value']))
          print('CONTAINER_SECRET_REF_SAFE',{'type':'secret','refLength':len(str(s['value'])),'testMode':e.get('YOOKASSA_TEST_MODE',{}).get('value'),'ugmuSales':e.get('UGMU_SALES_ENABLED',{}).get('value'),'globalSales':e.get('COMMERCIAL_SALES_ENABLED',{}).get('value'),'trials':e.get('TRIALS_ENABLED',{}).get('value')})
          PY
          mkdir -p /tmp/refdiag && cd /tmp/refdiag
          cat > go.mod <<'EOF'
          module ugmusecretrefdiag
          go 1.23.0
          require (
            github.com/cloudru-tech/secret-manager-sdk v1.1.1
            google.golang.org/grpc v1.70.0
            google.golang.org/protobuf v1.36.5
          )
          EOF
          cat > main.go <<'EOF'
          package main
          import("context";"encoding/json";"fmt";"os";"strings";"time";sm "github.com/cloudru-tech/secret-manager-sdk";v2 "github.com/cloudru-tech/secret-manager-sdk/api/v2";"google.golang.org/grpc/metadata";"google.golang.org/protobuf/encoding/protojson";"google.golang.org/protobuf/proto")
          func must(n string)string{v:=os.Getenv(n);if v==""{panic("missing "+n)};return v}
          func leaves(v any,p string,out map[string]string){switch x:=v.(type){case map[string]any:for k,y:=range x{q:=k;if p!=""{q=p+"."+k};leaves(y,q,out)};case []any:for i,y:=range x{leaves(y,fmt.Sprintf("%s[%d]",p,i),out)};case string:out[p]=x}}
          func find(rows []*v2.Secret,target string)*v2.Secret{var m []*v2.Secret;for _,s:=range rows{x:=s.GetPath();if x==target||strings.HasSuffix(x,"/"+target){m=append(m,s)}};if len(m)!=1{panic(fmt.Sprintf("secret %s matches=%d",target,len(m)))};return m[0]}
          func metadataMap(m proto.Message)map[string]string{b,e:=protojson.Marshal(m);if e!=nil{panic(e)};var x any;if e=json.Unmarshal(b,&x);e!=nil{panic(e)};out:=map[string]string{};leaves(x,"",out);return out}
          func main(){cl,e:=sm.New(&sm.Config{Host:"secretmanager.api.cloud.ru:443"});if e!=nil{panic(e)};defer cl.Close();ctx,c:=context.WithTimeout(context.Background(),30*time.Second);defer c();ctx=metadata.AppendToOutgoingContext(ctx,"authorization","Bearer "+must("TOKEN"));sr,e:=cl.V2.SecretService.Search(ctx,&v2.SearchSecretRequest{ProjectId:must("PROJECT"),Depth:-1});if e!=nil{panic(e)};live:=find(sr.GetSecrets(),must("LIVE"));test:=find(sr.GetSecrets(),must("TEST"));lm:=metadataMap(live);tm:=metadataMap(test);refb,e:=os.ReadFile("/tmp/current-ref");if e!=nil{panic(e)};ref:=string(refb);var exact,contains []string;for k,v:=range lm{if v!=""&&ref==v{exact=append(exact,k)};if len(v)>=6&&strings.Contains(ref,v){contains=append(contains,k)}};possible:=false;derivedField:="";testRefLen:=0;if len(exact)==1{if tv:=tm[exact[0]];tv!=""{possible=true;derivedField=exact[0];testRefLen=len(tv)}};fmt.Printf("SECRET_METADATA_SAFE livePath=%s testPath=%s liveFields=%d testFields=%d\n",live.GetPath(),test.GetPath(),len(lm),len(tm));fmt.Printf("SECRET_REF_MAPPING_SAFE exactMatches=%d containsMatches=%d derivable=%t derivedField=%s testRefLength=%d\n",len(exact),len(contains),possible,derivedField,testRefLen)}
          EOF
          go mod tidy
          TOKEN="$token" PROJECT="$project" LIVE="$LIVE_SECRET" TEST="$TEST_SECRET" go run .
