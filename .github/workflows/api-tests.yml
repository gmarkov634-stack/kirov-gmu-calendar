name: API tests

on:
  pull_request:
    paths:
      - "api/**"
      - "ops/patches/apply-vk-photo-import.mjs"
      - ".github/workflows/api-tests.yml"
  push:
    branches:
      - main
    paths:
      - "api/**"
      - ".github/workflows/api-tests.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - name: Apply temporary VK photo patch
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          node ops/patches/apply-vk-photo-import.mjs
          if ! git diff --quiet -- api/src/vk-control.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add api/src/vk-control.js
            git commit -m "feat(vk): add managed wall photo import"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Node regression tests
        run: node --test
      - name: OmGMU weekly parser self-test
        run: python3 tools/omgmu-parse-weekly-pdf.py --self-test
      - name: OmGMU fourth-course parser self-test
        run: python3 tools/omgmu-parse-fourth-pdf.py --self-test
