name: One-time verify payment-return API image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/omgmu-one-time-api-image-check-20260810.yml"

permissions:
  contents: write

jobs:
  verify:
    if: github.event.head_commit.message == 'Verify payment-return API image in Cloud.ru registry'
    runs-on: ubuntu-latest
    env:
      IMAGE: kgmu-calendar-api.cr.cloud.ru/api:a7eb36817636ab305b78f373725c76064230b7a9
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Cloud.ru Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: kgmu-calendar-api.cr.cloud.ru
          username: ${{ secrets.EVO_CR_LOGIN }}
          password: ${{ secrets.EVO_CR_PWD }}
      - name: Wait for immutable image tag
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 18); do
            if docker manifest inspect "$IMAGE" > /tmp/manifest.json 2>/dev/null; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" != 1 ]; then
            echo "Image tag did not appear: $IMAGE" >&2
            exit 2
          fi
          digest="$(sha256sum /tmp/manifest.json | awk '{print $1}')"
          mkdir -p ops/reports
          printf '{"version":1,"operation":"verify-api-image","image":"%s","available":true,"manifestSha256":"%s"}\n' "$IMAGE" "$digest" > ops/reports/omgmu-payment-return-api-image-20260810.json
      - name: Record image verification
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p ops/reports
          if [ ! -f ops/reports/omgmu-payment-return-api-image-20260810.json ]; then
            printf '{"version":1,"operation":"verify-api-image","image":"%s","available":false}\n' "$IMAGE" > ops/reports/omgmu-payment-return-api-image-20260810.json
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('ops/reports/omgmu-payment-return-api-image-20260810.json')
          d=json.loads(p.read_text()); d['jobStatus']=os.environ['JOB_STATUS']
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/reports/omgmu-payment-return-api-image-20260810.json
          git commit -m "Record payment-return API image verification" || true
          git push
