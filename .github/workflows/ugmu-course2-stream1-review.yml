name: UGMU course2 stream1 review

on:
  pull_request:
    paths:
      - "api/tools/ugmu-course2-stream1-*.py"
      - "api/tools/requirements-ugmu.txt"
      - "api/src/adapters/ugmu/**"
      - ".github/workflows/ugmu-course2-stream1-review.yml"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install PDF parser dependency
        run: python3 -m pip install -r tools/requirements-ugmu.txt

      - name: Discover official UGMU medicine sources
        run: node tools/ugmu-discover.mjs --program=medicine --output=data/imports/course2-source-manifest.json

      - name: Download official autumn PDFs
        run: node tools/ugmu-download.mjs --manifest=data/imports/course2-source-manifest.json --semester=autumn --output=data/imports/course2-pdfs

      - name: Extract, reconcile and expand only course2 stream I
        run: |
          set -euo pipefail
          report='data/imports/course2-pdfs/download-report.json'
          item="$(jq -c '.files[] | select(.status == "downloaded" and .course == 2 and .stream == "1" and .part == "combined")' "$report" | head -n 1)"
          test -n "$item"
          filename="$(jq -r '.filename' <<<"$item")"
          source_url="$(jq -r '.url' <<<"$item")"
          sha="$(jq -r '.sha256' <<<"$item")"
          test "$sha" = '8b81f37b517dd037c090b0d980ba4d916557f36c872fe0fc37031d4ae8808c6a'
          python3 tools/ugmu-course2-stream1-raw.py \
            --input="data/imports/course2-pdfs/$filename" \
            --source="$source_url" \
            --output=data/imports/course2-stream1/raw.json
          python3 tools/ugmu-course2-stream1-semantic.py \
            --raw=data/imports/course2-stream1/raw.json \
            --pdf="data/imports/course2-pdfs/$filename" \
            --output=data/imports/course2-stream1/semantic.json
          python3 tools/ugmu-course2-stream1-expand.py \
            --semantic=data/imports/course2-stream1/semantic.json \
            --output=data/imports/course2-stream1/dated-review.json
          jq -e '.summary.semanticPatternCount == 219 and .summary.canonicalizationPerformed == false and .summary.storageWritesPerformed == false and .summary.icsGenerated == false and .summary.publicationAllowed == false' data/imports/course2-stream1/dated-review.json >/dev/null
          jq '{summary:.summary, duplicates:.review.duplicates[:20], invalidIntervals:.review.invalidIntervals[:20], overlaps:.review.overlaps[:20]}' data/imports/course2-stream1/dated-review.json

      - name: Upload read-only review evidence
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-course2-stream1-review
          path: api/data/imports/course2-stream1/
          retention-days: 14
