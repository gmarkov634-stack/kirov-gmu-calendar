name: One-time publish approved ОмГМУ schedules

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/omgmu-one-time-publish-approved-20260810.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish-and-validate:
    if: github.event.head_commit.message == 'Publish approved ОмГМУ schedules from run 31341768461'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download verified publication plan
        uses: actions/download-artifact@v4
        with:
          name: omgmu-publication-plan
          path: api/data/publication/downloaded
          run-id: 31341768461
          github-token: ${{ github.token }}

      - name: Resolve package
        id: package
        run: |
          manifest="$(find data/publication/downloaded -name publication-manifest.json -type f -print -quit)"
          test -n "$manifest"
          package_dir="$(dirname "$manifest")"
          echo "dir=$package_dir" >> "$GITHUB_OUTPUT"

      - name: Validate package
        run: npm run publish:omgmu:s3 -- --package=${{ steps.package.outputs.dir }} --expected-publishable=43 --expected-blocked=0

      - name: Publish to Cloud.ru S3
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: npm run publish:omgmu:s3 -- --package=${{ steps.package.outputs.dir }} --expected-publishable=43 --expected-blocked=0 --confirm

      - name: Validate live API and landing
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p ops/reports live-check
          API_BASE="https://kgmu-calendar-api.containerapps.ru"
          SITE_ROOT="https://gmarkov634-stack.github.io/kirov-gmu-calendar"

          curl --fail --silent --show-error --max-time 30 "$API_BASE/health" -o live-check/health.json
          fetch_schedule() {
            group="$1"; course="$2"; group_id="$3"; stream="$4"
            url="$API_BASE/api/v2/schedules/omgmu/medicine-international/$course/$group_id/schedule?groupCode=$group"
            if [ -n "$stream" ]; then url="$url&stream=$stream"; fi
            for attempt in 1 2 3 4 5; do
              status="$(curl --silent --show-error --max-time 30 -o "live-check/$group.json" -w '%{http_code}' "$url" || true)"
              [ "$status" = "200" ] && return 0
              sleep 6
            done
            echo "Group $group did not become available" >&2
            return 1
          }
          fetch_schedule 2113 2 'omgmu%3Amedicine-international%3A2%3Astream-2%3A2113' 2
          fetch_schedule 2114 2 'omgmu%3Amedicine-international%3A2%3Astream-2%3A2114' 2
          fetch_schedule 389 3 'omgmu%3Amedicine-international%3A3%3A389' ''
          fetch_schedule 393 3 'omgmu%3Amedicine-international%3A3%3A393' ''

          for attempt in $(seq 1 20); do
            curl --silent --show-error --max-time 30 "$SITE_ROOT/site/omgmu/groups.js" -o live-check/groups.js || true
            curl --silent --show-error --max-time 30 "$SITE_ROOT/omgmu/config.js" -o live-check/config.js || true
            if grep -q '"2113"' live-check/groups.js 2>/dev/null && grep -q 'checkoutEnabled: false' live-check/config.js 2>/dev/null; then
              break
            fi
            sleep 10
          done

          python - <<'PY'
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('live-check')
          errors = []
          expected = {'2113': 176, '2114': 176, '389': 167, '393': 167}
          groups_report = {}
          for group, count in expected.items():
              data = json.loads((root / f'{group}.json').read_text(encoding='utf-8'))
              events = data.get('events', [])
              review = data.get('review', {})
              if data.get('group', {}).get('code') != group:
                  errors.append(f'{group}: wrong group code')
              if len(events) != count:
                  errors.append(f'{group}: {len(events)} events, expected {count}')
              if review.get('status') != 'approved':
                  errors.append(f'{group}: review is not approved')
              if not events or any(event.get('sourceType') != 'manual-review' for event in events):
                  errors.append(f'{group}: untrusted event source type')
              groups_report[group] = {
                  'eventCount': len(events),
                  'reviewStatus': review.get('status'),
                  'sourceSha256': review.get('sourceSha256'),
                  'eventsSha256': review.get('eventsSha256'),
                  'applicationConfirmedBy': review.get('applicationConfirmedBy'),
              }

          groups_text = (root / 'groups.js').read_text(encoding='utf-8', errors='replace')
          exposed = sorted(set(re.findall(r'"(\d{3,4})"', groups_text)), key=int)
          if len(exposed) != 43:
              errors.append(f'landing exposes {len(exposed)} groups, expected 43')
          for group in expected:
              if group not in exposed:
                  errors.append(f'landing is missing {group}')

          config_text = (root / 'config.js').read_text(encoding='utf-8', errors='replace')
          checkout_disabled = bool(re.search(r'checkoutEnabled\s*:\s*false', config_text))
          if not checkout_disabled:
              errors.append('checkout is not disabled')

          report = {
              'version': 1,
              'university': 'omgmu',
              'operation': 'publish-approved-manual-reviews',
              'sourceRunId': 31341768461,
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'groups': groups_report,
              'landing': {
                  'groupCount': len(exposed),
                  'checkoutDisabled': checkout_disabled,
              },
              'errors': errors,
              'status': 'success' if not errors else 'failure',
          }
          Path('ops/reports/omgmu-approved-publication-20260810.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, ensure_ascii=False))
          if errors:
              raise SystemExit(2)
          PY

      - name: Record result
        if: always()
        working-directory: .
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p ops/reports
          if [ ! -f ops/reports/omgmu-approved-publication-20260810.json ]; then
            printf '{"version":1,"university":"omgmu","operation":"publish-approved-manual-reviews","sourceRunId":31341768461,"status":"failure","errors":["validation report was not generated"]}\n' > ops/reports/omgmu-approved-publication-20260810.json
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('ops/reports/omgmu-approved-publication-20260810.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['jobStatus'] = os.environ['JOB_STATUS']
          reports = list(Path('api/data/publication/downloaded').rglob('s3-publication-report.json'))
          if reports:
              data['s3Publication'] = json.loads(reports[0].read_text(encoding='utf-8'))
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/reports/omgmu-approved-publication-20260810.json
          git commit -m "Record approved ОмГМУ publication result" || true
          git push
