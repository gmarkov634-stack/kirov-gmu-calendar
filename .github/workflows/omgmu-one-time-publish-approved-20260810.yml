name: One-time ОмГМУ production storage E2E

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/omgmu-one-time-publish-approved-20260810.yml"

permissions:
  contents: read

jobs:
  e2e:
    if: startsWith(github.event.head_commit.message, 'Run one-time ОмГМУ production storage E2E')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout pinned reviewed ОмГМУ source implementation
        uses: actions/checkout@v4
        with:
          ref: feb41a27b9d2406083e583534685af315e6dc924

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Verify production current/subscription A -> B -> A
        env:
          KGMU_ADMIN_TOKEN: ${{ secrets.KGMU_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import zlib from 'node:zlib';
          import { createHash } from 'node:crypto';
          import { buildWeeklyGridCanonicalCandidate } from './api/src/adapters/omgmu/weekly-grid.mjs';

          const base = 'https://kgmu-calendar-api.containerapps.ru';
          const adminToken = process.env.KGMU_ADMIN_TOKEN;
          if (!adminToken || adminToken.length < 32) throw new Error('KGMU_ADMIN_TOKEN missing');

          const sourceFile = '03_medicine-international_course-2_stream-1_combined.pdf';
          const sourceSha = 'f34129fe1a98ca8935620fce10b3adab7ca3858e5f5e842fe38bcfc85491d3da';
          const fixturePath = path.resolve('api/test/fixtures/omgmu-weekly-course2-stream1.geometry.json.gz.b64');
          const encoded = fs.readFileSync(fixturePath, 'utf8').trim();
          const geometry = JSON.parse(zlib.gunzipSync(Buffer.from(encoded, 'base64')).toString('utf8'));
          const candidate = buildWeeklyGridCanonicalCandidate(geometry, {
            metadata: {
              academicYear: '2025/2026',
              semester: 'spring',
              facultyCode: 'medicine-international',
              facultyName: 'Лечебное дело для иностранных граждан',
              course: 2,
              stream: '1',
              group: '2101',
              period: {
                start_date: '2026-04-01',
                end_date: '2026-08-08',
                week1_start_date: '2026-03-30',
              },
              calendarExceptions: ['2026-05-01', '2026-05-09', '2026-06-12'],
            },
            source: { fileName: sourceFile, fileHash: sourceSha },
          });
          if (candidate.review !== null) throw new Error(`group 2101 unexpectedly requires review: ${JSON.stringify(candidate.review)}`);
          const A = candidate.batch;
          if (!Array.isArray(A.events) || A.events.length < 50) throw new Error(`unexpected baseline event count ${A.events?.length}`);
          if (A.events.some((event) => event.parse?.status === 'needs_review')) throw new Error('baseline contains needs_review');
          const N = A.events.length;
          const expectedGroupId = 'omgmu:medicine-international:2:stream-1:2101';

          async function jsonRequest(url, { method = 'GET', body, admin = false } = {}) {
            const headers = {};
            if (admin) headers['X-Admin-Token'] = adminToken;
            if (body !== undefined) headers['Content-Type'] = 'application/json';
            const response = await fetch(url, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
            const text = await response.text();
            let parsed;
            try { parsed = JSON.parse(text); } catch { parsed = { error: 'non_json_response', raw: text.slice(0, 300) }; }
            if (!response.ok) throw new Error(`HTTP ${response.status}: ${JSON.stringify(parsed)}`);
            return parsed;
          }

          async function publish(batch) {
            return jsonRequest(`${base}/api/v1/admin/schedules/publish`, { method: 'POST', body: batch, admin: true });
          }

          async function ensureBaseline(label, maxAttempts = 5) {
            let last = null;
            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              last = await publish(structuredClone(A));
              console.log(`${label}_BASELINE_ATTEMPT attempt=${attempt} status=${last.status} version=${last.scheduleVersionId || 'n/a'} counts=${JSON.stringify(last.diff?.counts || {})}`);
              if (last.status === 'unchanged' && last.diff?.same_content === true && last.eventCount === N) {
                return { result: last, attempts: attempt };
              }
              if (last.status !== 'published') throw new Error(`${label} unexpected baseline status ${last.status}`);
            }
            throw new Error(`${label} baseline did not converge`);
          }

          async function readIcs(url) {
            const response = await fetch(url, { cache: 'no-store' });
            const text = await response.text();
            if (!response.ok) throw new Error(`ICS HTTP ${response.status}: ${text.slice(0, 200)}`);
            return { text, status: response.headers.get('x-subscription-status') };
          }

          function vevents(text) {
            const lines = text.replace(/\r?\n[ \t]/g, '').split(/\r?\n/);
            const out = [];
            let current = null;
            for (const line of lines) {
              if (line === 'BEGIN:VEVENT') { current = []; continue; }
              if (line === 'END:VEVENT') { if (current) out.push(current); current = null; continue; }
              if (current) current.push(line);
            }
            return out;
          }

          function field(block, name) {
            const prefix = `${name}:`;
            const line = block.find((item) => item.startsWith(prefix));
            return line?.slice(prefix.length) ?? null;
          }

          function minutes(value) {
            const [h, m] = value.split(':').map(Number);
            return h * 60 + m;
          }

          function hhmm(total) {
            return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
          }

          const B = structuredClone(A);
          const keys = new Map();
          for (const event of B.events) {
            if (event.timing?.all_day || !/^\d{2}:\d{2}$/.test(event.timing?.start_time || '') || !/^\d{2}:\d{2}$/.test(event.timing?.end_time || '')) continue;
            const key = `${event.timing.date}|${event.timing.start_time}|${event.lesson?.discipline?.normalized || ''}`;
            keys.set(key, (keys.get(key) || 0) + 1);
          }
          const target = B.events.find((event) => {
            if (event.timing?.all_day || !/^\d{2}:\d{2}$/.test(event.timing?.start_time || '') || !/^\d{2}:\d{2}$/.test(event.timing?.end_time || '')) return false;
            if (minutes(event.timing.end_time) - minutes(event.timing.start_time) <= 10) return false;
            const key = `${event.timing.date}|${event.timing.start_time}|${event.lesson?.discipline?.normalized || ''}`;
            return keys.get(key) === 1;
          });
          if (!target) throw new Error('safe controlled-change event not found');
          const targetInfo = {
            date: target.timing.date,
            start: target.timing.start_time,
            originalEnd: target.timing.end_time,
            changedEnd: hhmm(minutes(target.timing.end_time) - 1),
            discipline: target.lesson?.discipline?.normalized,
          };
          target.timing.end_time = targetInfo.changedEnd;

          let subscriptionUrl = null;
          let tokenHash = null;
          let bPublished = false;
          let normalCompletion = false;
          try {
            const health = await jsonRequest(`${base}/health`);
            if (health.status !== 'ok' || health.service !== 'medical-calendar-api') throw new Error('bad production health');
            const meta = await jsonRequest(`${base}/api/v2/meta`);
            if (meta.sales !== 'closed') throw new Error(`commercial sales unexpectedly open: ${meta.sales}`);

            const baselineState = await ensureBaseline('INITIAL');
            const baseline = baselineState.result;
            const baselineFingerprint = baseline.contentFingerprint;
            console.log(`BASELINE_OK events=${N} version=${baseline.scheduleVersionId} fingerprint=${baselineFingerprint} convergenceAttempts=${baselineState.attempts}`);
            console.log(`CONTROLLED_CHANGE ${targetInfo.date} ${targetInfo.start}-${targetInfo.originalEnd}->${targetInfo.changedEnd} ${targetInfo.discipline}`);

            const preview = await jsonRequest(`${base}/api/v1/admin/subscriptions/preview`, {
              method: 'POST',
              admin: true,
              body: {
                university: 'omgmu',
                program: 'medicine-international',
                course: 2,
                stream: '1',
                groupCode: '2101',
                groupId: expectedGroupId,
                academicYear: '2025/2026',
                semester: 2,
                days: 1,
              },
            });
            if (preview.status !== 'active' || preview.preview !== true || preview.groupCode !== '2101') throw new Error(`preview creation failed: ${JSON.stringify(preview)}`);
            subscriptionUrl = preview.subscriptionUrl;
            const match = new URL(subscriptionUrl).pathname.match(/^\/api\/v1\/subscriptions\/([A-Za-z0-9_-]{43})\/calendar\.ics$/);
            if (!match) throw new Error('bad preview subscription URL');
            console.log(`::add-mask::${match[1]}`);
            tokenHash = createHash('sha256').update(match[1]).digest('hex');
            console.log(`PREVIEW_CREATED expiresAt=${preview.expiresAt}`);

            const feedA = await readIcs(subscriptionUrl);
            if (feedA.status !== 'active') throw new Error(`baseline feed status ${feedA.status}`);
            const eventsA = vevents(feedA.text);
            if (eventsA.length < N) throw new Error(`baseline ICS event count ${eventsA.length} < canonical ${N}`);

            const changed = await publish(B);
            const countsB = changed.diff?.counts || {};
            if (changed.status !== 'published' || countsB.added !== 0 || countsB.changed !== 1 || countsB.removed !== 0 || countsB.unchanged !== N - 1) {
              throw new Error(`bad B diff ${JSON.stringify(countsB)}`);
            }
            bPublished = true;
            const changedEvent = changed.diff.changed?.[0];
            if (!changedEvent?.event_id || !changedEvent.changes?.some((change) => change.path === '/timing/end_time')) throw new Error('B changed event mismatch');
            const eventId = changedEvent.event_id;
            const uid = `${eventId}@omgmu-calendar`;
            const eventA = eventsA.find((block) => field(block, 'UID') === uid);
            if (!eventA) throw new Error('target UID missing from baseline feed');
            const seqA = Number(field(eventA, 'SEQUENCE'));
            if (!Number.isInteger(seqA)) throw new Error('baseline sequence missing');

            const feedB = await readIcs(subscriptionUrl);
            if (feedB.status !== 'active') throw new Error(`B feed status ${feedB.status}`);
            const eventsB = vevents(feedB.text);
            const eventB = eventsB.find((block) => field(block, 'UID') === uid);
            if (!eventB) throw new Error('target UID missing from B feed');
            const seqB = Number(field(eventB, 'SEQUENCE'));
            if (seqB !== seqA + 1) throw new Error(`SEQUENCE A->B ${seqA}->${seqB}`);
            if (field(eventA, 'DTSTART') !== field(eventB, 'DTSTART')) throw new Error('DTSTART changed unexpectedly');
            if (field(eventA, 'DTEND') === field(eventB, 'DTEND')) throw new Error('DTEND did not change');
            if (eventsB.length !== eventsA.length) throw new Error('VEVENT count changed A->B');
            console.log(`A_B_OK uid=${uid} sequence=${seqA}->${seqB} dtend=${field(eventA, 'DTEND')}->${field(eventB, 'DTEND')} sameUrl=true`);

            const restored = await publish(structuredClone(A));
            bPublished = false;
            const countsC = restored.diff?.counts || {};
            if (restored.status !== 'published' || countsC.added !== 0 || countsC.changed !== 1 || countsC.removed !== 0 || countsC.unchanged !== N - 1) {
              throw new Error(`bad rollback diff ${JSON.stringify(countsC)}`);
            }
            const restoredEvent = restored.diff.changed?.find((item) => item.event_id === eventId);
            if (!restoredEvent || !restoredEvent.changes?.some((change) => change.path === '/timing/end_time')) throw new Error('rollback target identity mismatch');

            const feedC = await readIcs(subscriptionUrl);
            if (feedC.status !== 'active') throw new Error(`rollback feed status ${feedC.status}`);
            const eventsC = vevents(feedC.text);
            const eventC = eventsC.find((block) => field(block, 'UID') === uid);
            if (!eventC) throw new Error('target UID missing after rollback');
            const seqC = Number(field(eventC, 'SEQUENCE'));
            if (seqC !== seqB + 1) throw new Error(`SEQUENCE B->A ${seqB}->${seqC}`);
            if (field(eventC, 'DTSTART') !== field(eventA, 'DTSTART') || field(eventC, 'DTEND') !== field(eventA, 'DTEND')) throw new Error('baseline timing not restored');
            if (eventsC.length !== eventsA.length) throw new Error('VEVENT count changed after rollback');
            console.log(`A_B_A_OK uid=${uid} sequence=${seqA}->${seqB}->${seqC} restoredDtend=${field(eventC, 'DTEND')} sameUrl=true`);

            const finalState = await ensureBaseline('FINAL');
            if (finalState.result.contentFingerprint !== baselineFingerprint) throw new Error('final baseline fingerprint differs');
            console.log(`FINAL_BASELINE_OK version=${finalState.result.scheduleVersionId} fingerprint=${finalState.result.contentFingerprint}`);

            const revoked = await jsonRequest(`${base}/api/v1/admin/subscriptions/${tokenHash}/revoke`, { method: 'POST', admin: true });
            if (revoked.status !== 'revoked' || revoked.groupCode !== '2101') throw new Error('preview revoke failed');
            tokenHash = null;
            const revokedFeed = await readIcs(subscriptionUrl);
            if (revokedFeed.status !== 'revoked' || vevents(revokedFeed.text).length !== 0) throw new Error('revoked feed still exposes events');
            console.log('PREVIEW_REVOKED_AND_EMPTY');
            normalCompletion = true;
            console.log('OMGMU_PRODUCTION_STORAGE_E2E_SUCCESS');
          } finally {
            if (bPublished) {
              try {
                const cleanup = await ensureBaseline('CLEANUP');
                console.log(`CLEANUP_RESTORE_OK version=${cleanup.result.scheduleVersionId} attempts=${cleanup.attempts}`);
              } catch (error) {
                console.error(`CLEANUP_RESTORE_FAILED ${error.message}`);
              }
            }
            if (tokenHash) {
              try {
                const revoked = await jsonRequest(`${base}/api/v1/admin/subscriptions/${tokenHash}/revoke`, { method: 'POST', admin: true });
                console.log(`CLEANUP_REVOKE status=${revoked.status || 'unknown'}`);
              } catch (error) {
                console.error(`CLEANUP_REVOKE_FAILED ${error.message}`);
              }
            }
            if (!normalCompletion) console.log('E2E_ABORTED_AFTER_CLEANUP');
          }
          NODE
