name: IzhGMU medicine-1 personalization

on:
  push:
    branches:
      - agent/izhgmu-batch-acquisition
    paths:
      - "api/src/adapters/izhgmu/weekly-parser.mjs"
      - "api/src/adapters/izhgmu/lecture-parser.mjs"
      - "api/src/adapters/izhgmu/weekly-lecture-elective-catalog.mjs"
      - "api/src/adapters/izhgmu/weekly-lecture-personalization-readiness.mjs"
      - "api/src/subscription-personalization.js"
      - "api/src/funnel-analytics-store.js"
      - "api/src/subscription-preferences-handler.js"
      - "api/src/schedule/personalization-publication.js"
      - "api/src/schedule/pipeline.js"
      - "api/src/schedule/publish-handler.js"
      - "api/tools/izhgmu-check-medicine1-electives.mjs"
      - "api/tools/izhgmu-check-medicine1-publication.mjs"
      - "api/tools/izhgmu-check-medicine1-readiness.mjs"
      - "api/tools/izhgmu-build-medicine1-dryrun-packages.mjs"
      - "api/tools/izhgmu-annotate-medicine1-dryrun-readiness.mjs"
      - "api/tools/izhgmu-audit-medicine1-curator.mjs"
      - "api/tools/izhgmu-audit-medicine1-curator-geometry.mjs"
      - "api/test/izhgmu-weekly-lecture-elective-catalog.test.mjs"
      - "api/test/izhgmu-weekly-lecture-personalization-readiness.test.mjs"
      - "api/test/subscription-personalization.test.js"
      - "api/test/schedule-personalization-publication.test.js"
      - ".github/workflows/izhgmu-medicine1-personalization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        working-directory: api
        run: npm ci
      - name: Run personalization unit regression
        working-directory: api
        run: node --test test/izhgmu-weekly-lecture-elective-catalog.test.mjs test/izhgmu-weekly-lecture-personalization-readiness.test.mjs test/subscription-personalization.test.js test/schedule-personalization-publication.test.js
      - name: Collect exact current official IzhGMU sources
        working-directory: api
        run: npm run collect:izhgmu -- --output /tmp/izhgmu-current --concurrency 4
      - name: Verify all medicine course-1 streams and groups
        working-directory: api
        run: node tools/izhgmu-check-medicine1-electives.mjs --input-dir /tmp/izhgmu-current
      - name: Audit start-only curator evidence
        working-directory: api
        run: node tools/izhgmu-audit-medicine1-curator.mjs --input-dir /tmp/izhgmu-current
      - name: Audit curator row time geometry
        working-directory: api
        run: node tools/izhgmu-audit-medicine1-curator-geometry.mjs --input-dir /tmp/izhgmu-current
      - name: Verify real content readiness state
        working-directory: api
        run: node tools/izhgmu-check-medicine1-readiness.mjs --input-dir /tmp/izhgmu-current
      - name: Verify real group-109 publication boundary
        working-directory: api
        run: node tools/izhgmu-check-medicine1-publication.mjs --input-dir /tmp/izhgmu-current
      - name: Build dry-run packages for all 30 groups
        working-directory: api
        run: node tools/izhgmu-build-medicine1-dryrun-packages.mjs --input-dir /tmp/izhgmu-current --output-dir /tmp/izhgmu-medicine1-dryrun
      - name: Bind dry-run package manifest to readiness
        working-directory: api
        run: node tools/izhgmu-annotate-medicine1-dryrun-readiness.mjs --input-dir /tmp/izhgmu-current --package-dir /tmp/izhgmu-medicine1-dryrun
      - name: Show personalization summary
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/izhgmu-current/medicine1-elective-personalization.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/izhgmu-current/medicine1-elective-personalization.json').read_text())
          print('STATUS', report['status'])
          for stream in report['streams']:
              print('STREAM', stream['stream'], 'GROUPS', ','.join(stream['groups']))
              print('  OPTIONS', stream['optionCount'], 'EVENTS_PER_OPTION', stream['eventsPerOption'])
              print('  SOURCE_BLOCKS', stream['sourceBlockRefs'], 'PRACTICE_BLOCKS', stream['practiceBlockRefs'])
              if stream['manifestAcademicYear'] != stream['sourceAcademicYear']:
                  print('  MANIFEST_YEAR_DIAGNOSTIC', stream['manifestAcademicYear'], '=>', stream['sourceAcademicYear'])
          print('GROUP_109_SCENARIO', report['scenario109'])
          PY
          else
            echo "Personalization report was not generated."
          fi
          if [ -f /tmp/izhgmu-current/medicine1-curator-audit.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path('/tmp/izhgmu-current/medicine1-curator-audit.json').read_text())
          print('CURATOR_AUDIT', audit['summary'])
          PY
          fi
          if [ -f /tmp/izhgmu-current/medicine1-curator-geometry.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path('/tmp/izhgmu-current/medicine1-curator-geometry.json').read_text())
          print('CURATOR_GEOMETRY', audit['summary'])
          PY
          fi
          if [ -f /tmp/izhgmu-current/medicine1-readiness.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          readiness=json.loads(Path('/tmp/izhgmu-current/medicine1-readiness.json').read_text())
          print('CONTENT_READINESS', readiness['summary'])
          PY
          fi
          if [ -f /tmp/izhgmu-medicine1-dryrun/manifest.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('/tmp/izhgmu-medicine1-dryrun/manifest.json').read_text())
          print('DRYRUN_SUMMARY', manifest['summary'])
          print('CONTENT_READY_ALL', manifest.get('contentReady'))
          print('PRODUCTION_AUTHORIZED', manifest['productionAuthorized'])
          PY
          fi
      - name: Upload medicine-1 personalization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izhgmu-medicine1-personalization
          path: |
            /tmp/izhgmu-current/medicine1-elective-personalization.json
            /tmp/izhgmu-current/medicine1-curator-audit.json
            /tmp/izhgmu-current/medicine1-curator-geometry.json
            /tmp/izhgmu-current/medicine1-readiness.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload medicine-1 dry-run packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izhgmu-medicine1-dryrun-packages
          path: /tmp/izhgmu-medicine1-dryrun
          if-no-files-found: warn
          retention-days: 14
