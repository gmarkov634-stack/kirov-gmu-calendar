name: Publish reviewed KGMU bundle

on:
  push:
    branches:
      - main
    paths:
      - "reviewed/kgmu/*.json"
      - "reviewed/kgmu/**/*.json"
      - "api/tools/validate-reviewed-kgmu.mjs"
      - "api/src/adapters/kgmu/reviewed-bundle.mjs"
  workflow_dispatch:
    inputs:
      bundle_path:
        description: "Path to one reviewed KGMU JSON bundle"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-reviewed-kgmu
  cancel-in-progress: false

env:
  KGMU_API_URL: https://kgmu-calendar-api.containerapps.ru

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve bundle files
        id: files
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf '%s\n' "${{ inputs.bundle_path }}" > /tmp/kgmu-reviewed-files.txt
          else
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- reviewed/kgmu \
              | grep -E '^reviewed/kgmu/.+\.json$' \
              | while IFS= read -r file; do [ -f "$file" ] && printf '%s\n' "$file"; done \
              > /tmp/kgmu-reviewed-files.txt || true
          fi
          if [ ! -s /tmp/kgmu-reviewed-files.txt ]; then
            echo "No reviewed JSON bundles to publish."
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/kgmu-reviewed-files.txt
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate reviewed JSON
        if: steps.files.outputs.has_files == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < /tmp/kgmu-reviewed-files.txt
          node api/tools/validate-reviewed-kgmu.mjs "${files[@]}"

      - name: Require API credential
        if: steps.files.outputs.has_files == 'true'
        env:
          KGMU_ADMIN_TOKEN: ${{ secrets.KGMU_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KGMU_ADMIN_TOKEN" ]; then
            echo "KGMU_ADMIN_TOKEN repository secret is not configured."
            exit 1
          fi

      - name: Publish reviewed bundles atomically
        if: steps.files.outputs.has_files == 'true'
        env:
          KGMU_ADMIN_TOKEN: ${{ secrets.KGMU_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "Publishing $file"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Content-Type: application/json" \
              --header "X-Admin-Token: $KGMU_ADMIN_TOKEN" \
              --data-binary "@$file" \
              "$KGMU_API_URL/api/v1/admin/kgmu/reviewed-bundle?publish=true"
            echo
          done < /tmp/kgmu-reviewed-files.txt
