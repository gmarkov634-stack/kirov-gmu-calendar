name: KGMU canonical overlap inspect

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/kgmu-canonical-overlap-inspect.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified official XLSX
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='reviewed/kgmu/2025-26/2/medicine/4/146876a71f1ad8503593aeb82fcc72fef76022896b85d7f7dc61ca7ec97c0dae.json';
          const legacy=JSON.parse(fs.readFileSync(path,'utf8'));
          fs.writeFileSync('/tmp/source-meta.json',JSON.stringify(legacy.source));
          NODE
          url="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/source-meta.json','utf8')).url")"
          expected="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/source-meta.json','utf8')).sha256")"
          curl --fail-with-body --silent --show-error --location "$url" -o /tmp/source.xlsx
          actual="$(sha256sum /tmp/source.xlsx | cut -d' ' -f1)"
          test "$actual" = "$expected"

      - name: Inspect reference table row 47 and headings
        shell: bash
        run: |
          python3 -m pip install --quiet openpyxl
          python3 - <<'PY'
          import json
          from openpyxl import load_workbook
          from openpyxl.utils import column_index_from_string
          wb=load_workbook('/tmp/source.xlsx',data_only=False,read_only=False)
          out=[]
          for ws in wb.worksheets:
              if ws['C47'].value in (None,''): continue
              vals=[]
              for r in range(37,50):
                  row=[]
                  for c in range(1,90):
                      cell=ws.cell(r,c)
                      if cell.value not in (None,'') and str(cell.value).strip():
                          row.append({'cell':cell.coordinate,'value':str(cell.value).replace('\n',' | ')})
                  if row: vals.append({'row':r,'values':row})
              merges=[str(rng) for rng in ws.merged_cells.ranges if rng.min_row<=49 and rng.max_row>=37]
              out.append({'sheet':ws.title,'rows':vals,'merges':merges})
          print('REFERENCE_TABLE_CONTEXT_BEGIN')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          print('REFERENCE_TABLE_CONTEXT_END')
          PY
