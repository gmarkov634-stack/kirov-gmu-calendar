name: IzhGMU stage I diagnostic
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Diagnose Node test files
        shell: bash
        run: |
          set +e
          failed=0
          for file in test/*.test.js; do
            node --test "$file" >/tmp/out 2>&1
            if [ $? -ne 0 ]; then
              echo "::error file=$file::Standalone Node test file failed"
              cat /tmp/out
              failed=1
            fi
          done
          exit "$failed"
