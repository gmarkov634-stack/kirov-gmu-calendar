name: UGMU YooKassa test payment cleanup

on:
  push:
    branches:
      - agent/ugmu-scaffold-20260820
    paths:
      - "universities/ugmu/yookassa-test-payment-cleanup.json"

permissions:
  contents: read

env:
  CONTAINER_NAME: kgmu-calendar-api
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru
  TEST_SHOP_ID: "1259975"
  TEST_SECRET: yookassa-test-secret-key
  OPENED_AFTER: "2026-08-21T08:27:00Z"
  S3_BUCKET: kgmu-calendar-data-gmarkov634
  S3_ENDPOINT: https://s3.cloud.ru
  S3_REGION: ru-central-1

jobs:
  verify-and-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
      CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
      DIRECT_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      DIRECT_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout exact authority commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify one-shot authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          p='universities/ugmu/yookassa-test-payment-cleanup.json'
          a=json.load(open(p,encoding='utf-8'))
          assert a['version']==1
          assert a['kind']=='ugmu-yookassa-test-payment-cleanup'
          assert a['boundary']=='temporary-yookassa-test-window'
          assert a['authorizedBranch']=='agent/ugmu-scaffold-20260820'
          assert a['testShopId']=='1259975'
          assert a['userAuthorization']=='Оплатил'
          assert a['verifyWebhookFulfillment'] is True
          assert a['revokeTestSubscription'] is True
          assert a['restoreLiveInThisRun'] is False
          prepared=a['preparedWorkflowHead']; assert len(prepared)==40
          changed=subprocess.check_output(['git','diff','--name-only',prepared,'HEAD'],text=True).splitlines()
          assert changed==[p],changed
          print('UGMU_TEST_PAYMENT_CLEANUP_AUTHORITY_SAFE')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Read current Cloud.ru test-window state
        id: cloud
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          payload="$(python3 - <<'PY'
          import json,os
          print(json.dumps({'keyId':os.environ['CLOUDRU_KEY_ID'],'secret':os.environ['CLOUDRU_KEY_SECRET']}))
          PY
          )"
          test "$(curl -sS -o /tmp/cloud-token.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data "$payload" https://iam.api.cloud.ru/api/v1/auth/token)" = 200
          readarray -t auth < <(python3 - <<'PY'
          import base64,json
          t=json.load(open('/tmp/cloud-token.json'))['access_token'];p=t.split('.')[1];p+='='*((4-len(p)%4)%4);c=json.loads(base64.urlsafe_b64decode(p.encode()));print(t);print(c['project_id'])
          PY
          )
          token="${auth[0]}"; project="${auth[1]}"; rm -f /tmp/cloud-token.json
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"; echo "project=$project" >> "$GITHUB_OUTPUT"
          test "$(curl -sS -o /tmp/container.json -w '%{http_code}' -H "Authorization: Bearer $token" "https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$project")" = 200
          TEST_SHOP_ID="$TEST_SHOP_ID" TEST_SECRET="$TEST_SECRET" python3 - <<'PY'
          import json,os
          a=json.load(open('/tmp/container.json'));assert a.get('status')=='running'
          c=a['template']['containers'][0];e={x.get('name'):x for x in c.get('env',[]) if isinstance(x,dict)}
          assert e.get('COMMERCIAL_SALES_ENABLED',{}).get('value')!='true'
          assert e.get('UGMU_SALES_ENABLED',{}).get('value')=='true'
          assert e.get('UGMU_ACTIVE',{}).get('value')=='true'
          assert e.get('TRIALS_ENABLED',{}).get('value')!='true'
          assert e.get('YOOKASSA_TEST_MODE',{}).get('value')=='true'
          assert e.get('YOOKASSA_SHOP_ID',{}).get('value')==os.environ['TEST_SHOP_ID']
          s=e.get('YOOKASSA_SECRET_KEY',{});assert s.get('type')=='secret' and s.get('value')==os.environ['TEST_SECRET']
          adm=e.get('ADMIN_TOKEN',{})
          assert adm.get('value')
          open('/tmp/admin-type','w').write(str(adm.get('type') or 'plain'))
          open('/tmp/admin-ref','w').write(str(adm.get('value')))
          print('UGMU_TEST_PAYMENT_RUNTIME_SAFE',{'running':True,'globalSales':False,'ugmuSales':True,'active':True,'trials':False,'paymentMode':'test','testShopMatched':True})
          PY
          meta="$(curl -fsS "$PRODUCTION_BASE_URL/api/v2/meta")"
          python3 - "$meta" <<'PY'
          import json,sys
          m=json.loads(sys.argv[1]);assert m.get('sales')=='open' and m.get('trials')=='closed' and m.get('paymentMode')=='test'
          PY

      - name: Find the succeeded UGMU test payment
        env:
          TOKEN: ${{ steps.cloud.outputs.token }}
          PROJECT: ${{ steps.cloud.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/provider && cd /tmp/provider
          cat > go.mod <<'EOF'
          module ugmutestpaymentverify
          go 1.23.0
          require (
            github.com/cloudru-tech/secret-manager-sdk v1.1.1
            google.golang.org/grpc v1.70.0
          )
          EOF
          cat > main.go <<'EOF'
          package main
          import("context";"encoding/json";"fmt";"io";"net/http";"os";"sort";"strings";"time";sm "github.com/cloudru-tech/secret-manager-sdk";v2 "github.com/cloudru-tech/secret-manager-sdk/api/v2";"google.golang.org/grpc/metadata")
          func must(n string)string{v:=os.Getenv(n);if v==""{panic("missing "+n)};return v}
          type P struct{Id string `json:"id"`;Status string `json:"status"`;Paid bool `json:"paid"`;Test bool `json:"test"`;Created string `json:"created_at"`;Amount struct{Value string `json:"value"`;Currency string `json:"currency"`} `json:"amount"`;Metadata map[string]string `json:"metadata"`}
          func main(){cl,e:=sm.New(&sm.Config{Host:"secretmanager.api.cloud.ru:443"});if e!=nil{panic(e)};defer cl.Close();ctx,c:=context.WithTimeout(context.Background(),30*time.Second);defer c();ctx=metadata.AppendToOutgoingContext(ctx,"authorization","Bearer "+must("TOKEN"));sr,e:=cl.V2.SecretService.Search(ctx,&v2.SearchSecretRequest{ProjectId:must("PROJECT"),Depth:-1});if e!=nil{panic(e)};target:=must("SECRET");paths:=[]string{};for _,s:=range sr.GetSecrets(){p:=s.GetPath();if p==target||strings.HasSuffix(p,"/"+target){paths=append(paths,p)}};if len(paths)!=1{panic("secret match count")};sec,e:=cl.V2.SecretService.Access(ctx,&v2.AccessSecretRequest{ProjectId:must("PROJECT"),Path:paths[0]});if e!=nil{panic(e)};req,_:=http.NewRequest(http.MethodGet,"https://api.yookassa.ru/v3/payments?limit=20",nil);req.SetBasicAuth(must("SHOP"),string(sec.GetPayload().GetValue()));r,e:=(&http.Client{Timeout:20*time.Second}).Do(req);if e!=nil{panic(e)};defer r.Body.Close();b,_:=io.ReadAll(io.LimitReader(r.Body,2<<20));if r.StatusCode!=200{panic(fmt.Sprintf("provider http %d",r.StatusCode))};var body struct{Type string `json:"type"`;Items []P `json:"items"`};if e=json.Unmarshal(b,&body);e!=nil{panic(e)};cut,e:=time.Parse(time.RFC3339,must("AFTER"));if e!=nil{panic(e)};cand:=[]P{};for _,p:=range body.Items{t,e:=time.Parse(time.RFC3339Nano,p.Created);if e==nil&&t.After(cut)&&p.Test&&p.Paid&&p.Status=="succeeded"&&p.Metadata["university"]=="ugmu"&&p.Metadata["order_id"]!=""{cand=append(cand,p)}};sort.Slice(cand,func(i,j int)bool{return cand[i].Created>cand[j].Created});if len(cand)!=1{fmt.Printf("UGMU_TEST_PAYMENT_CANDIDATES_SAFE count=%d\n",len(cand));os.Exit(4)};p:=cand[0];out:=map[string]any{"paymentId":p.Id,"orderId":p.Metadata["order_id"],"createdAt":p.Created,"amount":p.Amount.Value,"currency":p.Amount.Currency,"groupId":p.Metadata["group_id"],"status":p.Status,"paid":p.Paid,"test":p.Test};raw,_:=json.Marshal(out);if e=os.WriteFile("/tmp/payment-selection.json",raw,0600);e!=nil{panic(e)};fmt.Printf("UGMU_TEST_PAYMENT_PROVIDER_SAFE candidateCount=1 status=%s paid=%t test=%t amount=%s currency=%s\n",p.Status,p.Paid,p.Test,p.Amount.Value,p.Amount.Currency)}
          EOF
          go mod tidy
          TOKEN="$TOKEN" PROJECT="$PROJECT" SECRET="$TEST_SECRET" SHOP="$TEST_SHOP_ID" AFTER="$OPENED_AFTER" go run .
          rm -rf /tmp/provider

      - name: Verify order, webhook fulfillment and tokenized ICS
        working-directory: api
        env:
          S3_ACCESS_KEY_ID: ${{ env.DIRECT_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ env.DIRECT_S3_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {S3Client,GetObjectCommand} from '@aws-sdk/client-s3';
          const p=JSON.parse(fs.readFileSync('/tmp/payment-selection.json','utf8'));
          const s3=new S3Client({endpoint:process.env.S3_ENDPOINT||'https://s3.cloud.ru',region:process.env.S3_REGION||'ru-central-1',forcePathStyle:true,credentials:{accessKeyId:process.env.S3_ACCESS_KEY_ID,secretAccessKey:process.env.S3_SECRET_ACCESS_KEY}});
          async function get(key){const r=await s3.send(new GetObjectCommand({Bucket:process.env.S3_BUCKET||'kgmu-calendar-data-gmarkov634',Key:key}));return JSON.parse(await r.Body.transformToString('utf8'));}
          const order=await get(`orders/${p.orderId}.json`);
          if(order.status!=='succeeded'||order.testMode!==true||order.paymentId!==p.paymentId||order.university!=='ugmu'||!order.subscriptionUrl) throw new Error('order/webhook fulfillment mismatch');
          const m=String(order.subscriptionUrl).match(/\/api\/v1\/subscriptions\/([A-Za-z0-9_-]{43})\/calendar\.ics$/);if(!m)throw new Error('subscription url invalid');
          const token=m[1],hash=createHash('sha256').update(token).digest('hex');
          const sub=await get(`subscriptions/${hash}.json`);
          if(sub.status!=='active'||sub.entitlement!=='paid'||sub.orderId!==p.orderId||sub.paymentId!==p.paymentId||sub.university!=='ugmu')throw new Error('subscription mismatch');
          const res=await fetch(order.subscriptionUrl,{headers:{'User-Agent':'UGMU-test-payment-verifier/1'}});const ics=await res.text();if(res.status!==200||!ics.includes('BEGIN:VCALENDAR'))throw new Error('tokenized ICS unavailable');
          const events=(ics.match(/BEGIN:VEVENT/g)||[]).length;if(events<300)throw new Error(`unexpected event count ${events}`);
          fs.writeFileSync('/tmp/sub-token',token,{mode:0o600});fs.writeFileSync('/tmp/sub-hash',hash,{mode:0o600});fs.writeFileSync('/tmp/sub-url',order.subscriptionUrl,{mode:0o600});
          fs.writeFileSync('/tmp/e2e-safe.json',JSON.stringify({groupCode:order.groupCode,plan:order.plan,status:order.status,testMode:order.testMode,feedStatus:res.status,eventCount:events}),{mode:0o600});
          console.log('UGMU_TEST_PAYMENT_E2E_SAFE',JSON.stringify({orderStatus:'succeeded',webhookFulfilled:true,subscriptionStatus:'active',feedStatus:200,eventCount:events,groupCode:order.groupCode,testMode:true}));
          NODE

      - name: Resolve admin token and revoke only the test subscription
        env:
          TOKEN: ${{ steps.cloud.outputs.token }}
          PROJECT: ${{ steps.cloud.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          typ="$(cat /tmp/admin-type)"; ref="$(cat /tmp/admin-ref)"
          if [ "$typ" = secret ]; then
            mkdir -p /tmp/adminresolve && cd /tmp/adminresolve
            cat > go.mod <<'EOF'
          module ugmuadminresolve
          go 1.23.0
          require (
            github.com/cloudru-tech/secret-manager-sdk v1.1.1
            google.golang.org/grpc v1.70.0
          )
          EOF
            cat > main.go <<'EOF'
          package main
          import("context";"os";"strings";"time";sm "github.com/cloudru-tech/secret-manager-sdk";v2 "github.com/cloudru-tech/secret-manager-sdk/api/v2";"google.golang.org/grpc/metadata")
          func must(n string)string{v:=os.Getenv(n);if v==""{panic("missing "+n)};return v}
          func main(){cl,e:=sm.New(&sm.Config{Host:"secretmanager.api.cloud.ru:443"});if e!=nil{panic(e)};defer cl.Close();ctx,c:=context.WithTimeout(context.Background(),30*time.Second);defer c();ctx=metadata.AppendToOutgoingContext(ctx,"authorization","Bearer "+must("TOKEN"));sr,e:=cl.V2.SecretService.Search(ctx,&v2.SearchSecretRequest{ProjectId:must("PROJECT"),Depth:-1});if e!=nil{panic(e)};target:=must("REF");paths:=[]string{};for _,s:=range sr.GetSecrets(){p:=s.GetPath();if p==target||strings.HasSuffix(p,"/"+target){paths=append(paths,p)}};if len(paths)!=1{panic("admin secret match count")};sec,e:=cl.V2.SecretService.Access(ctx,&v2.AccessSecretRequest{ProjectId:must("PROJECT"),Path:paths[0]});if e!=nil{panic(e)};if e=os.WriteFile("/tmp/admin-token",sec.GetPayload().GetValue(),0600);e!=nil{panic(e)}}
          EOF
            go mod tidy
            TOKEN="$TOKEN" PROJECT="$PROJECT" REF="$ref" go run .
            cd "$GITHUB_WORKSPACE"
          else
            printf '%s' "$ref" >/tmp/admin-token
          fi
          admin="$(cat /tmp/admin-token)"; test "${#admin}" -ge 32; echo "::add-mask::$admin"
          hash="$(cat /tmp/sub-hash)"
          code="$(curl -sS -o /tmp/revoke.json -w '%{http_code}' -X POST -H "X-Admin-Token: $admin" "$PRODUCTION_BASE_URL/api/v1/admin/subscriptions/$hash/revoke")"
          test "$code" = 200
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/revoke.json'));assert x.get('status')=='revoked'
          PY
          url="$(cat /tmp/sub-url)"
          code="$(curl -sS -o /tmp/revoked.ics -w '%{http_code}' "$url")"; test "$code" = 200
          grep -q 'BEGIN:VCALENDAR' /tmp/revoked.ics
          test "$(grep -c 'BEGIN:VEVENT' /tmp/revoked.ics || true)" = 0
          echo 'UGMU_TEST_SUBSCRIPTION_REVOKE_SAFE status=revoked feedStatus=200 eventCount=0'
          rm -rf /tmp/adminresolve /tmp/admin-token /tmp/admin-ref /tmp/admin-type /tmp/sub-token /tmp/sub-hash /tmp/sub-url

      - name: Evidence
        shell: bash
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/payment-selection.json'));e=json.load(open('/tmp/e2e-safe.json'))
          json.dump({'status':'PASS','boundary':'temporary-yookassa-test-window','providerPayment':{'status':'succeeded','paid':True,'test':True,'amount':p['amount'],'currency':p['currency']},'webhookFulfilled':True,'orderStatus':'succeeded','groupCode':e['groupCode'],'plan':e['plan'],'tokenizedIcsBeforeRevoke':{'status':200,'eventCount':e['eventCount']},'testSubscriptionRevoked':True,'tokenizedIcsAfterRevoke':{'status':200,'eventCount':0},'paymentCreatedByVerifier':False,'restoreLiveRequired':True,'testWindowStillOpen':True},open('evidence/report.json','w'),indent=2,ensure_ascii=False)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ugmu-yookassa-test-payment-cleanup-${{ github.run_id }}
          path: evidence/report.json
          retention-days: 30
