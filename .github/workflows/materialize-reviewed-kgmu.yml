name: Materialize reviewed KGMU bundle

on:
  push:
    branches:
      - main
    paths:
      - "reviewed/kgmu/recipes/*.py"
      - "reviewed/kgmu/recipes/**/*.py"
      - "reviewed/kgmu/recipes/**/*.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-reviewed-kgmu
  cancel-in-progress: false

env:
  KGMU_API_URL: https://kgmu-calendar-api.containerapps.ru
  KGMU_MATERIALIZED_FILE_LIST: /tmp/kgmu-reviewed-materialized-files.txt

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize reviewed bundles
        shell: bash
        run: |
          set -euo pipefail
          : > "$KGMU_MATERIALIZED_FILE_LIST"
          mapfile -d '' recipes < <(find reviewed/kgmu/recipes -type f -name '*.py' -print0 | sort -z)
          if [ "${#recipes[@]}" -eq 0 ]; then
            echo "No reviewed KGMU recipes found."
            exit 0
          fi
          for recipe in "${recipes[@]}"; do
            echo "Running $recipe"
            python "$recipe"
          done
          if [ ! -s "$KGMU_MATERIALIZED_FILE_LIST" ]; then
            echo "Recipes did not register any materialized JSON bundles."
            exit 1
          fi
          sort -u -o "$KGMU_MATERIALIZED_FILE_LIST" "$KGMU_MATERIALIZED_FILE_LIST"
          cat "$KGMU_MATERIALIZED_FILE_LIST"

      - name: Validate materialized JSON
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t bundles < "$KGMU_MATERIALIZED_FILE_LIST"
          for file in "${bundles[@]}"; do
            [ -f "$file" ] || { echo "Missing materialized bundle: $file"; exit 1; }
          done
          node api/tools/validate-reviewed-kgmu.mjs "${bundles[@]}"

      - name: Commit materialized JSON
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do git add "$file"; done < "$KGMU_MATERIALIZED_FILE_LIST"
          if git diff --cached --quiet; then
            echo "Reviewed JSON is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Materialize reviewed KGMU bundle"
            git push
          fi

      - name: Require API credential
        env:
          KGMU_ADMIN_TOKEN: ${{ secrets.KGMU_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KGMU_ADMIN_TOKEN" ]; then
            echo "KGMU_ADMIN_TOKEN repository secret is not configured."
            exit 1
          fi

      - name: Publish materialized bundles atomically
        env:
          KGMU_ADMIN_TOKEN: ${{ secrets.KGMU_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "Publishing $file"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Content-Type: application/json" \
              --header "X-Admin-Token: $KGMU_ADMIN_TOKEN" \
              --data-binary "@$file" \
              "$KGMU_API_URL/api/v1/admin/kgmu/reviewed-bundle?publish=true"
            echo
          done < "$KGMU_MATERIALIZED_FILE_LIST"
