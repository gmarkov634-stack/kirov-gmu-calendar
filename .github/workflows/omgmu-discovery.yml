name: ОмГМУ source discovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "api/src/adapters/omgmu/**"
      - "api/tools/omgmu-*.mjs"
      - "api/tools/omgmu-*.py"
      - "api/tools/requirements-omgmu.txt"
      - "universities/omgmu/structure.json"
      - "universities/omgmu/manual-review.json"
      - ".github/workflows/omgmu-discovery.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - name: Install PDF tools and parser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python3 -m pip install --disable-pip-version-check -r tools/requirements-omgmu.txt
      - name: Discover official ОмГМУ sources
        run: npm run discover:omgmu -- --output=data/imports/omgmu-source-manifest.json
      - name: Download official ОмГМУ PDF files
        run: npm run download:omgmu -- --manifest=data/imports/omgmu-source-manifest.json --output=data/imports/omgmu-pdfs
      - name: Extract PDF text
        run: |
          mkdir -p data/imports/omgmu-text
          for file in data/imports/omgmu-pdfs/*.pdf; do
            name="$(basename "${file%.pdf}")"
            pdftotext -layout "$file" "data/imports/omgmu-text/$name.txt"
          done
      - name: Extract authoritative weekly_grid geometry
        run: |
          mkdir -p data/imports/omgmu-weekly-geometry
          for file in data/imports/omgmu-pdfs/0[1-5]_*.pdf; do
            name="$(basename "${file%.pdf}")"
            python3 tools/omgmu-extract-weekly-geometry.py \
              --input="$file" \
              --output="data/imports/omgmu-weekly-geometry/$name.json"
          done
      - name: Build ОмГМУ group catalog
        run: npm run catalog:omgmu -- --text-dir=data/imports/omgmu-text --output=data/imports/omgmu-catalog.json
      - name: Parse first-course stream 1 schedules
        run: npm run parse:omgmu:weekly -- --input=data/imports/omgmu-pdfs/01_medicine-international_course-1_stream-1_combined.pdf --course=1 --stream=1 --output=data/imports/omgmu-schedules
      - name: Parse first-course stream 2 schedules
        run: npm run parse:omgmu:weekly -- --input=data/imports/omgmu-pdfs/02_medicine-international_course-1_stream-2_combined.pdf --course=1 --stream=2 --output=data/imports/omgmu-schedules
      - name: Parse second-course stream 1 schedules
        run: npm run parse:omgmu:weekly -- --input=data/imports/omgmu-pdfs/03_medicine-international_course-2_stream-1_combined.pdf --course=2 --stream=1 --output=data/imports/omgmu-schedules
      - name: Parse second-course stream 2 schedules
        run: npm run parse:omgmu:weekly -- --input=data/imports/omgmu-pdfs/04_medicine-international_course-2_stream-2_combined.pdf --course=2 --stream=2 --output=data/imports/omgmu-schedules
      - name: Parse third-course schedules
        run: npm run parse:omgmu:weekly -- --input=data/imports/omgmu-pdfs/05_medicine-international_course-3_combined.pdf --course=3 --output=data/imports/omgmu-schedules
      - name: Parse fourth-course schedules
        run: npm run parse:omgmu:fourth -- --lectures=data/imports/omgmu-text/06_medicine-international_course-4_lectures.txt --cycles=data/imports/omgmu-pdfs/07_medicine-international_course-4_cycles.pdf --output=data/imports/omgmu-schedules
      - name: Parse fifth-course schedule
        run: npm run parse:omgmu:fifth -- --input=data/imports/omgmu-text/08_medicine-international_course-5_combined.txt --output=data/imports/omgmu-schedules/585.json
      - name: Apply approved manual reviews
        run: >-
          npm run review:omgmu:apply-registry --
          --registry=../universities/omgmu/manual-review.json
          --source-dir=data/imports/omgmu-pdfs
          --schedule-dir=data/imports/omgmu-schedules
          --report=data/imports/omgmu-manual-review-application.json
      - name: Validate normalized schedule coverage
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'data/imports/omgmu-schedules';
          const expected = [
            ...Array.from({length: 12}, (_, i) => String(1101 + i)),
            ...Array.from({length: 20}, (_, i) => String(2101 + i)),
            '385', '386', '387', '388', '389', '393', '394', '395',
            '485', '486', '585'
          ];
          const reviewedGroups = ['2113', '2114', '389', '393'];
          const missing = expected.filter(code => !fs.existsSync(`${path}/${code}.json`));
          const empty = expected.filter(code => {
            const file = `${path}/${code}.json`;
            if (!fs.existsSync(file)) return false;
            return JSON.parse(fs.readFileSync(file, 'utf8')).events.length === 0;
          });
          const approved = reviewedGroups.filter(code => {
            const file = `${path}/${code}.json`;
            if (!fs.existsSync(file)) return false;
            const schedule = JSON.parse(fs.readFileSync(file, 'utf8'));
            return schedule.review?.status === 'approved' && schedule.events.every(event => event.sourceType === 'manual-review');
          });
          const pending = reviewedGroups.filter(code => !approved.includes(code));
          const report = {
            expected: expected.length,
            created: expected.length - missing.length,
            empty,
            manualReviewApproved: approved,
            manualReviewPending: pending,
            missing,
          };
          fs.writeFileSync('data/imports/omgmu-coverage-report.json', `${JSON.stringify(report, null, 2)}\n`);
          console.log(`Normalized schedules: ${report.created}/${report.expected}`);
          console.log(`Approved manual reviews: ${approved.join(', ')}`);
          if (missing.length) console.error(`Missing: ${missing.join(', ')}`);
          if (empty.length) console.error(`Unexpected empty: ${empty.join(', ')}`);
          if (pending.length) console.error(`Manual review not applied: ${pending.join(', ')}`);
          if (missing.length || empty.length || pending.length) process.exit(2);
          NODE
      - name: Check normalized schedule quality
        run: npm run quality:omgmu -- --input=data/imports/omgmu-schedules --output=data/imports/omgmu-quality-report.json
      - name: Build publication dry run
        run: npm run publish:omgmu:plan -- --input=data/imports/omgmu-schedules --output=data/publication/omgmu --expected-publishable=43 --expected-blocked=0
      - name: Upload source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omgmu-source-manifest
          path: api/data/imports/omgmu-source-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload PDF bundle and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omgmu-source-pdfs
          path: api/data/imports/omgmu-pdfs
          if-no-files-found: error
          retention-days: 7
      - name: Upload weekly_grid geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omgmu-weekly-geometry
          path: api/data/imports/omgmu-weekly-geometry
          if-no-files-found: error
          retention-days: 14
      - name: Upload group catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omgmu-group-catalog
          path: |
            api/data/imports/omgmu-catalog.json
            api/data/imports/omgmu-text
          if-no-files-found: error
          retention-days: 14
      - name: Upload normalized schedules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omgmu-normalized-schedules
          path: api/data/imports/omgmu-schedules
          if-no-files-found: error
          retention-days: 14
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omgmu-quality-report
          path: |
            api/data/imports/omgmu-quality-report.json
            api/data/imports/omgmu-coverage-report.json
            api/data/imports/omgmu-manual-review-application.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload publication dry run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omgmu-publication-plan
          path: api/data/publication/omgmu
          if-no-files-found: error
          retention-days: 14
