name: UGMU trial-only normalize

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type ENFORCE_UGMU_TRIAL_ONLY to continue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kgmu-production-api-deploy
  cancel-in-progress: false

env:
  CONTAINER_NAME: kgmu-calendar-api
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru

jobs:
  normalize:
    if: ${{ inputs.confirm == 'ENFORCE_UGMU_TRIAL_ONLY' }}
    runs-on: ubuntu-latest
    steps:
      - name: Preflight, enforce trial-only state, verify and rollback on failure
        env:
          CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
          CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mutated='false'
          token=''
          project_id=''
          get_url=''
          patch_url=''

          rollback() {
            local exit_code=$?
            trap - ERR
            set +e
            if [ "$mutated" != 'true' ] || [ -z "$token" ] || [ -z "$get_url" ] || [ -z "$patch_url" ] || [ ! -f /tmp/trial-only-original.json ]; then
              echo 'UGMU_TRIAL_ONLY_ABORT_BEFORE_MUTATION_SAFE'
              exit "$exit_code"
            fi
            echo 'UGMU_TRIAL_ONLY_ROLLBACK_START_SAFE'
            current_code="$(curl --silent --show-error --output /tmp/trial-only-rollback-current.json --write-out '%{http_code}' \
              --header "Authorization: Bearer $token" --header 'Accept: application/json' "$get_url")"
            if [ "$current_code" = '200' ]; then
              python3 - <<'PY'
          import json
          app=json.load(open('/tmp/trial-only-rollback-current.json', encoding='utf-8'))
          original=json.load(open('/tmp/trial-only-original.json', encoding='utf-8'))
          container=app['template']['containers'][0]
          rows=[item for item in container.get('env',[]) if isinstance(item,dict) and item.get('name') not in {'UGMU_SALES_ENABLED','UGMU_TRIALS_ENABLED'}]
          for name in ('UGMU_SALES_ENABLED','UGMU_TRIALS_ENABLED'):
              item=original.get(name)
              if item is not None:
                  rows.append(item)
          container['env']=rows
          json.dump(app, open('/tmp/trial-only-rollback-patch.json','w', encoding='utf-8'), ensure_ascii=False, separators=(',',':'))
          PY
              curl --silent --show-error --output /tmp/trial-only-rollback-response.json \
                --request PATCH --header "Authorization: Bearer $token" --header 'Content-Type: application/json' \
                --data-binary @/tmp/trial-only-rollback-patch.json "$patch_url" >/dev/null
            fi
            rm -f /tmp/trial-only-rollback-current.json /tmp/trial-only-rollback-patch.json /tmp/trial-only-rollback-response.json
            echo 'UGMU_TRIAL_ONLY_ROLLBACK_REQUESTED_SAFE'
            exit "$exit_code"
          }
          trap rollback ERR

          auth_payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({'keyId':os.environ['CLOUDRU_KEY_ID'],'secret':os.environ['CLOUDRU_KEY_SECRET']}))
          PY
          )"
          test "$(curl --silent --show-error --output /tmp/trial-only-token.json --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data "$auth_payload" \
            'https://iam.api.cloud.ru/api/v1/auth/token')" = '200'

          readarray -t auth < <(python3 - <<'PY'
          import base64, json
          body=json.load(open('/tmp/trial-only-token.json', encoding='utf-8'))
          token=body.get('access_token')
          assert isinstance(token,str) and token
          parts=token.split('.')
          assert len(parts) == 3
          payload=parts[1] + '='*((4-len(parts[1])%4)%4)
          claims=json.loads(base64.urlsafe_b64decode(payload.encode()).decode())
          project_id=claims.get('project_id')
          assert isinstance(project_id,str) and project_id
          print(token)
          print(project_id)
          PY
          )
          token="${auth[0]}"
          project_id="${auth[1]}"
          rm -f /tmp/trial-only-token.json
          echo "::add-mask::$token"

          get_url="https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$project_id"
          patch_url="https://containers.api.cloud.ru/v2/containers/${CONTAINER_NAME}?projectId=$project_id"

          test "$(curl --silent --show-error --output /tmp/trial-only-current.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $token" --header 'Accept: application/json' "$get_url")" = '200'

          python3 - <<'PY'
          import json
          app=json.load(open('/tmp/trial-only-current.json', encoding='utf-8'))
          assert app.get('name') == 'kgmu-calendar-api', app.get('name')
          assert app.get('status') == 'running', app.get('status')
          containers=app.get('template',{}).get('containers',[])
          assert len(containers) == 1, len(containers)
          container=containers[0]
          rows=[item for item in container.get('env',[]) if isinstance(item,dict)]
          env={item.get('name'):item.get('value') for item in rows}
          for gate in ('FUNNEL_ANALYTICS_ENABLED','TRIALS_ENABLED','COMMERCIAL_SALES_ENABLED'):
              assert env.get(gate) != 'true', f'{gate} must remain fail-closed'
          secret=env.get('TRIAL_IDENTITY_HMAC_SECRET')
          assert isinstance(secret,str) and len(secret) >= 32, 'TRIAL_IDENTITY_HMAC_SECRET missing or too short'
          original={}
          for name in ('UGMU_SALES_ENABLED','UGMU_TRIALS_ENABLED'):
              match=next((item for item in rows if item.get('name') == name), None)
              original[name]=match
          json.dump(original, open('/tmp/trial-only-original.json','w', encoding='utf-8'), ensure_ascii=False)
          rows=[item for item in rows if item.get('name') not in {'UGMU_SALES_ENABLED','UGMU_TRIALS_ENABLED'}]
          rows.append({'name':'UGMU_SALES_ENABLED','value':'false'})
          rows.append({'name':'UGMU_TRIALS_ENABLED','value':'true'})
          container['env']=rows
          json.dump(app, open('/tmp/trial-only-patch.json','w', encoding='utf-8'), ensure_ascii=False, separators=(',',':'))
          print('UGMU_TRIAL_ONLY_PREFLIGHT_SAFE', {
              'globalSales':'closed',
              'globalTrials':'closed',
              'targetUgmuSales':'closed',
              'targetUgmuTrials':'open',
          })
          PY

          patch_code="$(curl --silent --show-error --output /tmp/trial-only-patch-response.json --write-out '%{http_code}' \
            --request PATCH --header "Authorization: Bearer $token" --header 'Content-Type: application/json' \
            --data-binary @/tmp/trial-only-patch.json "$patch_url")"
          test "$patch_code" = '200'
          mutated='true'
          rm -f /tmp/trial-only-patch.json /tmp/trial-only-patch-response.json

          runtime_ready='false'
          for attempt in $(seq 1 40); do
            current_code="$(curl --silent --show-error --output /tmp/trial-only-after.json --write-out '%{http_code}' \
              --header "Authorization: Bearer $token" --header 'Accept: application/json' "$get_url")"
            if [ "$current_code" = '200' ] && python3 - <<'PY'
          import json, sys
          app=json.load(open('/tmp/trial-only-after.json', encoding='utf-8'))
          containers=app.get('template',{}).get('containers',[])
          if app.get('status') != 'running' or len(containers) != 1:
              sys.exit(1)
          env={item.get('name'):item.get('value') for item in containers[0].get('env',[]) if isinstance(item,dict)}
          ok=(
              env.get('FUNNEL_ANALYTICS_ENABLED') != 'true' and
              env.get('TRIALS_ENABLED') != 'true' and
              env.get('COMMERCIAL_SALES_ENABLED') != 'true' and
              env.get('UGMU_SALES_ENABLED') != 'true' and
              env.get('UGMU_TRIALS_ENABLED') == 'true'
          )
          sys.exit(0 if ok else 1)
          PY
            then
              runtime_ready='true'
              echo "UGMU_TRIAL_ONLY_RUNTIME_SAFE attempt=$attempt"
              break
            fi
            sleep 3
          done
          test "$runtime_ready" = 'true'

          meta_ready='false'
          for attempt in $(seq 1 40); do
            meta="$(curl --silent --show-error "$PRODUCTION_BASE_URL/api/v2/meta" || true)"
            if META="$meta" python3 - <<'PY'
          import json, os, sys
          try:
              body=json.loads(os.environ.get('META') or '{}')
          except Exception:
              sys.exit(1)
          ok=(
              body.get('sales') == 'closed' and
              body.get('trials') == 'closed' and
              body.get('universityTrials',{}).get('ugmu') == 'open'
          )
          sys.exit(0 if ok else 1)
          PY
            then
              meta_ready='true'
              break
            fi
            sleep 3
          done
          test "$meta_ready" = 'true'

          final_meta="$(curl --fail --silent --show-error "$PRODUCTION_BASE_URL/api/v2/meta")"
          FINAL_META="$final_meta" python3 - <<'PY'
          import json, os
          body=json.loads(os.environ['FINAL_META'])
          assert body.get('sales') == 'closed', body
          assert body.get('trials') == 'closed', body
          assert body.get('universityTrials',{}).get('ugmu') == 'open', body
          print('UGMU_TRIAL_ONLY_COMPLETE_SAFE', {
              'sales':body.get('sales'),
              'globalTrials':body.get('trials'),
              'ugmuTrials':body.get('universityTrials',{}).get('ugmu'),
          })
          PY

          rm -f /tmp/trial-only-current.json /tmp/trial-only-after.json /tmp/trial-only-original.json
          trap - ERR
