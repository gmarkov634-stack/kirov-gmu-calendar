name: ОмГМУ source watch

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
  pull_request:
    paths:
      - "api/src/adapters/omgmu/discover.mjs"
      - "api/src/adapters/omgmu/watch.mjs"
      - "api/src/adapters/omgmu/source-watcher.mjs"
      - "api/src/adapters/omgmu/source-observer.mjs"
      - "api/src/adapters/omgmu/watch-store.mjs"
      - "api/src/adapters/omgmu/review-queue.mjs"
      - "api/src/adapters/omgmu/reviewed-service.mjs"
      - "api/src/adapters/omgmu/canonical-reviewed.mjs"
      - "api/src/adapters/omgmu/http-handler.mjs"
      - "api/src/schedule/review-service-router.js"
      - "api/tools/omgmu-watch-sources.mjs"
      - "api/test/omgmu-source-watch.test.mjs"
      - "api/test/omgmu-watch-review-issue-workflow.test.js"
      - "api/test/omgmu-source-review-watcher.test.js"
      - "api/test/omgmu-source-bound-canonical-review.test.js"
      - "api/test/omgmu-review-http-handler.test.js"
      - "api/package.json"
      - "api/src/config.js"
      - "api/src/server.js"
      - "universities/omgmu/source-watch.json"
      - ".github/workflows/omgmu-source-watch.yml"

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies for validation
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Test source watch and review boundary
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: >-
          node --test
          test/omgmu-source-watch.test.mjs
          test/omgmu-watch-review-issue-workflow.test.js
          test/omgmu-source-review-watcher.test.js
          test/omgmu-source-bound-canonical-review.test.js
          test/omgmu-review-http-handler.test.js

      - name: Discover official ОмГМУ sources
        run: npm run discover:omgmu -- --output=data/imports/omgmu-source-manifest.json

      - name: Classify target programs
        id: watch
        run: |
          set -euo pipefail
          npm run watch:omgmu -- \
            --manifest=data/imports/omgmu-source-manifest.json \
            --config=../universities/omgmu/source-watch.json \
            --output=data/imports/omgmu-source-watch-report.json
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('data/imports/omgmu-source-watch-report.json', 'utf8'));
          console.log(`has_target=${report.hasNewProgramSources ? 'true' : 'false'}`);
          console.log(`ready=${report.readyFor2026AutumnIngest ? 'true' : 'false'}`);
          NODE

      - name: Capture exact current-period official PDFs
        if: steps.watch.outputs.ready == 'true'
        run: npm run download:omgmu -- --manifest=data/imports/omgmu-source-manifest.json --output=data/imports/omgmu-watched-pdfs

      - name: Create deduplicated source-bound review issues
        if: steps.watch.outputs.ready == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          watch_report='data/imports/omgmu-source-watch-report.json'
          download_report='data/imports/omgmu-watched-pdfs/download-report.json'
          while IFS= read -r item; do
            sha="$(jq -r '.sha256' <<<"$item")"
            short="${sha:0:12}"
            program="$(jq -r '.program' <<<"$item")"
            course="$(jq -r '.course // "unknown"' <<<"$item")"
            stream="$(jq -r '.stream // "—"' <<<"$item")"
            part="$(jq -r '.part // "combined"' <<<"$item")"
            url="$(jq -r '.url' <<<"$item")"
            filename="$(jq -r '.filename' <<<"$item")"
            existing="$(gh issue list --state all --limit 100 --search "OMGMU-SOURCE-$short in:title" --json number --jq 'length')"
            if [ "$existing" -gt 0 ]; then
              echo "Known source: program=$program course=$course sha=$sha"
              continue
            fi
            title="OMGMU-SOURCE-$short: новое расписание $program, ${course} курс"
            body="$(cat <<EOF
          Обнаружен новый официальный PDF ОмГМУ, относящийся к текущему офферу **2026/2027, autumn**.

          - Program: $program
          - Course: $course
          - Stream: $stream
          - Part: $part
          - SHA-256: $sha
          - Official URL: $url
          - Artifact file: $filename
          - Watch run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Файл сохранён в artifact `omgmu-new-program-pdfs` этого run. Эта issue является только source-bound задачей на смысловой разбор. Автоматическая интерпретация и публикация расписания **не выполнялись**.

          Следующий этап: ChatGPT semantic review точного PDF/SHA → canonical schedule-batch/v1 → common QA → explicit OIDC publication. До QA PASS `current` не изменяется, продажи и trial не открываются.
          EOF
          )"
            gh issue create --title "$title" --body "$body"
          done < <(
            jq -c --slurpfile watch "$watch_report" '
              .files[]
              | select(.status == "downloaded")
              | select(.program as $p | ($watch[0].availableTargets | index($p)) != null)
            ' "$download_report"
          )

      - name: Write job summary
        if: always()
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const path = 'data/imports/omgmu-source-watch-report.json';
          if (!fs.existsSync(path)) {
            console.log('## ОмГМУ source watch\n\nReport was not generated.');
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          console.log('## ОмГМУ source watch');
          console.log('');
          console.log(`Official page period: **${report.pageAcademicYear || 'unknown'} / ${report.pageSemester || 'unknown'}**`);
          console.log(`Expected: **${report.expectedAcademicYear} / ${report.expectedSemester || 'autumn'}**`);
          console.log(`Period match: **${report.periodMatches ? 'yes' : 'no'}**`);
          console.log(`Status: **${report.status}**`);
          console.log('');
          console.log('| Program | Sources | Courses |');
          console.log('|---|---:|---|');
          for (const item of report.targetPrograms) {
            console.log(`| ${item.label} | ${item.sourceCount} | ${item.courses.join(', ') || '—'} |`);
          }
          if (!report.readyFor2026AutumnIngest) {
            console.log('');
            console.log('Current-period source is not ready; no PDF capture, review issue, publication, trial, or sale was triggered.');
          }
          NODE

      - name: Upload watch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omgmu-source-watch
          path: |
            api/data/imports/omgmu-source-manifest.json
            api/data/imports/omgmu-source-watch-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload newly active PDFs
        if: steps.watch.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: omgmu-new-program-pdfs
          path: api/data/imports/omgmu-watched-pdfs
          if-no-files-found: error
          retention-days: 30
