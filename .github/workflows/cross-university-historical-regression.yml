name: Cross-university historical regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/cross-university-historical-regression.yml"
      - ".github/workflows/omgmu-historical-regression.yml"
      - ".github/workflows/izhgmu-historical-regression.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run cross-university historical regression
        env:
          CROSS_UNIVERSITY_HISTORICAL_REPORT: data/regression/cross-university-historical-regression-report.json
        run: npm run regression:cross-university:historical

      - name: Upload aggregate historical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-university-historical-regression
          path: |
            api/data/regression/cross-university-historical-regression-report.json
            api/data/regression/cross-university/omgmu-historical-regression-report.json
            api/data/imports/izhgmu-historical-regression-report.json
          if-no-files-found: error
          retention-days: 90
