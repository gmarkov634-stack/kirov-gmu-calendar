name: Build dentistry 491-494 normalized draft

on:
  push:
    branches:
      - feat/dentistry-494-2026-09-03
    paths:
      - 'catalog/2026-2027-semester-1.json'
      - 'qa/2026-2027-semester-1/dentistry-494.source-probe.json'
      - 'fixtures/tools/build_dentistry_491_494_candidate.py'
      - '.github/workflows/build-dentistry-491-494-draft.yml'

permissions:
  contents: write

concurrency:
  group: dentistry-course4-branch-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize safe resolved draft and QA state
        run: python fixtures/tools/build_dentistry_491_494_candidate.py
      - name: Persist deterministic pipeline artifacts on branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            fixtures/2026-2027-semester-1/dentistry-491-494.source-artifact.json \
            fixtures/2026-2027-semester-1/dentistry-491-494.parsing-job.json \
            qa/2026-2027-semester-1/dentistry-491-494.parsing-result.json \
            qa/2026-2027-semester-1/dentistry-491-494.normalized-draft.partial.json \
            qa/2026-2027-semester-1/dentistry-491-494.semantic-review.json \
            qa/2026-2027-semester-1/dentistry-491-494.qa-report.json
          if git diff --cached --quiet; then
            echo 'Draft artifacts unchanged'
          else
            git commit -m 'Record Dentistry 491-494 normalized draft and QA state'
            git pull --rebase origin feat/dentistry-494-2026-09-03
            git push origin HEAD:feat/dentistry-494-2026-09-03
          fi
