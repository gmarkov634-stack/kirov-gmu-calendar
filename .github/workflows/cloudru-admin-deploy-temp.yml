name: TEMP Cloud.ru admin deploy

on:
  push:
    paths:
      - ".github/workflows/cloudru-admin-deploy-temp.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verify admin role, patch only image, and smoke production
        env:
          CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
          CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
          TARGET_IMAGE: kgmu-calendar-api.cr.cloud.ru/api@sha256:9aa6fea7ca9fe594de5da3b75ee6a64906031c26596c775d9344dd1ed345dfae
        shell: bash
        run: |
          set -euo pipefail

          auth_payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({'keyId': os.environ['CLOUDRU_KEY_ID'], 'secret': os.environ['CLOUDRU_KEY_SECRET']}))
          PY
          )"
          test "$(curl -sS -o /tmp/token.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data "$auth_payload" 'https://iam.api.cloud.ru/api/v1/auth/token')" = "200"
          readarray -t auth < <(python3 - <<'PY'
          import json, base64
          body=json.load(open('/tmp/token.json', encoding='utf-8'))
          token=body['access_token']
          payload=token.split('.')[1]
          payload += '='*((4-len(payload)%4)%4)
          claims=json.loads(base64.urlsafe_b64decode(payload))
          print(token)
          print(claims['project_id'])
          print(claims.get('sub_id') or claims.get('sub'))
          PY
          )
          token="${auth[0]}"; project_id="${auth[1]}"; subject_id="${auth[2]}"; rm -f /tmp/token.json

          perm_url="https://iam.api.cloud.ru/api/v1/permissions?subjectId=$subject_id&resourceId=$project_id"
          test "$(curl -sS -o /tmp/perms.json -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Accept: application/json' "$perm_url")" = "200"
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/perms.json', encoding='utf-8'))
          rows=x if isinstance(x,list) else x.get('permissions') or x.get('data') or x.get('items') or []
          roles={r.get('role'):r.get('enabled') for r in rows if isinstance(r,dict)}
          assert roles.get('serverless-containers.admin') is True, roles
          assert roles.get('serverless-containers.editor') is True, roles
          print('ROLE_CHECK_SAFE', {'editor': True, 'admin': True})
          PY

          get_url="https://containers.api.cloud.ru/v1/containers/kgmu-calendar-api?projectId=$project_id"
          patch_url="https://containers.api.cloud.ru/v2/containers/kgmu-calendar-api?projectId=$project_id"
          revs_url="https://containers.api.cloud.ru/v1/containers/kgmu-calendar-api/revisions?projectId=$project_id"

          test "$(curl -sS -o /tmp/current.json -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Accept: application/json' "$get_url")" = "200"
          test "$(curl -sS -o /tmp/revs-before.json -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Accept: application/json' "$revs_url")" = "200"

          TARGET_IMAGE="$TARGET_IMAGE" python3 - <<'PY'
          import json, os
          app=json.load(open('/tmp/current.json', encoding='utf-8'))
          assert app.get('name')=='kgmu-calendar-api', app.get('name')
          assert app.get('status')=='running', app.get('status')
          containers=app.get('template',{}).get('containers',[])
          assert len(containers)==1
          env={e.get('name'):e.get('value') for e in containers[0].get('env',[]) if isinstance(e,dict)}
          for gate in ('FUNNEL_ANALYTICS_ENABLED','TRIALS_ENABLED','COMMERCIAL_SALES_ENABLED'):
              assert env.get(gate)!='true', f'{gate} unexpectedly open before deploy'
          revs=json.load(open('/tmp/revs-before.json', encoding='utf-8')).get('data') or []
          active=[r for r in revs if isinstance(r,dict) and r.get('status')=='active']
          assert len(active)==1, active
          old_revision=active[0]['name']
          old_image=containers[0].get('image')
          json.dump({'oldRevision':old_revision,'oldImage':old_image}, open('/tmp/state.json','w', encoding='utf-8'))
          containers[0]['image']=os.environ['TARGET_IMAGE']
          json.dump(app, open('/tmp/patch.json','w', encoding='utf-8'), ensure_ascii=False, separators=(',',':'))
          print('PREPATCH_SAFE', {'oldRevision': old_revision, 'oldImage': old_image, 'targetImage': os.environ['TARGET_IMAGE'], 'gates': 'closed_or_unset'})
          PY

          patch_code="$(curl -sS -o /tmp/op.json -w '%{http_code}' -X PATCH -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data-binary @/tmp/patch.json "$patch_url")"
          echo "PATCH_HTTP=$patch_code"
          if [ "$patch_code" != "200" ]; then
            python3 - <<'PY'
          import json
          try:
              x=json.load(open('/tmp/op.json', encoding='utf-8'))
              print('PATCH_ERROR_SAFE', {k:x.get(k) for k in ('code','message','error','status') if k in x})
          except Exception:
              print('PATCH_ERROR_SAFE unreadable')
          PY
            exit 1
          fi
          rm -f /tmp/patch.json /tmp/op.json

          old_revision="$(python3 -c "import json; print(json.load(open('/tmp/state.json'))['oldRevision'])")"
          new_revision=''
          for n in $(seq 1 40); do
            sleep 4
            test "$(curl -sS -o /tmp/revs-now.json -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Accept: application/json' "$revs_url")" = "200"
            readarray -t active < <(python3 - <<'PY'
          import json
          rows=json.load(open('/tmp/revs-now.json', encoding='utf-8')).get('data') or []
          a=[r for r in rows if isinstance(r,dict) and r.get('status')=='active']
          if len(a)==1:
              print(a[0].get('name') or '')
              print(a[0].get('status') or '')
          else:
              print('')
              print('')
          PY
            )
            new_revision="${active[0]}"
            echo "REVISION_POLL_SAFE attempt=$n active=${new_revision:-none}"
            if [ -n "$new_revision" ] && [ "$new_revision" != "$old_revision" ]; then break; fi
          done
          test -n "$new_revision"
          test "$new_revision" != "$old_revision"

          test "$(curl -sS -o /tmp/after.json -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Accept: application/json' "$get_url")" = "200"
          TARGET_IMAGE="$TARGET_IMAGE" NEW_REVISION="$new_revision" python3 - <<'PY'
          import json, os
          app=json.load(open('/tmp/after.json', encoding='utf-8'))
          c=app['template']['containers'][0]
          assert c.get('image')==os.environ['TARGET_IMAGE'], (c.get('image'), os.environ['TARGET_IMAGE'])
          env={e.get('name'):e.get('value') for e in c.get('env',[]) if isinstance(e,dict)}
          for gate in ('FUNNEL_ANALYTICS_ENABLED','TRIALS_ENABLED','COMMERCIAL_SALES_ENABLED'):
              assert env.get(gate)!='true', f'{gate} unexpectedly open after deploy'
          print('DEPLOY_RESULT_SAFE', {'revision': os.environ['NEW_REVISION'], 'status': app.get('status'), 'image': c.get('image'), 'gates': 'closed_or_unset'})
          PY

          base='https://kgmu-calendar-api.containerapps.ru'
          health="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 3 "$base/health")"
          meta="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 3 "$base/api/v2/meta")"
          python3 - "$health" "$meta" <<'PY'
          import json, sys
          health=json.loads(sys.argv[1]); meta=json.loads(sys.argv[2])
          assert health=={'status':'ok','service':'medical-calendar-api'}, health
          assert meta.get('sales')=='closed', meta
          assert meta.get('trials')=='closed', meta
          print('PUBLIC_META_SAFE', {'sales':meta.get('sales'),'trials':meta.get('trials'),'paymentMode':meta.get('paymentMode')})
          PY

          analytics_status="$(curl --silent --show-error --output /tmp/analytics.json --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{}' "$base/api/v2/analytics")"
          test "$analytics_status" = "409"
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/analytics.json', encoding='utf-8'))
          assert x=={'error':'analytics_not_open'}, x
          print('ANALYTICS_GATE_SAFE', x)
          PY

          trial_status="$(curl --silent --show-error --output /tmp/trial.json --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{}' "$base/api/v2/trials")"
          test "$trial_status" = "409"
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/trial.json', encoding='utf-8'))
          assert x=={'error':'trials_not_open'}, x
          print('TRIAL_GATE_SAFE', x)
          PY
