name: Repair dentistry builder syntax

on:
  push:
    branches:
      - feat/dentistry-291-294-2026-27-s1
    paths:
      - '.github/workflows/repair-dentistry-builder.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dentistry-291-294-2026-27-s1
      - name: Replace malformed count-note regex line
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('fixtures/tools/build_dentistry_291_294_candidate.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          hits = 0
          for i, line in enumerate(lines):
              if 'r"(?P<count>' in line:
                  lines[i] = '    r"(?P<count>\\d+)\\s+заняти\\w*\\s+в[о.]?\\s*(?P<weekday>пн|вт|ср|чт|пт|сб)\\.?",'
                  hits += 1
          if hits != 1:
              raise SystemExit(f'expected one regex line, found {hits}')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fixtures/tools/build_dentistry_291_294_candidate.py
          git commit -m 'Fix dentistry 291-294 builder syntax'
          git push origin HEAD:feat/dentistry-291-294-2026-27-s1
