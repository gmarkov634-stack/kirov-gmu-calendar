name: UGMU YooKassa test payment cleanup observe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ugmu-yookassa-test-payment-cleanup-observe.yml"

permissions:
  contents: read
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: c9641acae16bb21d6ffa00c2103224f1a71679e7
      TARGET_WORKFLOW: UGMU YooKassa test payment cleanup
    steps:
      - name: Wait for exact cleanup run
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=50"
          run_id=''; conclusion=''
          for attempt in $(seq 1 180); do
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api" >/tmp/runs.json
            readarray -t state < <(python3 - <<'PY'
          import json,os
          rows=json.load(open('/tmp/runs.json')).get('workflow_runs',[])
          hits=[r for r in rows if r.get('name')==os.environ['TARGET_WORKFLOW'] and r.get('head_sha')==os.environ['TARGET_SHA']]
          if not hits: print('');print('');print('')
          else:
            r=hits[0];print(r['id']);print(r.get('status',''));print(r.get('conclusion') or '')
          PY
          )
            run_id="${state[0]}"
            if [ -n "$run_id" ] && [ "${state[1]}" = completed ]; then conclusion="${state[2]}"; break; fi
            sleep 5
          done
          test -n "$run_id"
          echo "UGMU_TEST_PAYMENT_CLEANUP_RUN_SAFE run=$run_id conclusion=$conclusion"
          test "$conclusion" = success
