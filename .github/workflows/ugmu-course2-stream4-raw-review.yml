name: UGMU course2 stream4 raw review

on:
  pull_request:
    paths:
      - "api/tools/ugmu-course2-stream4-raw.py"
      - "api/tools/requirements-ugmu.txt"
      - "api/src/adapters/ugmu/**"
      - ".github/workflows/ugmu-course2-stream4-raw-review.yml"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install PDF parser dependency
        run: python3 -m pip install -r tools/requirements-ugmu.txt

      - name: Discover official UGMU medicine sources
        run: node tools/ugmu-discover.mjs --program=medicine --output=data/imports/course2-source-manifest.json

      - name: Download official autumn PDFs
        run: node tools/ugmu-download.mjs --manifest=data/imports/course2-source-manifest.json --semester=autumn --output=data/imports/course2-pdfs

      - name: Diagnose stream IV weekday geometry
        run: |
          set -euo pipefail
          report='data/imports/course2-pdfs/download-report.json'
          filename="$(jq -r '.files[] | select(.status == "downloaded" and .course == 2 and .stream == "4" and .part == "combined") | .filename' "$report" | head -n 1)"
          PDF="data/imports/course2-pdfs/$filename" python3 - <<'PY'
          import os, re, pdfplumber
          path=os.environ['PDF']
          with pdfplumber.open(path) as doc:
              page=doc.pages[0]
              words=page.extract_words(extra_attrs=['upright'])
              print('ROTATED_WORDS')
              for w in words:
                  if not w.get('upright', True):
                      print(w['text'], round(w['top'],1), round(w['bottom'],1))
              print('DAY_TEXT_MATCHES')
              for w in words:
                  letters=re.sub(r'[^А-Яа-яЁё]','',w.get('text','')).lower()
                  if letters in {'понедельник','вторник','среда','четверг','пятница','суббота'} or letters[::-1] in {'понедельник','вторник','среда','четверг','пятница','суббота'}:
                      print(w['text'], w.get('upright'), round(w['top'],1), round(w['bottom'],1))
              tables=page.extract_tables() or []
              geoms=page.find_tables() or []
              for table,geom in zip(tables,geoms):
                  header=[' '.join(str(v or '').split()) for v in table[0][1:]] if table and table[0] else []
                  if not (header and header[0]=='ОЛД 237'):
                      continue
                  print('TARGET_TABLE_ROWS', len(table))
                  for idx,row in enumerate(table):
                      cell=geom.rows[idx].cells[0] if idx < len(geom.rows) else None
                      print('ROW',idx,'FIRST=',repr(row[0] if row else None),'Y=',cell[1:4:2] if cell else None,'NONEMPTY=',sum(bool(' '.join(str(v or '').split())) for v in row))
                  target_col=header.index('ОЛД 247')+1
                  target_header_cell=geom.rows[0].cells[target_col]
                  target_center=(target_header_cell[0]+target_header_cell[2])/2
                  print('GROUP247_MONDAY_CELLS center=',target_center)
                  for idx in range(1,14):
                      row=table[idx]
                      grow=geom.rows[idx]
                      for col in range(1,min(len(row),len(grow.cells))):
                          cell=grow.cells[col]
                          value=' '.join(str(row[col] or '').split())
                          if cell and value and cell[0]-1e-6 <= target_center <= cell[2]+1e-6:
                              print('G247ROW',idx,'COL',col,'VALUE=',repr(value),'CELL=',tuple(round(x,2) for x in cell))
                  print('MONDAY_NEIGHBOR_CELLS_245_248')
                  for idx in range(1,7):
                      row=table[idx]
                      grow=geom.rows[idx]
                      for group in ('ОЛД 245','ОЛД 246','ОЛД 247','ОЛД 248'):
                          center_cell=geom.rows[0].cells[header.index(group)+1]
                          center=(center_cell[0]+center_cell[2])/2
                          hits=[]
                          for col in range(1,min(len(row),len(grow.cells))):
                              cell=grow.cells[col]
                              value=' '.join(str(row[col] or '').split())
                              if cell and value and cell[0]-1e-6 <= center <= cell[2]+1e-6:
                                  hits.append((col,value,tuple(round(x,2) for x in cell)))
                          if hits:
                              print('NBR',idx,group,hits)
                  print('RAW_WORDS_AROUND_ORPHAN')
                  for w in words:
                      if 155 <= w['top'] <= 195 and 430 <= w['x0'] <= 570:
                          print(w['text'], round(w['x0'],2), round(w['x1'],2), round(w['top'],2), round(w['bottom'],2))
          PY

      - name: Extract only course2 stream IV raw weekly patterns
        run: |
          set -euo pipefail
          report='data/imports/course2-pdfs/download-report.json'
          item="$(jq -c '.files[] | select(.status == "downloaded" and .course == 2 and .stream == "4" and .part == "combined")' "$report" | head -n 1)"
          test -n "$item"
          filename="$(jq -r '.filename' <<<"$item")"
          source_url="$(jq -r '.url' <<<"$item")"
          sha="$(jq -r '.sha256' <<<"$item")"
          test "$sha" = '6b5f87dc7f565169105245a397996e61e94794dfe580529cc5f7398a62e21517'
          python3 tools/ugmu-course2-stream4-raw.py \
            --input="data/imports/course2-pdfs/$filename" \
            --source="$source_url" \
            --output=data/imports/course2-stream4/raw.json
          jq -e '
            .mode == "raw-weekly-patterns-only" and
            .course == 2 and .stream == 4 and
            .summary.groupCount == 12 and
            .summary.rawPatternCount > 0 and
            .summary.orphanSourceLineCount == 0 and
            .summary.semanticNormalizationPerformed == false and
            .summary.referenceTableMappingPerformed == false and
            .summary.eventExpansionPerformed == false and
            .summary.canonicalizationPerformed == false and
            .summary.storageWritesPerformed == false and
            .summary.publicationAllowed == false
          ' data/imports/course2-stream4/raw.json >/dev/null
          jq '{source, periodsLiteral, weekAnchorsLiteral, summary, embeddedTimeSplits:.review.embeddedTimeSplits}' data/imports/course2-stream4/raw.json

      - name: Upload read-only raw evidence
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-course2-stream4-raw-review
          path: api/data/imports/course2-stream4/
          retention-days: 14
