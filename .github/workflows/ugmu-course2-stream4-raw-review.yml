name: UGMU course2 stream4 raw review

on:
  pull_request:
    paths:
      - "api/tools/ugmu-course2-stream4-raw.py"
      - "api/tools/requirements-ugmu.txt"
      - "api/src/adapters/ugmu/**"
      - ".github/workflows/ugmu-course2-stream4-raw-review.yml"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python3 -m pip install -r tools/requirements-ugmu.txt

      - name: Discover and download exact official source
        run: |
          node tools/ugmu-discover.mjs --program=medicine --output=data/imports/course2-source-manifest.json
          node tools/ugmu-download.mjs --manifest=data/imports/course2-source-manifest.json --semester=autumn --output=data/imports/course2-pdfs

      - name: Extract and assert complete stream IV raw baseline
        run: |
          set -euo pipefail
          report='data/imports/course2-pdfs/download-report.json'
          item="$(jq -c '.files[] | select(.status == "downloaded" and .course == 2 and .stream == "4" and .part == "combined")' "$report" | head -n 1)"
          test -n "$item"
          filename="$(jq -r '.filename' <<<"$item")"
          source_url="$(jq -r '.url' <<<"$item")"
          sha="$(jq -r '.sha256' <<<"$item")"
          test "$sha" = '6b5f87dc7f565169105245a397996e61e94794dfe580529cc5f7398a62e21517'
          python3 tools/ugmu-course2-stream4-raw.py \
            --input="data/imports/course2-pdfs/$filename" \
            --source="$source_url" \
            --output=data/imports/course2-stream4/raw.json
          jq -e '
            .mode == "raw-weekly-patterns-only" and
            .course == 2 and .stream == 4 and
            .source.sha256 == "6b5f87dc7f565169105245a397996e61e94794dfe580529cc5f7398a62e21517" and
            .periodsLiteral == ["01.09.2026 – 23.12.2027"] and
            .summary.groupCount == 12 and
            .summary.rawPatternCount == 204 and
            ([.summary.rawPatternsByGroup[]] | all(. == 17)) and
            ([.summary.saturdayPatternsByGroup[]] | add) == 18 and
            .summary.saturdayPatternsByGroup["ОЛД 247"] == 0 and
            .summary.saturdayPatternsByGroup["ОЛД 248"] == 0 and
            .summary.markerCounts[""] == 108 and
            .summary.markerCounts["Л."] == 84 and
            .summary.markerCounts["Л. ДВ"] == 12 and
            .summary.weekRuleCounts.weekly == 132 and
            .summary.weekRuleCounts.I == 36 and
            .summary.weekRuleCounts.II == 36 and
            .summary.monthQualifierCounts == {} and
            .summary.orphanSourceLineCount == 0 and
            .summary.embeddedTimeSplitCount == 0 and
            .summary.geometryArtifactRepairCount == 1 and
            .review.sourceHasSaturdayBlock == true and
            .review.sourceWeekdayLayout.page2Continuation == ["суббота"] and
            any(.groups["ОЛД 247"][]; .weekdayName == "понедельник" and .startTime == "10:30" and .endTime == "12:00" and .sourceTitleRaw == "Экономика") and
            any(.groups["ОЛД 247"][]; .weekdayName == "понедельник" and .startTime == "12:10" and .endTime == "13:40" and .sourceTitleRaw == "Гистология эмбриология цитология") and
            any(.groups["ОЛД 247"][]; .weekdayName == "понедельник" and .startTime == "16:20" and .endTime == "18:40" and .sourceTitleRaw == "Нормальная физиология") and
            any(.groups["ОЛД 248"][]; .weekdayName == "понедельник" and .startTime == "08:50" and .endTime == "10:20" and .sourceTitleRaw == "Гистология эмбриология цитология") and
            any(.groups["ОЛД 248"][]; .weekdayName == "понедельник" and .startTime == "10:30" and .endTime == "12:00" and .sourceTitleRaw == "Экономика") and
            any(.groups["ОЛД 248"][]; .weekdayName == "понедельник" and .startTime == "16:20" and .endTime == "18:40" and .sourceTitleRaw == "Нормальная физиология") and
            .summary.semanticNormalizationPerformed == false and
            .summary.referenceTableMappingPerformed == false and
            .summary.eventExpansionPerformed == false and
            .summary.canonicalizationPerformed == false and
            .summary.storageWritesPerformed == false and
            .summary.publicationAllowed == false
          ' data/imports/course2-stream4/raw.json >/dev/null
          jq '{source, periodsLiteral, weekAnchorsLiteral, summary, sourceWeekdayLayout:.review.sourceWeekdayLayout, geometryArtifacts:.review.geometryArtifacts}' data/imports/course2-stream4/raw.json

      - name: Upload read-only raw evidence
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-course2-stream4-raw-review
          path: api/data/imports/course2-stream4/
          retention-days: 14
