name: One-time publish approved 43 ОмГМУ schedules

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/omgmu-one-time-publish-approved-43-20260810.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish approved 43 ОмГМУ schedules'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download verified 43/0 publication plan
        uses: actions/download-artifact@v4
        with:
          name: omgmu-publication-plan
          path: api/data/publication/downloaded
          run-id: 31341768461
          github-token: ${{ github.token }}

      - name: Resolve publication package
        id: package
        run: |
          manifest="$(find data/publication/downloaded -name publication-manifest.json -type f -print -quit)"
          if [ -z "$manifest" ]; then
            echo "publication-manifest.json was not found" >&2
            exit 2
          fi
          package_dir="$(dirname "$manifest")"
          echo "dir=$package_dir" >> "$GITHUB_OUTPUT"
          echo "Using publication package: $package_dir"

      - name: Validate approved package
        run: npm run publish:omgmu:s3 -- --package=${{ steps.package.outputs.dir }} --expected-publishable=43 --expected-blocked=0

      - name: Publish approved schedules to Cloud.ru S3
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: npm run publish:omgmu:s3 -- --package=${{ steps.package.outputs.dir }} --expected-publishable=43 --expected-blocked=0 --confirm

      - name: Record publication result
        if: always()
        working-directory: .
        env:
          JOB_STATUS: ${{ job.status }}
          SOURCE_RUN_ID: "31341768461"
          SOURCE_HEAD_SHA: "ebd91286287378059483fe191567b8702aa0aa6d"
          MERGE_SHA: "6db9959f1b3ec397ec580baf3600a53da29ea184"
        run: |
          mkdir -p ops/reports
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "version": 1,
              "university": "omgmu",
              "operation": "publish-approved-43-schedules-to-cloud-ru-s3",
              "jobStatus": os.environ.get("JOB_STATUS"),
              "sourceRunId": int(os.environ["SOURCE_RUN_ID"]),
              "sourceHeadSha": os.environ["SOURCE_HEAD_SHA"],
              "mergeSha": os.environ["MERGE_SHA"],
              "recordedAt": datetime.now(timezone.utc).isoformat(),
          }
          reports = list(Path("api/data/publication/downloaded").rglob("s3-publication-report.json"))
          if reports:
              payload["publisherReport"] = json.loads(reports[0].read_text(encoding="utf-8"))
          output = Path("ops/reports/omgmu-s3-publication-approved-43-20260810.json")
          output.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/reports/omgmu-s3-publication-approved-43-20260810.json
          git commit -m "Record approved 43 ОмГМУ S3 publication result" || true
          git push
