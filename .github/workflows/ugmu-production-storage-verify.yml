name: UGMU production storage read-back

on:
  pull_request:
    paths:
      - "api/tools/ugmu-production-storage-stage.mjs"
      - "api/tools/ugmu-production-storage-verify.mjs"
      - "api/test/ugmu-production-storage-stage.test.js"
      - "api/src/university-commerce-policy.mjs"
      - "universities/ugmu/production-staging-authority.json"
      - ".github/workflows/ugmu-production-storage-stage.yml"
      - ".github/workflows/ugmu-production-storage-verify.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru
  SOURCE_DRY_RUN_ID: "32418787126"
  CONTAINER_NAME: kgmu-calendar-api

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test read-only boundary contract
        run: node --test test/ugmu-production-storage-stage.test.js

      - name: Download the approved step-22 manifest
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ugmu-step22
          mkdir -p /tmp/ugmu-step22
          gh run download "$SOURCE_DRY_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name ugmu-preactivation-production-dry-run \
            --dir /tmp/ugmu-step22
          manifest="$(find /tmp/ugmu-step22 -path '*/ugmu-preactivation-dry-run/manifest.json' -print -quit)"
          test -n "$manifest"
          test "$(sha256sum "$manifest" | cut -d' ' -f1)" = "2d8103b1c0a873c8cd52cc569426338342f2671ce0d740db6f3f0482590262e5"
          mkdir -p api/data/imports/ugmu-preactivation-dry-run
          cp "$manifest" api/data/imports/ugmu-preactivation-dry-run/manifest.json
          echo "UGMU_STEP22_MANIFEST_SAFE"

      - name: Resolve production S3 read credentials from Cloud.ru
        env:
          CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
          CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDRU_KEY_ID"
          test -n "$CLOUDRU_KEY_SECRET"
          auth_payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({'keyId': os.environ['CLOUDRU_KEY_ID'], 'secret': os.environ['CLOUDRU_KEY_SECRET']}))
          PY
          )"
          test "$(curl --silent --show-error --output /tmp/token.json --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data "$auth_payload" \
            'https://iam.api.cloud.ru/api/v1/auth/token')" = "200"
          readarray -t auth < <(python3 - <<'PY'
          import base64, json
          body=json.load(open('/tmp/token.json', encoding='utf-8'))
          token=body.get('access_token'); assert isinstance(token,str) and token
          parts=token.split('.'); assert len(parts) == 3
          payload=parts[1] + '='*((4-len(parts[1])%4)%4)
          claims=json.loads(base64.urlsafe_b64decode(payload.encode()).decode())
          project_id=claims.get('project_id'); assert isinstance(project_id,str) and project_id
          print(token); print(project_id)
          PY
          )
          token="${auth[0]}"; project_id="${auth[1]}"
          rm -f /tmp/token.json
          echo "::add-mask::$token"
          get_url="https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$project_id"
          test "$(curl --silent --show-error --output /tmp/container.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $token" --header 'Accept: application/json' "$get_url")" = "200"
          python3 - <<'PY' >/tmp/s3-env
          import json
          app=json.load(open('/tmp/container.json', encoding='utf-8'))
          containers=app.get('template',{}).get('containers',[]); assert len(containers) == 1
          env={item.get('name'):item.get('value') for item in containers[0].get('env',[]) if isinstance(item,dict)}
          values={
            'S3_ACCESS_KEY_ID': env.get('S3_ACCESS_KEY_ID') or '',
            'S3_SECRET_ACCESS_KEY': env.get('S3_SECRET_ACCESS_KEY') or '',
            'S3_BUCKET': env.get('S3_BUCKET') or 'kgmu-calendar-data-gmarkov634',
            'S3_ENDPOINT': env.get('S3_ENDPOINT') or 'https://s3.cloud.ru',
            'S3_REGION': env.get('S3_REGION') or 'ru-central-1',
          }
          assert values['S3_ACCESS_KEY_ID'] and values['S3_SECRET_ACCESS_KEY']
          for key,value in values.items():
              assert '\n' not in value and '\r' not in value
              print(f'{key}={value}')
          PY
          rm -f /tmp/container.json
          while IFS= read -r line; do
            value="${line#*=}"
            echo "::add-mask::$value"
            echo "$line" >> "$GITHUB_ENV"
          done </tmp/s3-env
          rm -f /tmp/s3-env
          echo "UGMU_STORAGE_READ_CONTEXT_SAFE"

      - name: Verify all staged objects and rollback snapshots
        shell: bash
        run: |
          set -euo pipefail
          node tools/ugmu-production-storage-verify.mjs \
            --manifest=data/imports/ugmu-preactivation-dry-run/manifest.json \
            --report=data/imports/ugmu-production-storage-verify/report.json \
            --production-base-url="$PRODUCTION_BASE_URL"
          jq -e '
            .passed == true and
            .status == "PASS" and
            .totals.groups == 12 and
            .totals.events == 4286 and
            .totals.schedulesPresent == 12 and
            .totals.hashesMatched == 12 and
            .totals.rollbackSnapshotsPresent == 12 and
            .boundary.passed == true and
            .mutationPerformed == false and
            .nextRequiredBoundary == "deploy-isolation-guards"
          ' data/imports/ugmu-production-storage-verify/report.json >/dev/null

      - name: Write read-back summary
        if: always()
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const file = 'data/imports/ugmu-production-storage-verify/report.json';
          console.log('## UGMU production storage read-back');
          console.log('');
          if (!fs.existsSync(file)) { console.log('Read-back report was not generated.'); process.exit(0); }
          const r=JSON.parse(fs.readFileSync(file,'utf8'));
          console.log(`Status: **${r.status}**`);
          console.log(`Schedules present: **${r.totals.schedulesPresent}/12**`);
          console.log(`Schedule hashes matched: **${r.totals.hashesMatched}/12**`);
          console.log(`Rollback snapshots present: **${r.totals.rollbackSnapshotsPresent}/12**`);
          console.log(`Public boundary closed: **${r.boundary.passed ? 'yes' : 'no'}**`);
          console.log('Production mutation by this verification: **no**');
          NODE

      - name: Upload read-back evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-production-storage-readback
          path: api/data/imports/ugmu-production-storage-verify/report.json
          if-no-files-found: warn
          retention-days: 90
