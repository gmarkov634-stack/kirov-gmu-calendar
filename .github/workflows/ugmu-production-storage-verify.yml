name: UGMU production storage read-back

on:
  pull_request:
    paths:
      - "api/tools/ugmu-production-storage-stage.mjs"
      - "api/tools/ugmu-production-storage-verify.mjs"
      - "api/test/ugmu-production-storage-stage.test.js"
      - "api/test/ugmu-production-storage-verify.test.js"
      - "api/src/university-commerce-policy.mjs"
      - "universities/ugmu/production-staging-authority.json"
      - ".github/workflows/ugmu-production-storage-stage.yml"
      - ".github/workflows/ugmu-production-storage-verify.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru
  SOURCE_DRY_RUN_ID: "32418787126"
  S3_BUCKET: kgmu-calendar-data-gmarkov634
  S3_ENDPOINT: https://s3.cloud.ru
  S3_REGION: ru-central-1

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test storage and post-launch read-only boundary contracts
        run: node --test test/ugmu-production-storage-stage.test.js test/ugmu-production-storage-verify.test.js

      - name: Download the approved step-22 manifest
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ugmu-step22
          mkdir -p /tmp/ugmu-step22
          gh run download "$SOURCE_DRY_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name ugmu-preactivation-production-dry-run \
            --dir /tmp/ugmu-step22
          manifest="$(find /tmp/ugmu-step22 -path '*/ugmu-preactivation-dry-run/manifest.json' -print -quit)"
          test -n "$manifest"
          test "$(sha256sum "$manifest" | cut -d' ' -f1)" = "2d8103b1c0a873c8cd52cc569426338342f2671ce0d740db6f3f0482590262e5"
          mkdir -p api/data/imports/ugmu-preactivation-dry-run
          cp "$manifest" api/data/imports/ugmu-preactivation-dry-run/manifest.json
          echo "UGMU_STEP22_MANIFEST_SAFE"

      - name: Use protected production S3 credentials
        env:
          DIRECT_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          DIRECT_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DIRECT_S3_ACCESS_KEY_ID"
          test -n "$DIRECT_S3_SECRET_ACCESS_KEY"
          echo "::add-mask::$DIRECT_S3_ACCESS_KEY_ID"
          echo "::add-mask::$DIRECT_S3_SECRET_ACCESS_KEY"
          echo "S3_ACCESS_KEY_ID=$DIRECT_S3_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "S3_SECRET_ACCESS_KEY=$DIRECT_S3_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "UGMU_STORAGE_READ_CREDENTIAL_PATH_SAFE"

      - name: Verify all staged objects and rollback snapshots
        shell: bash
        run: |
          set -euo pipefail
          node tools/ugmu-production-storage-verify.mjs \
            --manifest=data/imports/ugmu-preactivation-dry-run/manifest.json \
            --report=data/imports/ugmu-production-storage-verify/report.json \
            --production-base-url="$PRODUCTION_BASE_URL"
          jq -e '
            .passed == true and
            .status == "PASS" and
            .mode == "post-launch-production-read-only" and
            .totals.groups == 12 and
            .totals.events == 4286 and
            .totals.schedulesPresent == 12 and
            .totals.hashesMatched == 12 and
            .totals.rollbackSnapshotsPresent == 12 and
            .boundary.passed == true and
            .boundary.checks.health == true and
            .boundary.checks.meta == true and
            .boundary.checks.salesOpen == true and
            .boundary.checks.trialsClosed == true and
            .boundary.checks.paymentModeLive == true and
            .boundary.checks.publicScheduleClosed == true and
            .boundary.checks.publicIcsClosed == true and
            .boundary.checks.getOnly == true and
            .mutationPerformed == false and
            .paymentCreated == false and
            .nextRequiredBoundary == "current-pr-ci-green"
          ' data/imports/ugmu-production-storage-verify/report.json >/dev/null

      - name: Write read-back summary
        if: always()
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const file = 'data/imports/ugmu-production-storage-verify/report.json';
          console.log('## UGMU production storage read-back');
          console.log('');
          if (!fs.existsSync(file)) { console.log('Read-back report was not generated.'); process.exit(0); }
          const r=JSON.parse(fs.readFileSync(file,'utf8'));
          console.log(`Status: **${r.status}**`);
          console.log(`Mode: **${r.mode}**`);
          console.log(`Schedules present: **${r.totals.schedulesPresent}/12**`);
          console.log(`Schedule hashes matched: **${r.totals.hashesMatched}/12**`);
          console.log(`Rollback snapshots present: **${r.totals.rollbackSnapshotsPresent}/12**`);
          console.log(`Post-launch public boundary safe: **${r.boundary.passed ? 'yes' : 'no'}**`);
          console.log('Production mutation by this verification: **no**');
          console.log('Payment/order creation by this verification: **no**');
          NODE

      - name: Upload read-back evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-production-storage-readback
          path: api/data/imports/ugmu-production-storage-verify/report.json
          if-no-files-found: warn
          retention-days: 90
