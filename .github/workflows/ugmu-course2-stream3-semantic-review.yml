name: UGMU course2 stream3 semantic review

on:
  pull_request:
    paths:
      - "api/tools/ugmu-course2-stream3-raw.py"
      - "api/tools/ugmu-course2-stream3-semantic.py"
      - "api/tools/requirements-ugmu.txt"
      - "api/src/adapters/ugmu/**"
      - ".github/workflows/ugmu-course2-stream3-semantic-review.yml"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm ci
      - name: Install PDF parser dependency
        run: python3 -m pip install -r tools/requirements-ugmu.txt
      - name: Discover official UGMU medicine sources
        run: node tools/ugmu-discover.mjs --program=medicine --output=data/imports/course2-source-manifest.json
      - name: Download official autumn PDFs
        run: node tools/ugmu-download.mjs --manifest=data/imports/course2-source-manifest.json --semester=autumn --output=data/imports/course2-pdfs
      - name: Extract and reconcile only course2 stream III
        run: |
          set -euo pipefail
          report='data/imports/course2-pdfs/download-report.json'
          item="$(jq -c '.files[] | select(.status == "downloaded" and .course == 2 and .stream == "3" and .part == "combined")' "$report" | head -n 1)"
          test -n "$item"
          filename="$(jq -r '.filename' <<<"$item")"
          source_url="$(jq -r '.url' <<<"$item")"
          sha="$(jq -r '.sha256' <<<"$item")"
          test "$sha" = 'b6cc586f29a20bd008b5da89129809db7fbed8b2a9224a9f2d4cd3e3a77a9b85'
          python3 tools/ugmu-course2-stream3-raw.py \
            --input="data/imports/course2-pdfs/$filename" \
            --source="$source_url" \
            --output=data/imports/course2-stream3/raw.json
          python3 tools/ugmu-course2-stream3-semantic.py \
            --raw=data/imports/course2-stream3/raw.json \
            --pdf="data/imports/course2-pdfs/$filename" \
            --output=data/imports/course2-stream3/semantic.json
          jq -e '
            .mode == "semantic-weekly-patterns-only" and
            .course == 2 and .stream == 3 and
            .summary.semanticPatternCount == 204 and
            .summary.unresolvedTitleReferences == 0 and
            .summary.ambiguousTitleReferences == 0 and
            .summary.eventExpansionPerformed == false and
            .summary.canonicalizationPerformed == false and
            .summary.storageWritesPerformed == false and
            .summary.publicationAllowed == false
          ' data/imports/course2-stream3/semantic.json >/dev/null
          jq '{source, summary}' data/imports/course2-stream3/semantic.json
      - name: Upload read-only semantic evidence
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-course2-stream3-semantic-review
          path: |
            api/data/imports/course2-stream3/raw.json
            api/data/imports/course2-stream3/semantic.json
          retention-days: 14
