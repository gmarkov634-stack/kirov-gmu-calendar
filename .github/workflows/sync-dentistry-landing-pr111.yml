name: Sync Dentistry landing PR 111 with main

on:
  push:
    branches:
      - feat/dentistry-191-194-landing-ready
    paths:
      - '.github/workflows/sync-dentistry-landing-pr111.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge exact current main and remove temporary workflow
        env:
          EXPECTED_MAIN: b972d2b167ac0827d02e831067b29b1002213848
        run: |
          set -euo pipefail
          git fetch origin main
          actual="$(git rev-parse origin/main)"
          test "$actual" = "$EXPECTED_MAIN" || { echo "main moved: $actual" >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit "$EXPECTED_MAIN"
          git rm .github/workflows/sync-dentistry-landing-pr111.yml
          git commit -m 'Sync Dentistry landing PR #111 with current main'
          git push origin HEAD:feat/dentistry-191-194-landing-ready
