name: Reconstruct KGMU course 3 parser

on:
  push:
    branches:
      - agent/kgmu-foreign-r-course3
    paths:
      - "api/tools/kgmu-course3-reconstruct.ready"

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct parser source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d api/src/adapters/kgmu/.course3-v2.mjs.gz.b64 | gunzip > api/src/adapters/kgmu/foreign-r-generic-v2.mjs
          node --check api/src/adapters/kgmu/foreign-r-generic-v2.mjs
          test "$(wc -c < api/src/adapters/kgmu/foreign-r-generic-v2.mjs)" -eq 37152
      - name: Commit reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          rm api/src/adapters/kgmu/.course3-v2.mjs.gz.b64
          rm -f api/src/adapters/kgmu/.course3-v2.part01.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A api/src/adapters/kgmu
          git commit -m "Add course 3 R-FIO generic parser v2"
          git push origin HEAD:agent/kgmu-foreign-r-course3
