name: UGMU fix staging credential path one-shot

on:
  push:
    branches:
      - main
    paths:
      - universities/ugmu/fix-staging-credential-path-execute.json

permissions:
  contents: write
  issues: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/ugmu-course1-staging-credential-path-20260822
          fetch-depth: 0

      - name: Patch exact stale credential path and test fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              Path('api/tools/ugmu-course1-production-storage-stage.mjs'): (
                  'credentialPath: authority?.credentialPath === "github-actions-s3-secrets",',
                  'credentialPath: authority?.credentialPath === "cloudru-runtime-container-env",',
              ),
              Path('api/test/ugmu-course1-production-storage-stage.test.js'): (
                  'credentialPath: "github-actions-s3-secrets",',
                  'credentialPath: "cloudru-runtime-container-env",',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one stale credentialPath, found {text.count(old)}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          cd api
          npm ci
          node --test test/ugmu-course1-production-storage-stage.test.js test/ugmu-course1-production-storage-verify.test.js

      - name: Commit and push feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gmarkov634-stack"
          git config user.email "gmarkov634@gmail.com"
          git add -- api/tools/ugmu-course1-production-storage-stage.mjs api/test/ugmu-course1-production-storage-stage.test.js
          git diff --cached --check
          git commit -m "Fix UGMU staging credential path validation"
          git push origin HEAD:fix/ugmu-course1-staging-credential-path-20260822
          sha="$(git rev-parse HEAD)"
          echo "$sha" > /tmp/sha

      - name: Report patch result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(cat /tmp/sha)"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "UGMU staging credential-path fix ready $sha" \
            --body "Patched only the stale credentialPath validator and its fixture. Target: cloudru-runtime-container-env. Focused staging tests passed before push."
