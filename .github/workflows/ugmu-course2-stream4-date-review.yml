name: UGMU course2 stream4 date review

on:
  pull_request:
    paths:
      - "api/tools/ugmu-course2-stream4-*.py"
      - "api/tools/requirements-ugmu.txt"
      - "api/src/adapters/ugmu/**"
      - ".github/workflows/ugmu-course2-stream4-date-review.yml"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install PDF parser dependency
        run: python3 -m pip install -r tools/requirements-ugmu.txt

      - name: Discover official UGMU medicine sources
        run: node tools/ugmu-discover.mjs --program=medicine --output=data/imports/course2-source-manifest.json

      - name: Download official autumn PDFs
        run: node tools/ugmu-download.mjs --manifest=data/imports/course2-source-manifest.json --semester=autumn --output=data/imports/course2-pdfs

      - name: Extract, reconcile and expand only course2 stream IV
        run: |
          set -euo pipefail
          report='data/imports/course2-pdfs/download-report.json'
          item="$(jq -c '.files[] | select(.status == "downloaded" and .course == 2 and .stream == "4" and .part == "combined")' "$report" | head -n 1)"
          test -n "$item"
          filename="$(jq -r '.filename' <<<"$item")"
          source_url="$(jq -r '.url' <<<"$item")"
          sha="$(jq -r '.sha256' <<<"$item")"
          test "$sha" = '6b5f87dc7f565169105245a397996e61e94794dfe580529cc5f7398a62e21517'
          python3 tools/ugmu-course2-stream4-raw.py \
            --input="data/imports/course2-pdfs/$filename" \
            --source="$source_url" \
            --output=data/imports/course2-stream4/raw.json
          python3 tools/ugmu-course2-stream4-semantic.py \
            --raw=data/imports/course2-stream4/raw.json \
            --pdf="data/imports/course2-pdfs/$filename" \
            --output=data/imports/course2-stream4/semantic.json
          python3 tools/ugmu-course2-stream4-expand.py \
            --semantic=data/imports/course2-stream4/semantic.json \
            --output=data/imports/course2-stream4/dated-review.json
          jq -e '
            .mode == "dated-events-review-only" and
            .course == 2 and .stream == 4 and
            .source.sha256 == "6b5f87dc7f565169105245a397996e61e94794dfe580529cc5f7398a62e21517" and
            .sourcePeriodLiteral.start == "01.09.2026" and
            .sourcePeriodLiteral.end == "23.12.2027" and
            .effectivePeriod.start == "2026-09-01" and
            .effectivePeriod.end == "2026-12-23" and
            .summary.sourcePeriodCorrectionApplied == true and
            .summary.groupCount == 12 and
            .summary.semanticPatternCount == 204 and
            .summary.eventCount == 2747 and
            .summary.eventsByGroup == {
              "ОЛД 237":228,"ОЛД 238":228,"ОЛД 239":229,"ОЛД 240":229,
              "ОЛД 241":228,"ОЛД 242":228,"ОЛД 243":230,"ОЛД 244":229,
              "ОЛД 245":229,"ОЛД 246":229,"ОЛД 247":230,"ОЛД 248":230
            } and
            .summary.lessonTypeEventCounts == {"other":1763,"lecture":984} and
            .summary.weekRuleEventCounts == {"weekly":2147,"II":288,"I":312} and
            .summary.duplicateCount == 0 and
            .summary.invalidIntervalCount == 0 and
            .summary.overlapCount == 32 and
            .summary.reviewRequired == true and
            ([.review.overlaps[].group] | unique | sort) == ["ОЛД 247","ОЛД 248"] and
            all(.review.overlaps[];
              .left.startTime == "16:20" and .left.endTime == "18:40" and
              .left.titleSemantic == "Микробиология, вирусология, иммунология" and
              .left.lessonTypeSemantic == "other" and
              .right.startTime == "18:00" and .right.endTime == "19:30" and
              .right.titleSemantic == "Микробиология, вирусология, иммунология" and
              .right.lessonTypeSemantic == "lecture"
            ) and
            .summary.canonicalizationPerformed == false and
            .summary.storageWritesPerformed == false and
            .summary.icsGenerated == false and
            .summary.publicationAllowed == false
          ' data/imports/course2-stream4/dated-review.json >/dev/null
          jq '{source, sourcePeriodLiteral, sourceCorrections, effectivePeriod, weekAnchors, summary, overlaps:.review.overlaps, duplicates:.review.duplicates, invalidIntervals:.review.invalidIntervals}' data/imports/course2-stream4/dated-review.json

      - name: Upload read-only date review evidence
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-course2-stream4-date-review
          path: api/data/imports/course2-stream4/
          retention-days: 14
