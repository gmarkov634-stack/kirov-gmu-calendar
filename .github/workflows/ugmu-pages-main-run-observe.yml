name: UGMU main Pages run observe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ugmu-pages-main-run-observe.yml"

permissions:
  actions: read
  contents: read

env:
  EXPECTED_MAIN_SHA: ce42184a3e21f01920299542ea350d22cffbe6ba

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Find exact post-launch Pages recovery run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ugmu-controlled-pages-main-v2.yml/runs?branch=main&per_page=10"
          test "$(curl -sS -o /tmp/runs.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$url")" = 200
          run_id="$(python3 - <<'PY'
          import json,os
          b=json.load(open('/tmp/runs.json')); sha=os.environ['EXPECTED_MAIN_SHA']
          matches=[r for r in (b.get('workflow_runs') or []) if r.get('head_sha')==sha and r.get('event')=='push']
          assert len(matches)==1, {'matches':[(r.get('id'),r.get('head_sha'),r.get('status'),r.get('conclusion')) for r in matches]}
          print(matches[0]['id'])
          PY
          )"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "UGMU_PAGES_RECOVERY_RUN_FOUND=$run_id"

      - name: Wait for exact recovery run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Verify exact launch recovery result
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion,headSha,event,jobs > /tmp/run.json
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '
            .status=="completed" and .conclusion=="success" and .headSha==$sha and .event=="push" and
            ([.jobs[]|select(.name=="deploy" and .conclusion=="success")]|length)==1
          ' /tmp/run.json >/dev/null
          page="$(curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 5 "https://gmarkov634-stack.github.io/kirov-gmu-calendar/ugmu/?recovery=$RUN_ID")"
          printf '%s' "$page" | grep -q 'name="robots" content="index,follow"'
          printf '%s' "$page" | grep -q 'Календарь доступен'
          echo "UGMU_PAGES_POST_LAUNCH_RECOVERY_PASS run=$RUN_ID"
