name: UGMU main Pages run observe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ugmu-pages-main-run-observe.yml"

permissions:
  actions: read
  contents: read

env:
  EXPECTED_MAIN_SHA: 1f4c2ef5681f704ebc051330ed580c222215c0f7
  EXPECTED_WORKFLOW: omgmu-pages.yml

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Find exact shared Pages preservation run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${EXPECTED_WORKFLOW}/runs?branch=main&per_page=10"
          test "$(curl -sS -o /tmp/runs.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$url")" = 200
          run_id="$(python3 - <<'PY'
          import json,os
          b=json.load(open('/tmp/runs.json')); sha=os.environ['EXPECTED_MAIN_SHA']
          matches=[r for r in (b.get('workflow_runs') or []) if r.get('head_sha')==sha and r.get('event')=='push']
          assert len(matches)==1, {'matches':[(r.get('id'),r.get('head_sha'),r.get('status'),r.get('conclusion')) for r in matches]}
          print(matches[0]['id'])
          PY
          )"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "UGMU_SHARED_PAGES_RUN_FOUND=$run_id"

      - name: Wait for exact shared Pages run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Verify exact shared deployment and live paths
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion,headSha,event,jobs > /tmp/run.json
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '
            .status=="completed" and .conclusion=="success" and .headSha==$sha and .event=="push" and
            ([.jobs[]|select(.name=="deploy" and .conclusion=="success")]|length)==1
          ' /tmp/run.json >/dev/null
          for attempt in $(seq 1 24); do
            root="$(curl -sS -o /tmp/root -w '%{http_code}' --max-time 20 "https://gmarkov634-stack.github.io/kirov-gmu-calendar/?observe=$RUN_ID&attempt=$attempt" || true)"
            omgmu="$(curl -sS -o /tmp/omgmu -w '%{http_code}' --max-time 20 "https://gmarkov634-stack.github.io/kirov-gmu-calendar/omgmu/?observe=$RUN_ID&attempt=$attempt" || true)"
            ugmu="$(curl -sS -o /tmp/ugmu -w '%{http_code}' --max-time 20 "https://gmarkov634-stack.github.io/kirov-gmu-calendar/ugmu/?observe=$RUN_ID&attempt=$attempt" || true)"
            if [ "$root" = 200 ] && [ "$omgmu" = 200 ] && [ "$ugmu" = 200 ] && grep -q 'name="robots" content="index,follow"' /tmp/ugmu && grep -q 'Календарь доступен' /tmp/ugmu; then
              echo "UGMU_SHARED_PAGES_PRESERVATION_PASS run=$RUN_ID root=$root omgmu=$omgmu ugmu=$ugmu"
              exit 0
            fi
            sleep 5
          done
          exit 2
