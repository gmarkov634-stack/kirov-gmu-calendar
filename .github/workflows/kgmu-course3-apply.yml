name: Apply R-FIO course 3 update

on:
  push:
    branches:
      - agent/kgmu-foreign-r-course3

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kgmu-foreign-r-course3
      - name: Materialize reviewed course 3 parser and regression
        shell: bash
        run: |
          set -euo pipefail
          GEN1='' 
          GEN2='' 
          GEN3=''
          REVIEWED=''
          TEST=''
          printf '%s%s%s' "$GEN1" "$GEN2" "$GEN3" | base64 -d | gzip -d > api/src/adapters/kgmu/foreign-r-generic.mjs
          printf '%s' "$REVIEWED" | base64 -d | gzip -d > api/src/adapters/kgmu/foreign-r-reviewed.mjs
          printf '%s' "$TEST" | base64 -d | gzip -d > api/test/kgmu-foreign-r-course3.test.js
          cat > api/test/fixtures/kgmu-foreign-course3-2025-26.part1.b64 <<'EOF'
          
          EOF
          cat > api/test/fixtures/kgmu-foreign-course3-2025-26.part2.b64 <<'EOF'
          
          EOF
          cat > api/test/fixtures/kgmu-foreign-course3-2025-26.part3.b64 <<'EOF'
          
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/src/adapters/kgmu/foreign-r-generic.mjs api/src/adapters/kgmu/foreign-r-reviewed.mjs api/test/kgmu-foreign-r-course3.test.js api/test/fixtures/kgmu-foreign-course3-2025-26.part1.b64 api/test/fixtures/kgmu-foreign-course3-2025-26.part2.b64 api/test/fixtures/kgmu-foreign-course3-2025-26.part3.b64
          git commit -m 'Extend R-FIO for course 3 weekly patterns'
          git push origin HEAD:agent/kgmu-foreign-r-course3
