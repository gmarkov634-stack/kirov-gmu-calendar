name: UGMU commercial sales isolation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "api/src/config.js"
      - "api/src/app.js"
      - "api/src/universities/**"
      - "api/test/ugmu-sales-isolation.test.js"
      - "api/test/ugmu-api-routing.test.js"
      - "api/test/shared-config.test.js"
      - "api/tools/ugmu-sales-isolation-gate.mjs"
      - "api/package.json"
      - ".github/workflows/ugmu-sales-isolation.yml"

permissions:
  contents: read

env:
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru

jobs:
  sales-isolation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Verify dedicated UGMU checkout isolation
        working-directory: api
        run: |
          node --test \
            test/ugmu-sales-isolation.test.js \
            test/ugmu-api-routing.test.js \
            test/shared-config.test.js

      - name: Build sales isolation evidence
        working-directory: api
        run: npm run gate:ugmu:sales-isolation -- --report=data/regression/ugmu-sales-isolation-report.json

      - name: Verify production remains closed before isolation deploy
        shell: bash
        run: |
          set -euo pipefail
          base="$PRODUCTION_BASE_URL"
          meta="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "$base/api/v2/meta")"
          python3 - "$meta" <<'PY'
          import json,sys
          meta=json.loads(sys.argv[1])
          assert meta.get('sales') == 'closed', meta
          assert meta.get('trials') == 'closed', meta
          print('UGMU_SALES_ISOLATION_PRODUCTION_BASELINE_CLOSED')
          PY

          status="$(curl --silent --show-error --output /tmp/ugmu-sales-isolation-checkout.json --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"university_id":"ugmu","program":"medicine","course":1,"stream":"1","groupCode":"ОЛД 101","groupId":"ugmu:medicine:1:stream-1:ОЛД 101","email":"sales-isolation-smoke@example.com","plan":"semester"}' \
            "$base/api/v2/payments")"
          test "$status" = "409"
          python3 - <<'PY'
          import json
          body=json.load(open('/tmp/ugmu-sales-isolation-checkout.json',encoding='utf-8'))
          assert body.get('error') in {'sales_not_open','university_sales_not_open'}, body
          print('UGMU_SALES_ISOLATION_PRODUCTION_CHECKOUT_CLOSED', body)
          PY

      - name: Upload sales isolation evidence
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-sales-isolation
          path: api/data/regression/ugmu-sales-isolation-report.json
          if-no-files-found: error
          retention-days: 90
