name: Probe medicine 111-120 official source

on:
  push:
    branches:
      - feat/medicine-111-120
    paths:
      - 'fixtures/tools/probe_medicine_111_120_source.py'
      - '.github/workflows/probe-medicine-111-120.yml'
  pull_request:
    branches: [main]
    paths:
      - 'fixtures/tools/probe_medicine_111_120_source.py'
      - '.github/workflows/probe-medicine-111-120.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Fetch and mechanically dump official workbook
        run: python fixtures/tools/probe_medicine_111_120_source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medicine-111-120-source-probe
          path: medicine-111-120-source-probe.json
          if-no-files-found: error
