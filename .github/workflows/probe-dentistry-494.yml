name: Probe dentistry 494 official source

on:
  push:
    branches:
      - feat/dentistry-494-2026-09-03
    paths:
      - 'fixtures/tools/probe_dentistry_494_source.py'
      - '.github/workflows/probe-dentistry-494.yml'
  pull_request:
    branches: [main]
    paths:
      - 'fixtures/tools/probe_dentistry_494_source.py'
      - '.github/workflows/probe-dentistry-494.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Fetch and mechanically dump official workbook
        run: python fixtures/tools/probe_dentistry_494_source.py
      - name: Persist text-only mechanical evidence on branch
        if: github.event_name == 'push'
        run: |
          cp dentistry-494-source-probe.json qa/2026-2027-semester-1/dentistry-494.source-probe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/2026-2027-semester-1/dentistry-494.source-probe.json
          if git diff --cached --quiet; then
            echo 'Mechanical evidence unchanged'
          else
            git commit -m 'Record Dentistry 494 mechanical source evidence'
            git push origin HEAD:feat/dentistry-494-2026-09-03
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dentistry-494-source-probe
          path: |
            dentistry-494-source-probe.json
            dentistry-494-source.xlsx
          if-no-files-found: error
