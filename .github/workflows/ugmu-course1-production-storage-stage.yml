name: UGMU course-1 production storage stage

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type the exact staging confirmation phrase"
        required: true
        type: string
      source_run_id:
        description: "Successful UGMU course-1 canonical package QA run ID from this exact main SHA"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ugmu-course1-production-storage-stage
  cancel-in-progress: false

env:
  EXPECTED_MANIFEST_ID: ugmu-course1-2026-autumn-c23093970be0
  EXPECTED_MANIFEST_SHA256: bb701f0619df8f53eb3943b846be8b8ac5e815225aace15df34de051b4c194eb
  EXPECTED_AUTHORITY_SHA256: 820e0f3537905872a136532142aaf31117396cd0cb3411f3e700466e68fb63e6
  EXPECTED_SOURCE_WORKFLOW_PATH: .github/workflows/ugmu-course1-canonical-package.yml
  EXPECTED_ARTIFACT_NAME: ugmu-course1-canonical-package
  CONFIRM_PHRASE: STAGE UGMU COURSE1 ugmu-course1-2026-autumn-c23093970be0
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout exact authorized revision
        uses: actions/checkout@v4

      - name: Verify pinned authority and explicit confirmation
        working-directory: .
        env:
          MANUAL_CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          authority='universities/ugmu/course1-production-staging-authority.json'
          test -f "$authority"
          test "$MANUAL_CONFIRM" = "$CONFIRM_PHRASE"
          test "$(sha256sum "$authority" | cut -d' ' -f1)" = "$EXPECTED_AUTHORITY_SHA256"
          jq -e --arg manifest "$EXPECTED_MANIFEST_ID" --arg manifest_sha "$EXPECTED_MANIFEST_SHA256" '
            .version == 1 and
            .kind == "ugmu-course1-production-storage-staging-authority" and
            .manifestId == $manifest and
            .manifestSha256 == $manifest_sha and
            .productionStorageWrite == true and
            .registryMutation == false and
            .catalogMutation == false and
            .checkoutMutation == false and
            .publicEndpointsMutation == false and
            .publicIcsMutation == false and
            .trialsMutation == false and
            .canonicalPublicationWrite == false and
            .salesActivation == false and
            .commerceState == "preserve-current-production-state" and
            .credentialPath == "github-actions-s3-secrets" and
            .scope.university == "ugmu" and
            .scope.program == "medicine" and
            .scope.course == 1 and
            .scope.academicYear == "2026/2027" and
            .scope.semester == 1 and
            (.groups | length) == 50 and
            .sourceQa.requiredEvent == "workflow_dispatch" and
            .sourceQa.requiredBranch == "main" and
            .sourceQa.requireSameHeadSha == true
          ' "$authority" >/dev/null
          echo 'UGMU_COURSE1_AUTHORITY_SAFE'

      - name: Verify canonical QA run is successful and from this exact main SHA
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > /tmp/source-run.json
          jq -e --arg sha "$GITHUB_SHA" --arg path "$EXPECTED_SOURCE_WORKFLOW_PATH" '
            .status == "completed" and
            .conclusion == "success" and
            .event == "workflow_dispatch" and
            .head_branch == "main" and
            .head_sha == $sha and
            .path == $path
          ' /tmp/source-run.json >/dev/null
          rm -f /tmp/source-run.json
          echo 'UGMU_COURSE1_SOURCE_RUN_SAFE'

      - name: Download exact canonical QA artifact
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ugmu-course1-artifact
          mkdir -p /tmp/ugmu-course1-artifact
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$EXPECTED_ARTIFACT_NAME" \
            --dir /tmp/ugmu-course1-artifact
          manifest='/tmp/ugmu-course1-artifact/preactivation-dry-run/manifest.json'
          groups='/tmp/ugmu-course1-artifact/preactivation-dry-run/groups'
          test -f "$manifest"
          test -d "$groups"
          test "$(sha256sum "$manifest" | cut -d' ' -f1)" = "$EXPECTED_MANIFEST_SHA256"
          jq -e --arg manifest_id "$EXPECTED_MANIFEST_ID" '
            .manifestId == $manifest_id and
            .passed == true and
            .publicationAllowed == false and
            .totals.groups == 50 and
            .totals.events == 17301 and
            .activationAuthority.granted == false and
            .activationAuthority.stagingWriteAuthority == false and
            .activationAuthority.salesAuthority == false
          ' "$manifest" >/dev/null
          echo 'UGMU_COURSE1_ARTIFACT_PINNED'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies and re-run staging contracts
        run: |
          set -euo pipefail
          npm ci
          node --check tools/ugmu-course1-production-storage-stage.mjs
          node --check tools/ugmu-course1-production-storage-verify.mjs
          node --test test/ugmu-course1-production-storage-stage.test.js test/ugmu-course1-production-storage-verify.test.js

      - name: Verify protected S3 secrets exist
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$S3_ACCESS_KEY_ID"
          test -n "$S3_SECRET_ACCESS_KEY"
          echo 'UGMU_COURSE1_S3_SECRETS_PRESENT'

      - name: Stage exact 50-group storage package
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/ugmu-course1-production-storage-stage.mjs \
            --manifest=/tmp/ugmu-course1-artifact/preactivation-dry-run/manifest.json \
            --groups-dir=/tmp/ugmu-course1-artifact/preactivation-dry-run/groups \
            --authority=../universities/ugmu/course1-production-staging-authority.json \
            --report=data/imports/ugmu-course1/production-storage-stage/report.json \
            --production-base-url="$PRODUCTION_BASE_URL"
          jq -e '
            .passed == true and
            .status == "PASS" and
            .manifestId == "ugmu-course1-2026-autumn-c23093970be0" and
            .manifestSha256 == "bb701f0619df8f53eb3943b846be8b8ac5e815225aace15df34de051b4c194eb" and
            .totals.groups == 50 and
            .totals.events == 17301 and
            .boundary.before.passed == true and
            .boundary.after.passed == true and
            .boundary.runtimeStatePreserved == true and
            .registryChanged == false and
            .catalogChanged == false and
            .trialsChanged == false and
            .checkoutChanged == false and
            .salesActivationPerformed == false and
            .publicationAllowed == false
          ' data/imports/ugmu-course1/production-storage-stage/report.json >/dev/null
          echo 'UGMU_COURSE1_STORAGE_STAGE_PASS'

      - name: Read back and verify all 50 production objects
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/ugmu-course1-production-storage-verify.mjs \
            --manifest=/tmp/ugmu-course1-artifact/preactivation-dry-run/manifest.json \
            --report=data/imports/ugmu-course1/production-storage-verify/report.json
          jq -e '
            .passed == true and
            .status == "PASS" and
            .readOnly == true and
            .totals.groups == 50 and
            .totals.events == 17301 and
            .totals.verified == 50 and
            .totals.missing == 0 and
            .totals.failed == 0
          ' data/imports/ugmu-course1/production-storage-verify/report.json >/dev/null
          echo 'UGMU_COURSE1_STORAGE_READBACK_PASS'

      - name: Write staging summary
        if: always()
        shell: bash
        run: |
          echo '## UGMU course-1 controlled storage staging' >> "$GITHUB_STEP_SUMMARY"
          stage='data/imports/ugmu-course1/production-storage-stage/report.json'
          verify='data/imports/ugmu-course1/production-storage-verify/report.json'
          if [ -f "$stage" ]; then
            jq -r '"Staging: **\(.status)** — groups \(.totals.groups)/50, writes \(.totals.schedulesWritten), already staged \(.totals.alreadyStaged), snapshots \(.totals.snapshotsCreated)"' "$stage" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$verify" ]; then
            jq -r '"Readback: **\(.status)** — verified \(.totals.verified)/50, missing \(.totals.missing), failed \(.totals.failed)"' "$verify" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'This workflow does not mutate registry, catalog, trial, checkout, public endpoints, public ICS or sales activation.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-course1-production-storage-stage
          path: |
            api/data/imports/ugmu-course1/production-storage-stage/report.json
            api/data/imports/ugmu-course1/production-storage-verify/report.json
            universities/ugmu/course1-production-staging-authority.json
          if-no-files-found: warn
          retention-days: 90
