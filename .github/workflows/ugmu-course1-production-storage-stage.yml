name: UGMU course-1 production storage stage

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type the exact staging confirmation phrase"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ugmu-course1-production-storage-stage
  cancel-in-progress: false

env:
  EXPECTED_MANIFEST_ID: ugmu-course1-2026-autumn-c23093970be0
  EXPECTED_MANIFEST_SHA256: bb701f0619df8f53eb3943b846be8b8ac5e815225aace15df34de051b4c194eb
  EXPECTED_AUTHORITY_SHA256: b269e0c3696de89d61c3e9d01e9b1a35ca4ceae4437b2d0118071e59549f9fad
  SOURCE_RUN_ID: "32561505590"
  SOURCE_HEAD_SHA: ae0a4a9002c89719f41290d25d8b9d22717d4fbb
  EXPECTED_ARTIFACT_NAME: ugmu-course1-canonical-package
  CONFIRM_PHRASE: STAGE UGMU COURSE1 ugmu-course1-2026-autumn-c23093970be0
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru
  CONTAINER_NAME: kgmu-calendar-api

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify authority and confirmation
        working-directory: .
        env:
          MANUAL_CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          authority='universities/ugmu/course1-production-staging-authority.json'
          test "$MANUAL_CONFIRM" = "$CONFIRM_PHRASE"
          test "$(sha256sum "$authority" | cut -d' ' -f1)" = "$EXPECTED_AUTHORITY_SHA256"
          jq -e --arg manifest "$EXPECTED_MANIFEST_ID" --arg manifest_sha "$EXPECTED_MANIFEST_SHA256" --argjson run_id "$SOURCE_RUN_ID" --arg source_sha "$SOURCE_HEAD_SHA" '
            .manifestId == $manifest and
            .manifestSha256 == $manifest_sha and
            .productionStorageWrite == true and
            .registryMutation == false and
            .catalogMutation == false and
            .checkoutMutation == false and
            .publicEndpointsMutation == false and
            .publicIcsMutation == false and
            .trialsMutation == false and
            .canonicalPublicationWrite == false and
            .salesActivation == false and
            .commerceState == "preserve-current-production-state" and
            .credentialPath == "cloudru-runtime-container-env" and
            (.groups | length) == 50 and
            .sourceQa.runId == $run_id and
            .sourceQa.headSha == $source_sha
          ' "$authority" >/dev/null

      - name: Download pinned reviewed course-1 artifact
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > /tmp/source-run.json
          jq -e --arg sha "$SOURCE_HEAD_SHA" '
            .status == "completed" and
            .conclusion == "success" and
            .event == "pull_request" and
            .head_sha == $sha and
            .path == ".github/workflows/ugmu-course1-canonical-package.yml"
          ' /tmp/source-run.json >/dev/null
          rm -rf /tmp/ugmu-course1-artifact
          mkdir -p /tmp/ugmu-course1-artifact
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$EXPECTED_ARTIFACT_NAME" --dir /tmp/ugmu-course1-artifact
          manifest='/tmp/ugmu-course1-artifact/preactivation-dry-run/manifest.json'
          test -f "$manifest"
          test -d /tmp/ugmu-course1-artifact/preactivation-dry-run/groups
          test "$(sha256sum "$manifest" | cut -d' ' -f1)" = "$EXPECTED_MANIFEST_SHA256"
          jq -e --arg id "$EXPECTED_MANIFEST_ID" '
            .manifestId == $id and .passed == true and .publicationAllowed == false and
            .totals.groups == 50 and .totals.events == 17301
          ' "$manifest" >/dev/null

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install and test staging code
        run: |
          set -euo pipefail
          npm ci
          node --test test/ugmu-course1-production-storage-stage.test.js test/ugmu-course1-production-storage-verify.test.js

      - name: Resolve production S3 credentials
        working-directory: .
        env:
          CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
          CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDRU_KEY_ID"
          test -n "$CLOUDRU_KEY_SECRET"
          python3 - <<'PY' > /tmp/auth.json
          import json, os
          print(json.dumps({"keyId": os.environ["CLOUDRU_KEY_ID"], "secret": os.environ["CLOUDRU_KEY_SECRET"]}))
          PY
          test "$(curl -sS -o /tmp/token.json -w '%{http_code}' -H 'Content-Type: application/json' --data @/tmp/auth.json https://iam.api.cloud.ru/api/v1/auth/token)" = "200"
          readarray -t auth < <(python3 - <<'PY'
          import base64, json
          body=json.load(open('/tmp/token.json', encoding='utf-8'))
          token=body['access_token']
          payload=token.split('.')[1]
          payload += '='*((4-len(payload)%4)%4)
          claims=json.loads(base64.urlsafe_b64decode(payload.encode()).decode())
          print(token)
          print(claims['project_id'])
          PY
          )
          token="${auth[0]}"
          project_id="${auth[1]}"
          echo "::add-mask::$token"
          test "$(curl -sS -o /tmp/container.json -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Accept: application/json' "https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$project_id")" = "200"
          python3 - <<'PY' > /tmp/s3-env
          import json
          app=json.load(open('/tmp/container.json', encoding='utf-8'))
          assert app.get('status') == 'running'
          containers=app.get('template',{}).get('containers',[])
          assert len(containers) == 1
          env={x.get('name'):x.get('value') for x in containers[0].get('env',[]) if isinstance(x,dict)}
          values={
            'S3_ACCESS_KEY_ID': env.get('S3_ACCESS_KEY_ID') or '',
            'S3_SECRET_ACCESS_KEY': env.get('S3_SECRET_ACCESS_KEY') or '',
            'S3_BUCKET': env.get('S3_BUCKET') or 'kgmu-calendar-data-gmarkov634',
            'S3_ENDPOINT': env.get('S3_ENDPOINT') or 'https://s3.cloud.ru',
            'S3_REGION': env.get('S3_REGION') or 'ru-central-1',
          }
          assert values['S3_ACCESS_KEY_ID'] and values['S3_SECRET_ACCESS_KEY']
          for key,value in values.items(): print(f'{key}={value}')
          PY
          while IFS= read -r line; do
            value="${line#*=}"
            echo "::add-mask::$value"
            echo "$line" >> "$GITHUB_ENV"
          done < /tmp/s3-env
          rm -f /tmp/auth.json /tmp/token.json /tmp/container.json /tmp/s3-env

      - name: Stage and verify 50 groups
        shell: bash
        run: |
          set -euo pipefail
          node tools/ugmu-course1-production-storage-stage.mjs \
            --manifest=/tmp/ugmu-course1-artifact/preactivation-dry-run/manifest.json \
            --groups-dir=/tmp/ugmu-course1-artifact/preactivation-dry-run/groups \
            --authority=../universities/ugmu/course1-production-staging-authority.json \
            --report=data/imports/ugmu-course1/production-storage-stage/report.json \
            --production-base-url="$PRODUCTION_BASE_URL"
          node tools/ugmu-course1-production-storage-verify.mjs \
            --manifest=/tmp/ugmu-course1-artifact/preactivation-dry-run/manifest.json \
            --report=data/imports/ugmu-course1/production-storage-verify/report.json
          jq -e '.passed == true and .totals.groups == 50 and .totals.events == 17301' data/imports/ugmu-course1/production-storage-stage/report.json >/dev/null
          jq -e '.passed == true and .totals.verified == 50 and .totals.missing == 0 and .totals.failed == 0' data/imports/ugmu-course1/production-storage-verify/report.json >/dev/null

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-course1-production-storage-stage
          path: |
            api/data/imports/ugmu-course1/production-storage-stage/report.json
            api/data/imports/ugmu-course1/production-storage-verify/report.json
          if-no-files-found: warn
          retention-days: 30
