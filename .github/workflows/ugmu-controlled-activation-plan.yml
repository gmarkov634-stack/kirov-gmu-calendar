name: UGMU controlled activation plan (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve completed activation-plan boundary
        run: |
          echo "The UGMU controlled activation plan is retired because controlled activation has already completed."
          echo "Its READY_FOR_EXPLICIT_CONTROLLED_ACTIVATION state is historical and must not be treated as current CI authority."
          echo "No production mutation is performed by this retired workflow."
          echo "Use UGMU Cloud.ru post-launch production smoke for current production regression checks."
