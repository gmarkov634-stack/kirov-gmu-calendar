name: UGMU YooKassa test window open

on:
  push:
    branches:
      - agent/ugmu-scaffold-20260820
    paths:
      - "universities/ugmu/yookassa-test-window-open.json"

permissions:
  contents: read
  actions: write

concurrency:
  group: ugmu-yookassa-mode-switch
  cancel-in-progress: false

env:
  CONTAINER_NAME: kgmu-calendar-api
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru
  UGMU_SITE_URL: https://gmarkov634-stack.github.io/kirov-gmu-calendar/ugmu/
  TEST_PAGE_URL: https://gmarkov634-stack.github.io/kirov-gmu-calendar/ugmu/test-checkout.html
  TEST_SHOP_ID: "1259975"
  TEST_SECRET: yookassa-test-secret-key
  LIVE_SECRET: yookassa-secret-key
  EXPECTED_IMAGE: kgmu-calendar-api.cr.cloud.ru/api@sha256:1eb443926c40e705ee8d758d8479552576deb735d54fe86a18ec300895929829
  PAGES_WORKFLOW: ugmu-controlled-pages-main-v2.yml

jobs:
  open-test-window:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
      CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact authority commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify one-shot authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          p='universities/ugmu/yookassa-test-window-open.json'
          a=json.load(open(p,encoding='utf-8'))
          assert a['version']==1
          assert a['kind']=='ugmu-yookassa-test-window-open'
          assert a['boundary']=='temporary-yookassa-test-window'
          assert a['authorizedBranch']=='agent/ugmu-scaffold-20260820'
          assert a['testShopId']=='1259975'
          assert a['testSecretPath']=='yookassa-test-secret-key'
          assert a['liveSecretPath']=='yookassa-secret-key'
          assert a['restoreLiveAfterTest'] is True
          assert a['userAuthorization']=='Готово'
          prepared=a['preparedCodeHead']; assert len(prepared)==40
          changed=subprocess.check_output(['git','diff','--name-only',prepared,'HEAD'],text=True).splitlines()
          assert changed==[p], changed
          print('UGMU_TEST_WINDOW_AUTHORITY_SAFE',{'testShopId':'1259975','restoreLiveAfterTest':True})
          PY

      - name: Setup Go for Secret Management preflight
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Open reversible test-mode window
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          auth_payload="$(python3 - <<'PY'
          import json,os
          print(json.dumps({'keyId':os.environ['CLOUDRU_KEY_ID'],'secret':os.environ['CLOUDRU_KEY_SECRET']}))
          PY
          )"
          test "$(curl -sS -o /tmp/cloud-token.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data "$auth_payload" https://iam.api.cloud.ru/api/v1/auth/token)" = 200
          readarray -t auth < <(python3 - <<'PY'
          import base64,json
          t=json.load(open('/tmp/cloud-token.json'))['access_token']
          p=t.split('.')[1]; p+='='*((4-len(p)%4)%4)
          c=json.loads(base64.urlsafe_b64decode(p.encode()))
          print(t); print(c['project_id'])
          PY
          )
          token="${auth[0]}"; project="${auth[1]}"; rm -f /tmp/cloud-token.json
          echo "::add-mask::$token"
          get="https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$project"
          patch="https://containers.api.cloud.ru/v2/containers/${CONTAINER_NAME}?projectId=$project"

          test "$(curl -sS -o /tmp/before.json -w '%{http_code}' -H "Authorization: Bearer $token" "$get")" = 200
          EXPECTED_IMAGE="$EXPECTED_IMAGE" UGMU_SITE_URL="$UGMU_SITE_URL" LIVE_SECRET="$LIVE_SECRET" python3 - <<'PY'
          import json,os
          a=json.load(open('/tmp/before.json')); assert a.get('status')=='running'
          c=a['template']['containers'][0]; assert c.get('image')==os.environ['EXPECTED_IMAGE'],c.get('image')
          e={x.get('name'):x for x in c.get('env',[]) if isinstance(x,dict)}
          assert e.get('COMMERCIAL_SALES_ENABLED',{}).get('value')!='true'
          assert e.get('UGMU_SALES_ENABLED',{}).get('value')=='true'
          assert e.get('UGMU_ACTIVE',{}).get('value')=='true'
          assert e.get('UGMU_SITE_URL',{}).get('value')==os.environ['UGMU_SITE_URL']
          assert e.get('TRIALS_ENABLED',{}).get('value')!='true'
          assert e.get('YOOKASSA_TEST_MODE',{}).get('value')=='false'
          sec=e.get('YOOKASSA_SECRET_KEY',{})
          assert sec.get('type')=='secret' and sec.get('value')==os.environ['LIVE_SECRET']
          assert str(e.get('YOOKASSA_SHOP_ID',{}).get('value') or '')
          print('UGMU_TEST_WINDOW_PRECONDITION_SAFE',{'running':True,'imageMatched':True,'globalSales':False,'ugmuSales':True,'active':True,'trials':False,'paymentMode':'live','liveSecretRefMatched':True})
          PY
          meta="$(curl -fsS --retry 6 --retry-all-errors --retry-delay 2 "$PRODUCTION_BASE_URL/api/v2/meta")"
          python3 - "$meta" <<'PY'
          import json,sys
          m=json.loads(sys.argv[1]); assert m.get('sales')=='open'; assert m.get('trials')=='closed'; assert m.get('paymentMode')=='live'
          print('UGMU_TEST_WINDOW_META_PRE_SAFE',{'sales':'open','trials':'closed','paymentMode':'live'})
          PY

          mkdir -p /tmp/provider && cd /tmp/provider
          cat > go.mod <<'EOF'
          module ugmutestwindow
          go 1.23.0
          require (
            github.com/cloudru-tech/secret-manager-sdk v1.1.1
            google.golang.org/grpc v1.70.0
          )
          EOF
          cat > main.go <<'EOF'
          package main
          import("context";"encoding/json";"fmt";"io";"net/http";"os";"strings";"time";sm "github.com/cloudru-tech/secret-manager-sdk";v2 "github.com/cloudru-tech/secret-manager-sdk/api/v2";"google.golang.org/grpc/metadata")
          func must(n string)string{v:=os.Getenv(n);if v==""{panic("missing "+n)};return v}
          func find(rows []*v2.Secret,target string)*v2.Secret{var m []*v2.Secret;for _,s:=range rows{x:=s.GetPath();if x==target||strings.HasSuffix(x,"/"+target){m=append(m,s)}};if len(m)!=1{panic(fmt.Sprintf("secret %s matches=%d",target,len(m)))};return m[0]}
          func probe(shop string,key []byte)(int,string,int,int){req,_:=http.NewRequest(http.MethodGet,"https://api.yookassa.ru/v3/payments?limit=10",nil);req.SetBasicAuth(shop,string(key));r,e:=(&http.Client{Timeout:20*time.Second}).Do(req);if e!=nil{panic(e)};defer r.Body.Close();b,_:=io.ReadAll(io.LimitReader(r.Body,1<<20));typ:="";tc,lc:=0,0;if r.StatusCode==200{var x struct{Type string `json:"type"`;Items []struct{Test bool `json:"test"`} `json:"items"`};if json.Unmarshal(b,&x)==nil{typ=x.Type;for _,p:=range x.Items{if p.Test{tc++}else{lc++}}}};return r.StatusCode,typ,tc,lc}
          func main(){cl,e:=sm.New(&sm.Config{Host:"secretmanager.api.cloud.ru:443"});if e!=nil{panic(e)};defer cl.Close();ctx,c:=context.WithTimeout(context.Background(),30*time.Second);defer c();ctx=metadata.AppendToOutgoingContext(ctx,"authorization","Bearer "+must("TOKEN"));sr,e:=cl.V2.SecretService.Search(ctx,&v2.SearchSecretRequest{ProjectId:must("PROJECT"),Depth:-1});if e!=nil{panic(e)};live:=find(sr.GetSecrets(),must("LIVE"));test:=find(sr.GetSecrets(),must("TEST"));lp,e:=cl.V2.SecretService.Access(ctx,&v2.AccessSecretRequest{ProjectId:must("PROJECT"),Path:live.GetPath()});if e!=nil{panic(e)};tp,e:=cl.V2.SecretService.Access(ctx,&v2.AccessSecretRequest{ProjectId:must("PROJECT"),Path:test.GetPath()});if e!=nil{panic(e)};lh,lt,ltest,llive:=probe(must("LIVE_SHOP"),lp.GetPayload().GetValue());th,tt,ttest,tlive:=probe(must("TEST_SHOP"),tp.GetPayload().GetValue());fmt.Printf("YOOKASSA_WINDOW_PREFLIGHT_SAFE liveHttp=%d liveType=%s liveTestItems=%d liveLiveItems=%d testHttp=%d testType=%s testTestItems=%d testLiveItems=%d paymentCreated=false\n",lh,lt,ltest,llive,th,tt,ttest,tlive);if lh!=200||th!=200||lt!="list"||tt!="list"{os.Exit(4)}}
          EOF
          go mod tidy
          live_shop="$(python3 - <<'PY'
          import json
          a=json.load(open('/tmp/before.json'));e={x.get('name'):x for x in a['template']['containers'][0].get('env',[]) if isinstance(x,dict)};print(e['YOOKASSA_SHOP_ID']['value'])
          PY
          )"
          TOKEN="$token" PROJECT="$project" LIVE="$LIVE_SECRET" TEST="$TEST_SECRET" LIVE_SHOP="$live_shop" TEST_SHOP="$TEST_SHOP_ID" go run .
          cd "$GITHUB_WORKSPACE"

          # Publish the hidden test page first. While backend is still live this page stays disabled.
          pages_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${PAGES_WORKFLOW}"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$pages_api/runs?event=workflow_dispatch&branch=main&per_page=30" >/tmp/pages-before.json
          pages_payload="$(python3 - <<'PY'
          import json,os
          print(json.dumps({'ref':'main','inputs':{'mode':'launch','source_sha':os.environ['GITHUB_SHA']}}))
          PY
          )"
          test "$(curl -sS -o /tmp/pages-dispatch.out -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' --data "$pages_payload" "$pages_api/dispatches")" = 204
          pages_run=''
          for attempt in $(seq 1 30); do
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$pages_api/runs?event=workflow_dispatch&branch=main&per_page=30" >/tmp/pages-after.json
            pages_run="$(python3 - <<'PY'
          import json
          before={r['id'] for r in json.load(open('/tmp/pages-before.json')).get('workflow_runs',[])}
          rows=json.load(open('/tmp/pages-after.json')).get('workflow_runs',[])
          new=[r for r in rows if r['id'] not in before]
          print(new[0]['id'] if new else '')
          PY
          )"
            [ -n "$pages_run" ] && break
            sleep 2
          done
          test -n "$pages_run"
          echo "PAGES_RUN_ID_SAFE=$pages_run"
          conclusion=''
          for attempt in $(seq 1 180); do
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/$pages_run" >/tmp/pages-run.json
            readarray -t st < <(python3 - <<'PY'
          import json
          r=json.load(open('/tmp/pages-run.json'));print(r.get('status',''));print(r.get('conclusion') or '')
          PY
          )
            if [ "${st[0]}" = completed ]; then conclusion="${st[1]}"; break; fi
            sleep 4
          done
          test "$conclusion" = success
          page_ok=false
          for attempt in $(seq 1 36); do
            code="$(curl -sS -o /tmp/test-page.html -w '%{http_code}' --max-time 20 "${TEST_PAGE_URL}?run=${GITHUB_RUN_ID}&attempt=$attempt" || true)"
            if [ "$code" = 200 ] && grep -q 'name="robots" content="noindex,nofollow"' /tmp/test-page.html && grep -q 'Тестовая оплата УГМУ' /tmp/test-page.html; then page_ok=true; break; fi
            sleep 5
          done
          test "$page_ok" = true
          echo 'UGMU_TEST_PAGE_DEPLOY_SAFE disabledWhileLive=true'

          backend_changed=false
          rollback() {
            status=$?
            if [ "$status" -eq 0 ]; then return 0; fi
            echo "UGMU_TEST_WINDOW_ROLLBACK_START status=$status"
            if [ "$backend_changed" = true ]; then
              code="$(curl -sS -o /tmp/rollback-patch.json -w '%{http_code}' -X PATCH -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data-binary @/tmp/before.json "$patch" || true)"
              echo "UGMU_TEST_WINDOW_ROLLBACK_PATCH_SAFE http=$code"
              for attempt in $(seq 1 60); do
                m="$(curl -sS "$PRODUCTION_BASE_URL/api/v2/meta" || true)"
                if META="$m" python3 - <<'PY'
          import json,os,sys
          try:m=json.loads(os.environ['META'])
          except:sys.exit(1)
          sys.exit(0 if m.get('sales')=='open' and m.get('trials')=='closed' and m.get('paymentMode')=='live' else 1)
          PY
                then echo "UGMU_TEST_WINDOW_LIVE_ROLLBACK_SAFE attempt=$attempt"; break; fi
                sleep 3
              done
            fi
            return "$status"
          }
          trap rollback EXIT

          TEST_SHOP_ID="$TEST_SHOP_ID" TEST_SECRET="$TEST_SECRET" python3 - <<'PY'
          import json,os
          a=json.load(open('/tmp/before.json')); c=a['template']['containers'][0]; items=c.setdefault('env',[]); by={x.get('name'):x for x in items if isinstance(x,dict) and x.get('name')}
          def set_plain(n,v):
            if n in by: by[n]['value']=v; by[n].pop('type',None)
            else: items.append({'name':n,'value':v}); by[n]=items[-1]
          set_plain('YOOKASSA_SHOP_ID',os.environ['TEST_SHOP_ID'])
          set_plain('YOOKASSA_TEST_MODE','true')
          if 'YOOKASSA_SECRET_KEY' not in by: items.append({'name':'YOOKASSA_SECRET_KEY','value':os.environ['TEST_SECRET'],'type':'secret'});by['YOOKASSA_SECRET_KEY']=items[-1]
          else: by['YOOKASSA_SECRET_KEY']['value']=os.environ['TEST_SECRET'];by['YOOKASSA_SECRET_KEY']['type']='secret'
          assert by.get('COMMERCIAL_SALES_ENABLED',{}).get('value')!='true'
          assert by.get('UGMU_SALES_ENABLED',{}).get('value')=='true'
          assert by.get('UGMU_ACTIVE',{}).get('value')=='true'
          assert by.get('TRIALS_ENABLED',{}).get('value')!='true'
          json.dump(a,open('/tmp/test-mode.json','w'),ensure_ascii=False,separators=(',',':'))
          PY
          test "$(curl -sS -o /tmp/test-patch.json -w '%{http_code}' -X PATCH -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data-binary @/tmp/test-mode.json "$patch")" = 200
          backend_changed=true

          ok=false
          for attempt in $(seq 1 60); do
            m="$(curl -sS "$PRODUCTION_BASE_URL/api/v2/meta" || true)"
            if META="$m" python3 - <<'PY'
          import json,os,sys
          try:m=json.loads(os.environ['META'])
          except:sys.exit(1)
          sys.exit(0 if m.get('sales')=='open' and m.get('trials')=='closed' and m.get('paymentMode')=='test' else 1)
          PY
            then ok=true; break; fi
            sleep 3
          done
          test "$ok" = true

          test "$(curl -sS -o /tmp/after.json -w '%{http_code}' -H "Authorization: Bearer $token" "$get")" = 200
          EXPECTED_IMAGE="$EXPECTED_IMAGE" TEST_SHOP_ID="$TEST_SHOP_ID" TEST_SECRET="$TEST_SECRET" python3 - <<'PY'
          import json,os
          a=json.load(open('/tmp/after.json')); assert a.get('status')=='running'; c=a['template']['containers'][0]; assert c.get('image')==os.environ['EXPECTED_IMAGE']
          e={x.get('name'):x for x in c.get('env',[]) if isinstance(x,dict)}
          assert e.get('COMMERCIAL_SALES_ENABLED',{}).get('value')!='true'
          assert e.get('UGMU_SALES_ENABLED',{}).get('value')=='true'
          assert e.get('UGMU_ACTIVE',{}).get('value')=='true'
          assert e.get('TRIALS_ENABLED',{}).get('value')!='true'
          assert e.get('YOOKASSA_SHOP_ID',{}).get('value')==os.environ['TEST_SHOP_ID']
          assert e.get('YOOKASSA_TEST_MODE',{}).get('value')=='true'
          s=e.get('YOOKASSA_SECRET_KEY',{}); assert s.get('type')=='secret' and s.get('value')==os.environ['TEST_SECRET']
          print('UGMU_TEST_WINDOW_RUNTIME_SAFE',{'running':True,'imageUnchanged':True,'globalSales':False,'ugmuSales':True,'active':True,'trials':False,'paymentMode':'test','testSecretRefMatched':True})
          PY

          normal_app="$(curl -fsS --retry 6 --retry-all-errors --retry-delay 2 "${UGMU_SITE_URL}app.js?run=${GITHUB_RUN_ID}")"
          printf '%s' "$normal_app" | grep -q 'runtime.paymentMode === "live"'
          test_code="$(curl -sS -o /tmp/test-page-after.html -w '%{http_code}' --max-time 20 "${TEST_PAGE_URL}?run=${GITHUB_RUN_ID}&after=1")"
          test "$test_code" = 200
          grep -q 'paymentMode === '\''test'\''' /tmp/test-page-after.html
          schedule_code="$(curl -sS -o /tmp/schedule.json -w '%{http_code}' "$PRODUCTION_BASE_URL/api/v2/schedules/ugmu/medicine/1/2026-2027/semester-1/ugmu%3Amedicine%3A1%3Astream-1%3A%D0%9E%D0%9B%D0%94%20101")"
          ics_code="$(curl -sS -o /tmp/public.ics -w '%{http_code}' "$PRODUCTION_BASE_URL/api/v2/schedules/ugmu/medicine/1/2026-2027/semester-1/ugmu%3Amedicine%3A1%3Astream-1%3A%D0%9E%D0%9B%D0%94%20101/calendar.ics")"
          test "$schedule_code" = 404
          test "$ics_code" = 404
          echo "UGMU_TEST_WINDOW_OPEN_PASS pagesRun=$pages_run schedule=$schedule_code publicIcs=$ics_code paymentCreated=false"

          mkdir -p evidence
          PAGES_RUN="$pages_run" python3 - <<'PY'
          import json,os
          json.dump({
            'status':'PASS',
            'boundary':'temporary-yookassa-test-window',
            'testShopId':'1259975',
            'testSecretPath':'yookassa-test-secret-key',
            'liveSecretPath':'yookassa-secret-key',
            'meta':{'sales':'open','trials':'closed','paymentMode':'test'},
            'globalSalesEnabled':False,
            'ugmuSalesEnabled':True,
            'ugmuActive':True,
            'publicScheduleStatus':404,
            'publicIcsStatus':404,
            'testPageNoindex':True,
            'normalPageCheckoutRequiresLive':True,
            'pagesRunId':int(os.environ['PAGES_RUN']),
            'paymentCreatedBySwitch':False,
            'restoreLiveRequired':True,
          },open('evidence/report.json','w'),indent=2,ensure_ascii=False)
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-yookassa-test-window-open-${{ github.run_id }}
          path: evidence/report.json
          if-no-files-found: ignore
          retention-days: 30
