name: OmGMU source probe

on:
  push:
    paths:
      - ".github/workflows/omgmu-source-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe 4th course lectures via production API
        shell: bash
        run: |
          set -euo pipefail
          base="https://kgmu-calendar-api.containerapps.ru"
          source="https://omsk-osma.ru/files/r/UU/bilingva/2026/zan/4lek.pdf"
          encoded="$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote('https://omsk-osma.ru/files/r/UU/bilingva/2026/zan/4lek.pdf', safe=''))
          PY
          )"
          body="$(curl --fail-with-body --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 "$base/api/v1/admin/omgmu/source-probe?url=$encoded")"
          echo "OMGMU_SOURCE_PROBE_BEGIN"
          echo "$body"
          echo "OMGMU_SOURCE_PROBE_END"
          python3 - "$body" <<'PY'
          import json, sys
          body = json.loads(sys.argv[1])
          assert body.get('status') == 'ok', body
          assert body.get('httpStatus') == 200, body
          assert body.get('isPdf') is True, body
          assert body.get('bytes', 0) > 0, body
          assert body.get('sha256'), body
          print('probe-ok')
          PY
