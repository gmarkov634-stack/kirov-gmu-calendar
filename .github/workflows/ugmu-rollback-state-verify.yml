name: UGMU rollback state verify (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve completed rollback boundary
        run: |
          echo "The rollback-state verifier is retired because production is now intentionally launched for UGMU."
          echo "Its former sales=closed / prelaunch-site invariant is historical and must not be used as current CI authority."
          echo "No production mutation is performed. Use UGMU Cloud.ru post-launch production smoke for current state."
