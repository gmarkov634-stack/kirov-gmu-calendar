name: UGMU rollback state verify

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ugmu-rollback-state-verify.yml"

permissions:
  contents: read

env:
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru
  UGMU_SITE_URL: https://gmarkov634-stack.github.io/kirov-gmu-calendar/ugmu/

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Confirm closed backend and prelaunch site
        shell: bash
        run: |
          set -euo pipefail
          meta="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$PRODUCTION_BASE_URL/api/v2/meta")"
          python3 - "$meta" <<'PY'
          import json,sys
          m=json.loads(sys.argv[1]); assert m.get('sales')=='closed'; assert m.get('trials')=='closed'; assert m.get('paymentMode')=='live'; print('ROLLBACK_META_SAFE',{'sales':'closed','trials':'closed','paymentMode':'live'})
          PY
          page="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "${UGMU_SITE_URL}?rollback-verify=${GITHUB_SHA}")"
          printf '%s' "$page" | grep -q 'name="robots" content="noindex,follow"'
          printf '%s' "$page" | grep -q 'Предзапусковый режим'
          group="$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote('ugmu:medicine:1:stream-1:ОЛД 101',safe=''))
          PY
          )"
          code="$(curl --silent --show-error --output /tmp/s.json --write-out '%{http_code}' "$PRODUCTION_BASE_URL/api/v2/schedules/ugmu/medicine/1/$group/schedule?groupCode=%D0%9E%D0%9B%D0%94%20101&stream=1")"
          test "$code" = 404
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/s.json')) == {'error':'schedule_not_published'}
          PY
          echo 'UGMU_ROLLBACK_STATE_SAFE paymentCreated=false mutation=false'
