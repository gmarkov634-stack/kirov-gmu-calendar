name: UGMU post-launch production verify observe

on:
  push:
    branches:
      - agent/ugmu-scaffold-20260820
    paths:
      - ".github/workflows/ugmu-post-launch-production-verify-observe.yml"

permissions:
  contents: write
  actions: read

# No production mutations; this workflow only observes the exact verifier run
# and records a non-secret GitHub evidence pointer on the feature branch.
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      AUTHORITY_SHA: ca197aeb19bedd74838d7e5807347cbc8575a8c4
    steps:
      - name: Wait for exact post-launch verifier and record pointer
        shell: bash
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/actions/workflows/ugmu-post-launch-production-verify.yml/runs?branch=agent%2Fugmu-scaffold-20260820&event=push&per_page=30"
          run_id=''; status=''; conclusion=''
          for attempt in $(seq 1 300); do
            gh api "$api" > /tmp/runs.json
            readarray -t r < <(python3 - <<'PY'
          import json,os
          rows=json.load(open('/tmp/runs.json')).get('workflow_runs',[])
          x=next((r for r in rows if r.get('head_sha')==os.environ['AUTHORITY_SHA']),None)
          if x:
            print(x['id']);print(x.get('status') or '');print(x.get('conclusion') or '')
          PY
            )
            if [ ${#r[@]} -ge 2 ]; then
              run_id="${r[0]}"; status="${r[1]}"; conclusion="${r[2]:-}"
              echo "UGMU_POST_LAUNCH_RUN_SAFE id=$run_id status=$status conclusion=$conclusion"
              [ "$status" = completed ] && break
            fi
            sleep 5
          done
          test -n "$run_id"
          test "$status" = completed
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/jobs?per_page=100" > /tmp/jobs.json
          RUN_ID="$run_id" STATUS="$status" CONCLUSION="$conclusion" python3 - <<'PY'
          import json,os
          rows=json.load(open('/tmp/jobs.json')).get('jobs',[])
          result={
            'version':1,
            'kind':'ugmu-post-launch-production-verify-observed',
            'authoritySha':os.environ['AUTHORITY_SHA'],
            'runId':int(os.environ['RUN_ID']),
            'status':os.environ['STATUS'],
            'conclusion':os.environ['CONCLUSION'],
            'jobs':[{'id':j['id'],'name':j['name'],'status':j['status'],'conclusion':j.get('conclusion')} for j in rows],
            'productionMutationPerformed':False,
          }
          json.dump(result,open('/tmp/result.json','w'),ensure_ascii=False,indent=2)
          print('UGMU_POST_LAUNCH_JOBS_SAFE',[(j['id'],j['name'],j['status'],j.get('conclusion')) for j in rows])
          PY
          content="$(base64 -w0 /tmp/result.json)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/universities/ugmu/post-launch-production-verify-observed.json" \
            -f message='Record UGMU post-launch verifier evidence pointer' \
            -f content="$content" \
            -f branch="$GITHUB_REF_NAME" >/tmp/write.json
          test "$conclusion" = success
