name: Publish API image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "api/src/**"
      - "api/data/**"
      - "api/schemas/**"
      - "api/package.json"
      - "api/package-lock.json"
      - "api/Dockerfile"
      - ".github/workflows/publish-api.yml"
      - ".github/workflows/deploy-api-cloudru.yml"

env:
  IMAGE: kgmu-calendar-api.cr.cloud.ru/api

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        working-directory: api
        run: npm ci
      - name: Test
        working-directory: api
        run: npm test
      - name: Log in to Cloud.ru Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: kgmu-calendar-api.cr.cloud.ru
          username: ${{ secrets.EVO_CR_LOGIN }}
          password: ${{ secrets.EVO_CR_PWD }}
      - name: Build Docker image
        run: |
          docker build \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${GITHUB_SHA}" \
            ./api
      - name: Push Docker image
        run: |
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${GITHUB_SHA}"
