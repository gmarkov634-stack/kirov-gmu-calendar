name: UGMU post-launch operational monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ugmu-post-launch-operational-monitor.yml"
      - "universities/ugmu/baselines/post-launch-first-stream-manifest.json"
  schedule:
    - cron: "17 * * * *"
    - cron: "43 1 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: ugmu-post-launch-operational-monitor
  cancel-in-progress: false

env:
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru
  UGMU_SITE_URL: https://gmarkov634-stack.github.io/kirov-gmu-calendar/ugmu/
  SITE_ORIGIN: https://gmarkov634-stack.github.io
  CONTAINER_NAME: kgmu-calendar-api
  EXPECTED_IMAGE: kgmu-calendar-api.cr.cloud.ru/api@sha256:1eb443926c40e705ee8d758d8479552576deb735d54fe86a18ec300895929829
  EXPECTED_SHOP_ID: "1258890"
  EXPECTED_SECRET_PATH: yookassa-secret-key
  EXPECTED_UGMU_SITE_URL: https://gmarkov634-stack.github.io/kirov-gmu-calendar/ugmu/
  APPROVED_SOURCE_SHA256: 34612248bba201096d6566cacb37c53be01d3f84eddc214bda2a594b46fb24f8
  APPROVED_STEP22_MANIFEST_SHA256: 2d8103b1c0a873c8cd52cc569426338342f2671ce0d740db6f3f0482590262e5
  S3_BUCKET: kgmu-calendar-data-gmarkov634
  S3_ENDPOINT: https://s3.cloud.ru
  S3_REGION: ru-central-1
  VERIFIER_CODE_SHA: baaf7e7d9c779a594ed4d6f695e26d6ced60dc9e

jobs:
  public:
    name: Hourly public production boundary
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify public post-launch state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence

          health="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "$PRODUCTION_BASE_URL/health")"
          meta="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "$PRODUCTION_BASE_URL/api/v2/meta")"
          python3 - "$health" "$meta" <<'PY'
          import json,sys
          health=json.loads(sys.argv[1]); meta=json.loads(sys.argv[2])
          assert health == {'status':'ok','service':'medical-calendar-api'}, health
          assert meta.get('sales') == 'open', meta
          assert meta.get('trials') == 'closed', meta
          assert meta.get('paymentMode') == 'live', meta
          print('UGMU_OPS_PUBLIC_META_SAFE')
          PY

          cors_headers="$(curl --fail --silent --show-error --max-time 20 -D - -o /dev/null \
            -X OPTIONS \
            -H "Origin: $SITE_ORIGIN" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" \
            "$PRODUCTION_BASE_URL/api/v2/payments" | tr -d '\r')"
          echo "$cors_headers" | grep -iq "^access-control-allow-origin: $SITE_ORIGIN$"

          page="$(curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 "$UGMU_SITE_URL")"
          printf '%s' "$page" | grep -q 'name="robots" content="index,follow"'
          printf '%s' "$page" | grep -q 'Календарь доступен'

          encoded_group="$(python3 - <<'PY'
          from urllib.parse import quote
          print(quote('ugmu:medicine:1:stream-1:ОЛД 101', safe=''))
          PY
          )"
          schedule_url="$PRODUCTION_BASE_URL/api/v2/schedules/ugmu/medicine/1/$encoded_group/schedule?groupCode=%D0%9E%D0%9B%D0%94%20101&stream=1"
          schedule_status="$(curl --silent --show-error --output /tmp/ugmu-schedule.json --write-out '%{http_code}' "$schedule_url")"
          test "$schedule_status" = "404"
          python3 - <<'PY'
          import json
          body=json.load(open('/tmp/ugmu-schedule.json',encoding='utf-8'))
          assert body.get('error') == 'schedule_not_published', body
          PY

          ics_url="$PRODUCTION_BASE_URL/api/v2/schedules/ugmu/medicine/1/$encoded_group/calendar.ics?groupCode=%D0%9E%D0%9B%D0%94%20101&stream=1"
          ics_status="$(curl --silent --show-error --output /tmp/ugmu-ics.txt --write-out '%{http_code}' "$ics_url")"
          test "$ics_status" = "404"

          META="$meta" python3 - <<'PY'
          import json, os, datetime
          meta=json.loads(os.environ['META'])
          report={
            'version':1,
            'kind':'ugmu-post-launch-public-monitor',
            'status':'PASS',
            'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'checks':{
              'health':True,
              'salesOpen':meta.get('sales')=='open',
              'trialsClosed':meta.get('trials')=='closed',
              'paymentModeLive':meta.get('paymentMode')=='live',
              'cors':True,
              'landingLaunchMode':True,
              'publicScheduleClosed':True,
              'publicIcsClosed':True,
            },
            'paymentCreated':False,
            'productionMutationPerformed':False,
          }
          json.dump(report,open('evidence/public.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print(json.dumps(report,ensure_ascii=False))
          PY

      - name: Upload public monitor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-post-launch-public-monitor
          path: evidence/public.json
          if-no-files-found: warn
          retention-days: 30

  deep:
    name: Daily deep Cloud.ru YooKassa storage read-back
    if: github.event_name != 'schedule' || github.event.schedule == '43 1 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout operational baseline from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: monitor

      - name: Checkout immutable UGMU verifier dependencies
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERIFIER_CODE_SHA }}
          path: verifier

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: verifier/api/package-lock.json

      - name: Setup Go for official Cloud.ru Secret Manager SDK
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Install pinned verifier dependencies
        working-directory: verifier/api
        run: npm ci

      - name: Verify Cloud.ru runtime and YooKassa live provider read-only
        env:
          CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
          CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p monitor/evidence

          auth_payload="$(python3 - <<'PY'
          import json,os
          print(json.dumps({'keyId':os.environ['CLOUDRU_KEY_ID'],'secret':os.environ['CLOUDRU_KEY_SECRET']}))
          PY
          )"
          test "$(curl --silent --show-error --output /tmp/cloud-token.json --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data "$auth_payload" \
            https://iam.api.cloud.ru/api/v1/auth/token)" = "200"

          readarray -t auth < <(python3 - <<'PY'
          import base64,json
          body=json.load(open('/tmp/cloud-token.json',encoding='utf-8'))
          token=body['access_token']; part=token.split('.')[1]; part += '='*((4-len(part)%4)%4)
          claims=json.loads(base64.urlsafe_b64decode(part.encode()).decode())
          print(token); print(claims['project_id'])
          PY
          )
          token="${auth[0]}"; project_id="${auth[1]}"; rm -f /tmp/cloud-token.json
          echo "::add-mask::$token"

          get_url="https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$project_id"
          test "$(curl --silent --show-error --output /tmp/container.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $token" --header 'Accept: application/json' "$get_url")" = "200"

          EXPECTED_IMAGE="$EXPECTED_IMAGE" EXPECTED_SHOP_ID="$EXPECTED_SHOP_ID" EXPECTED_SECRET_PATH="$EXPECTED_SECRET_PATH" EXPECTED_UGMU_SITE_URL="$EXPECTED_UGMU_SITE_URL" python3 - <<'PY'
          import json,os
          app=json.load(open('/tmp/container.json',encoding='utf-8'))
          assert app.get('status') == 'running', app.get('status')
          containers=app.get('template',{}).get('containers',[]); assert len(containers)==1
          c=containers[0]; assert c.get('image') == os.environ['EXPECTED_IMAGE'], c.get('image')
          env={x.get('name'):x for x in c.get('env',[]) if isinstance(x,dict) and x.get('name')}
          def value(name): return env.get(name,{}).get('value')
          assert value('COMMERCIAL_SALES_ENABLED') == 'false', value('COMMERCIAL_SALES_ENABLED')
          assert value('UGMU_SALES_ENABLED') == 'true', value('UGMU_SALES_ENABLED')
          assert value('UGMU_ACTIVE') == 'true', value('UGMU_ACTIVE')
          assert value('TRIALS_ENABLED') in (None,'','false'), value('TRIALS_ENABLED')
          assert value('YOOKASSA_TEST_MODE') == 'false', value('YOOKASSA_TEST_MODE')
          assert value('YOOKASSA_SHOP_ID') == os.environ['EXPECTED_SHOP_ID'], value('YOOKASSA_SHOP_ID')
          secret=env.get('YOOKASSA_SECRET_KEY',{})
          assert secret.get('type') == 'secret', secret.get('type')
          assert secret.get('value') == os.environ['EXPECTED_SECRET_PATH'], secret.get('value')
          assert value('UGMU_SITE_URL') == os.environ['EXPECTED_UGMU_SITE_URL'], value('UGMU_SITE_URL')
          open('/tmp/shop','w',encoding='utf-8').write(value('YOOKASSA_SHOP_ID'))
          print('UGMU_OPS_CLOUD_RUNTIME_SAFE')
          PY
          rm -f /tmp/container.json

          mkdir -p /tmp/ugmu-provider-monitor && cd /tmp/ugmu-provider-monitor
          cat > go.mod <<'EOF'
          module ugmu-provider-monitor
          go 1.23.0
          require (
            github.com/cloudru-tech/secret-manager-sdk v1.1.1
            google.golang.org/grpc v1.70.0
          )
          EOF
          cat > main.go <<'EOF'
          package main
          import("context";"encoding/json";"fmt";"io";"net/http";"os";"strings";"time";sm "github.com/cloudru-tech/secret-manager-sdk";v2 "github.com/cloudru-tech/secret-manager-sdk/api/v2";"google.golang.org/grpc/metadata")
          func must(n string)string{v:=os.Getenv(n);if v==""{panic("missing "+n)};return v}
          func main(){
            cl,e:=sm.New(&sm.Config{Host:"secretmanager.api.cloud.ru:443"});if e!=nil{panic(e)};defer cl.Close()
            ctx,cancel:=context.WithTimeout(context.Background(),30*time.Second);defer cancel();ctx=metadata.AppendToOutgoingContext(ctx,"authorization","Bearer "+must("TOKEN"))
            sr,e:=cl.V2.SecretService.Search(ctx,&v2.SearchSecretRequest{ProjectId:must("PROJECT"),Depth:-1});if e!=nil{panic(e)}
            target:=must("SECRET_PATH");paths:=[]string{};for _,s:=range sr.GetSecrets(){p:=s.GetPath();if p==target||strings.HasSuffix(p,"/"+target){paths=append(paths,p)}};if len(paths)!=1{panic(fmt.Sprintf("secret matches=%d",len(paths)))}
            secret,e:=cl.V2.SecretService.Access(ctx,&v2.AccessSecretRequest{ProjectId:must("PROJECT"),Path:paths[0]});if e!=nil{panic(e)};key:=secret.GetPayload().GetValue();if len(key)==0{panic("empty secret")}
            req,_:=http.NewRequest(http.MethodGet,"https://api.yookassa.ru/v3/payments?limit=10",nil);req.SetBasicAuth(must("SHOP"),string(key));hc:=&http.Client{Timeout:20*time.Second};resp,e:=hc.Do(req);if e!=nil{panic(e)};defer resp.Body.Close();raw,_:=io.ReadAll(io.LimitReader(resp.Body,1<<20));var body map[string]any;_ = json.Unmarshal(raw,&body)
            items,_:=body["items"].([]any);live:=0;test:=0;for _,x:=range items{if m,ok:=x.(map[string]any);ok{if f,ok:=m["test"].(bool);ok{if f{test++}else{live++}}}}
            report:=map[string]any{"status":"PASS","httpCode":resp.StatusCode,"secretMatchCount":len(paths),"secretResolved":true,"providerAuthenticated":resp.StatusCode==200,"liveItems":live,"testItems":test,"paymentCreated":false,"productionMutationPerformed":false}
            if resp.StatusCode!=200||body["type"]!="list"||test!=0||live<1{report["status"]="FAIL"}
            b,_:=json.Marshal(report);fmt.Println(string(b));if report["status"]!="PASS"{os.Exit(2)}
          }
          EOF
          go mod tidy
          TOKEN="$token" PROJECT="$project_id" SECRET_PATH="$EXPECTED_SECRET_PATH" SHOP="$(cat /tmp/shop)" go run . | tee /tmp/provider-report.json
          cd "$GITHUB_WORKSPACE"
          cp /tmp/provider-report.json monitor/evidence/provider.json
          rm -rf /tmp/ugmu-provider-monitor /tmp/shop

      - name: Verify 12 staged schedules and rollback snapshots against durable baseline
        working-directory: verifier/api
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$S3_ACCESS_KEY_ID"
          test -n "$S3_SECRET_ACCESS_KEY"
          echo "::add-mask::$S3_ACCESS_KEY_ID"
          echo "::add-mask::$S3_SECRET_ACCESS_KEY"
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import fs from 'node:fs/promises';
          import {GetObjectCommand,S3Client} from '@aws-sdk/client-s3';
          const baselinePath='../../monitor/universities/ugmu/baselines/post-launch-first-stream-manifest.json';
          const m=JSON.parse(await fs.readFile(baselinePath,'utf8'));
          const expectedGroups=Array.from({length:12},(_,i)=>`ОЛД ${101+i}`);
          if(m.manifestId!=='ugmu-first-stream-34612248bba2'||m.scope?.sourceSha256!==process.env.APPROVED_SOURCE_SHA256||m.totals?.events!==4286||m.groups?.length!==12) throw new Error('invalid durable UGMU baseline');
          if(JSON.stringify(m.scope.groups)!==JSON.stringify(expectedGroups)) throw new Error('unexpected group set');
          const s3=new S3Client({endpoint:process.env.S3_ENDPOINT,region:process.env.S3_REGION,forcePathStyle:true,credentials:{accessKeyId:process.env.S3_ACCESS_KEY_ID,secretAccessKey:process.env.S3_SECRET_ACCESS_KEY}});
          async function get(key){const r=await s3.send(new GetObjectCommand({Bucket:process.env.S3_BUCKET,Key:key}));const bytes=Buffer.from(await r.Body.transformToByteArray());return bytes;}
          const rows=[];
          for(const item of m.groups){
            const schedule=await get(item.storageKey);const actual=createHash('sha256').update(schedule).digest('hex');
            await get(item.rollback.snapshotKey);
            rows.push({group:item.group,eventCount:item.eventCount,schedulePresent:true,scheduleHashMatches:actual===item.hashes.scheduleSha256,rollbackSnapshotPresent:true});
          }
          const report={version:1,kind:'ugmu-post-launch-storage-monitor',status:rows.every(x=>x.scheduleHashMatches)?'PASS':'FAIL',manifestId:m.manifestId,approvedSourceManifestSha256:process.env.APPROVED_STEP22_MANIFEST_SHA256,sourceSha256:m.scope.sourceSha256,totals:{groups:rows.length,events:rows.reduce((a,x)=>a+x.eventCount,0),schedulesPresent:rows.length,hashesMatched:rows.filter(x=>x.scheduleHashMatches).length,rollbackSnapshotsPresent:rows.length},groups:rows,mutationPerformed:false};
          await fs.mkdir('../../monitor/evidence',{recursive:true});await fs.writeFile('../../monitor/evidence/storage.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report));if(report.status!=='PASS'||report.totals.events!==4286)process.exit(2);
          NODE

      - name: Upload deep monitor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-post-launch-deep-monitor
          path: monitor/evidence/*.json
          if-no-files-found: warn
          retention-days: 30

  notify-public:
    name: Public monitor alert lifecycle
    if: always()
    needs: public
    runs-on: ubuntu-latest
    steps:
      - name: Create, update, or close public monitor issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.public.result }}
          TITLE: "[UGMU OPS] Public production monitor failure"
        shell: bash
        run: |
          set -euo pipefail
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number,title --limit 20 | jq -r --arg t "$TITLE" '.[]|select(.title==$t)|.number' | head -n1)"
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$RESULT" = "success" ]; then
            if [ -n "$issue" ]; then gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Recovered: $run_url"; fi
          else
            body="Hourly read-only UGMU public production monitor failed. Run: $run_url"
            if [ -n "$issue" ]; then gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"; else gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"; fi
          fi

  notify-deep:
    name: Deep monitor alert lifecycle
    if: always()
    needs: deep
    runs-on: ubuntu-latest
    steps:
      - name: Create, update, or close deep monitor issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.deep.result }}
          TITLE: "[UGMU OPS] Deep production monitor failure"
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RESULT" = "skipped" ]; then exit 0; fi
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number,title --limit 20 | jq -r --arg t "$TITLE" '.[]|select(.title==$t)|.number' | head -n1)"
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$RESULT" = "success" ]; then
            if [ -n "$issue" ]; then gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Recovered: $run_url"; fi
          else
            body="Daily read-only UGMU Cloud.ru/YooKassa/S3 monitor failed. Run: $run_url"
            if [ -n "$issue" ]; then gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"; else gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"; fi
          fi
