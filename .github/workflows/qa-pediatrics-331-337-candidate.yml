name: QA pediatrics 331-337 candidate

on:
  push:
    branches:
      - feat/pediatrics-331-337-2026-27-s1
    paths:
      - 'fixtures/2026-2027-semester-1/pediatrics-331-337.decisions.json'
      - 'qa/2026-2027-semester-1/pediatrics-331-337.evidence.json'
      - 'qa/2026-2027-semester-1/pediatrics-331-337.date-plan.json'
      - 'qa/2026-2027-semester-1/pediatrics-331-337.semantic-review.json'
      - 'qa/2026-2027-semester-1/pediatrics-331-337.cross-day-audit.json'
      - 'fixtures/tools/qa_pediatrics_331_337_candidate.mjs'
      - 'src/explicit-decisions.js'
      - '.github/workflows/qa-pediatrics-331-337-candidate.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pediatrics-331-337-2026-27-s1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run candidate QA
        run: node fixtures/tools/qa_pediatrics_331_337_candidate.mjs
      - name: Commit QA report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add qa/2026-2027-semester-1/pediatrics-331-337.qa-report.json
          if git diff --cached --quiet; then
            echo 'QA report unchanged'
            exit 0
          fi
          git commit -m 'Record pediatrics 331-337 candidate QA'
          git push origin HEAD:feat/pediatrics-331-337-2026-27-s1
