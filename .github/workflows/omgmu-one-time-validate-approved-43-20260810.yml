name: One-time validate approved 43 ОмГМУ schedules live

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/omgmu-one-time-validate-approved-43-20260810.yml"

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'Validate approved 43 ОмГМУ schedules live'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate live API and landing
        env:
          REPORT_PATH: ops/reports/omgmu-live-approved-43-20260810.json
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          api = 'https://kgmu-calendar-api.containerapps.ru'
          site = 'https://gmarkov634-stack.github.io/kirov-gmu-calendar'
          specs = {
              '2113': (f'{api}/api/v2/schedules/omgmu/medicine-international/2/omgmu%3Amedicine-international%3A2%3Astream-2%3A2113/schedule?groupCode=2113&stream=2', 176, '35983ba32a518f9d61c184ba946907ec9d56b2bd03a99d2ace8bb1b3ad8afc69'),
              '2114': (f'{api}/api/v2/schedules/omgmu/medicine-international/2/omgmu%3Amedicine-international%3A2%3Astream-2%3A2114/schedule?groupCode=2114&stream=2', 176, '35983ba32a518f9d61c184ba946907ec9d56b2bd03a99d2ace8bb1b3ad8afc69'),
              '389': (f'{api}/api/v2/schedules/omgmu/medicine-international/3/omgmu%3Amedicine-international%3A3%3A389/schedule?groupCode=389', 167, '5a77c3eaede8e32887bc8c768cb19b5aaa6d9506249b2484ffb0bbb2f3bc9427'),
              '393': (f'{api}/api/v2/schedules/omgmu/medicine-international/3/omgmu%3Amedicine-international%3A3%3A393/schedule?groupCode=393', 167, '5a77c3eaede8e32887bc8c768cb19b5aaa6d9506249b2484ffb0bbb2f3bc9427'),
          }

          def fetch(url, timeout=30):
              request = urllib.request.Request(url, headers={'User-Agent': 'omgmu-live-validator/1.0'})
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      return response.status, response.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as error:
                  return error.code, error.read().decode('utf-8', errors='replace')

          errors = []
          resources = {}
          status, body = fetch(f'{api}/health')
          resources['health'] = {'httpStatus': status, 'bodyPreview': body[:500]}
          try:
              health = json.loads(body)
          except Exception:
              health = {}
          if status != 200 or health.get('status') != 'ok':
              errors.append(f'health check failed: HTTP {status}')

          groups_report = {}
          for group, (url, expected_count, expected_source_hash) in specs.items():
              status, body = fetch(url)
              resources[group] = {'url': url, 'httpStatus': status, 'bodyPreview': body[:500]}
              if status != 200:
                  errors.append(f'group {group} returned HTTP {status}')
                  continue
              try:
                  schedule = json.loads(body)
              except Exception as exc:
                  errors.append(f'group {group} returned invalid JSON: {exc}')
                  continue
              events = schedule.get('events') if isinstance(schedule.get('events'), list) else []
              review = schedule.get('review') if isinstance(schedule.get('review'), dict) else {}
              source_types = sorted({str(event.get('sourceType', '')) for event in events})
              unique_ids = len({str(event.get('id', '')) for event in events})
              groups_report[group] = {
                  'eventCount': len(events),
                  'uniqueEventIds': unique_ids,
                  'sourceTypes': source_types,
                  'reviewStatus': review.get('status'),
                  'sourceSha256': review.get('sourceSha256'),
                  'applicationConfirmedBy': review.get('applicationConfirmedBy'),
                  'applicationConfirmedOn': review.get('applicationConfirmedOn'),
              }
              if schedule.get('group', {}).get('code') != group:
                  errors.append(f'group {group} response has wrong group code')
              if len(events) != expected_count:
                  errors.append(f'group {group} has {len(events)} events, expected {expected_count}')
              if unique_ids != len(events):
                  errors.append(f'group {group} has missing or duplicate event ids')
              if source_types != ['manual-review']:
                  errors.append(f'group {group} source types are {source_types}')
              if review.get('status') != 'approved':
                  errors.append(f'group {group} review status is not approved')
              if review.get('sourceSha256') != expected_source_hash:
                  errors.append(f'group {group} source hash mismatch')
              if review.get('applicationConfirmedBy') != 'Григорий':
                  errors.append(f'group {group} application confirmation is missing')

          groups_url = f'{site}/site/omgmu/groups.js'
          config_url = f'{site}/omgmu/config.js'
          live_groups = []
          groups_status = 0
          groups_body = ''
          for attempt in range(20):
              groups_status, groups_body = fetch(groups_url)
              live_groups = sorted(set(re.findall(r'"(\d{3,4})"', groups_body)), key=int)
              if groups_status == 200 and len(live_groups) == 43 and all(group in live_groups for group in specs):
                  break
              time.sleep(15)
          resources['landingGroups'] = {'url': groups_url, 'httpStatus': groups_status, 'bodyPreview': groups_body[:1000]}
          if groups_status != 200:
              errors.append(f'landing groups returned HTTP {groups_status}')
          if len(live_groups) != 43:
              errors.append(f'landing exposes {len(live_groups)} groups, expected 43')
          for group in specs:
              if group not in live_groups:
                  errors.append(f'approved group {group} is missing from landing')

          config_status, config_body = fetch(config_url)
          resources['landingConfig'] = {'url': config_url, 'httpStatus': config_status, 'bodyPreview': config_body[:500]}
          checkout_disabled = config_status == 200 and bool(re.search(r'checkoutEnabled\s*:\s*false', config_body))
          if not checkout_disabled:
              errors.append('live checkout is not disabled')

          report = {
              'version': 1,
              'university': 'omgmu',
              'operation': 'validate-approved-43-live',
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'health': health,
              'groups': groups_report,
              'landing': {
                  'groupCount': len(live_groups),
                  'groups': live_groups,
                  'checkoutDisabled': checkout_disabled,
              },
              'resources': resources,
              'errors': errors,
              'validationStatus': 'success' if not errors else 'failure',
          }
          output = Path(os.environ['REPORT_PATH'])
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False))
          if errors:
              raise SystemExit(2)
          PY

      - name: Record live validation result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p ops/reports
          if [ ! -f ops/reports/omgmu-live-approved-43-20260810.json ]; then
            printf '{"version":1,"university":"omgmu","operation":"validate-approved-43-live","validationStatus":"failure","errors":["validation report was not generated"]}\n' > ops/reports/omgmu-live-approved-43-20260810.json
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('ops/reports/omgmu-live-approved-43-20260810.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['jobStatus'] = os.environ['JOB_STATUS']
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/reports/omgmu-live-approved-43-20260810.json
          git commit -m "Record live approved 43 ОмГМУ validation result" || true
          git push
