name: UGMU sales open

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type OPEN_UGMU_SALES to continue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kgmu-production-api-deploy
  cancel-in-progress: false

env:
  CONTAINER_NAME: kgmu-calendar-api
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru
  APPROVED_SOURCE_SHA256: 34612248bba201096d6566cacb37c53be01d3f84eddc214bda2a594b46fb24f8
  UGMU_SITE_URL: https://gmarkov634-stack.github.io/kirov-gmu-calendar/ugmu/

jobs:
  open-sales:
    if: ${{ inputs.confirm == 'OPEN_UGMU_SALES' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Open only UGMU paid checkout, verify and rollback on failure
        env:
          CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
          CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mutated='false'
          token=''
          project_id=''
          get_url=''
          patch_url=''

          rollback() {
            local exit_code=$?
            trap - ERR
            set +e
            if [ "$mutated" != 'true' ] || [ -z "$token" ] || [ -z "$get_url" ] || [ -z "$patch_url" ] || [ ! -f /tmp/ugmu-sales-original.json ]; then
              echo 'UGMU_SALES_OPEN_ABORT_BEFORE_MUTATION_SAFE'
              exit "$exit_code"
            fi
            echo 'UGMU_SALES_OPEN_ROLLBACK_START_SAFE'
            current_code="$(curl --silent --show-error --output /tmp/ugmu-sales-rollback-current.json --write-out '%{http_code}' \
              --header "Authorization: Bearer $token" --header 'Accept: application/json' "$get_url")"
            if [ "$current_code" = '200' ]; then
              python3 - <<'PY'
          import json
          app=json.load(open('/tmp/ugmu-sales-rollback-current.json', encoding='utf-8'))
          original=json.load(open('/tmp/ugmu-sales-original.json', encoding='utf-8'))
          container=app['template']['containers'][0]
          rows=[item for item in container.get('env',[]) if isinstance(item,dict) and item.get('name') != 'UGMU_SALES_ENABLED']
          if original is not None:
              rows.append(original)
          container['env']=rows
          json.dump(app, open('/tmp/ugmu-sales-rollback-patch.json','w', encoding='utf-8'), ensure_ascii=False, separators=(',',':'))
          PY
              curl --silent --show-error --output /tmp/ugmu-sales-rollback-response.json \
                --request PATCH --header "Authorization: Bearer $token" --header 'Content-Type: application/json' \
                --data-binary @/tmp/ugmu-sales-rollback-patch.json "$patch_url" >/dev/null
            fi
            rm -f /tmp/ugmu-sales-rollback-current.json /tmp/ugmu-sales-rollback-patch.json /tmp/ugmu-sales-rollback-response.json
            echo 'UGMU_SALES_OPEN_ROLLBACK_REQUESTED_SAFE'
            exit "$exit_code"
          }
          trap rollback ERR

          # Source-bound safety: the commercial scope must still point at the
          # exact reviewed first-stream PDF that produced the 12 QA schedules.
          APPROVED_SOURCE_SHA256="$APPROVED_SOURCE_SHA256" python3 - <<'PY'
          import os
          from pathlib import Path
          sha=os.environ['APPROVED_SOURCE_SHA256']
          parser=Path('api/tools/ugmu-parse-first-stream-pdf.py').read_text(encoding='utf-8')
          landing=Path('ugmu/config.js').read_text(encoding='utf-8')
          assert sha in parser, 'approved source SHA missing from parser'
          assert sha in landing, 'approved source SHA missing from UGMU landing config'
          print('UGMU_SALES_SOURCE_BOUND_SAFE', sha[:12])
          PY

          # Public read-only preflight. Sales may already be open if this job is
          # intentionally re-run; every other invariant must remain exact.
          pre_meta="$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 "$PRODUCTION_BASE_URL/api/v2/meta")"
          PRE_META="$pre_meta" python3 - <<'PY'
          import json, os
          body=json.loads(os.environ['PRE_META'])
          assert body.get('sales') in {'closed','open'}, body
          assert body.get('trials') == 'closed', body
          assert body.get('universityTrials',{}).get('ugmu') == 'open', body
          assert body.get('paymentMode') == 'live', body
          offer=body.get('offers',{}).get('semester',{})
          price=float(offer.get('price') or 0)
          assert price > 0, body
          print('UGMU_SALES_PUBLIC_PREFLIGHT_SAFE', {
              'sales': body.get('sales'),
              'globalTrials': body.get('trials'),
              'ugmuTrials': body.get('universityTrials',{}).get('ugmu'),
              'paymentMode': body.get('paymentMode'),
              'semesterPrice': offer.get('price'),
          })
          PY

          auth_payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({'keyId':os.environ['CLOUDRU_KEY_ID'],'secret':os.environ['CLOUDRU_KEY_SECRET']}))
          PY
          )"
          test "$(curl --silent --show-error --output /tmp/ugmu-sales-token.json --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data "$auth_payload" \
            'https://iam.api.cloud.ru/api/v1/auth/token')" = '200'

          readarray -t auth < <(python3 - <<'PY'
          import base64, json
          body=json.load(open('/tmp/ugmu-sales-token.json', encoding='utf-8'))
          token=body.get('access_token')
          assert isinstance(token,str) and token
          parts=token.split('.')
          assert len(parts) == 3
          payload=parts[1] + '='*((4-len(parts[1])%4)%4)
          claims=json.loads(base64.urlsafe_b64decode(payload.encode()).decode())
          project_id=claims.get('project_id')
          assert isinstance(project_id,str) and project_id
          print(token)
          print(project_id)
          PY
          )
          token="${auth[0]}"
          project_id="${auth[1]}"
          rm -f /tmp/ugmu-sales-token.json
          echo "::add-mask::$token"

          get_url="https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$project_id"
          patch_url="https://containers.api.cloud.ru/v2/containers/${CONTAINER_NAME}?projectId=$project_id"

          test "$(curl --silent --show-error --output /tmp/ugmu-sales-current.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $token" --header 'Accept: application/json' "$get_url")" = '200'

          already_open="$(python3 - <<'PY'
          import json
          app=json.load(open('/tmp/ugmu-sales-current.json', encoding='utf-8'))
          assert app.get('name') == 'kgmu-calendar-api', app.get('name')
          assert app.get('status') == 'running', app.get('status')
          containers=app.get('template',{}).get('containers',[])
          assert len(containers) == 1, len(containers)
          container=containers[0]
          rows=[item for item in container.get('env',[]) if isinstance(item,dict)]
          env={item.get('name'):item.get('value') for item in rows}
          for gate in ('FUNNEL_ANALYTICS_ENABLED','TRIALS_ENABLED','COMMERCIAL_SALES_ENABLED'):
              assert env.get(gate) != 'true', f'{gate} must remain fail-closed'
          assert env.get('UGMU_TRIALS_ENABLED') == 'true', 'UGMU trial must stay open while sales open'
          assert env.get('YOOKASSA_TEST_MODE') != 'true', 'YooKassa test mode must be off'
          assert env.get('YOOKASSA_SHOP_ID') == '1258890', 'unexpected YooKassa ShopID'
          site=env.get('UGMU_SITE_URL') or ''
          assert site == 'https://gmarkov634-stack.github.io/kirov-gmu-calendar/ugmu/', site
          original=next((item for item in rows if item.get('name') == 'UGMU_SALES_ENABLED'), None)
          json.dump(original, open('/tmp/ugmu-sales-original.json','w', encoding='utf-8'), ensure_ascii=False)
          print('true' if env.get('UGMU_SALES_ENABLED') == 'true' else 'false')
          PY
          )"

          if [ "$already_open" != 'true' ]; then
            python3 - <<'PY'
          import json
          app=json.load(open('/tmp/ugmu-sales-current.json', encoding='utf-8'))
          container=app['template']['containers'][0]
          rows=[item for item in container.get('env',[]) if isinstance(item,dict) and item.get('name') != 'UGMU_SALES_ENABLED']
          rows.append({'name':'UGMU_SALES_ENABLED','value':'true'})
          container['env']=rows
          json.dump(app, open('/tmp/ugmu-sales-patch.json','w', encoding='utf-8'), ensure_ascii=False, separators=(',',':'))
          print('UGMU_SALES_MUTATION_TARGET_SAFE ugmuSales=open ugmuTrials=open globalSales=closed')
          PY
            patch_code="$(curl --silent --show-error --output /tmp/ugmu-sales-patch-response.json --write-out '%{http_code}' \
              --request PATCH --header "Authorization: Bearer $token" --header 'Content-Type: application/json' \
              --data-binary @/tmp/ugmu-sales-patch.json "$patch_url")"
            test "$patch_code" = '200'
            mutated='true'
            rm -f /tmp/ugmu-sales-patch.json /tmp/ugmu-sales-patch-response.json
          else
            echo 'UGMU_SALES_ALREADY_OPEN_SAFE'
          fi

          runtime_ready='false'
          for attempt in $(seq 1 40); do
            current_code="$(curl --silent --show-error --output /tmp/ugmu-sales-after.json --write-out '%{http_code}' \
              --header "Authorization: Bearer $token" --header 'Accept: application/json' "$get_url")"
            if [ "$current_code" = '200' ] && python3 - <<'PY'
          import json, sys
          app=json.load(open('/tmp/ugmu-sales-after.json', encoding='utf-8'))
          containers=app.get('template',{}).get('containers',[])
          if app.get('status') != 'running' or len(containers) != 1:
              sys.exit(1)
          env={item.get('name'):item.get('value') for item in containers[0].get('env',[]) if isinstance(item,dict)}
          ok=(
              env.get('FUNNEL_ANALYTICS_ENABLED') != 'true' and
              env.get('TRIALS_ENABLED') != 'true' and
              env.get('COMMERCIAL_SALES_ENABLED') != 'true' and
              env.get('UGMU_SALES_ENABLED') == 'true' and
              env.get('UGMU_TRIALS_ENABLED') == 'true' and
              env.get('YOOKASSA_TEST_MODE') != 'true' and
              env.get('YOOKASSA_SHOP_ID') == '1258890'
          )
          sys.exit(0 if ok else 1)
          PY
            then
              runtime_ready='true'
              echo "UGMU_SALES_RUNTIME_OPEN_SAFE attempt=$attempt"
              break
            fi
            sleep 3
          done
          test "$runtime_ready" = 'true'

          meta_ready='false'
          for attempt in $(seq 1 40); do
            meta="$(curl --silent --show-error "$PRODUCTION_BASE_URL/api/v2/meta" || true)"
            if META="$meta" python3 - <<'PY'
          import json, os, sys
          try:
              body=json.loads(os.environ.get('META') or '{}')
          except Exception:
              sys.exit(1)
          ok=(
              body.get('sales') == 'open' and
              body.get('trials') == 'closed' and
              body.get('universityTrials',{}).get('ugmu') == 'open' and
              body.get('paymentMode') == 'live'
          )
          sys.exit(0 if ok else 1)
          PY
            then
              meta_ready='true'
              break
            fi
            sleep 3
          done
          test "$meta_ready" = 'true'

          # Preserve the privacy boundary: paid checkout may open, but no public
          # schedule or public ICS endpoint may become available.
          encoded_group="$(python3 - <<'PY'
          from urllib.parse import quote
          print(quote('ugmu:medicine:1:stream-1:ОЛД 101', safe=''))
          PY
          )"
          schedule_url="$PRODUCTION_BASE_URL/api/v2/schedules/ugmu/medicine/1/$encoded_group/schedule?groupCode=%D0%9E%D0%9B%D0%94%20101&stream=1"
          schedule_status="$(curl --silent --show-error --output /tmp/ugmu-sales-public-schedule.json --write-out '%{http_code}' "$schedule_url")"
          test "$schedule_status" = '404'
          ics_status="$(curl --silent --show-error --output /tmp/ugmu-sales-public-ics.txt --write-out '%{http_code}' \
            "$PRODUCTION_BASE_URL/api/v2/schedules/ugmu/medicine/1/$encoded_group/calendar.ics?groupCode=%D0%9E%D0%9B%D0%94%20101&stream=1")"
          test "$ics_status" = '404'

          final_meta="$(curl --fail --silent --show-error "$PRODUCTION_BASE_URL/api/v2/meta")"
          FINAL_META="$final_meta" python3 - <<'PY'
          import json, os
          body=json.loads(os.environ['FINAL_META'])
          assert body.get('sales') == 'open', body
          assert body.get('trials') == 'closed', body
          assert body.get('universityTrials',{}).get('ugmu') == 'open', body
          assert body.get('paymentMode') == 'live', body
          print('UGMU_SALES_OPEN_COMPLETE_SAFE', {
              'sales':body.get('sales'),
              'globalTrials':body.get('trials'),
              'ugmuTrials':body.get('universityTrials',{}).get('ugmu'),
              'paymentMode':body.get('paymentMode'),
              'paymentCreated':False,
          })
          PY

          rm -f /tmp/ugmu-sales-current.json /tmp/ugmu-sales-after.json /tmp/ugmu-sales-original.json \
            /tmp/ugmu-sales-public-schedule.json /tmp/ugmu-sales-public-ics.txt
          trap - ERR
