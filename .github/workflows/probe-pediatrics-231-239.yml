name: Probe pediatrics 231-239 official source

on:
  push:
    branches:
      - feat/pediatrics-231-239-2026-27-s1
    paths:
      - 'fixtures/tools/probe_pediatrics_231_239_source.py'
      - '.github/workflows/probe-pediatrics-231-239.yml'
  pull_request:
    branches: [main]
    paths:
      - 'fixtures/tools/probe_pediatrics_231_239_source.py'
      - '.github/workflows/probe-pediatrics-231-239.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Fetch and mechanically dump official workbook
        run: python fixtures/tools/probe_pediatrics_231_239_source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pediatrics-231-239-source-probe
          path: |
            pediatrics-231-239-source-probe.json
            pediatrics-231-239-source.xlsx
          if-no-files-found: error
