name: UGMU controlled launch retry v2 observe

on:
  pull_request:
    paths:
      - ".github/workflows/ugmu-controlled-launch-retry-v2-observe.yml"

permissions:
  actions: read
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      AUTHORITY_SHA: a11c2afe148b2501331f3ce99d5e43b82238a76c
    steps:
      - name: Wait for exact retry v2 run
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ugmu-controlled-launch-retry-v2.yml/runs?branch=agent%2Fugmu-scaffold-20260820&event=push&per_page=20"
          run_id=''
          for attempt in $(seq 1 300); do
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api" >/tmp/runs.json
            readarray -t r < <(python3 - <<'PY'
          import json,os
          rows=json.load(open('/tmp/runs.json')).get('workflow_runs',[])
          x=next((r for r in rows if r.get('head_sha')==os.environ['AUTHORITY_SHA']),None)
          if x:
            print(x['id']);print(x.get('status') or '');print(x.get('conclusion') or '')
          PY
          )
            if [ ${#r[@]} -ge 2 ];then
              run_id="${r[0]}";status="${r[1]}";conclusion="${r[2]:-}"
              echo "UGMU_RETRY_V2_RUN_SAFE id=$run_id status=$status conclusion=$conclusion"
              if [ "$status" = completed ];then test "$conclusion" = success;break;fi
            fi
            sleep 5
          done
          test -n "$run_id"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/jobs?per_page=100" >/tmp/jobs.json
          python3 - <<'PY'
          import json
          rows=json.load(open('/tmp/jobs.json')).get('jobs',[]);print('UGMU_RETRY_V2_JOBS_SAFE',[(j['id'],j['name'],j['status'],j.get('conclusion')) for j in rows]);assert rows and all(j.get('conclusion')=='success' for j in rows)
          PY
