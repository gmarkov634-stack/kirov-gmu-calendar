name: Audit medicine 102 Latin time

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-medicine-102-latin-time.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests==2.32.5 openpyxl==3.1.5
      - name: Fetch official sources and inspect group 102
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import io
          import json
          import re
          from urllib.parse import urljoin

          import requests
          from openpyxl import load_workbook

          PAGE = 'https://kirovgma.ru/lechebnyy-fakultet-raspisanie'
          FIXTURE = 'https://kirovgma.ru/sites/default/files/files/2026/08/27/1078/1_lech._1_potok-27-08-2026-11.xlsx'
          session = requests.Session()
          session.headers['User-Agent'] = 'medical-calendar-source-audit/1.0'

          page = session.get(PAGE, timeout=30)
          page.raise_for_status()
          hrefs = re.findall(r'href=["\']([^"\']*1_lech\._1_potok[^"\']*\.xlsx)["\']', page.text, flags=re.I)
          urls = [FIXTURE]
          for href in hrefs:
              url = urljoin(PAGE, href)
              if url not in urls:
                  urls.append(url)

          results = []
          for url in urls:
              response = session.get(url, timeout=30)
              item = {'url': url, 'httpStatus': response.status_code}
              if response.status_code != 200:
                  results.append(item)
                  continue
              data = response.content
              item['sha256'] = hashlib.sha256(data).hexdigest()
              item['byteLength'] = len(data)
              wb = load_workbook(io.BytesIO(data), data_only=False)
              item['sheetNames'] = wb.sheetnames
              if '1 леч.1' not in wb.sheetnames:
                  results.append(item)
                  continue
              ws = wb['1 леч.1']
              item['C36'] = ws['C36'].value
              item['row36BtoK'] = {ws.cell(36, col).coordinate: ws.cell(36, col).value for col in range(2, 12)}
              item['group102ColumnC'] = [
                  {'coord': ws.cell(row, 3).coordinate, 'value': ws.cell(row, 3).value}
                  for row in range(1, ws.max_row + 1)
                  if ws.cell(row, 3).value is not None
              ]
              item['latinCells'] = [
                  {'coord': cell.coordinate, 'value': cell.value}
                  for row in ws.iter_rows()
                  for cell in row
                  if cell.value is not None and 'латин' in str(cell.value).lower()
              ]
              item['september02Cells'] = [
                  {'coord': cell.coordinate, 'value': cell.value}
                  for row in ws.iter_rows()
                  for cell in row
                  if cell.value is not None and '02.09' in str(cell.value)
              ]
              results.append(item)

          payload = {'page': PAGE, 'discoveredUrls': urls, 'results': results}
          with open('medicine-102-latin-time-audit.json', 'w', encoding='utf-8') as fh:
              json.dump(payload, fh, ensure_ascii=False, indent=2)
          print(json.dumps(payload, ensure_ascii=False, indent=2))

          if not any(item.get('C36') for item in results):
              raise SystemExit('No official workbook with sheet 1 леч.1 was readable')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: medicine-102-latin-time-audit
          path: medicine-102-latin-time-audit.json
          if-no-files-found: error
