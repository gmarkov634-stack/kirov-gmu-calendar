name: UGMU trial activate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type ACTIVATE_UGMU_TRIAL to continue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kgmu-production-api-deploy
  cancel-in-progress: false

env:
  CONTAINER_NAME: kgmu-calendar-api
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru

jobs:
  activate:
    if: ${{ inputs.confirm == 'ACTIVATE_UGMU_TRIAL' }}
    runs-on: ubuntu-latest
    steps:
      - name: Preflight, activate, verify and rollback on failure
        env:
          CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
          CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
          KGMU_ADMIN_TOKEN: ${{ secrets.KGMU_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$KGMU_ADMIN_TOKEN"
          activated='false'
          token=''
          project_id=''
          get_url=''
          patch_url=''

          rollback() {
            trap - ERR
            set +e
            if [ "$activated" != 'true' ] || [ -z "$token" ] || [ -z "$get_url" ] || [ -z "$patch_url" ]; then
              return 0
            fi
            echo 'UGMU_TRIAL_ROLLBACK_START_SAFE'
            current_code="$(curl --silent --show-error --output /tmp/rollback-current.json --write-out '%{http_code}' \
              --header "Authorization: Bearer $token" --header 'Accept: application/json' "$get_url")"
            if [ "$current_code" = '200' ]; then
              python3 - <<'PY'
          import json
          app=json.load(open('/tmp/rollback-current.json', encoding='utf-8'))
          container=app['template']['containers'][0]
          rows=[item for item in container.get('env',[]) if isinstance(item,dict)]
          rows=[item for item in rows if item.get('name') != 'UGMU_TRIALS_ENABLED']
          rows.append({'name':'UGMU_TRIALS_ENABLED','value':'false'})
          container['env']=rows
          json.dump(app, open('/tmp/rollback-patch.json','w', encoding='utf-8'), ensure_ascii=False, separators=(',',':'))
          PY
              curl --silent --show-error --output /tmp/rollback-response.json \
                --request PATCH --header "Authorization: Bearer $token" --header 'Content-Type: application/json' \
                --data-binary @/tmp/rollback-patch.json "$patch_url" >/dev/null
            fi
            rm -f /tmp/rollback-current.json /tmp/rollback-patch.json /tmp/rollback-response.json
            echo 'UGMU_TRIAL_ROLLBACK_REQUESTED_SAFE'
          }
          trap rollback ERR

          auth_payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({'keyId':os.environ['CLOUDRU_KEY_ID'],'secret':os.environ['CLOUDRU_KEY_SECRET']}))
          PY
          )"
          test "$(curl --silent --show-error --output /tmp/token.json --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data "$auth_payload" \
            'https://iam.api.cloud.ru/api/v1/auth/token')" = '200'

          readarray -t auth < <(python3 - <<'PY'
          import base64, json
          body=json.load(open('/tmp/token.json', encoding='utf-8'))
          token=body.get('access_token')
          assert isinstance(token,str) and token
          parts=token.split('.')
          assert len(parts) == 3
          payload=parts[1] + '='*((4-len(parts[1])%4)%4)
          claims=json.loads(base64.urlsafe_b64decode(payload.encode()).decode())
          project_id=claims.get('project_id')
          assert isinstance(project_id,str) and project_id
          print(token)
          print(project_id)
          PY
          )
          token="${auth[0]}"
          project_id="${auth[1]}"
          rm -f /tmp/token.json
          echo "::add-mask::$token"

          get_url="https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$project_id"
          patch_url="https://containers.api.cloud.ru/v2/containers/${CONTAINER_NAME}?projectId=$project_id"

          test "$(curl --silent --show-error --output /tmp/current.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $token" --header 'Accept: application/json' "$get_url")" = '200'

          python3 - <<'PY'
          import json
          app=json.load(open('/tmp/current.json', encoding='utf-8'))
          assert app.get('name') == 'kgmu-calendar-api', app.get('name')
          assert app.get('status') == 'running', app.get('status')
          containers=app.get('template',{}).get('containers',[])
          assert len(containers) == 1, len(containers)
          env={item.get('name'):item.get('value') for item in containers[0].get('env',[]) if isinstance(item,dict)}
          assert env.get('TRIALS_ENABLED') != 'true', 'legacy global trials must remain closed'
          assert env.get('UGMU_TRIALS_ENABLED') != 'true', 'UGMU trial must start closed'
          secret=env.get('TRIAL_IDENTITY_HMAC_SECRET')
          assert isinstance(secret,str) and len(secret) >= 32, 'trial identity HMAC secret is not provisioned'
          assert str(env.get('UGMU_SITE_URL') or '').startswith('https://'), 'UGMU_SITE_URL is not configured'
          assert str(env.get('PUBLIC_API_URL') or '').startswith('https://'), 'PUBLIC_API_URL is not configured'
          print('UGMU_TRIAL_ACTIVATION_PREFLIGHT_ENV_SAFE')
          PY

          expected_client="$(curl --fail --silent --show-error --retry 3 https://api.ipify.org)"
          test -n "$expected_client"
          probe_sentinel='192.0.2.123'
          observation="$(curl --fail --silent --show-error --retry 3 \
            --header "X-Admin-Token: $KGMU_ADMIN_TOKEN" \
            --header "X-Real-IP: $probe_sentinel" \
            --header "X-Forwarded-For: $probe_sentinel" \
            --header "X-Proxy-Probe-Expected-Client: $expected_client" \
            --header "X-Proxy-Probe-Sentinel: $probe_sentinel" \
            "$PRODUCTION_BASE_URL/api/v1/admin/proxy-contract")"
          python3 - "$observation" <<'PY'
          import json, sys
          body=json.loads(sys.argv[1])
          assert body.get('version') == 2, body
          trusted_real_ip=(
              body.get('policyResolution') == 'x-real-ip' and
              body.get('xRealIpEqualsExpectedClient') is True and
              body.get('xRealIpEqualsProbeSentinel') is False
          )
          trusted_single_xff=(
              body.get('policyResolution') == 'single-x-forwarded-for' and
              body.get('xForwardedForHopCount') == 1 and
              body.get('firstXffEqualsExpectedClient') is True and
              body.get('firstXffEqualsProbeSentinel') is False
          )
          assert trusted_real_ip or trusted_single_xff, body
          print('UGMU_TRIAL_ACTIVATION_PROXY_PREFLIGHT_SAFE', {
              'policyResolution':body.get('policyResolution'),
              'trustedRealIp':trusted_real_ip,
              'trustedSingleXff':trusted_single_xff,
          })
          PY

          python3 - <<'PY'
          import json
          app=json.load(open('/tmp/current.json', encoding='utf-8'))
          container=app['template']['containers'][0]
          rows=[item for item in container.get('env',[]) if isinstance(item,dict)]
          rows=[item for item in rows if item.get('name') != 'UGMU_TRIALS_ENABLED']
          rows.append({'name':'UGMU_TRIALS_ENABLED','value':'true'})
          container['env']=rows
          json.dump(app, open('/tmp/activate-patch.json','w', encoding='utf-8'), ensure_ascii=False, separators=(',',':'))
          PY

          patch_code="$(curl --silent --show-error --output /tmp/activate-response.json --write-out '%{http_code}' \
            --request PATCH --header "Authorization: Bearer $token" --header 'Content-Type: application/json' \
            --data-binary @/tmp/activate-patch.json "$patch_url")"
          test "$patch_code" = '200'
          activated='true'
          rm -f /tmp/activate-patch.json /tmp/activate-response.json

          ready='false'
          for attempt in $(seq 1 40); do
            meta="$(curl --silent --show-error "$PRODUCTION_BASE_URL/api/v2/meta" || true)"
            if META="$meta" python3 - <<'PY'
          import json, os, sys
          try:
              body=json.loads(os.environ.get('META') or '{}')
          except Exception:
              sys.exit(1)
          ok=(body.get('trials') == 'closed' and body.get('universityTrials',{}).get('ugmu') == 'open')
          sys.exit(0 if ok else 1)
          PY
            then
              ready='true'
              break
            fi
            sleep 3
          done
          test "$ready" = 'true'

          trial_payload='{"university":"ugmu","program":"medicine","course":1,"stream":"1","groupCode":"ОЛД 101","groupId":"ugmu:medicine:1:stream-1:ОЛД 101","source":"activation-e2e"}'
          trial_code="$(curl --silent --show-error --output /tmp/trial.json --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data "$trial_payload" \
            "$PRODUCTION_BASE_URL/api/v2/trials")"
          test "$trial_code" = '201'

          readarray -t trial_values < <(python3 - <<'PY'
          import datetime, json
          body=json.load(open('/tmp/trial.json', encoding='utf-8'))
          url=body.get('subscriptionUrl')
          conversion=body.get('conversionId')
          start=body.get('trialStartDate')
          end=body.get('trialEndDateExclusive')
          assert isinstance(url,str) and url.startswith('https://kgmu-calendar-api.containerapps.ru/api/v1/subscriptions/') and url.endswith('/calendar.ics')
          assert isinstance(conversion,str) and len(conversion) == 43
          start_date=datetime.date.fromisoformat(start)
          end_date=datetime.date.fromisoformat(end)
          assert (end_date-start_date).days == 7
          print(url)
          print(conversion)
          PY
          )
          subscription_url="${trial_values[0]}"
          conversion_id="${trial_values[1]}"
          echo "::add-mask::$subscription_url"
          echo "::add-mask::$conversion_id"

          curl --fail --silent --show-error --dump-header /tmp/trial-headers.txt --output /tmp/trial.ics "$subscription_url"
          python3 - <<'PY'
          headers=open('/tmp/trial-headers.txt', encoding='utf-8').read().lower()
          body=open('/tmp/trial.ics', encoding='utf-8').read()
          assert 'x-subscription-entitlement: trial' in headers, headers
          assert 'x-subscription-status: active' in headers, headers
          assert 'BEGIN:VCALENDAR' in body and 'END:VCALENDAR' in body
          print('UGMU_TRIAL_SUBSCRIPTION_E2E_SAFE')
          PY

          continue_body="$(curl --fail --silent --show-error "$PRODUCTION_BASE_URL/api/v2/trials/continue/$conversion_id")"
          CONTINUE_BODY="$continue_body" python3 - <<'PY'
          import json, os
          body=json.loads(os.environ['CONTINUE_BODY'])
          assert body.get('university') == 'ugmu', body
          assert body.get('program') == 'medicine', body
          assert body.get('course') == 1, body
          assert str(body.get('stream')) == '1', body
          assert body.get('groupCode') == 'ОЛД 101', body
          assert body.get('groupId') == 'ugmu:medicine:1:stream-1:ОЛД 101', body
          print('UGMU_TRIAL_CONTINUATION_E2E_SAFE')
          PY

          post_meta="$(curl --fail --silent --show-error "$PRODUCTION_BASE_URL/api/v2/meta")"
          POST_META="$post_meta" python3 - <<'PY'
          import json, os
          body=json.loads(os.environ['POST_META'])
          assert body.get('trials') == 'closed', body
          assert body.get('universityTrials',{}).get('ugmu') == 'open', body
          print('UGMU_TRIAL_ACTIVATION_COMPLETE_SAFE')
          PY

          rm -f /tmp/current.json /tmp/trial.json /tmp/trial-headers.txt /tmp/trial.ics
          trap - ERR
