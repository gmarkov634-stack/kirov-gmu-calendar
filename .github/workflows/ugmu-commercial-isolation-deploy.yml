name: UGMU commercial isolation fail-closed deploy

on:
  push:
    branches:
      - agent/ugmu-scaffold-20260820
    paths:
      - ".github/workflows/ugmu-commercial-isolation-deploy.yml"

permissions:
  contents: read

concurrency:
  group: kgmu-production-api-deploy
  cancel-in-progress: false

env:
  IMAGE: kgmu-calendar-api.cr.cloud.ru/api
  CONTAINER_NAME: kgmu-calendar-api
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru

jobs:
  deploy-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout authorized branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify one-time Step 25 authority and freeze code commit
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          execute='universities/ugmu/commercial-isolation-deploy-execute.json'
          test -f "$execute"
          code_sha="$(jq -r '.codeCommitSha // empty' "$execute")"
          [[ "$code_sha" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${code_sha}^{commit}"
          git merge-base --is-ancestor "$code_sha" HEAD
          jq -e --arg code "$code_sha" '
            .version == 1 and
            .kind == "ugmu-commercial-isolation-deploy-execute" and
            .authorizedStep == 25 and
            .codeCommitSha == $code and
            .productionApiImageDeploy == true and
            .patchOnlyImage == true and
            .automaticRollbackOnSmokeFailure == true and
            .expectedProductionFlags.COMMERCIAL_SALES_ENABLED == false and
            .expectedProductionFlags.UGMU_SALES_ENABLED == false and
            .expectedProductionFlags.TRIALS_ENABLED == false and
            .expectedProductionFlags.FUNNEL_ANALYTICS_ENABLED == false and
            .registryActive == false and
            .catalogEnabled == false and
            .checkoutEnabled == false and
            .publicEndpointsEnabled == false and
            .publicIcsEnabled == false and
            .trialsEnabled == false and
            .salesActivation == false and
            .pagesDeploy == false and
            .storageWrite == false and
            .launchAuthority == false
          ' "$execute" >/dev/null
          changed="$(git diff --name-only "$code_sha"..HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/ugmu-commercial-isolation-deploy.yml' 'universities/ugmu/commercial-isolation-deploy-execute.json' | sort)"
          test "$changed" = "$expected"
          echo "code_sha=$code_sha" >> "$GITHUB_OUTPUT"
          echo "UGMU_COMMERCIAL_ISOLATION_AUTHORITY_SAFE"

      - name: Checkout frozen Step 24 API code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.auth.outputs.code_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install and verify frozen isolation code
        working-directory: api
        run: |
          npm ci
          node --test test/ugmu-sales-isolation.test.js test/ugmu-api-routing.test.js test/shared-config.test.js

      - name: Log in to Cloud.ru Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: kgmu-calendar-api.cr.cloud.ru
          username: ${{ secrets.EVO_CR_LOGIN }}
          password: ${{ secrets.EVO_CR_PWD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frozen Step 24 image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:ugmu-commercial-isolation-${{ steps.auth.outputs.code_sha }}

      - name: Resolve immutable image digest
        id: image
        env:
          CODE_SHA: ${{ steps.auth.outputs.code_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${IMAGE}:ugmu-commercial-isolation-${CODE_SHA}"
          inspect="$(docker buildx imagetools inspect "$tag")"
          digest="$(printf '%s\n' "$inspect" | awk '/^Digest:/ {print $2; exit}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          target="${IMAGE}@${digest}"
          echo "target_image=$target" >> "$GITHUB_OUTPUT"
          echo "TARGET_IMAGE_SAFE=$target"

      - name: Patch only production image and preserve closed flags
        id: deploy
        env:
          CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
          CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
          TARGET_IMAGE: ${{ steps.image.outputs.target_image }}
        shell: bash
        run: |
          set -euo pipefail
          auth_payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({'keyId':os.environ['CLOUDRU_KEY_ID'],'secret':os.environ['CLOUDRU_KEY_SECRET']}))
          PY
          )"
          test "$(curl --silent --show-error --output /tmp/token.json --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data "$auth_payload" 'https://iam.api.cloud.ru/api/v1/auth/token')" = "200"
          readarray -t auth < <(python3 - <<'PY'
          import base64,json
          body=json.load(open('/tmp/token.json',encoding='utf-8'))
          token=body.get('access_token'); assert isinstance(token,str) and token
          parts=token.split('.'); assert len(parts)==3
          payload=parts[1] + '='*((4-len(parts[1])%4)%4)
          claims=json.loads(base64.urlsafe_b64decode(payload.encode()).decode())
          project=claims.get('project_id'); assert isinstance(project,str) and project
          print(token); print(project)
          PY
          )
          token="${auth[0]}"; project_id="${auth[1]}"; rm -f /tmp/token.json
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
          get_url="https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$project_id"
          patch_url="https://containers.api.cloud.ru/v2/containers/${CONTAINER_NAME}?projectId=$project_id"
          test "$(curl --silent --show-error --output /tmp/before.json --write-out '%{http_code}' --header "Authorization: Bearer $token" --header 'Accept: application/json' "$get_url")" = "200"
          TARGET_IMAGE="$TARGET_IMAGE" python3 - <<'PY'
          import copy,hashlib,json,os
          app=json.load(open('/tmp/before.json',encoding='utf-8'))
          assert app.get('status') == 'running', app.get('status')
          containers=app.get('template',{}).get('containers',[]); assert len(containers)==1
          c=containers[0]
          old=c.get('image'); assert isinstance(old,str) and old.startswith('kgmu-calendar-api.cr.cloud.ru/api'), old
          env={x.get('name'):x.get('value') for x in c.get('env',[]) if isinstance(x,dict)}
          for gate in ('FUNNEL_ANALYTICS_ENABLED','TRIALS_ENABLED','COMMERCIAL_SALES_ENABLED','UGMU_SALES_ENABLED'):
              assert env.get(gate) != 'true', f'{gate} unexpectedly enabled before deploy'
          protected=copy.deepcopy(app['template']); protected['containers'][0]['image']='<IMAGE>'
          fp=hashlib.sha256(json.dumps(protected,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          state={'oldImage':old,'targetImage':os.environ['TARGET_IMAGE'],'templateFingerprint':fp,'needsPatch':old!=os.environ['TARGET_IMAGE']}
          json.dump(state,open('/tmp/deploy-state.json','w',encoding='utf-8'))
          if state['needsPatch']:
              c['image']=os.environ['TARGET_IMAGE']
              json.dump(app,open('/tmp/patch.json','w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          print('UGMU_COMMERCIAL_DEPLOY_PRECHECK_SAFE',{'oldImage':old,'targetImage':os.environ['TARGET_IMAGE'],'gates':'closed_or_unset','templateFingerprint':fp})
          PY
          old_image="$(python3 -c "import json; print(json.load(open('/tmp/deploy-state.json'))['oldImage'])")"
          echo "old_image=$old_image" >> "$GITHUB_OUTPUT"
          needs_patch="$(python3 -c "import json; print('true' if json.load(open('/tmp/deploy-state.json'))['needsPatch'] else 'false')")"
          if [ "$needs_patch" = true ]; then
            test "$(curl --silent --show-error --output /tmp/patch-response.json --write-out '%{http_code}' --request PATCH --header "Authorization: Bearer $token" --header 'Content-Type: application/json' --data-binary @/tmp/patch.json "$patch_url")" = "200"
          else
            echo "DEPLOY_SKIP_SAFE target image already active"
          fi
          ready=false
          for attempt in $(seq 1 40); do
            code="$(curl --silent --show-error --output /tmp/after.json --write-out '%{http_code}' --header "Authorization: Bearer $token" --header 'Accept: application/json' "$get_url")"
            if [ "$code" = 200 ] && TARGET_IMAGE="$TARGET_IMAGE" python3 - <<'PY'
          import copy,hashlib,json,os,sys
          state=json.load(open('/tmp/deploy-state.json',encoding='utf-8'))
          app=json.load(open('/tmp/after.json',encoding='utf-8'))
          containers=app.get('template',{}).get('containers',[])
          if app.get('status')!='running' or len(containers)!=1 or containers[0].get('image')!=os.environ['TARGET_IMAGE']:
              sys.exit(1)
          env={x.get('name'):x.get('value') for x in containers[0].get('env',[]) if isinstance(x,dict)}
          for gate in ('FUNNEL_ANALYTICS_ENABLED','TRIALS_ENABLED','COMMERCIAL_SALES_ENABLED','UGMU_SALES_ENABLED'):
              if env.get(gate)=='true': sys.exit(1)
          protected=copy.deepcopy(app['template']); protected['containers'][0]['image']='<IMAGE>'
          fp=hashlib.sha256(json.dumps(protected,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          sys.exit(0 if fp==state['templateFingerprint'] else 1)
          PY
            then ready=true; echo "CONTAINER_READY_SAFE attempt=$attempt"; break; fi
            sleep 3
          done
          test "$ready" = true
          echo "UGMU_COMMERCIAL_ISOLATION_IMAGE_DEPLOYED_SAFE"

      - name: Production fail-closed smoke
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base="$PRODUCTION_BASE_URL"
          health="$(curl --fail-with-body --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$base/health")"
          meta="$(curl --fail-with-body --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$base/api/v2/meta")"
          kgmu_programs="$(curl --fail-with-body --silent --show-error "$base/api/v2/catalog/kgmu/programs")"
          ugmu_catalog_code="$(curl --silent --show-error --output /tmp/ugmu-catalog.json --write-out '%{http_code}' "$base/api/v2/catalog/ugmu/programs")"
          encoded='ugmu%3Amedicine%3A1%3Astream-1%3A%D0%9E%D0%9B%D0%94%20101'
          ugmu_schedule_code="$(curl --silent --show-error --output /tmp/ugmu-schedule.json --write-out '%{http_code}' "$base/api/v2/schedules/ugmu/medicine/1/$encoded/schedule?groupCode=%D0%9E%D0%9B%D0%94%20101&stream=1")"
          ugmu_checkout_code="$(curl --silent --show-error --output /tmp/ugmu-checkout.json --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{"university_id":"ugmu","program":"medicine","course":1,"stream":"1","groupCode":"ОЛД 101","groupId":"ugmu:medicine:1:stream-1:ОЛД 101","email":"step25-smoke@example.com","plan":"semester"}' "$base/api/v2/payments")"
          kgmu_checkout_code="$(curl --silent --show-error --output /tmp/kgmu-checkout.json --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{}' "$base/api/v2/payments")"
          HEALTH="$health" META="$meta" KGMU_PROGRAMS="$kgmu_programs" UGMU_CATALOG_CODE="$ugmu_catalog_code" UGMU_SCHEDULE_CODE="$ugmu_schedule_code" UGMU_CHECKOUT_CODE="$ugmu_checkout_code" KGMU_CHECKOUT_CODE="$kgmu_checkout_code" python3 - <<'PY'
          import json,os
          h=json.loads(os.environ['HEALTH']); m=json.loads(os.environ['META']); p=json.loads(os.environ['KGMU_PROGRAMS'])
          assert h == {'status':'ok','service':'medical-calendar-api'}, h
          assert m.get('sales') == 'closed' and m.get('trials') == 'closed', m
          assert p.get('university') == 'kgmu' and isinstance(p.get('programs'),list), p
          assert os.environ['UGMU_CATALOG_CODE'] == '404'
          assert os.environ['UGMU_SCHEDULE_CODE'] == '404'
          assert os.environ['UGMU_CHECKOUT_CODE'] == '409'
          assert os.environ['KGMU_CHECKOUT_CODE'] == '409'
          assert json.load(open('/tmp/ugmu-checkout.json',encoding='utf-8')).get('error') in {'sales_not_open','university_sales_not_open'}
          assert json.load(open('/tmp/kgmu-checkout.json',encoding='utf-8')).get('error') == 'sales_not_open'
          print('UGMU_COMMERCIAL_ISOLATION_FAIL_CLOSED_SMOKE_PASS')
          PY

      - name: Roll back production image if smoke failed
        if: steps.smoke.outcome != 'success'
        env:
          CLOUD_TOKEN: ${{ steps.deploy.outputs.token }}
          PROJECT_ID: ${{ steps.deploy.outputs.project_id }}
          OLD_IMAGE: ${{ steps.deploy.outputs.old_image }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$CLOUD_TOKEN"
          get_url="https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$PROJECT_ID"
          patch_url="https://containers.api.cloud.ru/v2/containers/${CONTAINER_NAME}?projectId=$PROJECT_ID"
          test "$(curl --silent --show-error --output /tmp/current-rollback.json --write-out '%{http_code}' --header "Authorization: Bearer $CLOUD_TOKEN" "$get_url")" = 200
          OLD_IMAGE="$OLD_IMAGE" python3 - <<'PY'
          import json,os
          app=json.load(open('/tmp/current-rollback.json',encoding='utf-8'))
          app['template']['containers'][0]['image']=os.environ['OLD_IMAGE']
          json.dump(app,open('/tmp/rollback-patch.json','w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          PY
          test "$(curl --silent --show-error --output /tmp/rollback-response.json --write-out '%{http_code}' --request PATCH --header "Authorization: Bearer $CLOUD_TOKEN" --header 'Content-Type: application/json' --data-binary @/tmp/rollback-patch.json "$patch_url")" = 200
          restored=false
          for attempt in $(seq 1 40); do
            code="$(curl --silent --show-error --output /tmp/restored.json --write-out '%{http_code}' --header "Authorization: Bearer $CLOUD_TOKEN" "$get_url")"
            if [ "$code" = 200 ] && OLD_IMAGE="$OLD_IMAGE" python3 - <<'PY'
          import json,os,sys
          app=json.load(open('/tmp/restored.json',encoding='utf-8')); c=(app.get('template',{}).get('containers') or [{}])[0]
          sys.exit(0 if app.get('status')=='running' and c.get('image')==os.environ['OLD_IMAGE'] else 1)
          PY
            then restored=true; break; fi
            sleep 3
          done
          test "$restored" = true
          echo "UGMU_COMMERCIAL_ISOLATION_ROLLBACK_PASS"

      - name: Require successful production smoke
        if: always()
        shell: bash
        run: |
          test '${{ steps.smoke.outcome }}' = 'success'

      - name: Write deployment evidence
        if: always()
        env:
          CODE_SHA: ${{ steps.auth.outputs.code_sha }}
          TARGET_IMAGE: ${{ steps.image.outputs.target_image }}
          OLD_IMAGE: ${{ steps.deploy.outputs.old_image }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        shell: bash
        run: |
          mkdir -p /tmp/ugmu-commercial-isolation-deploy
          CODE_SHA="$CODE_SHA" TARGET_IMAGE="$TARGET_IMAGE" OLD_IMAGE="$OLD_IMAGE" SMOKE_OUTCOME="$SMOKE_OUTCOME" python3 - <<'PY'
          import json,os
          r={
            'version':1,
            'kind':'ugmu-commercial-isolation-fail-closed-deploy-report',
            'authorizedStep':25,
            'codeCommitSha':os.environ.get('CODE_SHA') or None,
            'oldImage':os.environ.get('OLD_IMAGE') or None,
            'targetImage':os.environ.get('TARGET_IMAGE') or None,
            'smokePassed':os.environ.get('SMOKE_OUTCOME')=='success',
            'patchOnlyImage':True,
            'commercialSalesEnabled':False,
            'ugmuSalesEnabled':False,
            'salesActivation':False,
            'registryActiveChanged':False,
            'storageWrite':False,
            'pagesDeploy':False,
            'nextRequiredBoundary':'ugmu-live-checkout-ui' if os.environ.get('SMOKE_OUTCOME')=='success' else 'blocked'
          }
          json.dump(r,open('/tmp/ugmu-commercial-isolation-deploy/report.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-commercial-isolation-fail-closed-deploy
          path: /tmp/ugmu-commercial-isolation-deploy/report.json
          if-no-files-found: error
          retention-days: 90
