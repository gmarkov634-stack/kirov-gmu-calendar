name: Publish ОмГМУ schedules to Cloud.ru

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful ОмГМУ source discovery run ID"
        required: true
        type: string
      confirmation:
        description: "Enter PUBLISH_OMGMU_39 to write to Cloud.ru; any other value is dry-run"
        required: true
        default: "DRY-RUN"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download verified publication plan
        uses: actions/download-artifact@v4
        with:
          name: omgmu-publication-plan
          path: api/data/publication/downloaded
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Resolve publication package
        id: package
        run: |
          manifest="$(find data/publication/downloaded -name publication-manifest.json -type f -print -quit)"
          if [ -z "$manifest" ]; then
            echo "publication-manifest.json was not found in the downloaded artifact" >&2
            exit 2
          fi
          package_dir="$(dirname "$manifest")"
          echo "dir=$package_dir" >> "$GITHUB_OUTPUT"
          echo "Using publication package: $package_dir"

      - name: Validate package in dry-run mode
        run: npm run publish:omgmu:s3 -- --package=${{ steps.package.outputs.dir }} --expected-publishable=39 --expected-blocked=4

      - name: Publish verified schedules
        if: inputs.confirmation == 'PUBLISH_OMGMU_39'
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: npm run publish:omgmu:s3 -- --package=${{ steps.package.outputs.dir }} --expected-publishable=39 --expected-blocked=4 --confirm

      - name: Upload publication report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omgmu-s3-publication-report
          path: api/data/publication/downloaded/**/s3-publication-report.json
          if-no-files-found: error
          retention-days: 30
