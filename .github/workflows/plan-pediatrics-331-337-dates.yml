name: Plan pediatrics 331-337 dates

on:
  push:
    branches:
      - feat/pediatrics-331-337-2026-27-s1
    paths:
      - 'qa/2026-2027-semester-1/pediatrics-331-337.semantic-tokenization.json'
      - 'fixtures/2026-2027-semester-1/pediatrics-331-337.source.json'
      - 'fixtures/tools/plan_pediatrics_331_337_dates.py'
      - '.github/workflows/plan-pediatrics-331-337-dates.yml'

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pediatrics-331-337-2026-27-s1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build explicit date plan from current tokenization
        run: python fixtures/tools/plan_pediatrics_331_337_dates.py
      - name: Commit date-plan evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add qa/2026-2027-semester-1/pediatrics-331-337.date-plan.json
          if git diff --cached --quiet; then
            echo 'date plan unchanged'
            exit 0
          fi
          git commit -m 'Record pediatrics 331-337 explicit date plan'
          git push origin HEAD:feat/pediatrics-331-337-2026-27-s1
