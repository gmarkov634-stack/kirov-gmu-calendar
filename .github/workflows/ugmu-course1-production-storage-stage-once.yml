name: UGMU course-1 staging one-shot dispatcher

on:
  push:
    branches:
      - main
    paths:
      - universities/ugmu/course1-production-staging-execute.json

permissions:
  contents: read
  actions: write

concurrency:
  group: ugmu-course1-staging-one-shot-dispatch
  cancel-in-progress: false

env:
  EXPECTED_MANIFEST_ID: ugmu-course1-2026-autumn-c23093970be0
  CONFIRM_PHRASE: STAGE UGMU COURSE1 ugmu-course1-2026-autumn-c23093970be0
  EXECUTION_FILE: universities/ugmu/course1-production-staging-execute.json

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify one-shot execution request
        shell: bash
        run: |
          set -euo pipefail
          test -f "$EXECUTION_FILE"
          jq -e --arg manifest "$EXPECTED_MANIFEST_ID" --arg confirm "$CONFIRM_PHRASE" '
            .kind == "ugmu-course1-production-storage-staging-execution" and
            .manifestId == $manifest and
            .confirm == $confirm and
            .execute == true
          ' "$EXECUTION_FILE" >/dev/null
          changed="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          test "$changed" = "$EXECUTION_FILE"

      - name: Dispatch guarded production staging workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ugmu-course1-production-storage-stage.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f confirm="$CONFIRM_PHRASE"
