name: Temporary fetch medicine 101-110 current workbook

on:
  push:
    branches:
      - tmp/fetch-medicine-101-110-2026-09-16
    paths:
      - '.github/workflows/tmp-fetch-medicine-101-110-2026-09-16.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/fetch-medicine-101-110-2026-09-16
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Fetch current workbook and compare group 109 with prior reviewed source
        run: |
          python - <<'PY'
          import hashlib, io, json, re, urllib.request
          from pathlib import Path
          from openpyxl import load_workbook

          page_url = 'https://kirovgma.ru/lechebnyy-fakultet-raspisanie'
          current_url = 'https://kirovgma.ru/sites/default/files/files/2026/09/04/1078/1_lech._1_potok-04-09-2026-12.xlsx'
          previous_url = 'https://kirovgma.ru/sites/default/files/files/2026/08/31/1078/1_lech._1_potok-31-08-2026-10.xlsx'
          current_filename = current_url.rsplit('/', 1)[-1]

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent':'kgmu-calendar-temp-fetch/1.1'})
              with urllib.request.urlopen(req, timeout=45) as r:
                  return r.read()

          page = get(page_url).decode('utf-8', errors='replace')
          if current_filename not in page:
              raise SystemExit(f'current workbook link missing from official page: {current_filename}')

          current_data = get(current_url)
          previous_data = get(previous_url)
          if not current_data.startswith(b'PK') or not previous_data.startswith(b'PK'):
              raise SystemExit('one of the sources is not XLSX/ZIP')
          current_wb = load_workbook(io.BytesIO(current_data), data_only=False)
          previous_wb = load_workbook(io.BytesIO(previous_data), data_only=False)
          cws = current_wb['1 леч.1']
          pws = previous_wb['1 леч.1']

          def cell_value(ws, coord):
              value = ws[coord].value
              return None if value is None else str(value).strip()

          sheets = []
          for ws in current_wb.worksheets:
              cells = []
              for row in ws.iter_rows(min_row=1, max_row=ws.max_row, min_col=1, max_col=ws.max_column):
                  for c in row:
                      if c.value is not None:
                          cells.append({'coord':c.coordinate,'value':str(c.value).strip(),'dataType':c.data_type,'numberFormat':c.number_format})
              sheets.append({'title':ws.title,'maxRow':ws.max_row,'maxColumn':ws.max_column,'mergedRanges':[str(r) for r in ws.merged_cells.ranges],'nonEmptyCells':cells})
          dump = {'sourceUrl':current_url,'sha256':hashlib.sha256(current_data).hexdigest(),'byteLength':len(current_data),'sheetNames':current_wb.sheetnames,'sheets':sheets}
          Path('tmp/medicine-101-110-2026-09-16-workbook-dump.json').write_text(json.dumps(dump,ensure_ascii=False,indent=2),encoding='utf-8')

          manifest = json.loads(Path('fixtures/2026-2027-semester-1/medicine-101-110-2026-08-31.decisions.json').read_text(encoding='utf-8'))
          group_bit = 1 << manifest['groupTable'].index('109')
          relevant = []
          relevant_cells = {'A43','A44'}
          for decision in manifest['decisions']:
              if not (int(decision[1],16) & group_bit):
                  continue
              coord = re.match(r'([A-Z]+\d+)', decision[0]).group(1)
              relevant_cells.add(coord)
              relevant.append({'decision':decision,'coord':coord,'previousValue':cell_value(pws,coord),'currentValue':cell_value(cws,coord),'cellChanged':cell_value(pws,coord)!=cell_value(cws,coord)})

          all_coords = set()
          for ws in (pws,cws):
              for row in ws.iter_rows():
                  for cell in row:
                      if cell.value is not None:
                          all_coords.add(cell.coordinate)
          changed_cells = []
          for coord in sorted(all_coords):
              pv, cv = cell_value(pws,coord), cell_value(cws,coord)
              if pv != cv:
                  changed_cells.append({'coord':coord,'previousValue':pv,'currentValue':cv,'group109Relevant':coord in relevant_cells})

          prev_merges = {str(r) for r in pws.merged_cells.ranges}
          cur_merges = {str(r) for r in cws.merged_cells.ranges}
          compare = {
              'previousUrl':previous_url,
              'previousSha256':hashlib.sha256(previous_data).hexdigest(),
              'currentUrl':current_url,
              'currentSha256':hashlib.sha256(current_data).hexdigest(),
              'group109DecisionCount':len(relevant),
              'group109RelevantCells':sorted(relevant_cells),
              'group109ChangedDecisionCells':[x for x in relevant if x['cellChanged']],
              'group109Decisions':relevant,
              'changedCells':changed_cells,
              'A43':{'previous':cell_value(pws,'A43'),'current':cell_value(cws,'A43'),'changed':cell_value(pws,'A43')!=cell_value(cws,'A43')},
              'A44':{'previous':cell_value(pws,'A44'),'current':cell_value(cws,'A44'),'changed':cell_value(pws,'A44')!=cell_value(cws,'A44')},
              'mergesAdded':sorted(cur_merges-prev_merges),
              'mergesRemoved':sorted(prev_merges-cur_merges),
          }
          Path('tmp/medicine-109-current-vs-2026-08-31.json').write_text(json.dumps(compare,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'currentSha256':compare['currentSha256'],'changedCellsTotal':len(changed_cells),'group109ChangedDecisionCells':len(compare['group109ChangedDecisionCells']),'A43Changed':compare['A43']['changed'],'A44Changed':compare['A44']['changed'],'mergesAdded':compare['mergesAdded'],'mergesRemoved':compare['mergesRemoved']},ensure_ascii=False,indent=2))
          PY
      - name: Commit evidence to temporary branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/medicine-101-110-2026-09-16-workbook-dump.json tmp/medicine-109-current-vs-2026-08-31.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: save current medicine 109 comparison evidence'
            git push origin HEAD:tmp/fetch-medicine-101-110-2026-09-16
          fi
