name: Temporary fetch medicine 101-110 current workbook

on:
  push:
    branches:
      - tmp/fetch-medicine-101-110-2026-09-16
    paths:
      - '.github/workflows/tmp-fetch-medicine-101-110-2026-09-16.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/fetch-medicine-101-110-2026-09-16
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Fetch official workbook and dump cells
        run: |
          python - <<'PY'
          import hashlib, io, json, urllib.request
          from pathlib import Path
          from openpyxl import load_workbook

          page_url = 'https://kirovgma.ru/lechebnyy-fakultet-raspisanie'
          xlsx_url = 'https://kirovgma.ru/sites/default/files/files/2026/09/04/1078/1_lech._1_potok-04-09-2026-12.xlsx'
          filename = xlsx_url.rsplit('/', 1)[-1]

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'kgmu-calendar-temp-fetch/1.0'})
              with urllib.request.urlopen(req, timeout=45) as r:
                  return r.read()

          page = get(page_url).decode('utf-8', errors='replace')
          if filename not in page:
              raise SystemExit(f'expected current workbook link not found on official page: {filename}')

          data = get(xlsx_url)
          if not data.startswith(b'PK'):
              raise SystemExit('downloaded source is not XLSX/ZIP')
          wb = load_workbook(io.BytesIO(data), data_only=False)
          sheets = []
          for ws in wb.worksheets:
              cells = []
              for row in ws.iter_rows(min_row=1, max_row=ws.max_row, min_col=1, max_col=ws.max_column):
                  for c in row:
                      if c.value is None:
                          continue
                      cells.append({
                          'coord': c.coordinate,
                          'value': str(c.value).strip(),
                          'dataType': c.data_type,
                          'numberFormat': c.number_format,
                      })
              sheets.append({
                  'title': ws.title,
                  'maxRow': ws.max_row,
                  'maxColumn': ws.max_column,
                  'mergedRanges': [str(r) for r in ws.merged_cells.ranges],
                  'nonEmptyCells': cells,
              })
          out = {
              'sourceUrl': xlsx_url,
              'sha256': hashlib.sha256(data).hexdigest(),
              'byteLength': len(data),
              'sheetNames': wb.sheetnames,
              'sheets': sheets,
          }
          p = Path('tmp/medicine-101-110-2026-09-16-workbook-dump.json')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({'sourceUrl': xlsx_url, 'sha256': out['sha256'], 'byteLength': out['byteLength'], 'sheetNames': out['sheetNames']}, ensure_ascii=False))
          PY
      - name: Commit dump to temporary branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/medicine-101-110-2026-09-16-workbook-dump.json
          git commit -m 'chore: save current medicine 101-110 workbook dump'
          git push origin HEAD:tmp/fetch-medicine-101-110-2026-09-16
