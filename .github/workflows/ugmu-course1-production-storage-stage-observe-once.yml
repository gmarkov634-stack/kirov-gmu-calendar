name: UGMU course-1 staging one-shot observer

on:
  workflow_run:
    workflows:
      - UGMU course-1 production storage stage
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Collect staging result
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/evidence
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name ugmu-course1-production-storage-stage --dir /tmp/evidence || true
          stage='/tmp/evidence/api/data/imports/ugmu-course1/production-storage-stage/report.json'
          verify='/tmp/evidence/api/data/imports/ugmu-course1/production-storage-verify/report.json'
          if [ ! -f "$stage" ]; then stage='/tmp/evidence/production-storage-stage/report.json'; fi
          if [ ! -f "$verify" ]; then verify='/tmp/evidence/production-storage-verify/report.json'; fi
          groups='null'; events='null'; stage_passed='false'; verified='null'; missing='null'; failed='null'; verify_passed='false'
          if [ -f "$stage" ]; then
            stage_passed="$(jq -r '.passed // false' "$stage")"
            groups="$(jq -r '.totals.groups // null' "$stage")"
            events="$(jq -r '.totals.events // null' "$stage")"
          fi
          if [ -f "$verify" ]; then
            verify_passed="$(jq -r '.passed // false' "$verify")"
            verified="$(jq -r '.totals.verified // null' "$verify")"
            missing="$(jq -r '.totals.missing // null' "$verify")"
            failed="$(jq -r '.totals.failed // null' "$verify")"
          fi
          cat > /tmp/body.md <<EOF
          Controlled UGMU course-1 production storage staging completed.

          - run: $RUN_ID
          - conclusion: $RUN_CONCLUSION
          - stagePassed: $stage_passed
          - groups: $groups
          - events: $events
          - verifyPassed: $verify_passed
          - verified: $verified
          - missing: $missing
          - failed: $failed
          - runUrl: $RUN_URL
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" --title "UGMU course1 staging result $RUN_ID" --body-file /tmp/body.md
