name: UGMU YooKassa runtime secret verify

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ugmu-yookassa-runtime-secret-verify.yml"

permissions:
  contents: read

env:
  CONTAINER_NAME: kgmu-calendar-api

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Resolve active secret and call YooKassa GET only
        env:
          CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
          CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          auth_payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({'keyId':os.environ['CLOUDRU_KEY_ID'],'secret':os.environ['CLOUDRU_KEY_SECRET']}))
          PY
          )"
          test "$(curl -sS -o /tmp/token.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data "$auth_payload" https://iam.api.cloud.ru/api/v1/auth/token)" = 200
          readarray -t auth < <(python3 - <<'PY'
          import base64,json
          b=json.load(open('/tmp/token.json')); t=b['access_token']; p=t.split('.')[1]; p+='='*((4-len(p)%4)%4); c=json.loads(base64.urlsafe_b64decode(p)); print(t); print(c['project_id'])
          PY
          )
          token="${auth[0]}"; project_id="${auth[1]}"; rm -f /tmp/token.json; echo "::add-mask::$token"
          test "$(curl -sS -o /tmp/container.json -w '%{http_code}' -H "Authorization: Bearer $token" "https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$project_id")" = 200
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/container.json')); assert a.get('status')=='running'; c=a['template']['containers'][0]; e={x['name']:x for x in c.get('env',[]) if isinstance(x,dict) and x.get('name')}
          assert e['YOOKASSA_SECRET_KEY'].get('type')=='secret'; assert e['YOOKASSA_TEST_MODE'].get('value')=='false'; assert e['COMMERCIAL_SALES_ENABLED'].get('value')=='false'; assert e['UGMU_SALES_ENABLED'].get('value')=='false'; assert e.get('TRIALS_ENABLED',{}).get('value') in (None,'','false')
          open('/tmp/shop','w').write(e['YOOKASSA_SHOP_ID']['value']); open('/tmp/ref','w').write(e['YOOKASSA_SECRET_KEY']['value'])
          print('RUNTIME_GATES_SAFE', {'container':'running','secretType':'secret','paymentModeEnv':'live','globalSales':False,'ugmuSales':False,'trials':False})
          PY
          rm -f /tmp/container.json
          shop="$(cat /tmp/shop)"; ref="$(cat /tmp/ref)"; echo "::add-mask::$shop"; echo "::add-mask::$ref"

          mkdir /tmp/verify && cd /tmp/verify
          cat > go.mod <<'EOF'
          module verifier
          go 1.23.0
          require (
            github.com/cloudru-tech/secret-manager-sdk v1.1.1
            google.golang.org/grpc v1.70.0
          )
          EOF
          cat > main.go <<'EOF'
          package main
          import("context";"encoding/json";"fmt";"io";"net/http";"os";"time"; sm "github.com/cloudru-tech/secret-manager-sdk"; v2 "github.com/cloudru-tech/secret-manager-sdk/api/v2";"google.golang.org/grpc/metadata")
          func e(n string)string{v:=os.Getenv(n);if v==""{panic("missing env")};return v}
          func main(){
            cl,err:=sm.New(&sm.Config{Host:"secretmanager.api.cloud.ru:443"});if err!=nil{panic(err)};defer cl.Close()
            ctx,cancel:=context.WithTimeout(context.Background(),20*time.Second);defer cancel();ctx=metadata.AppendToOutgoingContext(ctx,"authorization","Bearer "+e("TOKEN"))
            s,err:=cl.V2.SecretService.Access(ctx,&v2.AccessSecretRequest{ProjectId:e("PROJECT"),Path:e("REF")});if err!=nil{fmt.Println("SECRET_RESOLVE_SAFE",`{"resolved":false}`);os.Exit(3)}
            key:=s.GetPayload().GetValue();if len(key)==0{panic("empty resolved secret")}
            req,_:=http.NewRequest(http.MethodGet,"https://api.yookassa.ru/v3/payments?limit=1",nil);req.SetBasicAuth(e("SHOP"),string(key));hc:=&http.Client{Timeout:20*time.Second};r,err:=hc.Do(req);if err!=nil{panic(err)};defer r.Body.Close();raw,_:=io.ReadAll(io.LimitReader(r.Body,1<<20));var b map[string]any;_ = json.Unmarshal(raw,&b)
            safe:=map[string]any{"secretResolved":true,"httpCode":r.StatusCode,"paymentCreated":false};if r.StatusCode==200{items,_:=b["items"].([]any);safe["type"]=b["type"];safe["itemCount"]=len(items);flags:=map[bool]bool{};for _,x:=range items{if m,ok:=x.(map[string]any);ok{if f,ok:=m["test"].(bool);ok{flags[f]=true}}};a:=[]bool{};if flags[false]{a=append(a,false)};if flags[true]{a=append(a,true)};safe["paymentTestFlags"]=a}else{safe["type"]=b["type"];safe["code"]=b["code"]};out,_:=json.Marshal(safe);fmt.Println("YOOKASSA_RUNTIME_SECRET_AUTH_SAFE",string(out));if r.StatusCode!=200{os.Exit(4)}
          }
          EOF
          go mod tidy
          TOKEN="$token" PROJECT="$project_id" REF="$ref" SHOP="$shop" go run .
          cd / && rm -rf /tmp/verify /tmp/shop /tmp/ref
