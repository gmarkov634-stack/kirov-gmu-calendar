name: UGMU YooKassa runtime secret verify (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve completed runtime-secret boundary
        run: |
          echo "The prelaunch YooKassa runtime-secret verifier is retired after UGMU launch."
          echo "Its old runtime assertion required UGMU_SALES_ENABLED=false and would now report a false regression."
          echo "After the temporary test window, ShopID 1258890, live secret reference, YOOKASSA_TEST_MODE=false and provider live mode were verified read-only."
          echo "No secret access, provider request, payment creation, or Cloud.ru mutation is performed by this retired workflow."
