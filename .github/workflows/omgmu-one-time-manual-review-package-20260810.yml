name: One-time build ОмГМУ manual review package

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/omgmu-one-time-manual-review-package-20260810.yml"

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: github.event.head_commit.message == 'Build ОмГМУ manual review package'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Download official PDF sources
        uses: actions/download-artifact@v4
        with:
          name: omgmu-source-pdfs
          path: api/data/review-input/pdfs
          run-id: 31339883275
          github-token: ${{ github.token }}

      - name: Download normalized schedules
        uses: actions/download-artifact@v4
        with:
          name: omgmu-normalized-schedules
          path: api/data/review-input/schedules
          run-id: 31339883275
          github-token: ${{ github.token }}

      - name: Prepare review drafts and package
        working-directory: api
        env:
          SOURCE_RUN_ID: "31339883275"
          ARTIFACT_NAME: "omgmu-manual-review-package-20260810"
        run: |
          set -euo pipefail
          package="data/manual-review-package"
          rm -rf "$package"
          mkdir -p "$package/drafts" "$package/sources"

          source_course2="$(find data/review-input/pdfs -type f -name '04_medicine-international_course-2_stream-2_combined.pdf' -print -quit)"
          source_course3="$(find data/review-input/pdfs -type f -name '05_medicine-international_course-3_combined.pdf' -print -quit)"
          test -n "$source_course2" && test -n "$source_course3"

          schedule_2113="$(find data/review-input/schedules -type f -name '2113.json' -print -quit)"
          schedule_2114="$(find data/review-input/schedules -type f -name '2114.json' -print -quit)"
          schedule_389="$(find data/review-input/schedules -type f -name '389.json' -print -quit)"
          schedule_393="$(find data/review-input/schedules -type f -name '393.json' -print -quit)"
          test -n "$schedule_2113" && test -n "$schedule_2114" && test -n "$schedule_389" && test -n "$schedule_393"

          npm run review:omgmu:prepare -- --group=2113 --source="$source_course2" --schedule="$schedule_2113" --output="$package/drafts/2113.review.json"
          npm run review:omgmu:prepare -- --group=2114 --source="$source_course2" --schedule="$schedule_2114" --output="$package/drafts/2114.review.json"
          npm run review:omgmu:prepare -- --group=389 --source="$source_course3" --schedule="$schedule_389" --output="$package/drafts/389.review.json"
          npm run review:omgmu:prepare -- --group=393 --source="$source_course3" --schedule="$schedule_393" --output="$package/drafts/393.review.json"

          cp "$source_course2" "$package/sources/course-2-stream-2.pdf"
          cp "$source_course3" "$package/sources/course-3.pdf"
          cp ../review/omgmu/index.html "$package/editor.html"

          cat > "$package/README.md" <<'EOF'
          # Ручная проверка расписаний ОмГМУ

          Проверяемые группы: **2113, 2114, 389, 393**.

          Причина блокировки: в официальном PDF отдельные даты не совпадают с вертикальным обозначением дня недели. До ручного подтверждения эти группы скрыты с лендинга и отсутствуют в публичном API.

          ## Порядок проверки

          1. Откройте соответствующий PDF из папки `sources`.
          2. Откройте `editor.html` в браузере.
          3. Нажмите «Открыть review.json» и выберите файл группы из папки `drafts`.
          4. Сверьте каждое занятие с PDF: название, дату, начало, окончание и адрес.
          5. Исправьте ошибки, укажите проверяющего и дату проверки.
          6. Нажмите «Утвердить и скачать».
          7. Сохраните утверждённый файл без изменения поля `sourceSha256`.

          Утверждённый JSON можно применять только к тому PDF, SHA-256 которого указан в файле. При изменении официального PDF старое утверждение автоматически станет недействительным.
          EOF

          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          package = Path('data/manual-review-package')
          groups = ['2113', '2114', '389', '393']
          drafts = {}
          for group in groups:
              path = package / 'drafts' / f'{group}.review.json'
              data = json.loads(path.read_text(encoding='utf-8'))
              drafts[group] = {
                  'file': str(path.relative_to(package)),
                  'sourceSha256': data['sourceSha256'],
                  'sourceFile': data['sourceFile'],
                  'eventCount': len(data.get('events', [])),
                  'status': data.get('status'),
              }
          sources = {}
          for path in sorted((package / 'sources').glob('*.pdf')):
              sources[path.name] = {
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'sizeBytes': path.stat().st_size,
              }
          manifest = {
              'version': 1,
              'university': 'omgmu',
              'operation': 'manual-review-package',
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'sourceRunId': int(os.environ['SOURCE_RUN_ID']),
              'artifactName': os.environ['ARTIFACT_NAME'],
              'groups': groups,
              'drafts': drafts,
              'sources': sources,
          }
          (package / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          report = {
              **manifest,
              'workflowRunId': int(os.environ['GITHUB_RUN_ID']),
              'jobStatus': 'package-built',
          }
          output = Path('../ops/reports/omgmu-manual-review-package-20260810.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload manual review package
        uses: actions/upload-artifact@v4
        with:
          name: omgmu-manual-review-package-20260810
          path: api/data/manual-review-package
          if-no-files-found: error
          retention-days: 30

      - name: Record package result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p ops/reports
          if [ ! -f ops/reports/omgmu-manual-review-package-20260810.json ]; then
            printf '{"version":1,"university":"omgmu","operation":"manual-review-package","workflowRunId":%s,"errors":["package report was not generated"]}\n' "$WORKFLOW_RUN_ID" > ops/reports/omgmu-manual-review-package-20260810.json
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('ops/reports/omgmu-manual-review-package-20260810.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['jobStatus'] = os.environ['JOB_STATUS']
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/reports/omgmu-manual-review-package-20260810.json
          git commit -m "Record ОмГМУ manual review package result" || true
          git push
