name: TEMP stage Dentistry course 4 publication inputs

on:
  push:
    branches:
      - feat/dentistry-course4-publish-2026-09-03

permissions:
  contents: write

jobs:
  stage-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dentistry-course4-publish-2026-09-03
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce resolved candidate
        run: |
          python3 fixtures/tools/run_dentistry_491_494_prepost_candidate.py
          python3 fixtures/tools/postprocess_dentistry_491_494_candidate.py
      - name: Verify resolved outputs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          draft = json.loads((root/'qa/2026-2027-semester-1/dentistry-491-494.normalized-draft.json').read_text())
          qa = json.loads((root/'qa/2026-2027-semester-1/dentistry-491-494.qa-report.json').read_text())
          assert draft['status'] == 'PASS'
          assert draft['eventCount'] == 531
          assert draft['candidateDigest'] == 'sha256:2a0490e90c89cfb40004b128c8429f896108ff9fc98e98cd1426adae171931a1'
          assert qa['status'] == 'PASS'
          assert qa['scheduleVersionReady'] is True
          assert qa['blockers'] == []
          PY
      - name: Commit immutable publication inputs and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            fixtures/2026-2027-semester-1/dentistry-491-494.source-artifact.json \
            fixtures/2026-2027-semester-1/dentistry-491-494.parsing-job.json \
            qa/2026-2027-semester-1/dentistry-491-494.parsing-result.json \
            qa/2026-2027-semester-1/dentistry-491-494.normalized-draft.json \
            qa/2026-2027-semester-1/dentistry-491-494.semantic-review.json \
            qa/2026-2027-semester-1/dentistry-491-494.qa-report.json
          git rm .github/workflows/temp-build-dentistry-491-494-publication.yml
          git commit -m 'Commit resolved Dentistry course 4 publication inputs'
          git push origin HEAD:feat/dentistry-course4-publish-2026-09-03
