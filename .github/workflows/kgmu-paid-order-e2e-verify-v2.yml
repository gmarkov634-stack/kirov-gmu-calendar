name: KGMU paid order E2E verify v2

on:
  push:
    paths:
      - ".github/workflows/kgmu-paid-order-e2e-verify-v2.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify paid order subscription and cleanup
        env:
          KGMU_ADMIN_TOKEN: ${{ secrets.KGMU_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          base='https://kgmu-calendar-api.containerapps.ru'
          order_id='7lN66yq9Ol8UD_DSG1F-V1BPukoNsYtx'
          test -n "$KGMU_ADMIN_TOKEN"

          cleanup_hash=''
          cleanup() {
            if [ -n "$cleanup_hash" ]; then
              echo 'CLEANUP_REVOKE_TEST_SUBSCRIPTION'
              curl --silent --show-error --output /tmp/cleanup.json \
                -X POST -H "X-Admin-Token: $KGMU_ADMIN_TOKEN" \
                "$base/api/v1/admin/subscriptions/$cleanup_hash/revoke" || true
            fi
          }
          trap cleanup EXIT

          curl --fail-with-body --silent --show-error \
            -H "X-Admin-Token: $KGMU_ADMIN_TOKEN" \
            "$base/api/v1/admin/subscriptions" \
            -o /tmp/subscriptions.json

          active_hash="$(jq -r --arg order "$order_id" '[.subscriptions[] | select(.orderId == $order and .status == "active")][0].tokenHash // empty' /tmp/subscriptions.json)"
          test -n "$active_hash"
          echo 'FULFILLMENT_SUBSCRIPTION_CREATED_OK'

          rotate_status="$(curl --silent --show-error --output /tmp/rotated.json --write-out '%{http_code}' \
            -X POST -H "X-Admin-Token: $KGMU_ADMIN_TOKEN" \
            "$base/api/v1/admin/subscriptions/$active_hash/rotate")"
          echo "ROTATE_HTTP_STATUS=$rotate_status"
          test "$rotate_status" = '200'
          jq -e '.status == "succeeded" and .testMode == true and .university == "kgmu" and .program == "medicine" and .course == 4 and .groupCode == "401" and .plan == "year"' /tmp/rotated.json >/dev/null
          echo 'ORDER_STATUS_SUCCEEDED_OK'

          subscription_url="$(jq -r '.subscriptionUrl // empty' /tmp/rotated.json)"
          token="$(printf '%s' "$subscription_url" | sed -nE 's#^.*/subscriptions/([A-Za-z0-9_-]{43})/calendar\.ics$#\1#p')"
          test "${#token}" = '43'
          echo "::add-mask::$token"
          echo "::add-mask::$subscription_url"
          cleanup_hash="$(python3 - "$token" <<'PY'
          import hashlib, sys
          print(hashlib.sha256(sys.argv[1].encode()).hexdigest())
          PY
          )"

          curl --fail-with-body --silent --show-error -D /tmp/headers.txt "$subscription_url" -o /tmp/calendar.ics
          status="$(awk 'BEGIN{IGNORECASE=1} /^X-Subscription-Status:/ {gsub("\r",""); print $2}' /tmp/headers.txt | tail -1)"
          tr -d '\r' < /tmp/calendar.ics > /tmp/calendar.lf
          events="$(grep -c '^BEGIN:VEVENT$' /tmp/calendar.lf || true)"
          uids="$(grep -c '^UID:evt_' /tmp/calendar.lf || true)"
          echo "ICS_SUBSCRIPTION_STATUS=$status"
          echo "ICS_EVENT_COUNT=$events"
          echo "ICS_UID_COUNT=$uids"
          test "$status" = 'active'
          test "$events" = '112'
          test "$uids" = '112'
          echo 'PAID_SUBSCRIPTION_ICS_OK'

          revoke_status="$(curl --silent --show-error --output /tmp/revoke.json --write-out '%{http_code}' \
            -X POST -H "X-Admin-Token: $KGMU_ADMIN_TOKEN" \
            "$base/api/v1/admin/subscriptions/$cleanup_hash/revoke")"
          echo "REVOKE_HTTP_STATUS=$revoke_status"
          test "$revoke_status" = '200'
          cleanup_hash=''

          curl --fail-with-body --silent --show-error -D /tmp/revoked-headers.txt "$subscription_url" -o /tmp/revoked.ics
          revoked_status="$(awk 'BEGIN{IGNORECASE=1} /^X-Subscription-Status:/ {gsub("\r",""); print $2}' /tmp/revoked-headers.txt | tail -1)"
          tr -d '\r' < /tmp/revoked.ics > /tmp/revoked.lf
          revoked_events="$(grep -c '^BEGIN:VEVENT$' /tmp/revoked.lf || true)"
          echo "REVOKED_ICS_STATUS=$revoked_status"
          echo "REVOKED_ICS_EVENT_COUNT=$revoked_events"
          test "$revoked_status" = 'revoked'
          test "$revoked_events" = '0'
          echo 'TEST_SUBSCRIPTION_CLEANUP_OK'
          echo 'PAID_ORDER_E2E_SUCCESS'
