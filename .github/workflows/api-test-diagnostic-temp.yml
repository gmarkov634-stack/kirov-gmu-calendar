name: TEMP API test failure diagnostic

on:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api-test-diagnostic-temp.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Capture exact node test output
        id: node_tests
        shell: bash
        run: |
          set +e
          node --test > api-test-diagnostic.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "$status" > api-test-diagnostic.exit
          exit 0

      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: api-test-diagnostic
          path: |
            api/api-test-diagnostic.log
            api/api-test-diagnostic.exit
          if-no-files-found: error
          retention-days: 1

      - name: Preserve original test conclusion
        shell: bash
        run: |
          test "${{ steps.node_tests.outputs.exit_code }}" = "0"
