name: Commercial gate production smoke

on:
  push:
    paths:
      - ".github/workflows/commercial-gate-production-smoke.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify closed production sales gate
        shell: bash
        run: |
          set -euo pipefail
          base='https://kgmu-calendar-api.containerapps.ru'

          curl --fail-with-body --silent --show-error "$base/health" -o /tmp/health.json
          jq -e '.status == "ok" and .service == "medical-calendar-api"' /tmp/health.json >/dev/null
          echo "HEALTH_OK"

          curl --fail-with-body --silent --show-error "$base/api/v2/meta" -o /tmp/meta.json
          jq -e '.sales == "closed" and (.paymentMode == "test")' /tmp/meta.json >/dev/null
          echo "META_OK sales=$(jq -r '.sales' /tmp/meta.json) paymentMode=$(jq -r '.paymentMode' /tmp/meta.json)"

          curl --fail-with-body --silent --show-error "$base/api/v2/catalog/kgmu/programs" -o /tmp/catalog.json
          jq -e '.programs | type == "array"' /tmp/catalog.json >/dev/null
          echo "CATALOG_OK programs=$(jq '.programs|length' /tmp/catalog.json)"

          status="$(curl --silent --show-error --output /tmp/payment.json --write-out '%{http_code}' \
            -X POST "$base/api/v2/payments" \
            -H 'Content-Type: application/json' \
            --data '{"email":"commercial-gate-smoke@example.com","university":"kgmu","program":"medicine","course":4,"groupCode":"401","groupId":"kgmu:medicine:4:401","plan":"semester"}')"
          echo "PAYMENT_HTTP=$status"
          jq . /tmp/payment.json
          test "$status" = '409'
          jq -e '.error == "sales_not_open"' /tmp/payment.json >/dev/null
          echo "COMMERCIAL_GATE_PRODUCTION_PASS"
