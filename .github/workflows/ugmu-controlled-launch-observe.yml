name: UGMU controlled launch observer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ugmu-controlled-launch-observe.yml"

permissions:
  contents: read

env:
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru
  UGMU_SITE_URL: https://gmarkov634-stack.github.io/kirov-gmu-calendar/ugmu/

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Wait for coherent controlled-launch state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p launch-evidence
          success=false
          last='{}'
          for attempt in $(seq 1 60); do
            meta_code="$(curl -sS -o /tmp/meta.json -w '%{http_code}' --max-time 15 "$PRODUCTION_BASE_URL/api/v2/meta" || true)"
            page_code="$(curl -sS -o /tmp/page.html -w '%{http_code}' --max-time 15 "${UGMU_SITE_URL}?observe=${GITHUB_SHA}&attempt=$attempt" || true)"
            sales=""; trials=""; mode=""; robots=""; livecopy=false
            if [ "$meta_code" = 200 ]; then
              readarray -t state < <(python3 - <<'PY'
          import json
          m=json.load(open('/tmp/meta.json')); print(m.get('sales','')); print(m.get('trials','')); print(m.get('paymentMode',''))
          PY
              ); sales="${state[0]}"; trials="${state[1]}"; mode="${state[2]}"
            fi
            if [ "$page_code" = 200 ]; then
              if grep -q 'name="robots" content="index,follow"' /tmp/page.html; then robots=index; elif grep -q 'name="robots" content="noindex,follow"' /tmp/page.html; then robots=noindex; else robots=unknown; fi
              if grep -q 'Календарь доступен' /tmp/page.html && ! grep -q 'Предзапусковый режим' /tmp/page.html; then livecopy=true; fi
            fi
            echo "OBSERVE attempt=$attempt meta=$meta_code sales=$sales trials=$trials paymentMode=$mode page=$page_code robots=$robots liveCopy=$livecopy"
            if [ "$meta_code" = 200 ] && [ "$sales" = open ] && [ "$trials" = closed ] && [ "$mode" = live ] && [ "$page_code" = 200 ] && [ "$robots" = index ] && [ "$livecopy" = true ]; then
              success=true; break
            fi
            sleep 10
          done
          test "$success" = true

          group="$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote('ugmu:medicine:1:stream-1:ОЛД 101',safe=''))
          PY
          )"
          schedule_code="$(curl -sS -o /tmp/schedule.json -w '%{http_code}' "$PRODUCTION_BASE_URL/api/v2/schedules/ugmu/medicine/1/$group/schedule?groupCode=%D0%9E%D0%9B%D0%94%20101&stream=1")"
          test "$schedule_code" = 404
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/schedule.json')) == {'error':'schedule_not_published'}
          PY
          cors="$(curl -sS -D - -o /dev/null -X OPTIONS -H 'Origin: https://gmarkov634-stack.github.io' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' "$PRODUCTION_BASE_URL/api/v2/payments" | tr -d '\r')"
          echo "$cors" | grep -iq '^access-control-allow-origin: https://gmarkov634-stack.github.io$'
          printf '%s\n' '{"status":"PASS","observedLaunch":true,"sales":"open","trials":"closed","paymentMode":"live","siteIndexed":true,"publicSchedule":false,"paymentCreated":false,"productionMutationPerformed":false}' > launch-evidence/observer.json
          echo 'UGMU_CONTROLLED_LAUNCH_OBSERVED_SAFE paymentCreated=false mutation=false'
      - name: Upload observer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-controlled-launch-observer-${{ github.sha }}
          path: launch-evidence/observer.json
          if-no-files-found: warn
          retention-days: 30
