name: Sync Dentistry course 2 PR 107 with main

on:
  push:
    branches:
      - feat/dentistry-291-294-2026-27-s1
    paths:
      - '.github/workflows/sync-dentistry-291-294-pr107.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge exact current main and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin 71eccf47544243d199fb143436ab727834e1bf15
          if ! git merge --no-edit 71eccf47544243d199fb143436ab727834e1bf15; then
            echo 'Merge conflicts:'
            git diff --name-only --diff-filter=U
            exit 1
          fi
          rm .github/workflows/sync-dentistry-291-294-pr107.yml
          git add -A
          git commit --amend --no-edit
          git push origin HEAD:feat/dentistry-291-294-2026-27-s1
