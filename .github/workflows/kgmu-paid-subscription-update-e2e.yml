name: KGMU paid subscription update E2E

on:
  push:
    paths:
      - ".github/workflows/kgmu-paid-subscription-update-e2e.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify paid URL A to B to A and cleanup
        env:
          KGMU_ADMIN_TOKEN: ${{ secrets.KGMU_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          base='https://kgmu-calendar-api.containerapps.ru'
          order_id='7lN66yq9Ol8UD_DSG1F-V1BPukoNsYtx'
          source='reviewed/kgmu/2025-26/2/medicine/4/146876a71f1ad8503593aeb82fcc72fef76022896b85d7f7dc61ca7ec97c0dae.json'
          test -n "$KGMU_ADMIN_TOKEN"

          cleanup_hash=''
          have_a='false'
          cleanup() {
            set +e
            if [ "$have_a" = 'true' ] && [ -f /tmp/a.json ]; then
              echo 'CLEANUP_RESTORE_A'
              curl --silent --show-error --output /tmp/cleanup-a.json \
                -X POST -H "X-Admin-Token: $KGMU_ADMIN_TOKEN" -H 'Content-Type: application/json' \
                --data-binary @/tmp/a.json "$base/api/v1/admin/schedules/publish" || true
            fi
            if [ -n "$cleanup_hash" ]; then
              echo 'CLEANUP_REVOKE_PAID_TEST_SUBSCRIPTION'
              curl --silent --show-error --output /tmp/cleanup-revoke.json \
                -X POST -H "X-Admin-Token: $KGMU_ADMIN_TOKEN" \
                "$base/api/v1/admin/subscriptions/$cleanup_hash/revoke" || true
            fi
          }
          trap cleanup EXIT

          health="$(curl --fail-with-body --silent --show-error "$base/health")"
          test "$(printf '%s' "$health" | jq -r '.status')" = 'ok'

          node api/tools/kgmu-legacy-reviewed-to-canonical.mjs \
            --input "$source" --groups 401 --week1-start 2026-02-02 --output /tmp/pkg.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg=JSON.parse(fs.readFileSync('/tmp/pkg.json','utf8'));
          if (pkg.batches.length !== 1 || pkg.batches[0].schedule.group !== '401' || pkg.batches[0].events.length !== 112) {
            throw new Error('unexpected canonical group 401 package');
          }
          const a=pkg.batches[0];
          const counts=new Map();
          for (const e of a.events) {
            if (e.timing?.all_day || !e.timing?.date || !e.timing?.start_time || !e.timing?.end_time) continue;
            const key=`${e.timing.date}|${e.timing.start_time}`;
            counts.set(key,(counts.get(key)||0)+1);
          }
          const target=a.events.find(e => {
            if (e.timing?.all_day || !e.timing?.date || !e.timing?.start_time || !e.timing?.end_time) return false;
            const key=`${e.timing.date}|${e.timing.start_time}`;
            if (counts.get(key) !== 1) return false;
            const [sh,sm]=e.timing.start_time.split(':').map(Number);
            const [eh,em]=e.timing.end_time.split(':').map(Number);
            return (eh*60+em)-(sh*60+sm) >= 5;
          });
          if (!target) throw new Error('no safe unique target event');
          const [h,m]=target.timing.end_time.split(':').map(Number);
          const total=h*60+m-1;
          const changedEnd=`${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`;
          const b=structuredClone(a);
          const index=a.events.indexOf(target);
          b.events[index].timing.end_time=changedEnd;
          fs.writeFileSync('/tmp/a.json',JSON.stringify(a));
          fs.writeFileSync('/tmp/b.json',JSON.stringify(b));
          fs.writeFileSync('/tmp/target.json',JSON.stringify({
            date:target.timing.date,
            start:target.timing.start_time,
            endA:target.timing.end_time,
            endB:changedEnd,
            discipline:target.lesson?.discipline?.normalized || ''
          }));
          console.log(JSON.stringify({target:JSON.parse(fs.readFileSync('/tmp/target.json','utf8'))},null,2));
          NODE
          have_a='true'

          publish() {
            local file="$1" out="$2"
            curl --fail-with-body --silent --show-error \
              -X POST -H "X-Admin-Token: $KGMU_ADMIN_TOKEN" -H 'Content-Type: application/json' \
              --data-binary @"$file" "$base/api/v1/admin/schedules/publish" -o "$out"
          }

          parse_target() {
            local ics="$1" out="$2"
            python3 - "$ics" /tmp/target.json "$out" <<'PY'
          import json, re, sys
          ics_path,target_path,out_path=sys.argv[1:]
          target=json.load(open(target_path,encoding='utf-8'))
          text=open(ics_path,'rb').read().decode('utf-8').replace('\r\n','\n').replace('\r','\n')
          dtstart='DTSTART:'+target['date'].replace('-','')+'T'+target['start'].replace(':','')+'00'
          blocks=[]
          for raw in text.split('BEGIN:VEVENT')[1:]:
              block=raw.split('END:VEVENT',1)[0]
              if dtstart in block.split('\n'):
                  blocks.append(block)
          if len(blocks)!=1:
              raise SystemExit(f'expected exactly one target VEVENT, got {len(blocks)}')
          props={}
          for line in blocks[0].split('\n'):
              if ':' in line:
                  k,v=line.split(':',1)
                  props.setdefault(k,v)
          value={
              'uid':props.get('UID',''),
              'sequence':int(props.get('SEQUENCE','-1')),
              'dtstart':props.get('DTSTART',''),
              'dtend':props.get('DTEND',''),
          }
          if not value['uid'].startswith('evt_') or value['sequence'] < 0:
              raise SystemExit('target VEVENT identity is invalid')
          json.dump(value,open(out_path,'w',encoding='utf-8'))
          print(json.dumps(value))
          PY
          }

          echo '== Normalize production baseline A =='
          publish /tmp/a.json /tmp/baseline-publish.json
          jq '{status,eventCount,contentFingerprint,diff:.diff.counts}' /tmp/baseline-publish.json
          test "$(jq -r '.status' /tmp/baseline-publish.json)" = 'unchanged'
          test "$(jq -r '.eventCount' /tmp/baseline-publish.json)" = '112'

          echo '== Reactivate subscription from already paid test order =='
          curl --fail-with-body --silent --show-error -H "X-Admin-Token: $KGMU_ADMIN_TOKEN" \
            "$base/api/v1/admin/subscriptions" -o /tmp/subscriptions.json
          mapfile -t candidates < <(jq -r --arg order "$order_id" '.subscriptions[] | select(.orderId == $order) | .tokenHash' /tmp/subscriptions.json)
          test "${#candidates[@]}" -ge 1
          rotate_status=''
          for hash in "${candidates[@]}"; do
            rotate_status="$(curl --silent --show-error --output /tmp/rotated.json --write-out '%{http_code}' \
              -X POST -H "X-Admin-Token: $KGMU_ADMIN_TOKEN" \
              "$base/api/v1/admin/subscriptions/$hash/rotate")"
            if [ "$rotate_status" = '200' ]; then break; fi
            if [ "$rotate_status" != '409' ]; then
              echo "unexpected rotate status $rotate_status"
              cat /tmp/rotated.json
              exit 1
            fi
          done
          test "$rotate_status" = '200'
          jq -e '.status == "succeeded" and .testMode == true and .university == "kgmu" and .program == "medicine" and .course == 4 and .groupCode == "401" and .plan == "year"' /tmp/rotated.json >/dev/null
          paid_url="$(jq -r '.subscriptionUrl // empty' /tmp/rotated.json)"
          paid_token="$(printf '%s' "$paid_url" | sed -nE 's#^.*/subscriptions/([A-Za-z0-9_-]{43})/calendar\.ics$#\1#p')"
          test "${#paid_token}" = '43'
          echo "::add-mask::$paid_token"
          echo "::add-mask::$paid_url"
          cleanup_hash="$(python3 - "$paid_token" <<'PY'
          import hashlib,sys
          print(hashlib.sha256(sys.argv[1].encode()).hexdigest())
          PY
          )"
          echo 'PAID_ORDER_REACTIVATED_OK'

          fetch_paid() {
            local out="$1" headers="$2"
            curl --fail-with-body --silent --show-error -D "$headers" "$paid_url" -o "$out"
            local s
            s="$(awk 'BEGIN{IGNORECASE=1} /^X-Subscription-Status:/ {gsub("\r",""); print $2}' "$headers" | tail -1)"
            test "$s" = 'active'
            tr -d '\r' < "$out" > "$out.lf"
            test "$(grep -c '^BEGIN:VEVENT$' "$out.lf" || true)" = '112'
          }

          echo '== Paid URL baseline A =='
          fetch_paid /tmp/a.ics /tmp/a.headers
          parse_target /tmp/a.ics /tmp/ics-a.json
          expected_a="$(jq -r '.endA' /tmp/target.json | tr -d ':')00"
          test "$(jq -r '.dtend' /tmp/ics-a.json)" = "$(jq -r '.date' /tmp/target.json | tr -d '-')T$expected_a"
          echo 'PAID_URL_A_OK'

          echo '== Publish controlled B =='
          publish /tmp/b.json /tmp/publish-b.json
          jq '{status,eventCount,scheduleVersionId,previousScheduleVersionId,diff:.diff.counts}' /tmp/publish-b.json
          test "$(jq -r '.status' /tmp/publish-b.json)" = 'published'
          test "$(jq -r '.diff.counts.added' /tmp/publish-b.json)" = '0'
          test "$(jq -r '.diff.counts.changed' /tmp/publish-b.json)" = '1'
          test "$(jq -r '.diff.counts.removed' /tmp/publish-b.json)" = '0'
          test "$(jq -r '.diff.counts.unchanged' /tmp/publish-b.json)" = '111'

          echo '== Same paid URL sees B =='
          fetch_paid /tmp/b.ics /tmp/b.headers
          parse_target /tmp/b.ics /tmp/ics-b.json
          test "$(jq -r '.uid' /tmp/ics-b.json)" = "$(jq -r '.uid' /tmp/ics-a.json)"
          test "$(jq -r '.sequence' /tmp/ics-b.json)" = "$(( $(jq -r '.sequence' /tmp/ics-a.json) + 1 ))"
          expected_b="$(jq -r '.endB' /tmp/target.json | tr -d ':')00"
          test "$(jq -r '.dtend' /tmp/ics-b.json)" = "$(jq -r '.date' /tmp/target.json | tr -d '-')T$expected_b"
          echo 'PAID_URL_UPDATED_TO_B_OK'

          echo '== Roll back to A =='
          publish /tmp/a.json /tmp/publish-a.json
          jq '{status,eventCount,scheduleVersionId,previousScheduleVersionId,diff:.diff.counts}' /tmp/publish-a.json
          test "$(jq -r '.status' /tmp/publish-a.json)" = 'published'
          test "$(jq -r '.diff.counts.added' /tmp/publish-a.json)" = '0'
          test "$(jq -r '.diff.counts.changed' /tmp/publish-a.json)" = '1'
          test "$(jq -r '.diff.counts.removed' /tmp/publish-a.json)" = '0'
          test "$(jq -r '.diff.counts.unchanged' /tmp/publish-a.json)" = '111'

          echo '== Same paid URL returns to A =='
          fetch_paid /tmp/a2.ics /tmp/a2.headers
          parse_target /tmp/a2.ics /tmp/ics-a2.json
          test "$(jq -r '.uid' /tmp/ics-a2.json)" = "$(jq -r '.uid' /tmp/ics-a.json)"
          test "$(jq -r '.sequence' /tmp/ics-a2.json)" = "$(( $(jq -r '.sequence' /tmp/ics-b.json) + 1 ))"
          test "$(jq -r '.dtend' /tmp/ics-a2.json)" = "$(jq -r '.dtend' /tmp/ics-a.json)"
          test "$(grep '^UID:evt_' /tmp/a.ics.lf | sort | sha256sum | cut -d' ' -f1)" = "$(grep '^UID:evt_' /tmp/a2.ics.lf | sort | sha256sum | cut -d' ' -f1)"
          echo 'PAID_URL_ROLLBACK_TO_A_OK'

          publish /tmp/a.json /tmp/final-a.json
          test "$(jq -r '.status' /tmp/final-a.json)" = 'unchanged'
          have_a='false'
          echo 'FINAL_A_UNCHANGED_OK'

          echo '== Revoke paid test subscription =='
          revoke_status="$(curl --silent --show-error --output /tmp/revoke.json --write-out '%{http_code}' \
            -X POST -H "X-Admin-Token: $KGMU_ADMIN_TOKEN" \
            "$base/api/v1/admin/subscriptions/$cleanup_hash/revoke")"
          test "$revoke_status" = '200'
          cleanup_hash=''
          curl --fail-with-body --silent --show-error -D /tmp/revoked.headers "$paid_url" -o /tmp/revoked.ics
          revoked_status="$(awk 'BEGIN{IGNORECASE=1} /^X-Subscription-Status:/ {gsub("\r",""); print $2}' /tmp/revoked.headers | tail -1)"
          tr -d '\r' < /tmp/revoked.ics > /tmp/revoked.lf
          test "$revoked_status" = 'revoked'
          test "$(grep -c '^BEGIN:VEVENT$' /tmp/revoked.lf || true)" = '0'
          echo 'PAID_TEST_SUBSCRIPTION_REVOKED_OK'
          echo 'PAID_SUBSCRIPTION_UPDATE_E2E_SUCCESS'
