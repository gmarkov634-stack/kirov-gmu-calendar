name: Deploy KGMU GitHub Pages

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kgmu-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        github.repository == 'gmarkov634-stack/kirov-gmu-calendar' &&
        github.actor == 'gmarkov634-stack' &&
        github.event.issue.user.login == 'gmarkov634-stack' &&
        github.event.issue.author_association == 'OWNER' &&
        github.event.issue.title == '[pages-op] deploy' &&
        (github.event.issue.body == null || github.event.issue.body == '')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - run: npm run check
      - run: sh deploy/build-pages.sh dist/pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
