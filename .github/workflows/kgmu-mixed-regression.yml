name: KGMU mixed regression

on:
  pull_request:
    paths:
      - "api/src/adapters/kgmu/mixed-s-parser.mjs"
      - "api/src/adapters/kgmu/classifier.mjs"
      - "api/src/adapters/kgmu/xlsx-reader.mjs"
      - "api/tools/kgmu-verify-mixed.mjs"
      - ".github/workflows/kgmu-mixed-regression.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify official 291-294 XLSX against golden digest
        shell: bash
        run: |
          set -o pipefail
          node tools/kgmu-verify-mixed.mjs 2>&1 | tee mixed-regression-output.txt
      - name: Upload mixed regression output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kgmu-mixed-regression-output
          path: api/mixed-regression-output.txt
          if-no-files-found: ignore
