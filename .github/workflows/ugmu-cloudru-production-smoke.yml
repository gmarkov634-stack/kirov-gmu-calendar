name: UGMU Cloud.ru production smoke gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "api/src/**"
      - "api/test/**"
      - "api/tools/**"
      - ".github/workflows/deploy-api-cloudru.yml"
      - ".github/workflows/ugmu-cloudru-production-smoke.yml"
  workflow_run:
    workflows:
      - Deploy API to Cloud.ru
    types:
      - completed

permissions:
  contents: read

env:
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru
  SITE_ORIGIN: https://gmarkov634-stack.github.io

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR or manual revision
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v4

      - name: Checkout main after production deploy
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify deploy and UGMU fail-closed contracts
        working-directory: api
        run: |
          node --test \
            test/cloudru-deploy-workflow.test.js \
            test/ugmu-api-routing.test.js \
            test/ugmu-cloudru-production-smoke-workflow.test.js

      - name: Public production smoke without Cloud.ru write credentials
        shell: bash
        run: |
          set -euo pipefail
          base="$PRODUCTION_BASE_URL"

          health="$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 "$base/health")"
          meta="$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 "$base/api/v2/meta")"
          python3 - "$health" "$meta" <<'PY'
          import json, sys
          health=json.loads(sys.argv[1])
          meta=json.loads(sys.argv[2])
          assert health == {'status':'ok','service':'medical-calendar-api'}, health
          assert meta.get('sales') == 'closed', meta
          assert meta.get('trials') == 'closed', meta
          assert meta.get('paymentMode') in {'test','live'}, meta
          print('UGMU_PRODUCTION_META_SAFE', {
              'sales': meta.get('sales'),
              'trials': meta.get('trials'),
              'paymentMode': meta.get('paymentMode'),
          })
          PY

          cors_headers="$(curl --fail --silent --show-error --max-time 20 -D - -o /dev/null \
            -X OPTIONS \
            -H "Origin: $SITE_ORIGIN" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" \
            "$base/api/v2/payments" | tr -d '\r')"
          echo "$cors_headers" | grep -iq "^access-control-allow-origin: $SITE_ORIGIN$"

          kgmu_programs="$(curl --fail --silent --show-error "$base/api/v2/catalog/kgmu/programs")"
          python3 - "$kgmu_programs" <<'PY'
          import json, sys
          body=json.loads(sys.argv[1])
          assert body.get('university') == 'kgmu', body
          assert isinstance(body.get('programs'), list), body
          print('UGMU_PRODUCTION_KGMU_CONTROL_SAFE', {'programs': len(body['programs'])})
          PY

          encoded_group="$(python3 - <<'PY'
          from urllib.parse import quote
          print(quote('ugmu:medicine:1:stream-1:ОЛД 101', safe=''))
          PY
          )"
          ugmu_schedule_url="$base/api/v2/schedules/ugmu/medicine/1/$encoded_group/schedule?groupCode=%D0%9E%D0%9B%D0%94%20101&stream=1"
          ugmu_schedule_status="$(curl --silent --show-error --output /tmp/ugmu-schedule.json --write-out '%{http_code}' "$ugmu_schedule_url")"
          test "$ugmu_schedule_status" = "404"

          strict_after_deploy='false'
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            strict_after_deploy='true'
          fi
          STRICT_AFTER_DEPLOY="$strict_after_deploy" python3 - <<'PY'
          import json, os
          body=json.load(open('/tmp/ugmu-schedule.json', encoding='utf-8'))
          error=body.get('error')
          if os.environ['STRICT_AFTER_DEPLOY'] == 'true':
              assert error == 'schedule_not_published', body
          else:
              assert error in {'schedule_not_published','not_found'}, body
          print('UGMU_PRODUCTION_PUBLIC_FEED_CLOSED', {'error': error, 'strictAfterDeploy': os.environ['STRICT_AFTER_DEPLOY']})
          PY

          ugmu_checkout_status="$(curl --silent --show-error --output /tmp/ugmu-checkout.json --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"university_id":"ugmu","program":"medicine","course":1,"stream":"1","groupCode":"ОЛД 101","groupId":"ugmu:medicine:1:stream-1:ОЛД 101","email":"production-smoke@example.com","plan":"semester"}' \
            "$base/api/v2/payments")"
          test "$ugmu_checkout_status" = "409"
          python3 - <<'PY'
          import json
          body=json.load(open('/tmp/ugmu-checkout.json', encoding='utf-8'))
          assert body == {'error':'sales_not_open'}, body
          print('UGMU_PRODUCTION_CHECKOUT_CLOSED')
          PY

          python3 - <<PY
          import json, os
          report = {
            'version': 1,
            'status': 'PASS',
            'productionBaseUrl': os.environ['PRODUCTION_BASE_URL'],
            'eventName': os.environ['GITHUB_EVENT_NAME'],
            'strictAfterDeploy': os.environ['GITHUB_EVENT_NAME'] == 'workflow_run',
            'checks': {
              'health': True,
              'metaFailClosed': True,
              'cors': True,
              'kgmuControl': True,
              'ugmuPublicScheduleClosed': True,
              'ugmuCheckoutClosed': True,
              'noCloudRuWriteCredentialsUsed': True,
            },
            'productionMutationPerformed': False,
            'nextRequiredBoundary': 'final-launch-readiness-gate',
          }
          os.makedirs('api/data/imports/ugmu-production-smoke', exist_ok=True)
          json.dump(report, open('api/data/imports/ugmu-production-smoke/report.json','w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Upload production smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-cloudru-production-smoke
          path: api/data/imports/ugmu-production-smoke/report.json
          if-no-files-found: error
          retention-days: 30
