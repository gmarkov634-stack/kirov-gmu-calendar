name: UGMU Cloud.ru post-launch production smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "api/src/**"
      - "api/test/**"
      - "api/tools/**"
      - "site/ugmu/**"
      - "universities/ugmu/**"
      - ".github/workflows/deploy-api-cloudru.yml"
      - ".github/workflows/ugmu-cloudru-production-smoke.yml"
  workflow_run:
    workflows:
      - Deploy API to Cloud.ru
    types:
      - completed

permissions:
  contents: read

env:
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru
  SITE_ORIGIN: https://gmarkov634-stack.github.io
  UGMU_SITE_URL: https://gmarkov634-stack.github.io/kirov-gmu-calendar/ugmu/

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR or manual revision
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v4

      - name: Checkout main after production deploy
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify read-only post-launch smoke contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/ugmu-cloudru-production-smoke.yml').read_text(encoding='utf-8')
          forbidden = [
              '--request ' + 'PATCH',
              '--request ' + 'POST',
              '-X ' + 'POST',
              'containers.api.cloud.ru/' + 'v2/',
              'EVO_' + 'CR_LOGIN',
              'EVO_' + 'CR_PWD',
              'YOOKASSA_' + 'SECRET_KEY',
              'https://api.yookassa.ru/v3/' + 'payments',
              'aws ' + 's3',
          ]
          for marker in forbidden:
              assert marker not in text, marker
          print('UGMU_POST_LAUNCH_SMOKE_READ_ONLY')
          PY

      - name: Public post-launch production smoke
        shell: bash
        run: |
          set -euo pipefail
          base="$PRODUCTION_BASE_URL"

          health="$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 "$base/health")"
          meta="$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 "$base/api/v2/meta")"
          python3 - "$health" "$meta" <<'PY'
          import json, sys
          health=json.loads(sys.argv[1])
          meta=json.loads(sys.argv[2])
          assert health == {'status':'ok','service':'medical-calendar-api'}, health
          assert meta.get('sales') == 'open', meta
          assert meta.get('trials') == 'closed', meta
          assert meta.get('paymentMode') == 'live', meta
          print('UGMU_POST_LAUNCH_META_SAFE', {
              'sales': meta.get('sales'),
              'trials': meta.get('trials'),
              'paymentMode': meta.get('paymentMode'),
          })
          PY

          cors_headers="$(curl --fail --silent --show-error --max-time 20 -D - -o /dev/null \
            -X OPTIONS \
            -H "Origin: $SITE_ORIGIN" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" \
            "$base/api/v2/payments" | tr -d '\r')"
          echo "$cors_headers" | grep -iq "^access-control-allow-origin: $SITE_ORIGIN$"

          kgmu_programs="$(curl --fail --silent --show-error "$base/api/v2/catalog/kgmu/programs")"
          python3 - "$kgmu_programs" <<'PY'
          import json, sys
          body=json.loads(sys.argv[1])
          assert body.get('university') == 'kgmu', body
          assert isinstance(body.get('programs'), list), body
          print('UGMU_POST_LAUNCH_KGMU_CONTROL_SAFE', {'programs': len(body['programs'])})
          PY

          encoded_group="$(python3 - <<'PY'
          from urllib.parse import quote
          print(quote('ugmu:medicine:1:stream-1:ОЛД 101', safe=''))
          PY
          )"
          ugmu_schedule_url="$base/api/v2/schedules/ugmu/medicine/1/$encoded_group/schedule?groupCode=%D0%9E%D0%9B%D0%94%20101&stream=1"
          ugmu_schedule_status="$(curl --silent --show-error --output /tmp/ugmu-schedule.json --write-out '%{http_code}' "$ugmu_schedule_url")"
          test "$ugmu_schedule_status" = "404"
          python3 - <<'PY'
          import json
          body=json.load(open('/tmp/ugmu-schedule.json', encoding='utf-8'))
          assert body.get('error') == 'schedule_not_published', body
          print('UGMU_POST_LAUNCH_PUBLIC_SCHEDULE_CLOSED')
          PY

          ugmu_ics_status="$(curl --silent --show-error --output /tmp/ugmu-ics.txt --write-out '%{http_code}' \
            "$base/api/v2/schedules/ugmu/medicine/1/$encoded_group/calendar.ics?groupCode=%D0%9E%D0%9B%D0%94%20101&stream=1")"
          test "$ugmu_ics_status" = "404"

          landing_status="$(curl --silent --show-error --location --output /tmp/ugmu-landing.html --write-out '%{http_code}' "$UGMU_SITE_URL")"
          test "$landing_status" = "200"
          grep -q 'Календарь доступен' /tmp/ugmu-landing.html

          python3 - <<'PY'
          import json, os
          report = {
            'version': 2,
            'status': 'PASS',
            'mode': 'post-launch-production-read-only',
            'productionBaseUrl': os.environ['PRODUCTION_BASE_URL'],
            'ugmuSiteUrl': os.environ['UGMU_SITE_URL'],
            'eventName': os.environ['GITHUB_EVENT_NAME'],
            'checks': {
              'health': True,
              'metaSalesOpen': True,
              'metaTrialsClosed': True,
              'metaPaymentModeLive': True,
              'cors': True,
              'kgmuControl': True,
              'ugmuPublicScheduleClosed': True,
              'ugmuPublicIcsClosed': True,
              'ugmuLandingAvailable': True,
              'readOnly': True,
            },
            'productionMutationPerformed': False,
            'paymentCreated': False,
            'nextRequiredBoundary': 'ongoing-post-launch-monitoring',
          }
          os.makedirs('api/data/imports/ugmu-production-smoke', exist_ok=True)
          json.dump(report, open('api/data/imports/ugmu-production-smoke/report.json','w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Upload production smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-cloudru-post-launch-production-smoke
          path: api/data/imports/ugmu-production-smoke/report.json
          if-no-files-found: error
          retention-days: 30
