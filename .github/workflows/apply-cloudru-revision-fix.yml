name: Apply Cloud.ru deploy revision fix

on:
  pull_request:
    paths:
      - "ops/patches/apply-cloudru-revision-fix.mjs"
      - ".github/workflows/apply-cloudru-revision-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply deploy revision-state fix
        run: |
          set -euo pipefail
          node ops/patches/apply-cloudru-revision-fix.mjs
          git diff --check
          if ! git diff --quiet -- .github/workflows/deploy-api-cloudru.yml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/workflows/deploy-api-cloudru.yml
            git commit -m "fix(deploy): tolerate missing active revision marker"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
