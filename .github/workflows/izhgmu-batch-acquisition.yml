name: IzhGMU batch acquisition

on:
  push:
    branches:
      - agent/izhgmu-batch-acquisition
    paths:
      - "api/src/adapters/izhgmu/**"
      - "api/src/universities/registry.mjs"
      - "api/tools/izhgmu-collect.mjs"
      - "api/tools/izhgmu-collect-postsemester.mjs"
      - "api/tools/izhgmu-check-postsemester-reviewed.mjs"
      - "api/tools/izhgmu-check-postsemester-canonical.mjs"
      - "api/tools/izhgmu-check-medicine6-composite.mjs"
      - "api/tools/izhgmu-fingerprint.py"
      - "api/tools/izhgmu-parse-weekly.mjs"
      - "api/tools/izhgmu-parse-weekly-lecture.mjs"
      - "api/tools/izhgmu-diagnose-lecture.mjs"
      - "api/tools/izhgmu-diagnose-cycle.mjs"
      - "api/tools/izhgmu-parse-cycle.mjs"
      - "api/tools/izhgmu-parse-cycle-medicine4.mjs"
      - "api/tools/izhgmu-parse-lecture-medicine4.mjs"
      - "api/tools/izhgmu-audit-medicine4-mapping.mjs"
      - "api/tools/izhgmu-parse-cycle-medicine5.mjs"
      - "api/tools/izhgmu-parse-cycle-medicine6.mjs"
      - "api/tools/izhgmu-parse-lecture-medicine5.mjs"
      - "api/tools/izhgmu-parse-lecture-medicine6.mjs"
      - "api/tools/izhgmu-check-cycle-medicine5-provenance.mjs"
      - "api/test/izhgmu-*.test.mjs"
      - "api/package.json"
      - ".github/workflows/izhgmu-batch-acquisition.yml"
  workflow_dispatch:

permissions:
  contents: read

# Medicine 1-3 full readiness is enforced independently by
# izhgmu-medicine1-3-readiness.yml. This workflow keeps acquisition and the
# current early-course source smoke blocking, while medicine 4-6 remain
# fail-closed in parser code but diagnostic-only until that scope is resumed.

jobs:
  collect:
    name: Acquire sources and run blocking early-course smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        working-directory: api
        run: npm ci
      - name: Run full API regression and fingerprint self-test
        working-directory: api
        run: |
          npm test
          python3 tools/izhgmu-fingerprint.py --self-test
      - name: Collect current official schedule files
        working-directory: api
        run: npm run collect:izhgmu -- --output /tmp/izhgmu-current --concurrency 4
      - name: Fingerprint current source set
        working-directory: api
        run: npm run fingerprint:izhgmu -- --input-dir /tmp/izhgmu-current
      - name: Parse real IZH-WEEKLY source pair through canonical QA boundary
        working-directory: api
        run: npm run parse:izhgmu:weekly -- --input-dir /tmp/izhgmu-current --faculty medicine --course 1 --stream 1 --group 109 --language ru --term spring
      - name: Diagnose real IZH-LECTURE companion before assertions
        working-directory: api
        run: node tools/izhgmu-diagnose-lecture.mjs --input-dir /tmp/izhgmu-current --group 109
      - name: Parse real IZH-WEEKLY plus exact-date lecture companion
        working-directory: api
        run: npm run parse:izhgmu:weekly-lecture -- --input-dir /tmp/izhgmu-current --faculty medicine --course 1 --stream 1 --group 109 --language ru --term spring
      - name: Show acquisition summary
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/izhgmu-current/source-manifest.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/izhgmu-current')
          manifest=json.loads((root/'source-manifest.json').read_text())
          print('SOURCE_COUNT', manifest['sourceCount'])
          print('VALIDATION', manifest['validation']['status'])
          print('WARNINGS', len(manifest['validation']['warnings']))
          report_path=root/'download-report.json'
          if report_path.exists():
              report=json.loads(report_path.read_text())
              print('DOWNLOADED', report['downloadedCount'])
              print('FAILED', report['failedCount'])
          fingerprint_path=root/'fingerprint-report.json'
          if fingerprint_path.exists():
              fp=json.loads(fingerprint_path.read_text())
              print('FINGERPRINT_PROFILES', fp['profileCounts'])
              print('XLSX_FINGERPRINT_STATUS', fp['xlsxFingerprintStatus'])
              print('LEGACY_XLS', fp['legacyXlsCount'])
              print('OVERALL_STATUS', fp['overallStatus'])
          diag_path=root/'lecture-diagnostic.json'
          if diag_path.exists():
              diag=json.loads(diag_path.read_text())
              print('LECTURE_STATS', diag['lecture']['stats'])
              print('COMBINED_BLOCKERS', diag['combined']['blockers'])
          PY
          fi
      - name: Upload current IzhGMU source set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izhgmu-current-sources
          path: /tmp/izhgmu-current
          if-no-files-found: error
          retention-days: 7

  senior_diagnostics:
    name: Deferred medicine 4-6 diagnostics
    needs: collect
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        working-directory: api
        run: npm ci
      - name: Download exact ordinary IzhGMU artifact
        uses: actions/download-artifact@v4
        with:
          name: izhgmu-current-sources
          path: /tmp/izhgmu-current
      - name: Parse real IZH-CYCLE geometry fail-closed
        id: generic_cycle
        continue-on-error: true
        working-directory: api
        run: npm run parse:izhgmu:cycle -- --input-dir /tmp/izhgmu-current --faculty pediatrics --course 3
      - name: Parse real IZH-CYCLE medicine 4 through canonical QA
        id: medicine4_class
        continue-on-error: true
        working-directory: api
        run: npm run parse:izhgmu:cycle:medicine4 -- --input-dir /tmp/izhgmu-current --group 401
      - name: Verify medicine 4 lecture streams without heuristic group attribution
        id: medicine4_lecture
        continue-on-error: true
        working-directory: api
        run: node tools/izhgmu-parse-lecture-medicine4.mjs --input-dir /tmp/izhgmu-current
      - name: Audit medicine 4 stream-group mapping fail-closed boundary
        id: medicine4_mapping
        continue-on-error: true
        working-directory: api
        run: node tools/izhgmu-audit-medicine4-mapping.mjs --input-dir /tmp/izhgmu-current
      - name: Diagnose real IZH-CYCLE medicine 5 without publication
        id: medicine5_diagnose
        continue-on-error: true
        working-directory: api
        run: node tools/izhgmu-diagnose-cycle.mjs --input-dir /tmp/izhgmu-current --faculty medicine --course 5 --output cycle-diagnostic-medicine-5.json
      - name: Parse real IZH-CYCLE medicine 5 fail-closed through canonical QA
        id: medicine5_class
        continue-on-error: true
        working-directory: api
        run: npm run parse:izhgmu:cycle:medicine5 -- --input-dir /tmp/izhgmu-current --group 501
      - name: Verify medicine 5 lecture-backed glossary provenance scope
        id: medicine5_provenance
        continue-on-error: true
        working-directory: api
        run: node tools/izhgmu-check-cycle-medicine5-provenance.mjs --input-dir /tmp/izhgmu-current
      - name: Parse medicine 5 lecture streams without heuristic group attribution
        id: medicine5_lecture
        continue-on-error: true
        working-directory: api
        run: npm run parse:izhgmu:lecture:medicine5 -- --input-dir /tmp/izhgmu-current
      - name: Diagnose real IZH-CYCLE medicine 6 without publication
        id: medicine6_diagnose
        continue-on-error: true
        working-directory: api
        run: node tools/izhgmu-diagnose-cycle.mjs --input-dir /tmp/izhgmu-current --faculty medicine --course 6 --output cycle-diagnostic-medicine-6.json
      - name: Parse real IZH-CYCLE medicine 6 fail-closed through canonical QA
        id: medicine6_class
        continue-on-error: true
        working-directory: api
        run: npm run parse:izhgmu:cycle:medicine6 -- --input-dir /tmp/izhgmu-current --group 601
      - name: Parse medicine 6 lecture companion with course stream and choice boundaries
        id: medicine6_lecture
        continue-on-error: true
        working-directory: api
        run: npm run parse:izhgmu:lecture:medicine6 -- --input-dir /tmp/izhgmu-current
      - name: Show deferred senior diagnostic summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Deferred IzhGMU diagnostics — not a medicine 1-3 readiness gate'
            echo
            echo '| Check | Outcome |'
            echo '|---|---|'
            echo '| Generic cycle | ${{ steps.generic_cycle.outcome }} |'
            echo '| Medicine 4 class | ${{ steps.medicine4_class.outcome }} |'
            echo '| Medicine 4 lecture | ${{ steps.medicine4_lecture.outcome }} |'
            echo '| Medicine 4 mapping | ${{ steps.medicine4_mapping.outcome }} |'
            echo '| Medicine 5 diagnose | ${{ steps.medicine5_diagnose.outcome }} |'
            echo '| Medicine 5 class | ${{ steps.medicine5_class.outcome }} |'
            echo '| Medicine 5 provenance | ${{ steps.medicine5_provenance.outcome }} |'
            echo '| Medicine 5 lecture | ${{ steps.medicine5_lecture.outcome }} |'
            echo '| Medicine 6 diagnose | ${{ steps.medicine6_diagnose.outcome }} |'
            echo '| Medicine 6 class | ${{ steps.medicine6_class.outcome }} |'
            echo '| Medicine 6 lecture | ${{ steps.medicine6_lecture.outcome }} |'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/izhgmu-current')
          medicine4_path=root/'medicine4-mapping-audit.json'
          if medicine4_path.exists():
              m4=json.loads(medicine4_path.read_text())
              print('MEDICINE4_GROUPS', m4['groups'])
              print('MEDICINE4_MAPPING', m4['mapping'])
              print('MEDICINE4_QA', m4['representativeQa'])
          cycle_diag_path=root/'cycle-diagnostic-medicine-5.json'
          if cycle_diag_path.exists():
              diag=json.loads(cycle_diag_path.read_text())
              print('CYCLE_MEDICINE5_STATS', diag['parser']['stats'])
              print('CYCLE_MEDICINE5_GROUPS', diag['groupSpans'])
              print('CYCLE_MEDICINE5_REVIEW', len(diag['review']))
          lecture5_path=root/'medicine5-lecture-diagnostic.json'
          if lecture5_path.exists():
              diag=json.loads(lecture5_path.read_text())
              print('LECTURE_MEDICINE5', diag)
          cycle6_path=root/'cycle-diagnostic-medicine-6.json'
          if cycle6_path.exists():
              diag=json.loads(cycle6_path.read_text())
              print('CYCLE_MEDICINE6_STATS', diag['parser']['stats'])
              print('CYCLE_MEDICINE6_GROUPS', diag['groupSpans'])
              print('CYCLE_MEDICINE6_REVIEW', len(diag['review']))
          lecture6_path=root/'medicine6-lecture-diagnostic.json'
          if lecture6_path.exists():
              diag=json.loads(lecture6_path.read_text())
              print('LECTURE_MEDICINE6_STATS', diag['stats'])
              print('LECTURE_MEDICINE6_MARKERS', diag['periodMarkers'])
              print('LECTURE_MEDICINE6_BLOCKERS', diag['blockers'])
          PY

  postsemester:
    name: Deferred medicine 6 post-semester diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        working-directory: api
        run: npm ci
      - name: Collect exact medicine 6 post-semester schedule PDFs on isolated runner
        working-directory: api
        run: npm run collect:izhgmu:postsemester -- --input-dir /tmp/izhgmu-postsemester
      - name: Verify visually reviewed extraction against exact PDF SHA
        working-directory: api
        run: node tools/izhgmu-check-postsemester-reviewed.mjs --input-dir /tmp/izhgmu-postsemester
      - name: Verify safe canonical projection without invented GIA end time
        working-directory: api
        run: node tools/izhgmu-check-postsemester-canonical.mjs --input-dir /tmp/izhgmu-postsemester
      - name: Show isolated post-semester acquisition summary
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/izhgmu-postsemester/postsemester-report.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/izhgmu-postsemester')
          post=json.loads((root/'postsemester-report.json').read_text())
          print('POSTSEMESTER_STATUS', post['status'])
          print('POSTSEMESTER_DOWNLOADED', post['downloadedCount'])
          print('POSTSEMESTER_FAILED', post['failedCount'])
          print('POSTSEMESTER_STREAM_POLICY', post['streamMappingPolicy']['scope'], post['streamMappingPolicy']['communicationSkillsStatus'])
          print('POSTSEMESTER_FILES', [{k:v for k,v in f.items() if k in ('kind','status','bytes','sha256','outputFile','error')} for f in post['files']])
          PY
          fi
      - name: Upload isolated post-semester source set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izhgmu-postsemester-sources
          path: /tmp/izhgmu-postsemester
          if-no-files-found: error
          retention-days: 7

  composite:
    name: Deferred medicine 6 composite diagnostics
    needs: [collect, postsemester]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        working-directory: api
        run: npm ci
      - name: Download exact ordinary IzhGMU artifact
        uses: actions/download-artifact@v4
        with:
          name: izhgmu-current-sources
          path: /tmp/izhgmu-current
      - name: Download exact post-semester IzhGMU artifact
        uses: actions/download-artifact@v4
        with:
          name: izhgmu-postsemester-sources
          path: /tmp/izhgmu-postsemester
      - name: Build and verify medicine 6 composite candidate from reviewed artifacts
        working-directory: api
        run: node tools/izhgmu-check-medicine6-composite.mjs --current-dir /tmp/izhgmu-current --postsemester-dir /tmp/izhgmu-postsemester
