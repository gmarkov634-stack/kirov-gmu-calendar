name: KGMU production smoke

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/kgmu-production-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check production API
        env:
          KGMU_ADMIN_TOKEN: ${{ secrets.KGMU_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://kgmu-calendar-api.containerapps.ru"

          health="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$base/health")"
          python3 - "$health" <<'PY'
          import json, sys
          body = json.loads(sys.argv[1])
          assert body == {"status": "ok", "service": "medical-calendar-api"}, body
          PY

          meta="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$base/api/v2/meta")"
          python3 - "$meta" <<'PY'
          import json, sys
          body = json.loads(sys.argv[1])
          assert body.get("sales") == "closed", body
          assert body.get("trials") == "closed", body
          assert body.get("paymentMode") in {"test", "live"}, body
          print("PRODUCTION_META_SAFE", json.dumps({
              "sales": body.get("sales"),
              "trials": body.get("trials"),
              "paymentMode": body.get("paymentMode"),
          }, ensure_ascii=False))
          PY

          programs="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$base/api/v2/catalog/kgmu/programs")"
          python3 - "$programs" <<'PY'
          import json, sys
          body = json.loads(sys.argv[1])
          assert body.get("university") == "kgmu", body
          assert body.get("academicYear") == "2026/27", body
          assert body.get("semester") == 1, body
          assert isinstance(body.get("programs"), list), body
          print(json.dumps(body, ensure_ascii=False))
          PY

          groups="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$base/api/v2/catalog/kgmu/medicine/1/groups")"
          python3 - "$groups" <<'PY'
          import json, sys
          body = json.loads(sys.argv[1])
          assert body.get("university") == "kgmu", body
          assert body.get("program") == "medicine", body
          assert body.get("course") == 1, body
          assert body.get("academicYear") == "2026/27", body
          assert body.get("semester") == 1, body
          assert isinstance(body.get("groups"), list), body
          print(json.dumps(body, ensure_ascii=False))
          PY

          admin_status="$(curl --silent --show-error --output /tmp/admin.json --write-out '%{http_code}' --request POST "$base/api/v1/admin/kgmu/watch")"
          test "$admin_status" = "403"
          python3 - <<'PY'
          import json
          with open('/tmp/admin.json', encoding='utf-8') as fh:
              body = json.load(fh)
          assert body == {"error": "admin_forbidden"}, body
          PY

          control_status="$(curl --silent --show-error --output /tmp/schedule-control.json --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "$base/api/v1/schedule-review/control")"
          test "$control_status" = "401"
          python3 - <<'PY'
          import json
          with open('/tmp/schedule-control.json', encoding='utf-8') as fh:
              body = json.load(fh)
          assert body == {"error": "unauthorized"}, body
          PY

          test -n "$KGMU_ADMIN_TOKEN"
          reviews="$(curl --fail-with-body --silent --show-error \
            --header "X-Admin-Token: $KGMU_ADMIN_TOKEN" \
            "$base/api/v1/admin/parser-reviews?limit=20")"
          python3 - "$reviews" <<'PY'
          import json, sys
          body = json.loads(sys.argv[1])
          reviews = body.get("reviews")
          assert isinstance(reviews, list), body
          safe = []
          for item in reviews:
              meta = item.get("metadata") or {}
              safe.append({
                  "reviewId": item.get("reviewId"),
                  "status": item.get("status"),
                  "reason": item.get("reason"),
                  "parserType": item.get("parserType"),
                  "sourceSha256": item.get("sourceSha256"),
                  "filename": meta.get("filename"),
                  "program": meta.get("program"),
                  "course": meta.get("course"),
                  "academicYear": meta.get("academicYear"),
                  "semester": meta.get("semester"),
                  "groupRange": meta.get("groupRange"),
              })
          print("PARSER_REVIEWS_SAFE_BEGIN")
          print(json.dumps(safe, ensure_ascii=False, indent=2))
          print("PARSER_REVIEWS_SAFE_END")
          PY