name: UGMU YooKassa test payment cleanup v3

on:
  push:
    branches: [agent/ugmu-scaffold-20260820]
    paths: ["universities/ugmu/yookassa-test-payment-cleanup-v3.json"]

permissions:
  contents: read

env:
  CONTAINER_NAME: kgmu-calendar-api
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru
  TEST_SHOP_ID: "1259975"
  TEST_SECRET: yookassa-test-secret-key
  OPENED_AFTER: "2026-08-21T08:27:00Z"
  EXPECTED_TEST_PAYMENTS: "2"
  S3_BUCKET: kgmu-calendar-data-gmarkov634
  S3_ENDPOINT: https://s3.cloud.ru
  S3_REGION: ru-central-1

jobs:
  verify-and-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
      CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify one-shot authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          p='universities/ugmu/yookassa-test-payment-cleanup-v3.json'
          a=json.load(open(p,encoding='utf-8'))
          assert a['version']==3
          assert a['kind']=='ugmu-yookassa-test-payment-cleanup'
          assert a['boundary']=='temporary-yookassa-test-window'
          assert a['authorizedBranch']=='agent/ugmu-scaffold-20260820'
          assert a['testShopId']=='1259975'
          assert a['expectedSucceededTestPayments']==2
          assert a['userAuthorization']=='Оплатил'
          assert a['revokeAllCorrelatedTestSubscriptions'] is True
          assert a['restoreLiveInThisRun'] is False
          prepared=a['preparedWorkflowHead'];assert len(prepared)==40
          changed=subprocess.check_output(['git','diff','--name-only',prepared,'HEAD'],text=True).splitlines()
          assert changed==[p],changed
          print('UGMU_TEST_PAYMENT_CLEANUP_V3_AUTHORITY_SAFE',{'expectedPayments':2})
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API dependencies
        working-directory: api
        run: npm ci
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Verify current test mode and get Cloud token
        id: cloud
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          auth_payload="$(python3 - <<'PY'
          import json,os
          print(json.dumps({'keyId':os.environ['CLOUDRU_KEY_ID'],'secret':os.environ['CLOUDRU_KEY_SECRET']}))
          PY
          )"
          test "$(curl -sS -o /tmp/cloud-token.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data "$auth_payload" https://iam.api.cloud.ru/api/v1/auth/token)" = 200
          readarray -t auth < <(python3 - <<'PY'
          import base64,json
          t=json.load(open('/tmp/cloud-token.json'))['access_token']
          p=t.split('.')[1];p+='='*((4-len(p)%4)%4);c=json.loads(base64.urlsafe_b64decode(p.encode()))
          print(t);print(c['project_id'])
          PY
          )
          token="${auth[0]}";project="${auth[1]}";rm -f /tmp/cloud-token.json
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "project=$project" >> "$GITHUB_OUTPUT"
          test "$(curl -sS -o /tmp/container.json -w '%{http_code}' -H "Authorization: Bearer $token" "https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$project")" = 200
          TEST_SHOP_ID="$TEST_SHOP_ID" TEST_SECRET="$TEST_SECRET" python3 - <<'PY'
          import json,os
          a=json.load(open('/tmp/container.json'));assert a.get('status')=='running'
          e={x.get('name'):x for x in a['template']['containers'][0].get('env',[]) if isinstance(x,dict)}
          assert e.get('COMMERCIAL_SALES_ENABLED',{}).get('value')!='true'
          assert e.get('UGMU_SALES_ENABLED',{}).get('value')=='true'
          assert e.get('UGMU_ACTIVE',{}).get('value')=='true'
          assert e.get('TRIALS_ENABLED',{}).get('value')!='true'
          assert e.get('YOOKASSA_TEST_MODE',{}).get('value')=='true'
          assert e.get('YOOKASSA_SHOP_ID',{}).get('value')==os.environ['TEST_SHOP_ID']
          sec=e.get('YOOKASSA_SECRET_KEY',{});assert sec.get('type')=='secret' and sec.get('value')==os.environ['TEST_SECRET']
          adm=e.get('ADMIN_TOKEN',{});assert adm.get('value')
          open('/tmp/admin-type','w').write(str(adm.get('type') or 'plain'))
          open('/tmp/admin-ref','w').write(str(adm.get('value')))
          print('UGMU_TEST_PAYMENT_V3_RUNTIME_SAFE',{'paymentMode':'test','globalSales':False,'ugmuSales':True,'trials':False})
          PY
          meta="$(curl -fsS "$PRODUCTION_BASE_URL/api/v2/meta")"
          python3 - "$meta" <<'PY'
          import json,sys
          m=json.loads(sys.argv[1]);assert m.get('sales')=='open' and m.get('trials')=='closed' and m.get('paymentMode')=='test'
          PY

      - name: Resolve exactly two provider payments
        env:
          TOKEN: ${{ steps.cloud.outputs.token }}
          PROJECT: ${{ steps.cloud.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/provider && cd /tmp/provider
          cat > go.mod <<'EOF'
          module ugmutestcleanupv3
          go 1.23.0
          require github.com/cloudru-tech/secret-manager-sdk v1.1.1
          require google.golang.org/grpc v1.70.0
          EOF
          cat > main.go <<'EOF'
          package main
          import("context";"encoding/json";"fmt";"io";"net/http";"os";"sort";"strconv";"strings";"time";sm "github.com/cloudru-tech/secret-manager-sdk";v2 "github.com/cloudru-tech/secret-manager-sdk/api/v2";"google.golang.org/grpc/metadata")
          func must(n string)string{v:=os.Getenv(n);if v==""{panic("missing "+n)};return v}
          type P struct{Id string `json:"id"`;Status string `json:"status"`;Paid bool `json:"paid"`;Test bool `json:"test"`;Created string `json:"created_at"`;Amount struct{Value string `json:"value"`;Currency string `json:"currency"`} `json:"amount"`;Metadata map[string]string `json:"metadata"`}
          func main(){cl,e:=sm.New(&sm.Config{Host:"secretmanager.api.cloud.ru:443"});if e!=nil{panic(e)};defer cl.Close();ctx,c:=context.WithTimeout(context.Background(),30*time.Second);defer c();ctx=metadata.AppendToOutgoingContext(ctx,"authorization","Bearer "+must("TOKEN"));sr,e:=cl.V2.SecretService.Search(ctx,&v2.SearchSecretRequest{ProjectId:must("PROJECT"),Depth:-1});if e!=nil{panic(e)};target:=must("SECRET");paths:=[]string{};for _,s:=range sr.GetSecrets(){p:=s.GetPath();if p==target||strings.HasSuffix(p,"/"+target){paths=append(paths,p)}};if len(paths)!=1{panic("secret match count")};sec,e:=cl.V2.SecretService.Access(ctx,&v2.AccessSecretRequest{ProjectId:must("PROJECT"),Path:paths[0]});if e!=nil{panic(e)};req,_:=http.NewRequest(http.MethodGet,"https://api.yookassa.ru/v3/payments?limit=20",nil);req.SetBasicAuth(must("SHOP"),string(sec.GetPayload().GetValue()));r,e:=(&http.Client{Timeout:20*time.Second}).Do(req);if e!=nil{panic(e)};defer r.Body.Close();b,_:=io.ReadAll(io.LimitReader(r.Body,2<<20));if r.StatusCode!=200{panic(fmt.Sprintf("provider http %d",r.StatusCode))};var body struct{Items []P `json:"items"`};if e=json.Unmarshal(b,&body);e!=nil{panic(e)};cut,e:=time.Parse(time.RFC3339,must("AFTER"));if e!=nil{panic(e)};cand:=[]P{};for _,p:=range body.Items{t,e:=time.Parse(time.RFC3339Nano,p.Created);if e==nil&&t.After(cut)&&p.Test&&p.Paid&&p.Status=="succeeded"&&p.Metadata["university"]=="ugmu"&&p.Metadata["order_id"]!=""{cand=append(cand,p)}};sort.Slice(cand,func(i,j int)bool{return cand[i].Created<cand[j].Created});expected,_:=strconv.Atoi(must("EXPECTED"));if len(cand)!=expected{fmt.Printf("UGMU_TEST_PAYMENT_V3_CANDIDATES_SAFE count=%d expected=%d\n",len(cand),expected);os.Exit(4)};seen:=map[string]bool{};out:=[]map[string]any{};for _,p:=range cand{oid:=p.Metadata["order_id"];if seen[oid]{panic("duplicate order")};seen[oid]=true;out=append(out,map[string]any{"paymentId":p.Id,"orderId":oid,"amount":p.Amount.Value,"currency":p.Amount.Currency})};raw,_:=json.Marshal(out);if e=os.WriteFile("/tmp/payments.json",raw,0600);e!=nil{panic(e)};fmt.Printf("UGMU_TEST_PAYMENT_V3_PROVIDER_SAFE count=%d allSucceeded=true allPaid=true allTest=true\n",len(cand))}
          EOF
          go mod tidy
          TOKEN="$TOKEN" PROJECT="$PROJECT" SECRET="$TEST_SECRET" SHOP="$TEST_SHOP_ID" AFTER="$OPENED_AFTER" EXPECTED="$EXPECTED_TEST_PAYMENTS" go run .
          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/provider

      - name: Correlate orders, subscriptions and tokenized ICS
        working-directory: api
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {S3Client,GetObjectCommand} from '@aws-sdk/client-s3';
          const ps=JSON.parse(fs.readFileSync('/tmp/payments.json','utf8'));if(ps.length!==2)throw new Error('expected two payments');
          const s3=new S3Client({endpoint:process.env.S3_ENDPOINT,region:process.env.S3_REGION,forcePathStyle:true,credentials:{accessKeyId:process.env.S3_ACCESS_KEY_ID,secretAccessKey:process.env.S3_SECRET_ACCESS_KEY}});
          async function get(k){const r=await s3.send(new GetObjectCommand({Bucket:process.env.S3_BUCKET,Key:k}));return JSON.parse(await r.Body.transformToString('utf8'));}
          const clean=[];let totalEvents=0;
          for(const p of ps){const o=await get(`orders/${p.orderId}.json`);if(o.status!=='succeeded'||o.testMode!==true||o.paymentId!==p.paymentId||o.university!=='ugmu'||!o.subscriptionUrl)throw new Error('order mismatch');const m=String(o.subscriptionUrl).match(/\/api\/v1\/subscriptions\/([A-Za-z0-9_-]{43})\/calendar\.ics$/);if(!m)throw new Error('bad subscription url');const token=m[1],hash=createHash('sha256').update(token).digest('hex');const sub=await get(`subscriptions/${hash}.json`);if(sub.status!=='active'||sub.entitlement!=='paid'||sub.orderId!==p.orderId||sub.paymentId!==p.paymentId||sub.university!=='ugmu')throw new Error('subscription mismatch');const r=await fetch(o.subscriptionUrl,{headers:{'User-Agent':'UGMU-test-cleanup-v3/1'}});const ics=await r.text();const events=(ics.match(/BEGIN:VEVENT/g)||[]).length;if(r.status!==200||events<300)throw new Error('feed invalid');totalEvents+=events;clean.push({hash,url:o.subscriptionUrl,groupCode:o.groupCode,plan:o.plan,eventCount:events});}
          fs.writeFileSync('/tmp/cleanup-targets.json',JSON.stringify(clean),{mode:0o600});console.log('UGMU_TEST_PAYMENT_V3_E2E_SAFE',JSON.stringify({payments:2,ordersSucceeded:2,activeSubscriptions:2,feeds200:2,totalEvents}));
          NODE

      - name: Resolve admin token and revoke both test subscriptions
        env:
          TOKEN: ${{ steps.cloud.outputs.token }}
          PROJECT: ${{ steps.cloud.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          typ="$(cat /tmp/admin-type)";ref="$(cat /tmp/admin-ref)"
          if [ "$typ" = secret ]; then
            mkdir -p /tmp/adminresolve && cd /tmp/adminresolve
            cat > go.mod <<'EOF'
          module ugmuadminresolvev3
          go 1.23.0
          require github.com/cloudru-tech/secret-manager-sdk v1.1.1
          require google.golang.org/grpc v1.70.0
          EOF
            cat > main.go <<'EOF'
          package main
          import("context";"os";"strings";"time";sm "github.com/cloudru-tech/secret-manager-sdk";v2 "github.com/cloudru-tech/secret-manager-sdk/api/v2";"google.golang.org/grpc/metadata")
          func m(n string)string{v:=os.Getenv(n);if v==""{panic(n)};return v}
          func main(){cl,e:=sm.New(&sm.Config{Host:"secretmanager.api.cloud.ru:443"});if e!=nil{panic(e)};defer cl.Close();ctx,c:=context.WithTimeout(context.Background(),30*time.Second);defer c();ctx=metadata.AppendToOutgoingContext(ctx,"authorization","Bearer "+m("TOKEN"));sr,e:=cl.V2.SecretService.Search(ctx,&v2.SearchSecretRequest{ProjectId:m("PROJECT"),Depth:-1});if e!=nil{panic(e)};target:=m("REF");paths:=[]string{};for _,s:=range sr.GetSecrets(){p:=s.GetPath();if p==target||strings.HasSuffix(p,"/"+target){paths=append(paths,p)}};if len(paths)!=1{panic("admin secret match count")};sec,e:=cl.V2.SecretService.Access(ctx,&v2.AccessSecretRequest{ProjectId:m("PROJECT"),Path:paths[0]});if e!=nil{panic(e)};if e=os.WriteFile("/tmp/admin-token",sec.GetPayload().GetValue(),0600);e!=nil{panic(e)}}
          EOF
            go mod tidy
            TOKEN="$TOKEN" PROJECT="$PROJECT" REF="$ref" go run .
            cd "$GITHUB_WORKSPACE"
          else
            printf '%s' "$ref" >/tmp/admin-token
          fi
          admin="$(cat /tmp/admin-token)";test "${#admin}" -ge 32;echo "::add-mask::$admin"
          python3 - <<'PY' >/tmp/revoke-lines
          import json
          for x in json.load(open('/tmp/cleanup-targets.json')):print(x['hash']+'\t'+x['url'])
          PY
          count=0
          while IFS=$'\t' read -r hash url;do
            code="$(curl -sS -o /tmp/revoke.json -w '%{http_code}' -X POST -H "X-Admin-Token: $admin" "$PRODUCTION_BASE_URL/api/v1/admin/subscriptions/$hash/revoke")";test "$code" = 200
            python3 - <<'PY'
          import json
          assert json.load(open('/tmp/revoke.json')).get('status')=='revoked'
          PY
            code="$(curl -sS -o /tmp/revoked.ics -w '%{http_code}' "$url")";test "$code" = 200;grep -q 'BEGIN:VCALENDAR' /tmp/revoked.ics;test "$(grep -c 'BEGIN:VEVENT' /tmp/revoked.ics || true)" = 0
            count=$((count+1))
          done </tmp/revoke-lines
          test "$count" = 2
          echo 'UGMU_TEST_PAYMENT_V3_REVOKE_SAFE revoked=2 feeds200=2 eventsAfter=0'
          rm -rf /tmp/adminresolve /tmp/admin-token /tmp/admin-ref /tmp/admin-type /tmp/revoke-lines /tmp/cleanup-targets.json

      - name: Evidence
        shell: bash
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import json
          json.dump({'status':'PASS','boundary':'temporary-yookassa-test-window','succeededTestPayments':2,'allProviderTestTrue':True,'allProviderPaid':True,'ordersSucceeded':2,'tokenizedFeedsVerified':2,'testSubscriptionsRevoked':2,'revokedFeedsEventCount':0,'paymentCreatedByVerifier':False,'restoreLiveRequired':True,'testWindowStillOpen':True},open('evidence/report.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ugmu-yookassa-test-payment-cleanup-v3-${{ github.run_id }}
          path: evidence/report.json
          retention-days: 30
