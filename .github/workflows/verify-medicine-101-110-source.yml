name: Verify medicine 101-110 source

on:
  push:
    branches:
      - feat/medicine-101-110-production

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - name: Discover and download current official XLSX
        shell: python
        run: |
          import hashlib
          import io
          import json
          import re
          import urllib.parse
          import urllib.request
          import zipfile
          from pathlib import Path

          PAGE = "https://kirovgma.ru/lechebnyy-fakultet-raspisanie"
          request = urllib.request.Request(PAGE, headers={"User-Agent": "medical-calendar-source-verifier/1"})
          html = urllib.request.urlopen(request, timeout=30).read().decode("utf-8", errors="replace")
          hrefs = re.findall(r'href=["\\\']([^"\\\']+)["\\\']', html)
          links = [urllib.parse.urljoin(PAGE, href) for href in hrefs]
          candidates = [
              url for url in links
              if url.lower().endswith(".xlsx") and "1_lech._1_potok" in url
          ]
          if len(candidates) != 1:
              raise SystemExit(f"expected exactly one current 101-110 XLSX, got {candidates}")

          source_url = candidates[0]
          source_request = urllib.request.Request(source_url, headers={"User-Agent": "medical-calendar-source-verifier/1"})
          data = urllib.request.urlopen(source_request, timeout=60).read()
          digest = hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(io.BytesIO(data)) as workbook:
              names = set(workbook.namelist())
              if "[Content_Types].xml" not in names or "xl/worksheets/sheet1.xml" not in names:
                  raise SystemExit("download is not a valid one-sheet XLSX container")

          Path("medicine-101-110-current.xlsx").write_bytes(data)
          metadata = {
              "pageUrl": PAGE,
              "sourceUrl": source_url,
              "sha256": digest,
              "byteLength": len(data),
          }
          Path("medicine-101-110-current.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"source_url={source_url}")
          print(f"byte_length={len(data)}")
          print(f"sha256={digest}")
          print("MEDICINE_101_110_SOURCE_DISCOVERED")

      - name: Upload current official source
        uses: actions/upload-artifact@v4
        with:
          name: medicine-101-110-current-source
          path: |
            medicine-101-110-current.xlsx
            medicine-101-110-current.json
          if-no-files-found: error
          retention-days: 1
