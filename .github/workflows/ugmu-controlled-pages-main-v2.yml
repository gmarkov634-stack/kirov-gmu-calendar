name: UGMU controlled Pages deploy v2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: UGMU page mode
        required: true
        type: choice
        options: [prelaunch, launch]
      source_sha:
        description: Exact reviewed commit containing canonical ugmu/
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "ugmu/**"
      - ".github/workflows/ugmu-controlled-pages-main-v2.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: medical-calendar-pages
  cancel-in-progress: false

env:
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru
  UGMU_SITE_URL: https://gmarkov634-stack.github.io/kirov-gmu-calendar/ugmu/

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = push ]; then mode=launch; source="$GITHUB_SHA"; else mode='${{ inputs.mode }}'; source='${{ inputs.source_sha }}'; fi
          test "$mode" = prelaunch -o "$mode" = launch
          [[ "$source" =~ ^[0-9a-f]{40}$ ]]
          echo "mode=$mode" >> "$GITHUB_OUTPUT"; echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "UGMU_PAGES_REQUEST_SAFE mode=$mode source=$source"

      - name: Checkout main baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: base

      - name: Checkout exact canonical UGMU source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.source }}
          path: feature

      - name: Build isolated artifact from canonical ugmu
        env:
          MODE: ${{ steps.request.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/site; mkdir -p dist/site/omgmu dist/site/ugmu
          for file in index.html styles.css landing-v1.css data.js app.js app-utils.js; do cp "base/$file" dist/site/; done
          cp -R base/site/omgmu/. dist/site/omgmu/
          cp -R feature/ugmu/. dist/site/ugmu/
          touch dist/site/.nojekyll
          API_URL="$PRODUCTION_BASE_URL" MODE="$MODE" python3 - <<'PY'
          import os,re
          from pathlib import Path
          api=os.environ['API_URL'].rstrip('/'); mode=os.environ['MODE']
          p=Path('dist/site/ugmu/config.js'); text=p.read_text(); text,n=re.subn(r'apiBaseUrl:\s*"https://[^\"]+"',f'apiBaseUrl: "{api}"',text,count=1); assert n==1; p.write_text(text)
          hp=Path('dist/site/ugmu/index.html'); h=hp.read_text()
          canonical_robots='name="robots" content="index,follow"'
          canonical_launch='<strong>Календарь доступен</strong>'
          assert canonical_robots in h, 'canonical UGMU source must be launch-shaped'
          assert canonical_launch in h, 'canonical UGMU source must contain launch marker'
          if mode=='prelaunch':
              h=h.replace(canonical_robots, 'name="robots" content="noindex,follow"', 1)
              h=h.replace(canonical_launch, '<strong>Предзапусковый режим</strong>', 1)
          hp.write_text(h)
          app=Path('dist/site/ugmu/app.js').read_text(); cfg=Path('dist/site/ugmu/config.js').read_text()
          assert 'runtime.sales === "open"' in app and 'runtime.paymentMode === "live"' in app and 'type="submit" disabled' in h
          assert 'meta.universityTrials?.ugmu === "open"' in app
          assert '/api/v2/trials' in cfg and 'trialDays: 7' in cfg
          assert 'id="trial-start"' in h and 'Попробовать бесплатно' in h
          assert '/api/v2/catalog/ugmu' not in app and '/api/v2/schedules/ugmu' not in app
          assert 'apiBaseUrl: "https://kgmu-calendar-api.containerapps.ru"' in cfg
          if mode=='prelaunch': assert 'name="robots" content="noindex,follow"' in h and 'Предзапусковый режим' in h
          else: assert 'name="robots" content="index,follow"' in h and 'Календарь доступен' in h and 'Предзапусковый режим' not in h
          print('UGMU_CANONICAL_PAGES_ARTIFACT_SAFE',{'mode':mode,'trialUi':True})
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed mode and trial entry point
        env:
          MODE: ${{ steps.request.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for attempt in $(seq 1 36); do
            code="$(curl -sS -o /tmp/page.html -w '%{http_code}' --max-time 20 "${UGMU_SITE_URL}?mode=$MODE&run=${GITHUB_RUN_ID}&attempt=$attempt" || true)"
            if [ "$code" = 200 ] && grep -q 'id="trial-start"' /tmp/page.html && grep -q 'Попробовать бесплатно' /tmp/page.html; then
              if [ "$MODE" = prelaunch ] && grep -q 'name="robots" content="noindex,follow"' /tmp/page.html && grep -q 'Предзапусковый режим' /tmp/page.html; then ok=true; break; fi
              if [ "$MODE" = launch ] && grep -q 'name="robots" content="index,follow"' /tmp/page.html && grep -q 'Календарь доступен' /tmp/page.html && ! grep -q 'Предзапусковый режим' /tmp/page.html; then ok=true; break; fi
            fi
            sleep 5
          done
          test "$ok" = true
          echo "UGMU_PAGES_DEPLOY_SAFE mode=$MODE trial-ui=present"
      - name: Evidence
        env:
          MODE: ${{ steps.request.outputs.mode }}
          SOURCE: ${{ steps.request.outputs.source }}
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import json,os
          json.dump({'status':'PASS','mode':os.environ['MODE'],'sourceSha':os.environ['SOURCE'],'sourcePath':'ugmu/','trialUiPresent':True,'productionMutation':'pages-only','paymentCreated':False},open('evidence/report.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ugmu-controlled-pages-v2-${{ steps.request.outputs.mode }}-${{ github.run_id }}
          path: evidence/report.json
          retention-days: 30
