name: KGMU archive payment E2E start

on:
  push:
    paths:
      - ".github/workflows/kgmu-archive-payment-e2e-start.yml"

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create test-mode archived order
        env:
          KGMU_ADMIN_TOKEN: ${{ secrets.KGMU_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          base='https://kgmu-calendar-api.containerapps.ru'
          test -n "$KGMU_ADMIN_TOKEN"

          health="$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors "$base/health")"
          test "$(printf '%s' "$health" | jq -r '.status')" = 'ok'

          status="$(curl --silent --show-error --output /tmp/payment.json --write-out '%{http_code}' \
            -X POST "$base/api/v1/admin/payments/test-archive" \
            -H "X-Admin-Token: $KGMU_ADMIN_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"program":"medicine","course":4,"groupCode":"401","academicYear":"2025/2026","semester":2,"email":"kgmu-calendar-e2e@example.com"}')"
          echo "ARCHIVE_TEST_HTTP_STATUS=$status"
          if [ "$status" != '201' ]; then
            jq '{error}' /tmp/payment.json || cat /tmp/payment.json
            exit 1
          fi

          access="$(jq -r '.accessToken // empty' /tmp/payment.json)"
          test -n "$access"
          echo "::add-mask::$access"

          jq -e '.testMode == true and .archive.program == "medicine" and .archive.course == 4 and .archive.groupCode == "401" and .archive.academicYear == "2025/2026" and .archive.semester == 2' /tmp/payment.json >/dev/null
          order="$(jq -r '.orderId' /tmp/payment.json)"
          confirmation="$(jq -r '.confirmationUrl' /tmp/payment.json)"
          test -n "$order"
          test -n "$confirmation"
          echo "TEST_ORDER_ID=$order"
          echo "TEST_CONFIRMATION_URL=$confirmation"
          echo "TEST_CHECKOUT_CREATED_OK"
