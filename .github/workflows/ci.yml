name: KGMU CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Upload source-change candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medicine-101-110-source-change-candidate
          path: .artifacts/*.json
          if-no-files-found: ignore
