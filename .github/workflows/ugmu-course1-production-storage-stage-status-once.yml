name: UGMU course-1 staging status one-shot

on:
  push:
    branches:
      - main
    paths:
      - universities/ugmu/course1-production-staging-status-probe.json

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve, wait and report latest guarded staging run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          run_json="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ugmu-course1-production-storage-stage.yml --branch main --event workflow_dispatch --limit 1 --json databaseId,status,conclusion,url,createdAt,headSha 2>&1)"
          list_rc=$?
          run_id=""
          if [ "$list_rc" -eq 0 ]; then
            run_id="$(jq -r '.[0].databaseId // empty' <<<"$run_json" 2>/dev/null)"
          fi
          if [ -z "$run_id" ]; then
            cat > /tmp/body.md <<EOF
          No guarded staging workflow_dispatch run was found.

          - listRc: $list_rc
          - raw: $run_json
          EOF
            gh issue create --repo "$GITHUB_REPOSITORY" --title "UGMU course1 staging probe no-run" --body-file /tmp/body.md
            exit 1
          fi

          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          watch_rc=$?
          view_json="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,url,createdAt,headSha 2>&1)"

          groups='null'; events='null'; verified='null'; missing='null'; failed='null'; stage_passed='false'; verify_passed='false'; evidence_rc=1
          rm -rf /tmp/evidence && mkdir -p /tmp/evidence
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name ugmu-course1-production-storage-stage --dir /tmp/evidence
          download_rc=$?
          if [ "$download_rc" -eq 0 ]; then
            stage="$(find /tmp/evidence -type f -path '*/production-storage-stage/report.json' | head -n1)"
            verify="$(find /tmp/evidence -type f -path '*/production-storage-verify/report.json' | head -n1)"
            if [ -f "$stage" ]; then
              stage_passed="$(jq -r '.passed // false' "$stage")"
              groups="$(jq -r '.totals.groups // null' "$stage")"
              events="$(jq -r '.totals.events // null' "$stage")"
            fi
            if [ -f "$verify" ]; then
              verify_passed="$(jq -r '.passed // false' "$verify")"
              verified="$(jq -r '.totals.verified // null' "$verify")"
              missing="$(jq -r '.totals.missing // null' "$verify")"
              failed="$(jq -r '.totals.failed // null' "$verify")"
            fi
            if [ "$stage_passed" = true ] && [ "$groups" = 50 ] && [ "$events" = 17301 ] && [ "$verify_passed" = true ] && [ "$verified" = 50 ] && [ "$missing" = 0 ] && [ "$failed" = 0 ]; then
              evidence_rc=0
            fi
          fi

          cat > /tmp/body.md <<EOF
          Guarded production storage staging probe completed.

          - run: $run_id
          - watchRc: $watch_rc
          - stagePassed: $stage_passed
          - groups: $groups
          - events: $events
          - verifyPassed: $verify_passed
          - verified: $verified
          - missing: $missing
          - failed: $failed
          - runView: $view_json
          EOF
          if [ "$watch_rc" -eq 0 ] && [ "$evidence_rc" -eq 0 ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "UGMU course1 staging verified $run_id" --body-file /tmp/body.md
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "UGMU course1 staging probe failed $run_id" --body-file /tmp/body.md
          exit 1
