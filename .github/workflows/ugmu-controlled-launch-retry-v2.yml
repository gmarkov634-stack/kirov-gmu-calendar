name: UGMU controlled launch retry v2

on:
  push:
    branches:
      - agent/ugmu-scaffold-20260820
    paths:
      - "universities/ugmu/controlled-launch-retry-v2.json"

permissions:
  contents: read
  actions: write

concurrency:
  group: ugmu-controlled-production-launch
  cancel-in-progress: false

env:
  CONTAINER_NAME: kgmu-calendar-api
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru
  UGMU_SITE_URL: https://gmarkov634-stack.github.io/kirov-gmu-calendar/ugmu/
  UGMU_SOURCE_SHA: 34612248bba201096d6566cacb37c53be01d3f84eddc214bda2a594b46fb24f8
  PAGES_SOURCE_SHA: 11c37ac0a6513c6621c297aec5c6dbceb42ede3b
  EXPECTED_IMAGE: kgmu-calendar-api.cr.cloud.ru/api@sha256:1eb443926c40e705ee8d758d8479552576deb735d54fe86a18ec300895929829
  YOOKASSA_SECRET_NAME: yookassa-secret-key
  PAGES_WORKFLOW: ugmu-controlled-pages-main-v2.yml

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
      CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact authority commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify one-shot authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          a=json.load(open('universities/ugmu/controlled-launch-retry-v2.json',encoding='utf-8'))
          expected_image='kgmu-calendar-api.cr.cloud.ru/api@sha256:1eb443926c40e705ee8d758d8479552576deb735d54fe86a18ec300895929829'
          assert a['version']==2
          assert a['kind']=='ugmu-controlled-launch-retry-v2'
          assert a['boundary']=='controlled-launch-activation'
          assert a['authorizedBranch']=='agent/ugmu-scaffold-20260820'
          assert a['sourceSha256']=='34612248bba201096d6566cacb37c53be01d3f84eddc214bda2a594b46fb24f8'
          assert a['pagesSourceSha']=='11c37ac0a6513c6621c297aec5c6dbceb42ede3b'
          assert a['expectedImage']==expected_image
          assert a['imagePayloadVerifiedByRun']==32457299530
          assert a['groups']==[f'ОЛД {n}' for n in range(101,113)]
          assert a['userAuthorization']=='Далее'
          assert a['automaticRollback'] is True
          prepared=a['preparedCodeHead']; assert len(prepared)==40
          changed=subprocess.check_output(['git','diff','--name-only',prepared,'HEAD'],text=True).splitlines()
          assert changed==['universities/ugmu/controlled-launch-retry-v2.json'],changed
          print('UGMU_RETRY_V2_AUTHORITY_SAFE',{'groups':12,'image':expected_image,'payloadVerifyRun':32457299530})
          PY

      - name: Setup Go for Secret Management preflight
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Execute reversible controlled launch
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          auth_payload="$(python3 - <<'PY'
          import json,os
          print(json.dumps({'keyId':os.environ['CLOUDRU_KEY_ID'],'secret':os.environ['CLOUDRU_KEY_SECRET']}))
          PY
          )"
          test "$(curl -sS -o /tmp/cloud-token.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data "$auth_payload" https://iam.api.cloud.ru/api/v1/auth/token)" = 200
          readarray -t auth < <(python3 - <<'PY'
          import base64,json
          t=json.load(open('/tmp/cloud-token.json'))['access_token'];p=t.split('.')[1];p+='='*((4-len(p)%4)%4);c=json.loads(base64.urlsafe_b64decode(p.encode()));print(t);print(c['project_id'])
          PY
          )
          token="${auth[0]}"; project="${auth[1]}"; rm -f /tmp/cloud-token.json
          echo "::add-mask::$token"
          get="https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$project"
          patch="https://containers.api.cloud.ru/v2/containers/${CONTAINER_NAME}?projectId=$project"

          test "$(curl -sS -o /tmp/before.json -w '%{http_code}' -H "Authorization: Bearer $token" "$get")" = 200
          EXPECTED_IMAGE="$EXPECTED_IMAGE" python3 - <<'PY'
          import json,os
          a=json.load(open('/tmp/before.json')); assert a.get('status')=='running'
          c=a['template']['containers'][0]; assert c.get('image')==os.environ['EXPECTED_IMAGE'],c.get('image')
          e={x.get('name'):x for x in c.get('env',[]) if isinstance(x,dict)}
          assert e.get('COMMERCIAL_SALES_ENABLED',{}).get('value')!='true'
          assert e.get('UGMU_SALES_ENABLED',{}).get('value')!='true'
          assert e.get('UGMU_ACTIVE',{}).get('value')!='true'
          assert not (e.get('UGMU_SITE_URL',{}).get('value') or '')
          assert e.get('TRIALS_ENABLED',{}).get('value')!='true'
          assert e.get('YOOKASSA_TEST_MODE',{}).get('value')=='false'
          assert e.get('YOOKASSA_SECRET_KEY',{}).get('type')=='secret'
          shop=str(e.get('YOOKASSA_SHOP_ID',{}).get('value') or ''); assert shop; open('/tmp/shop','w').write(shop)
          print('UGMU_RETRY_V2_PRECONDITION_SAFE',{'running':True,'imageMatched':True,'globalSales':False,'ugmuSales':False,'active':False,'trials':False,'paymentMode':'live'})
          PY
          meta="$(curl -fsS --retry 6 --retry-all-errors --retry-delay 2 "$PRODUCTION_BASE_URL/api/v2/meta")"
          python3 - "$meta" <<'PY'
          import json,sys
          m=json.loads(sys.argv[1]); assert m.get('sales')=='closed'; assert m.get('trials')=='closed'; assert m.get('paymentMode')=='live'
          print('UGMU_RETRY_V2_META_PRE_SAFE',{'sales':'closed','trials':'closed','paymentMode':'live'})
          PY

          mkdir -p /tmp/provider && cd /tmp/provider
          cat > go.mod <<'EOF'
          module ugmulaunchretryv2
          go 1.23.0
          require (
            github.com/cloudru-tech/secret-manager-sdk v1.1.1
            google.golang.org/grpc v1.70.0
          )
          EOF
          cat > main.go <<'EOF'
          package main
          import("context";"fmt";"io";"net/http";"os";"strings";"time";sm "github.com/cloudru-tech/secret-manager-sdk";v2 "github.com/cloudru-tech/secret-manager-sdk/api/v2";"google.golang.org/grpc/metadata")
          func must(n string)string{v:=os.Getenv(n);if v==""{panic("missing "+n)};return v}
          func main(){cl,e:=sm.New(&sm.Config{Host:"secretmanager.api.cloud.ru:443"});if e!=nil{panic(e)};defer cl.Close();ctx,c:=context.WithTimeout(context.Background(),30*time.Second);defer c();ctx=metadata.AppendToOutgoingContext(ctx,"authorization","Bearer "+must("TOKEN"));sr,e:=cl.V2.SecretService.Search(ctx,&v2.SearchSecretRequest{ProjectId:must("PROJECT"),Depth:-1});if e!=nil{panic(e)};target:=must("SECRET");var p []string;for _,s:=range sr.GetSecrets(){x:=s.GetPath();if x==target||strings.HasSuffix(x,"/"+target){p=append(p,x)}};if len(p)!=1{panic("secret match count")};s,e:=cl.V2.SecretService.Access(ctx,&v2.AccessSecretRequest{ProjectId:must("PROJECT"),Path:p[0]});if e!=nil{panic(e)};key:=s.GetPayload().GetValue();if len(key)==0{panic("empty secret")};req,_:=http.NewRequest(http.MethodGet,"https://api.yookassa.ru/v3/payments?limit=1",nil);req.SetBasicAuth(must("SHOP"),string(key));r,e:=(&http.Client{Timeout:20*time.Second}).Do(req);if e!=nil{panic(e)};defer r.Body.Close();_,_=io.ReadAll(io.LimitReader(r.Body,1<<20));fmt.Printf("YOOKASSA_RETRY_V2_PREFLIGHT_SAFE http=%d secretMatchCount=%d paymentCreated=false\n",r.StatusCode,len(p));if r.StatusCode!=200{os.Exit(4)}}
          EOF
          go mod tidy
          TOKEN="$token" PROJECT="$project" SECRET="$YOOKASSA_SECRET_NAME" SHOP="$(cat /tmp/shop)" go run .
          cd "$GITHUB_WORKSPACE"

          backend_opened=false
          pages_launch_dispatched=false
          rollback() {
            status=$?
            if [ "$status" -eq 0 ]; then return 0; fi
            echo "UGMU_RETRY_V2_ROLLBACK_START status=$status"
            if [ "$backend_opened" = true ]; then
              test "$(curl -sS -o /tmp/rb-current.json -w '%{http_code}' -H "Authorization: Bearer $token" "$get")" = 200 || true
              python3 - <<'PY'
          import json
          a=json.load(open('/tmp/rb-current.json'));c=a['template']['containers'][0];items=c.setdefault('env',[]);by={x.get('name'):x for x in items if isinstance(x,dict) and x.get('name')}
          for n,v in [('UGMU_SALES_ENABLED','false'),('UGMU_ACTIVE','false'),('UGMU_SITE_URL','')]:
            if n in by: by[n]['value']=v;by[n].pop('type',None)
            else: items.append({'name':n,'value':v})
          json.dump(a,open('/tmp/rb.json','w'),ensure_ascii=False,separators=(',',':'))
          PY
              curl -sS -o /tmp/rb-patch.json -X PATCH -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data-binary @/tmp/rb.json "$patch" || true
              for attempt in $(seq 1 50); do
                m="$(curl -sS "$PRODUCTION_BASE_URL/api/v2/meta" || true)"
                if META="$m" python3 - <<'PY'
          import json,os,sys
          try:m=json.loads(os.environ['META'])
          except:sys.exit(1)
          sys.exit(0 if m.get('sales')=='closed' and m.get('trials')=='closed' and m.get('paymentMode')=='live' else 1)
          PY
                then echo "UGMU_RETRY_V2_BACKEND_ROLLBACK_SAFE attempt=$attempt"; break; fi
                sleep 3
              done
            fi
            payload="$(python3 - <<'PY'
          import json,os
          print(json.dumps({'ref':'main','inputs':{'mode':'prelaunch','source_sha':os.environ['PAGES_SOURCE_SHA']}}))
          PY
          )"
            code="$(curl -sS -o /tmp/rb-pages.out -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${PAGES_WORKFLOW}/dispatches" || true)"
            echo "UGMU_RETRY_V2_PAGES_ROLLBACK_DISPATCH_SAFE http=$code"
            return "$status"
          }
          trap rollback EXIT

          UGMU_SITE_URL="$UGMU_SITE_URL" EXPECTED_IMAGE="$EXPECTED_IMAGE" python3 - <<'PY'
          import json,os
          a=json.load(open('/tmp/before.json'));c=a['template']['containers'][0];assert c['image']==os.environ['EXPECTED_IMAGE'];items=c.setdefault('env',[]);by={x.get('name'):x for x in items if isinstance(x,dict) and x.get('name')}
          def setv(n,v):
            if n in by: by[n]['value']=v;by[n].pop('type',None)
            else: items.append({'name':n,'value':v});by[n]=items[-1]
          setv('UGMU_ACTIVE','true');setv('UGMU_SALES_ENABLED','true');setv('UGMU_SITE_URL',os.environ['UGMU_SITE_URL'])
          assert by.get('COMMERCIAL_SALES_ENABLED',{}).get('value')!='true';assert by.get('TRIALS_ENABLED',{}).get('value')!='true';assert by.get('YOOKASSA_TEST_MODE',{}).get('value')=='false'
          json.dump(a,open('/tmp/open.json','w'),ensure_ascii=False,separators=(',',':'))
          PY
          test "$(curl -sS -o /tmp/open-patch.json -w '%{http_code}' -X PATCH -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data-binary @/tmp/open.json "$patch")" = 200
          backend_opened=true
          ok=false
          for attempt in $(seq 1 50); do
            m="$(curl -sS "$PRODUCTION_BASE_URL/api/v2/meta" || true)"
            if META="$m" python3 - <<'PY'
          import json,os,sys
          try:m=json.loads(os.environ['META'])
          except:sys.exit(1)
          sys.exit(0 if m.get('sales')=='open' and m.get('trials')=='closed' and m.get('paymentMode')=='live' else 1)
          PY
            then ok=true;break;fi
            sleep 3
          done
          test "$ok" = true
          echo 'UGMU_RETRY_V2_BACKEND_OPEN_SAFE paymentCreated=false'

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${PAGES_WORKFLOW}"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api/runs?event=workflow_dispatch&branch=main&per_page=30" >/tmp/pages-before.json
          payload="$(python3 - <<'PY'
          import json,os
          print(json.dumps({'ref':'main','inputs':{'mode':'launch','source_sha':os.environ['PAGES_SOURCE_SHA']}}))
          PY
          )"
          test "$(curl -sS -o /tmp/pages-dispatch.out -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' --data "$payload" "$api/dispatches")" = 204
          pages_launch_dispatched=true
          pages_run=''
          for attempt in $(seq 1 30); do
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api/runs?event=workflow_dispatch&branch=main&per_page=30" >/tmp/pages-after.json
            pages_run="$(python3 - <<'PY'
          import json
          before={r['id'] for r in json.load(open('/tmp/pages-before.json')).get('workflow_runs',[])}
          rows=json.load(open('/tmp/pages-after.json')).get('workflow_runs',[]);new=[r for r in rows if r['id'] not in before]
          print(new[0]['id'] if new else '')
          PY
          )"
            [ -n "$pages_run" ] && break
            sleep 2
          done
          test -n "$pages_run"
          echo "PAGES_RUN_ID_SAFE=$pages_run"
          conclusion=''
          for attempt in $(seq 1 150); do
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/$pages_run" >/tmp/pages-run.json
            readarray -t state < <(python3 - <<'PY'
          import json
          r=json.load(open('/tmp/pages-run.json'));print(r.get('status') or '');print(r.get('conclusion') or '')
          PY
          )
            if [ "${state[0]}" = completed ];then conclusion="${state[1]}";break;fi
            sleep 5
          done
          test "$conclusion" = success
          echo "UGMU_RETRY_V2_PAGES_LAUNCH_SAFE run=$pages_run"

          meta="$(curl -fsS --retry 8 --retry-all-errors --retry-delay 2 "$PRODUCTION_BASE_URL/api/v2/meta")"
          python3 - "$meta" <<'PY'
          import json,sys
          m=json.loads(sys.argv[1]);assert m.get('sales')=='open';assert m.get('trials')=='closed';assert m.get('paymentMode')=='live'
          print('UGMU_RETRY_V2_META_POST_SAFE',{'sales':'open','trials':'closed','paymentMode':'live'})
          PY
          page="$(curl -fsS --retry 10 --retry-all-errors --retry-delay 2 "${UGMU_SITE_URL}?launch-v2=${GITHUB_RUN_ID}")"
          printf '%s' "$page"|grep -q 'name="robots" content="index,follow"'
          printf '%s' "$page"|grep -q 'Календарь доступен'
          ! printf '%s' "$page"|grep -q 'Предзапусковый режим'
          group="$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote('ugmu:medicine:1:stream-1:ОЛД 101',safe=''))
          PY
          )"
          code="$(curl -sS -o /tmp/public.json -w '%{http_code}' "$PRODUCTION_BASE_URL/api/v2/schedules/ugmu/medicine/1/$group/schedule?groupCode=%D0%9E%D0%9B%D0%94%20101&stream=1")"
          test "$code" = 404
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/public.json'))=={'error':'schedule_not_published'}
          PY
          echo "UGMU_CONTROLLED_LAUNCH_V2_PASS pagesRun=$pages_run publicSchedule=false publicIcs=false trials=false paymentCreated=false"
          echo "pages_run=$pages_run" >> "$GITHUB_OUTPUT"
          trap - EXIT

      - name: Record evidence
        env:
          PAGES_RUN_ID: ${{ steps.execute.outputs.pages_run }}
        shell: bash
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import json,os
          json.dump({'status':'PASS','boundary':'controlled-launch-activation','backendRunId':int(os.environ['GITHUB_RUN_ID']),'pagesRunId':int(os.environ['PAGES_RUN_ID']),'image':os.environ['EXPECTED_IMAGE'],'pagesSourceSha':os.environ['PAGES_SOURCE_SHA'],'sourceSha256':os.environ['UGMU_SOURCE_SHA'],'sales':'open','trials':'closed','paymentMode':'live','publicSchedule':False,'publicIcs':False,'paymentCreated':False},open('evidence/report.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ugmu-controlled-launch-retry-v2-${{ github.run_id }}
          path: evidence/report.json
          retention-days: 30
