name: UGMU Cloud.ru revision live shop diagnostic

on:
  push:
    branches: [agent/ugmu-scaffold-20260820]
    paths: ["universities/ugmu/cloudru-revision-live-shop-diagnostic.json"]

permissions:
  contents: read

env:
  CONTAINER_NAME: kgmu-calendar-api

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
      CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify read-only authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          p='universities/ugmu/cloudru-revision-live-shop-diagnostic.json'
          a=json.load(open(p,encoding='utf-8'))
          assert a['kind']=='ugmu-cloudru-revision-live-shop-diagnostic'
          assert a['readOnly'] is True and a['productionMutationAllowed'] is False
          prepared=a['preparedWorkflowHead']
          assert subprocess.check_output(['git','diff','--name-only',prepared,'HEAD'],text=True).splitlines()==[p]
          print('UGMU_REVISION_DIAGNOSTIC_AUTHORITY_SAFE readOnly=true')
          PY
      - name: Discover previous live ShopID read-only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          payload="$(python3 - <<'PY'
          import json,os
          print(json.dumps({'keyId':os.environ['CLOUDRU_KEY_ID'],'secret':os.environ['CLOUDRU_KEY_SECRET']}))
          PY
          )"
          test "$(curl -sS -o /tmp/token.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data "$payload" https://iam.api.cloud.ru/api/v1/auth/token)" = 200
          readarray -t auth < <(python3 - <<'PY'
          import base64,json
          t=json.load(open('/tmp/token.json'))['access_token'];p=t.split('.')[1];p+='='*((4-len(p)%4)%4);c=json.loads(base64.urlsafe_b64decode(p.encode()));print(t);print(c['project_id'])
          PY
          )
          token="${auth[0]}";project="${auth[1]}";rm -f /tmp/token.json;echo "::add-mask::$token"
          TOKEN="$token" PROJECT="$project" python3 - <<'PY'
          import json,os,urllib.request,urllib.error,urllib.parse
          token=os.environ['TOKEN']; project=os.environ['PROJECT']; name=os.environ['CONTAINER_NAME']
          base='https://containers.api.cloud.ru'
          def get(path):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+token})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read().decode() or '{}')
              except urllib.error.HTTPError as e:
                  try:b=json.loads(e.read().decode() or '{}')
                  except:b={}
                  return e.code,b
          q=urllib.parse.quote(project,safe='')
          paths=[
            f'/v1/containers/{name}/revisions?projectId={q}',
            f'/v1/revisions?projectId={q}&containerName={urllib.parse.quote(name)}',
            f'/v1/containers/{name}/operations?projectId={q}',
          ]
          docs=[]
          for p in paths:
              code,body=get(p);docs.append((p,code,body));print('CLOUDRU_REVISION_ENDPOINT_SAFE',{'path':p.split('?')[0],'http':code,'keys':sorted(body.keys())[:12] if isinstance(body,dict) else []})
          ids=[]
          def walk(x):
              if isinstance(x,dict):
                  for k in ('id','name','revisionId','revisionName'):
                      v=x.get(k)
                      if isinstance(v,str) and v and v!=name: ids.append(v)
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          for _,code,b in docs:
              if code==200:walk(b)
          ids=list(dict.fromkeys(ids))[:100]
          detail_paths=[]
          for rid in ids:
              r=urllib.parse.quote(rid,safe='')
              detail_paths += [f'/v1/containers/{name}/revisions/{r}?projectId={q}',f'/v1/revisions/{r}?projectId={q}']
          all_bodies=[b for _,c,b in docs if c==200]
          for p in detail_paths:
              code,b=get(p)
              if code==200: all_bodies.append(b)
          found=[]
          def env_candidates(x):
              if isinstance(x,dict):
                  env=x.get('env')
                  if isinstance(env,list): yield env
                  for v in x.values(): yield from env_candidates(v)
              elif isinstance(x,list):
                  for v in x: yield from env_candidates(v)
          for b in all_bodies:
              for env in env_candidates(b):
                  m={e.get('name'):e for e in env if isinstance(e,dict) and e.get('name')}
                  sec=m.get('YOOKASSA_SECRET_KEY',{}); mode=m.get('YOOKASSA_TEST_MODE',{}).get('value'); shop=str(m.get('YOOKASSA_SHOP_ID',{}).get('value') or '')
                  if sec.get('type')=='secret' and sec.get('value')=='yookassa-secret-key' and mode=='false' and shop and shop!='1259975': found.append(shop)
          unique=list(dict.fromkeys(found))
          print('UGMU_LIVE_SHOP_RECOVERY_SAFE',{'matches':len(found),'uniqueMatches':len(unique),'liveShopId':unique[0] if len(unique)==1 else None,'productionMutation':False})
          if len(unique)!=1: raise SystemExit(4)
          open('/tmp/live-shop-id','w').write(unique[0])
          PY
