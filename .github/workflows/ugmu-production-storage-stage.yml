name: UGMU controlled production storage staging

on:
  push:
    branches:
      - agent/ugmu-scaffold-20260820
    paths:
      - "universities/ugmu/production-staging-authority.json"
  workflow_dispatch:
    inputs:
      confirm:
        description: Exact manifest id required for controlled storage staging
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ugmu-production-storage-stage
  cancel-in-progress: false

env:
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru
  EXPECTED_MANIFEST_ID: ugmu-first-stream-34612248bba2
  EXPECTED_MANIFEST_SHA256: 2d8103b1c0a873c8cd52cc569426338342f2671ce0d740db6f3f0482590262e5
  EXPECTED_AUTHORITY_SHA256: 9061bb48f6f4b6012a75a11e98cc1c3534424c9c0ad361edda6f68fb3dbb142f
  EXPECTED_SOURCE_SHA256: 34612248bba201096d6566cacb37c53be01d3f84eddc214bda2a594b46fb24f8
  CONTAINER_NAME: kgmu-calendar-api

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout authorized branch revision
        uses: actions/checkout@v4

      - name: Verify one-time staging authority
        working-directory: .
        env:
          MANUAL_CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          authority='universities/ugmu/production-staging-authority.json'
          test -f "$authority"
          test "$(sha256sum "$authority" | cut -d' ' -f1)" = "$EXPECTED_AUTHORITY_SHA256"
          jq -e --arg manifest "$EXPECTED_MANIFEST_ID" --arg manifest_sha "$EXPECTED_MANIFEST_SHA256" --arg source_sha "$EXPECTED_SOURCE_SHA256" '
            .version == 1 and
            .kind == "ugmu-production-storage-staging-authority" and
            .authorizedStep == 23 and
            .manifestId == $manifest and
            .manifestSha256 == $manifest_sha and
            .sourceSha256 == $source_sha and
            .productionStorageWrite == true and
            .registryActive == false and
            .catalogEnabled == false and
            .checkoutEnabled == false and
            .publicEndpointsEnabled == false and
            .publicIcsEnabled == false and
            .trialsEnabled == false and
            .canonicalPublicationWrite == false and
            .salesActivation == false and
            (.groups | length) == 12
          ' "$authority" >/dev/null
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$MANUAL_CONFIRM" = "$EXPECTED_MANIFEST_ID"
          fi
          echo "UGMU_STORAGE_STAGE_AUTHORITY_SAFE"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python3 -m pip install -r tools/requirements-ugmu.txt

      - name: Test staging and fail-closed boundary contracts
        run: |
          node --test \
            test/ugmu-production-storage-stage.test.js \
            test/ugmu-first-stream-production-dry-run.test.js \
            test/ugmu-api-routing.test.js

      - name: Rebuild exact source, QA and approved dry-run
        shell: bash
        run: |
          set -euo pipefail
          npm run discover:ugmu -- --program=medicine --output=data/imports/ugmu-first-stream/source-manifest.json
          npm run download:ugmu -- \
            --manifest=data/imports/ugmu-first-stream/source-manifest.json \
            --semester=autumn \
            --output=data/imports/ugmu-first-stream/watched-pdfs

          report='data/imports/ugmu-first-stream/watched-pdfs/download-report.json'
          item="$(jq -c '.files[] | select(.status == "downloaded" and .course == 1 and .stream == "1" and .part == "combined")' "$report" | head -n 1)"
          test -n "$item"
          filename="$(jq -r '.filename' <<<"$item")"
          source_url="$(jq -r '.url' <<<"$item")"
          sha="$(jq -r '.sha256' <<<"$item")"
          test "$sha" = "$EXPECTED_SOURCE_SHA256"

          mkdir -p data/imports/ugmu-first-stream/raw
          for number in $(seq 101 112); do
            npm run parse:ugmu:first-stream -- \
              --input="data/imports/ugmu-first-stream/watched-pdfs/$filename" \
              --group="ОЛД $number" \
              --source="$source_url" \
              --sha256="$sha" \
              --output="data/imports/ugmu-first-stream/raw/OLD-$number.json"
          done

          npm run qa:ugmu:first-stream -- \
            --input-dir=data/imports/ugmu-first-stream/raw \
            --output-dir=data/imports/ugmu-first-stream/qa
          npm run regression:ugmu:first-stream -- \
            --input-dir=data/imports/ugmu-first-stream/raw \
            --fixture=test/fixtures/ugmu/first-stream-2026-autumn.json \
            --output=data/imports/ugmu-first-stream/regression/first-stream-regression.json
          npm run dry-run:ugmu:production-stage -- \
            --input-dir=data/imports/ugmu-first-stream/raw \
            --qa-report=data/imports/ugmu-first-stream/qa/first-stream-qa.json \
            --regression-report=data/imports/ugmu-first-stream/regression/first-stream-regression.json \
            --output-dir=data/imports/ugmu-preactivation-dry-run

          manifest='data/imports/ugmu-preactivation-dry-run/manifest.json'
          test "$(sha256sum "$manifest" | cut -d' ' -f1)" = "$EXPECTED_MANIFEST_SHA256"
          jq -e '
            .passed == true and
            .totals.groups == 12 and
            .totals.events == 4286 and
            .safety.productionMutationPerformed == false and
            .nextRequiredBoundary == "preactivation-production-storage-staging"
          ' "$manifest" >/dev/null
          echo "UGMU_STORAGE_STAGE_DRY_RUN_PINNED"

      - name: Resolve production S3 credentials from protected Cloud.ru container
        env:
          CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
          CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDRU_KEY_ID"
          test -n "$CLOUDRU_KEY_SECRET"

          auth_payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({'keyId': os.environ['CLOUDRU_KEY_ID'], 'secret': os.environ['CLOUDRU_KEY_SECRET']}))
          PY
          )"
          test "$(curl --silent --show-error --output /tmp/token.json --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data "$auth_payload" \
            'https://iam.api.cloud.ru/api/v1/auth/token')" = "200"

          readarray -t auth < <(python3 - <<'PY'
          import base64, json
          body=json.load(open('/tmp/token.json', encoding='utf-8'))
          token=body.get('access_token')
          assert isinstance(token,str) and token
          parts=token.split('.')
          assert len(parts) == 3
          payload=parts[1] + '='*((4-len(parts[1])%4)%4)
          claims=json.loads(base64.urlsafe_b64decode(payload.encode()).decode())
          project_id=claims.get('project_id')
          assert isinstance(project_id,str) and project_id
          print(token)
          print(project_id)
          PY
          )
          token="${auth[0]}"
          project_id="${auth[1]}"
          rm -f /tmp/token.json
          echo "::add-mask::$token"

          get_url="https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$project_id"
          test "$(curl --silent --show-error --output /tmp/container.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $token" --header 'Accept: application/json' "$get_url")" = "200"

          python3 - <<'PY' >/tmp/s3-env
          import json
          app=json.load(open('/tmp/container.json', encoding='utf-8'))
          assert app.get('status') == 'running', app.get('status')
          containers=app.get('template',{}).get('containers',[])
          assert len(containers) == 1
          env={item.get('name'):item.get('value') for item in containers[0].get('env',[]) if isinstance(item,dict)}
          access=env.get('S3_ACCESS_KEY_ID') or ''
          secret=env.get('S3_SECRET_ACCESS_KEY') or ''
          assert access and secret, 'production container S3 credentials are missing'
          values={
            'S3_ACCESS_KEY_ID': access,
            'S3_SECRET_ACCESS_KEY': secret,
            'S3_BUCKET': env.get('S3_BUCKET') or 'kgmu-calendar-data-gmarkov634',
            'S3_ENDPOINT': env.get('S3_ENDPOINT') or 'https://s3.cloud.ru',
            'S3_REGION': env.get('S3_REGION') or 'ru-central-1',
          }
          for key,value in values.items():
              assert '\n' not in value and '\r' not in value
              print(f'{key}={value}')
          PY
          rm -f /tmp/container.json

          while IFS= read -r line; do
            value="${line#*=}"
            echo "::add-mask::$value"
            echo "$line" >> "$GITHUB_ENV"
          done </tmp/s3-env
          rm -f /tmp/s3-env
          echo "UGMU_STORAGE_STAGE_S3_CONTEXT_SAFE"

      - name: Stage 12 QA-approved schedules with rollback snapshots and read-back
        env:
          PRODUCTION_STORAGE_STAGE_ALLOWED: "true"
        shell: bash
        run: |
          set -euo pipefail
          npm run stage:ugmu:production-storage -- \
            --manifest=data/imports/ugmu-preactivation-dry-run/manifest.json \
            --groups-dir=data/imports/ugmu-preactivation-dry-run/groups \
            --authority=../universities/ugmu/production-staging-authority.json \
            --report=data/imports/ugmu-production-storage-stage/report.json \
            --production-base-url="$PRODUCTION_BASE_URL" \
            --confirm="$EXPECTED_MANIFEST_ID"

          report='data/imports/ugmu-production-storage-stage/report.json'
          jq -e '
            .passed == true and
            .status == "PASS" and
            .manifestSha256 == "2d8103b1c0a873c8cd52cc569426338342f2671ce0d740db6f3f0482590262e5" and
            .totals.groups == 12 and
            .totals.events == 4286 and
            .totals.readBackVerified == 12 and
            .boundaries.before.passed == true and
            .boundaries.after.passed == true and
            .safety.scheduleObjectsStaged == 12 and
            .safety.rollbackSnapshotsRetained == true and
            .safety.canonicalPublicationObjectsWritten == false and
            .safety.publicIcsWritten == false and
            .safety.registryActiveChanged == false and
            .safety.checkoutChanged == false and
            .safety.publicEndpointsChanged == false and
            .safety.trialsChanged == false and
            .safety.catalogChanged == false and
            .nextRequiredBoundary == "deploy-isolation-guards" and
            ([.groups[] | select(.readBackSha256 != .desiredSha256)] | length) == 0
          ' "$report" >/dev/null
          echo "UGMU_PRODUCTION_STORAGE_STAGE_PASS"

      - name: Write staging summary
        if: always()
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const file = 'data/imports/ugmu-production-storage-stage/report.json';
          console.log('## UGMU controlled production storage staging');
          console.log('');
          if (!fs.existsSync(file)) { console.log('Staging report was not generated.'); process.exit(0); }
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log(`Status: **${report.status}**`);
          if (report.totals) {
            console.log(`Groups: **${report.totals.groups}/12**; events: **${report.totals.events}**`);
            console.log(`Schedule writes: **${report.totals.schedulesWritten}**; already staged: **${report.totals.alreadyStaged}**`);
            console.log(`Rollback snapshots created: **${report.totals.snapshotsCreated}**`);
            console.log(`Read-back verified: **${report.totals.readBackVerified}/12**`);
          }
          console.log(`Rollback passed after failure: **${report.rollbackPassed ?? 'not-needed'}**`);
          console.log('Catalog/public schedule/checkout remain closed: **required before and after write**');
          console.log(`Next boundary: **${report.nextRequiredBoundary || 'blocked'}**`);
          NODE

      - name: Upload production staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-production-storage-stage
          path: |
            api/data/imports/ugmu-production-storage-stage/report.json
            api/data/imports/ugmu-preactivation-dry-run/manifest.json
            universities/ugmu/production-staging-authority.json
          if-no-files-found: warn
          retention-days: 90
