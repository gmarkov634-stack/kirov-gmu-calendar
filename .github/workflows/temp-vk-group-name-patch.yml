name: Temp VK group name patch

on:
  push:
    branches:
      - agent/vk-group-name-edit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'gmarkov634-stack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vk-group-name-edit
          fetch-depth: 0

      - name: Apply exact source and regression patch
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const sourcePath = 'api/src/vk-control.js';
          let source = fs.readFileSync(sourcePath, 'utf8');

          function replaceOne(oldText, newText, label) {
            const first = source.indexOf(oldText);
            const last = source.lastIndexOf(oldText);
            if (first < 0 || first !== last) throw new Error(`expected exactly one ${label}`);
            source = source.replace(oldText, newText);
          }

          replaceOne(
            'const MAX_GROUP_DESCRIPTION_LENGTH = 10000;',
            'const MAX_GROUP_NAME_LENGTH = 100;\nconst MAX_GROUP_DESCRIPTION_LENGTH = 10000;',
            'group name length anchor',
          );
          replaceOne(
            'const GROUP_EDIT_ALLOWED_FIELDS = new Set(["description", "website"]);',
            'const GROUP_EDIT_ALLOWED_FIELDS = new Set(["name", "description", "website"]);',
            'group edit allowlist anchor',
          );

          const functionStart = source.indexOf('function cleanGroupEditPayload(value) {');
          const functionEnd = source.indexOf('\nfunction cleanGroupLinkUrl(value) {', functionStart);
          if (functionStart < 0 || functionEnd < 0) throw new Error('cleanGroupEditPayload boundary not found');
          const newFunction = `function cleanGroupEditPayload(value) {
            if (!value || typeof value !== "object" || Array.isArray(value)) throw new Error("invalid_group_edit_payload");
            const keys = Object.keys(value);
            if (!keys.length || keys.some((key) => !GROUP_EDIT_ALLOWED_FIELDS.has(key))) {
              throw new Error("invalid_group_edit_payload");
            }

            const params = {};
            const fields = [];
            if (Object.hasOwn(value, "name")) {
              if (typeof value.name !== "string" || value.name.length > MAX_GROUP_NAME_LENGTH) {
                throw new Error("invalid_group_name");
              }
              const name = value.name.trim();
              if (!name) throw new Error("invalid_group_name");
              params.title = name;
              fields.push("name");
            }
            if (Object.hasOwn(value, "description")) {
              if (typeof value.description !== "string" || value.description.length > MAX_GROUP_DESCRIPTION_LENGTH) {
                throw new Error("invalid_group_description");
              }
              params.description = value.description;
              fields.push("description");
            }
            if (Object.hasOwn(value, "website")) {
              if (typeof value.website !== "string" || value.website.length > MAX_GROUP_WEBSITE_LENGTH) {
                throw new Error("invalid_group_website");
              }
              const website = value.website.trim();
              if (website) {
                let url;
                try {
                  url = new URL(website);
                } catch {
                  throw new Error("invalid_group_website");
                }
                if (url.protocol !== "https:") throw new Error("invalid_group_website");
              }
              params.website = website;
              fields.push("website");
            }
            return { params, fields };
          }
          `;
          source = source.slice(0, functionStart) + newFunction + source.slice(functionEnd + 1);

          replaceOne(
            `  if (command.action === "group.edit") {
              const fields = cleanGroupEditPayload(command.payload);
              const result = await vkMethod({
                method: "groups.edit",
                token,
                apiVersion,
                fetchImpl,
                params: { group_id: groupId, ...fields },
              });
              return { updated: Number(result || 0) === 1, fields: Object.keys(fields) };
            }`,
            `  if (command.action === "group.edit") {
              const { params, fields } = cleanGroupEditPayload(command.payload);
              const result = await vkMethod({
                method: "groups.edit",
                token,
                apiVersion,
                fetchImpl,
                params: { group_id: groupId, ...params },
              });
              return { updated: Number(result || 0) === 1, fields };
            }`,
            'group.edit execution block',
          );

          replaceOne(
            '        "invalid_group_edit_payload",\n        "invalid_group_description",',
            '        "invalid_group_edit_payload",\n        "invalid_group_name",\n        "invalid_group_description",',
            'validation error allowlist anchor',
          );

          fs.writeFileSync(sourcePath, source);

          const testContent = `import assert from "node:assert/strict";
          import test from "node:test";
          import { createVkControlHandler } from "../src/vk-control.js";

          const now = Date.parse("2026-08-15T22:15:00.000Z");

          function fakeRequest(payload, action = "group.edit") {
            return {
              method: "POST",
              headers: { authorization: "Bearer test-oidc" },
              async *[Symbol.asyncIterator]() {
                yield Buffer.from(JSON.stringify({
                  id: "cmd-group-edit-0001",
                  action,
                  createdAt: "2026-08-15T22:14:00.000Z",
                  payload,
                }));
              },
            };
          }

          function fakeResponse() {
            return {
              statusCode: null,
              body: "",
              writeHead(statusCode) { this.statusCode = statusCode; },
              end(body = "") { this.body = String(body); },
            };
          }

          function makeHandler({ communityToken = "community-token", fetchImpl, tokenManager } = {}) {
            return createVkControlHandler({
              VK_CALLBACK_GROUP_ID: "191574528",
              ...(communityToken ? { VK_ACCESS_TOKEN: communityToken } : {}),
              VK_USER_ACCESS_TOKEN: "legacy-user-token-must-not-be-used",
              VK_API_VERSION: "5.199",
            }, {
              tokenManager: tokenManager || {
                configured: true,
                async getAccessToken() {
                  throw new Error("managed token must not be used for group.edit");
                },
              },
              nowFactory: () => now,
              verifyOidcToken: async () => ({}),
              fetchImpl: fetchImpl || (async () => { throw new Error("unexpected VK call"); }),
            });
          }

          test("group.edit updates name, description and website through the community token", async () => {
            const requests = [];
            let managedTokenCalls = 0;
            const response = fakeResponse();
            const handler = makeHandler({
              tokenManager: {
                configured: true,
                async getAccessToken() {
                  managedTokenCalls += 1;
                  return "managed-user-token-must-not-be-used";
                },
              },
              fetchImpl: async (url, options) => {
                requests.push({ url, options });
                return {
                  ok: true,
                  async json() { return { response: 1 }; },
                };
              },
            });

            const name = "Расписание в телефоне | ОмГМУ";
            const description = "Новое описание сообщества";
            const website = "https://gmarkov634-stack.github.io/kirov-gmu-calendar";
            await handler(fakeRequest({ name, description, website }), response);

            assert.equal(response.statusCode, 200);
            assert.equal(managedTokenCalls, 0);
            assert.equal(requests.length, 1);
            assert.equal(requests[0].url, "https://api.vk.com/method/groups.edit");
            const body = requests[0].options.body;
            assert.equal(body.get("access_token"), "community-token");
            assert.equal(body.get("v"), "5.199");
            assert.equal(body.get("group_id"), "191574528");
            assert.equal(body.get("title"), name);
            assert.equal(body.get("description"), description);
            assert.equal(body.get("website"), website);
            assert.equal(body.get("screen_name"), null);
            assert.equal(body.get("access"), null);
            assert.equal(body.get("subject"), null);
            assert.equal(body.get("status"), null);
            assert.deepEqual(JSON.parse(response.body).result, {
              updated: true,
              fields: ["name", "description", "website"],
            });
          });

          test("group.edit maps a name-only mutation to VK title and does not broaden the request", async () => {
            const requests = [];
            const response = fakeResponse();
            const handler = makeHandler({
              fetchImpl: async (url, options) => {
                requests.push({ url, options });
                return { ok: true, async json() { return { response: 1 }; } };
              },
            });

            await handler(fakeRequest({ name: "  Расписание в телефоне | ОмГМУ  " }), response);

            assert.equal(response.statusCode, 200);
            assert.equal(requests.length, 1);
            const body = requests[0].options.body;
            assert.equal(body.get("title"), "Расписание в телефоне | ОмГМУ");
            assert.equal(body.get("description"), null);
            assert.equal(body.get("website"), null);
            assert.equal(body.get("status"), null);
            assert.deepEqual(JSON.parse(response.body).result.fields, ["name"]);
          });

          test("group.edit rejects any field outside the strict allowlist", async () => {
            let vkCalls = 0;
            const handler = makeHandler({
              fetchImpl: async () => {
                vkCalls += 1;
                return { ok: true, async json() { return { response: 1 }; } };
              },
            });

            for (const payload of [
              { title: "Raw VK title is not a control field" },
              { status: "Нельзя менять статус через groups.edit" },
              { screen_name: "other" },
              { subject: "1" },
            ]) {
              const response = fakeResponse();
              await handler(fakeRequest(payload), response);
              assert.equal(response.statusCode, 400);
              assert.deepEqual(JSON.parse(response.body), { error: "invalid_group_edit_payload" });
            }
            assert.equal(vkCalls, 0);
          });

          test("group.edit rejects invalid names, an empty payload and a non-HTTPS website", async () => {
            let vkCalls = 0;
            const handler = makeHandler({
              fetchImpl: async () => {
                vkCalls += 1;
                return { ok: true, async json() { return { response: 1 }; } };
              },
            });

            for (const name of ["", "   ", "x".repeat(101)]) {
              const response = fakeResponse();
              await handler(fakeRequest({ name }), response);
              assert.equal(response.statusCode, 400);
              assert.deepEqual(JSON.parse(response.body), { error: "invalid_group_name" });
            }

            const emptyResponse = fakeResponse();
            await handler(fakeRequest({}), emptyResponse);
            assert.equal(emptyResponse.statusCode, 400);
            assert.deepEqual(JSON.parse(emptyResponse.body), { error: "invalid_group_edit_payload" });

            const websiteResponse = fakeResponse();
            await handler(fakeRequest({ website: "http://example.test" }), websiteResponse);
            assert.equal(websiteResponse.statusCode, 400);
            assert.deepEqual(JSON.parse(websiteResponse.body), { error: "invalid_group_website" });
            assert.equal(vkCalls, 0);
          });

          test("group.edit fails closed without a community token and never falls back to a user token", async () => {
            let managedTokenCalls = 0;
            let vkCalls = 0;
            const response = fakeResponse();
            const handler = makeHandler({
              communityToken: "",
              tokenManager: {
                configured: true,
                async getAccessToken() {
                  managedTokenCalls += 1;
                  return "managed-user-token";
                },
              },
              fetchImpl: async () => {
                vkCalls += 1;
                throw new Error("VK must not be called");
              },
            });

            await handler(fakeRequest({ name: "Расписание в телефоне | ОмГМУ" }), response);
            assert.equal(response.statusCode, 503);
            assert.deepEqual(JSON.parse(response.body), { error: "vk_control_not_configured" });
            assert.equal(managedTokenCalls, 0);
            assert.equal(vkCalls, 0);
          });
          `;
          fs.writeFileSync('api/test/vk-group-edit.test.js', testContent.replace(/^          /gm, ''));
          NODE

      - name: Run focused regression
        run: |
          cd api
          node --test test/vk-group-edit.test.js

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "gmarkov634-stack"
          git config user.email "gmarkov634@gmail.com"
          git rm .github/workflows/temp-vk-group-name-patch.yml
          git add api/src/vk-control.js api/test/vk-group-edit.test.js
          git commit -m "vk: allow controlled community name edits"
          git push origin HEAD:agent/vk-group-name-edit
