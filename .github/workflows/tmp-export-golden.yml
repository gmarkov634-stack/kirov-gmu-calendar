name: Temporary KGMU golden export

on:
  push:
    branches:
      - kgmu-worker-integration-regression
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify golden fixture
        run: |
          test -f fixtures/2026-2027-semester-1/normalized/medicine-101-110.normalized.compact.json
          test -f qa/2026-2027-semester-1/medicine-101-110.qa-report.json
          node -e "const f=require('./fixtures/2026-2027-semester-1/normalized/medicine-101-110.normalized.compact.json'); if(f.eventCount!==3412) process.exit(1); console.log(f.eventCount, f.candidateDigest)"
      - uses: actions/upload-artifact@v4
        with:
          name: kgmu-golden-101-110
          path: |
            fixtures/2026-2027-semester-1/normalized/medicine-101-110.normalized.compact.json
            fixtures/2026-2027-semester-1/medicine-101-110.source.json
            qa/2026-2027-semester-1/medicine-101-110.qa-report.json
            parser-rules/v1/manifest.json
          if-no-files-found: error
