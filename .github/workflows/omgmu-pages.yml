name: Medical university landings

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "index.html"
      - "styles.css"
      - "data.js"
      - "app.js"
      - "app-utils.js"
      - "omgmu/**"
      - "site/omgmu/**"
      - ".github/workflows/omgmu-pages.yml"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "styles.css"
      - "data.js"
      - "app.js"
      - "app-utils.js"
      - "omgmu/**"
      - "site/omgmu/**"
      - ".github/workflows/omgmu-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: medical-calendar-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate landing files and catalog
        run: |
          for file in index.html styles.css data.js app.js app-utils.js; do
            test -f "$file"
          done
          for file in index.html styles.css app.js config.js groups.js; do
            test -f "site/omgmu/$file"
          done
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const groupCode = fs.readFileSync('site/omgmu/groups.js', 'utf8');
          const configCode = fs.readFileSync('site/omgmu/config.js', 'utf8');
          const sandbox = { window: {} };
          vm.runInNewContext(groupCode, sandbox);
          vm.runInNewContext(configCode, sandbox);
          const catalog = sandbox.window.OMGMU_GROUPS;
          const config = sandbox.window.OMGMU_CONFIG;
          if (!Array.isArray(catalog)) throw new Error('OMGMU_GROUPS is not an array');
          const groups = catalog.flatMap(item => item.groups || []);
          const unique = new Set(groups);
          const approvedManual = ['2113', '2114', '389', '393'];
          if (groups.length !== 43) throw new Error(`Expected 43 groups, got ${groups.length}`);
          if (unique.size !== groups.length) throw new Error('Duplicate ОмГМУ groups are exposed');
          for (const group of approvedManual) {
            if (!groups.includes(group)) throw new Error(`Approved group ${group} is missing`);
          }
          if (config.checkoutEnabled === true && config.testMode !== true) {
            throw new Error('Production ОмГМУ checkout requires an explicit rollout change');
          }

          const html = fs.readFileSync('site/omgmu/index.html', 'utf8');
          for (const requiredId of ['how', 'order-form', 'order-result', 'selection-summary', 'price-summary', 'restore-order', 'faq']) {
            if (!html.includes(`id="${requiredId}"`)) throw new Error(`Landing UX element missing: ${requiredId}`);
          }
          for (const requiredCopy of ['Оплата проходит через ЮKassa', 'Без автосписаний', 'Открыть последний заказ', 'Это официальный сервис ОмГМУ?']) {
            if (!html.includes(requiredCopy)) throw new Error(`Trust/FAQ copy missing: ${requiredCopy}`);
          }
          if (/name=["']calendar["']/.test(html)) {
            throw new Error('Calendar provider must not be selected before payment; subscription URL is universal');
          }
          if (html.includes('Email для получения ссылки')) {
            throw new Error('Landing must not claim that the subscription URL is delivered by email');
          }

          const app = fs.readFileSync('site/omgmu/app.js', 'utf8');
          for (const required of ['email:', 'groupId:', 'stream,', 'confirmationUrl', 'checkoutEnabled', 'restoreOrderForm', 'resultPanel', 'enableSavedOrderRecovery', 'restoreOrderButton']) {
            if (!app.includes(required)) throw new Error(`Checkout contract marker missing: ${required}`);
          }
          if (!app.includes("window.location.hash === '#order'")) {
            throw new Error('Return-to-group reset guard is missing');
          }
          console.log('Landing validation passed');
          NODE
      - name: Prepare production artifact
        if: github.event_name != 'pull_request'
        env:
          CONFIGURED_API_URL: ${{ vars.CLOUD_RU_API_URL }}
          DEFAULT_API_URL: https://kgmu-calendar-api.containerapps.ru
          SITE_ORIGIN: https://gmarkov634-stack.github.io
        run: |
          CLOUD_RU_API_URL="${CONFIGURED_API_URL:-$DEFAULT_API_URL}"
          case "$CLOUD_RU_API_URL" in
            https://*) ;;
            *) echo "CLOUD_RU_API_URL must use https://" >&2; exit 2 ;;
          esac
          CLOUD_RU_API_URL="${CLOUD_RU_API_URL%/}"

          health="$(curl --fail --silent --show-error --max-time 20 "$CLOUD_RU_API_URL/health")"
          echo "$health" | grep -q '"status":"ok"' || {
            echo "Cloud.ru API health check failed: $health" >&2
            exit 2
          }

          cors_headers="$(curl --fail --silent --show-error --max-time 20 -D - -o /dev/null \
            -X OPTIONS \
            -H "Origin: $SITE_ORIGIN" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" \
            "$CLOUD_RU_API_URL/api/v2/payments" | tr -d '\r')"
          echo "$cors_headers" | grep -iq "^access-control-allow-origin: $SITE_ORIGIN$" || {
            echo "Cloud.ru API CORS check failed for $SITE_ORIGIN" >&2
            echo "$cors_headers" >&2
            exit 2
          }

          rm -rf dist/site
          mkdir -p dist/site/omgmu
          cp index.html styles.css data.js app.js app-utils.js dist/site/
          cp -R site/omgmu/. dist/site/omgmu/
          touch dist/site/.nojekyll

          API_URL="$CLOUD_RU_API_URL" node - <<'NODE'
          const fs = require('fs');
          const path = 'dist/site/omgmu/config.js';
          const apiUrl = process.env.API_URL;
          const source = fs.readFileSync(path, 'utf8');
          const pattern = /apiBaseUrl:\s*"https:\/\/[^\"]+"/;
          if (!pattern.test(source)) throw new Error('apiBaseUrl setting missing');
          fs.writeFileSync(path, source.replace(pattern, `apiBaseUrl: "${apiUrl}"`));
          NODE
          ! grep -R "REPLACE_WITH_CLOUD_RU_API" dist/site
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
