name: Medical university landings

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "index.html"
      - "styles.css"
      - "landing-v1.css"
      - "data.js"
      - "app.js"
      - "app-utils.js"
      - "omgmu/**"
      - "site/omgmu/**"
      - ".github/workflows/omgmu-pages.yml"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "styles.css"
      - "landing-v1.css"
      - "data.js"
      - "app.js"
      - "app-utils.js"
      - "omgmu/**"
      - "site/omgmu/**"
      - ".github/workflows/omgmu-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: medical-calendar-pages
  cancel-in-progress: false

env:
  UGMU_LAUNCH_SOURCE_SHA: 11c37ac0a6513c6621c297aec5c6dbceb42ede3b

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout exact UGMU launch source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.UGMU_LAUNCH_SOURCE_SHA }}
          path: ugmu-feature

      - name: Validate landing files and live commercial boundary
        run: |
          for file in index.html styles.css landing-v1.css data.js app.js app-utils.js; do
            test -f "$file"
          done
          for file in index.html styles.css mobile.css app.js config.js ui.js; do
            test -f "site/omgmu/$file"
          done
          for file in index.html styles.css mobile.css app.js config.js; do
            test -f "ugmu-feature/site/ugmu/$file"
          done
          test ! -f site/omgmu/groups.js
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const configCode = fs.readFileSync('site/omgmu/config.js', 'utf8');
          const sandbox = { window: {} };
          vm.runInNewContext(configCode, sandbox);
          const config = sandbox.window.OMGMU_CONFIG;
          if (!config || config.university !== 'omgmu') throw new Error('OmGMU identity config is missing');
          if (config.defaultPlan !== 'semester') throw new Error('OmGMU default commercial plan must be explicit');
          for (const forbidden of ['checkoutEnabled', 'testMode', 'priceRub']) {
            if (Object.prototype.hasOwnProperty.call(config, forbidden) || configCode.includes(forbidden)) {
              throw new Error(`Static commercial authority must not exist in OmGMU config: ${forbidden}`);
            }
          }
          if (configCode.includes('mobile.css') || configCode.includes('document.currentScript')) {
            throw new Error('OmGMU config must not dynamically inject the mobile stylesheet');
          }

          const mobileCss = fs.readFileSync('site/omgmu/mobile.css', 'utf8');
          for (const marker of ['max-width: 760px', 'font-size: 16px', 'safe-area-inset-bottom', 'prefers-reduced-motion']) {
            if (!mobileCss.includes(marker)) throw new Error(`Mobile UX marker missing: ${marker}`);
          }

          const html = fs.readFileSync('site/omgmu/index.html', 'utf8');
          if ((html.match(/mobile\.css/g) || []).length !== 1) {
            throw new Error('OmGMU mobile stylesheet must be linked exactly once in HTML');
          }
          for (const requiredId of ['how', 'order-form', 'order-result', 'selection-summary', 'price-summary', 'runtime-price', 'restore-order', 'faq']) {
            if (!html.includes(`id="${requiredId}"`)) throw new Error(`Landing UX element missing: ${requiredId}`);
          }
          for (const requiredCopy of ['Оплата проходит через ЮKassa', 'Без автосписаний', 'Открыть последний заказ', 'Это официальный сервис ОмГМУ?']) {
            if (!html.includes(requiredCopy)) throw new Error(`Trust/FAQ copy missing: ${requiredCopy}`);
          }
          for (const program of ['medicine-international', 'medicine', 'pediatrics', 'dentistry', 'preventive-medicine', 'pharmacy']) {
            if (!html.includes(`data-program="${program}"`)) throw new Error(`Program card missing: ${program}`);
          }
          if (/name=["']calendar["']/.test(html)) {
            throw new Error('Calendar provider must not be selected before payment; subscription URL is universal');
          }
          if (html.includes('Email для получения ссылки')) {
            throw new Error('Landing must not claim that the subscription URL is delivered by email');
          }
          if (html.includes('groups.js') || html.includes('>490 ₽<') || html.includes('<span class="badge">Доступно</span>')) {
            throw new Error('OmGMU landing contains stale static commercial availability');
          }
          if (!html.includes('type="submit" disabled')) {
            throw new Error('OmGMU checkout must start fail-closed before runtime meta is loaded');
          }

          const app = fs.readFileSync('site/omgmu/app.js', 'utf8');
          for (const required of [
            'email:',
            'groupId:',
            'stream: group.stream ?? null',
            'plan: config.defaultPlan',
            'confirmationUrl',
            '/api/v2/meta',
            '/api/v2/catalog/',
            "runtime.sales === 'open'",
            'meta.paymentMode',
            'meta.offers?.[config.defaultPlan]?.price',
            'restoreOrderForm',
            'resultPanel',
            'enableSavedOrderRecovery',
            'restoreOrderButton',
          ]) {
            if (!app.includes(required)) throw new Error(`Live checkout contract marker missing: ${required}`);
          }
          for (const forbidden of ['window.OMGMU_GROUPS', 'checkoutEnabled', 'config.testMode', 'config.priceRub']) {
            if (app.includes(forbidden)) throw new Error(`Stale static commercial marker remains: ${forbidden}`);
          }
          if (!app.includes("window.location.hash === '#order'")) {
            throw new Error('Return-to-group reset guard is missing');
          }

          const ugmuHtml = fs.readFileSync('ugmu-feature/site/ugmu/index.html', 'utf8');
          const ugmuApp = fs.readFileSync('ugmu-feature/site/ugmu/app.js', 'utf8');
          const ugmuConfig = fs.readFileSync('ugmu-feature/site/ugmu/config.js', 'utf8');
          for (const marker of ['name="robots" content="noindex,follow"', 'Предзапусковый режим', 'type="submit" disabled']) {
            if (!ugmuHtml.includes(marker)) throw new Error(`Pinned UGMU source marker missing: ${marker}`);
          }
          for (const marker of ['runtime.sales === "open"', 'runtime.paymentMode === "live"', '/api/v2/meta', '/api/v2/payments']) {
            if (!ugmuApp.includes(marker)) throw new Error(`Pinned UGMU checkout marker missing: ${marker}`);
          }
          if (!ugmuConfig.includes('university: "ugmu"')) throw new Error('Pinned UGMU identity missing');
          console.log('Landing live commercial boundary validation passed');
          NODE

      - name: Prepare production artifact
        if: github.event_name != 'pull_request'
        env:
          CONFIGURED_API_URL: ${{ vars.CLOUD_RU_API_URL }}
          DEFAULT_API_URL: https://kgmu-calendar-api.containerapps.ru
          SITE_ORIGIN: https://gmarkov634-stack.github.io
        run: |
          set -euo pipefail
          CLOUD_RU_API_URL="${CONFIGURED_API_URL:-$DEFAULT_API_URL}"
          case "$CLOUD_RU_API_URL" in
            https://*) ;;
            *) echo "CLOUD_RU_API_URL must use https://" >&2; exit 2 ;;
          esac
          CLOUD_RU_API_URL="${CLOUD_RU_API_URL%/}"

          health="$(curl --fail --silent --show-error --max-time 20 "$CLOUD_RU_API_URL/health")"
          echo "$health" | grep -q '"status":"ok"' || {
            echo "Cloud.ru API health check failed: $health" >&2
            exit 2
          }

          cors_headers="$(curl --fail --silent --show-error --max-time 20 -D - -o /dev/null \
            -X OPTIONS \
            -H "Origin: $SITE_ORIGIN" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" \
            "$CLOUD_RU_API_URL/api/v2/payments" | tr -d '\r')"
          echo "$cors_headers" | grep -iq "^access-control-allow-origin: $SITE_ORIGIN$" || {
            echo "Cloud.ru API CORS check failed for $SITE_ORIGIN" >&2
            echo "$cors_headers" >&2
            exit 2
          }

          rm -rf dist/site
          mkdir -p dist/site/omgmu dist/site/ugmu
          cp index.html styles.css landing-v1.css data.js app.js app-utils.js dist/site/
          cp -R site/omgmu/. dist/site/omgmu/
          cp -R ugmu-feature/site/ugmu/. dist/site/ugmu/
          touch dist/site/.nojekyll

          API_URL="$CLOUD_RU_API_URL" python3 - <<'PY'
          import os,re
          from pathlib import Path
          api=os.environ['API_URL'].rstrip('/')
          targets=[
            (Path('dist/site/data.js'), r'apiBase:\s*"https://[^\"]+"', f'apiBase: "{api}"'),
            (Path('dist/site/omgmu/config.js'), r'apiBaseUrl:\s*"https://[^\"]+"', f'apiBaseUrl: "{api}"'),
            (Path('dist/site/ugmu/config.js'), r'apiBaseUrl:\s*"https://[^\"]+"', f'apiBaseUrl: "{api}"'),
          ]
          for p,pattern,replacement in targets:
            text=p.read_text(encoding='utf-8'); text,n=re.subn(pattern,replacement,text,count=1); assert n==1,p; p.write_text(text,encoding='utf-8')

          hp=Path('dist/site/ugmu/index.html'); h=hp.read_text(encoding='utf-8')
          replacements={
            'name="robots" content="noindex,follow"':'name="robots" content="index,follow"',
            'Проверенное расписание УГМУ для ОЛД 101–112. Checkout подготовлен и откроется только после production-разрешения продаж и live-проверки ЮKassa.':'Проверенное расписание УГМУ для ОЛД 101–112. Оплата доступна через ЮKassa, после оплаты выдаётся персональная ссылка на календарь.',
            'можно будет подключить одной персональной ссылкой':'можно подключить одной персональной ссылкой',
            'продажи пока<br>закрыты':'оплата<br>доступна',
            'Предзапусковый режим':'Календарь доступен',
            'Интерфейс checkout уже подключён к production API, но сам сервер пока держит продажи УГМУ закрытыми. GitHub Pages на этом этапе не публикуется.':'Оплата для утверждённых групп ОЛД 101–112 доступна через ЮKassa. Публичное бесплатное расписание и trials остаются закрытыми.',
            '<span class="badge">Подготовлено</span>':'<span class="badge">Доступно</span>',
            'Форма уже работает с production API. Кнопка оплаты включится только когда сервер разрешит продажи УГМУ и ЮKassa будет подтверждена в live-режиме.':'Форма работает с production API и включает оплату только при подтверждённом live-режиме ЮKassa.',
            'Осталась live-проверка ЮKassa и финальная активация':'ЮKassa подтверждена в live-режиме; оплата доступна',
            'Независимый сервис · предзапусковая подготовка':'Независимый сервис электронных календарей',
          }
          for a,b in replacements.items():
            assert a in h,a
            h=h.replace(a,b)
          hp.write_text(h,encoding='utf-8')

          app=Path('dist/site/ugmu/app.js').read_text(encoding='utf-8')
          cfg=Path('dist/site/ugmu/config.js').read_text(encoding='utf-8')
          assert 'runtime.sales === "open"' in app
          assert 'runtime.paymentMode === "live"' in app
          assert '/api/v2/catalog/ugmu' not in app and '/api/v2/schedules/ugmu' not in app
          assert 'name="robots" content="index,follow"' in h
          assert 'Календарь доступен' in h and 'Предзапусковый режим' not in h
          assert f'apiBaseUrl: "{api}"' in cfg
          print('UGMU_PRESERVED_IN_SHARED_PAGES_ARTIFACT')
          PY

          grep -q "apiBase: \"$CLOUD_RU_API_URL\"" dist/site/data.js
          grep -q "apiBaseUrl: \"$CLOUD_RU_API_URL\"" dist/site/omgmu/config.js
          grep -q "apiBaseUrl: \"$CLOUD_RU_API_URL\"" dist/site/ugmu/config.js
          grep -q 'name="robots" content="index,follow"' dist/site/ugmu/index.html
          grep -q 'Календарь доступен' dist/site/ugmu/index.html
          ! grep -R "REPLACE_WITH_CLOUD_RU_API" dist/site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify all production landing paths
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            root="$(curl -sS -o /tmp/root -w '%{http_code}' --max-time 20 "https://gmarkov634-stack.github.io/kirov-gmu-calendar/?shared=${GITHUB_RUN_ID}&attempt=$attempt" || true)"
            omgmu="$(curl -sS -o /tmp/omgmu -w '%{http_code}' --max-time 20 "https://gmarkov634-stack.github.io/kirov-gmu-calendar/omgmu/?shared=${GITHUB_RUN_ID}&attempt=$attempt" || true)"
            ugmu="$(curl -sS -o /tmp/ugmu -w '%{http_code}' --max-time 20 "https://gmarkov634-stack.github.io/kirov-gmu-calendar/ugmu/?shared=${GITHUB_RUN_ID}&attempt=$attempt" || true)"
            if [ "$root" = 200 ] && [ "$omgmu" = 200 ] && [ "$ugmu" = 200 ] && grep -q 'name="robots" content="index,follow"' /tmp/ugmu && grep -q 'Календарь доступен' /tmp/ugmu; then
              echo "SHARED_PAGES_ALL_LANDINGS_SAFE root=$root omgmu=$omgmu ugmu=$ugmu"
              exit 0
            fi
            sleep 5
          done
          echo "Shared Pages verification failed" >&2
          exit 2
