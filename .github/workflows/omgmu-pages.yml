name: Medical university landings

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "index.html"
      - "styles.css"
      - "landing-v1.css"
      - "data.js"
      - "app.js"
      - "app-utils.js"
      - "omgmu/**"
      - "site/omgmu/**"
      - ".github/workflows/omgmu-pages.yml"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "styles.css"
      - "landing-v1.css"
      - "data.js"
      - "app.js"
      - "app-utils.js"
      - "omgmu/**"
      - "site/omgmu/**"
      - ".github/workflows/omgmu-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: medical-calendar-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate landing files and server-owned catalog contract
        run: |
          for file in index.html styles.css landing-v1.css data.js app.js app-utils.js; do
            test -f "$file"
          done
          for file in index.html styles.css mobile.css app.js config.js; do
            test -f "site/omgmu/$file"
          done
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const configCode = fs.readFileSync('site/omgmu/config.js', 'utf8');
          const sandbox = { window: {}, document: undefined };
          vm.runInNewContext(configCode, sandbox);
          const config = sandbox.window.OMGMU_CONFIG;
          if (config.university !== 'omgmu') throw new Error('ОмГМУ university id is missing');
          for (const forbidden of ['program', 'priceRub', 'testMode', 'checkoutEnabled']) {
            if (Object.prototype.hasOwnProperty.call(config, forbidden)) {
              throw new Error(`Commercial truth must not be static in config: ${forbidden}`);
            }
          }
          if (!config.apiBaseUrl?.startsWith('https://')) throw new Error('HTTPS API base is required');
          if (config.paymentPath !== '/api/v2/payments') throw new Error('Payment path mismatch');

          const mobileCss = fs.readFileSync('site/omgmu/mobile.css', 'utf8');
          for (const marker of ['max-width: 760px', 'font-size: 16px', 'safe-area-inset-bottom', 'prefers-reduced-motion']) {
            if (!mobileCss.includes(marker)) throw new Error(`Mobile UX marker missing: ${marker}`);
          }

          const html = fs.readFileSync('site/omgmu/index.html', 'utf8');
          for (const requiredId of ['program-grid', 'program', 'course', 'group', 'order-form', 'order-result', 'selection-summary', 'price-summary', 'hero-price-value', 'restore-order', 'faq']) {
            if (!html.includes(`id="${requiredId}"`)) throw new Error(`Landing UX element missing: ${requiredId}`);
          }
          for (const requiredCopy of ['Оплата проходит через ЮKassa', 'Без автосписаний', 'Открыть последний заказ', 'Это официальный сервис ОмГМУ?']) {
            if (!html.includes(requiredCopy)) throw new Error(`Trust/FAQ copy missing: ${requiredCopy}`);
          }
          if (html.includes('groups.js')) throw new Error('Static groups.js must not be loaded by the commercial landing');
          if (/\b490\s*₽/.test(html)) throw new Error('Static commercial price must not be embedded in HTML');
          if (/name=["']calendar["']/.test(html)) throw new Error('Calendar provider must not be selected before payment');
          if (html.includes('Email для получения ссылки')) throw new Error('Landing must not claim that the subscription URL is delivered by email');

          const app = fs.readFileSync('site/omgmu/app.js', 'utf8');
          for (const required of [
            '/offer',
            '/programs',
            '/groups',
            'selectedGroup.groupId',
            "state.offer?.sales !== 'open'",
            "plan: 'semester'",
            'confirmationUrl',
            'restoreOrderForm',
            'enableSavedOrderRecovery',
          ]) {
            if (!app.includes(required)) throw new Error(`Server-owned checkout marker missing: ${required}`);
          }
          for (const forbidden of ['window.OMGMU_GROUPS', 'buildGroupId(', 'config.priceRub', 'config.checkoutEnabled', 'config.testMode']) {
            if (app.includes(forbidden)) throw new Error(`Legacy static checkout marker remains: ${forbidden}`);
          }
          if (!app.includes("window.location.hash === '#order'")) throw new Error('Return-to-group reset guard is missing');
          console.log('Landing validation passed');
          NODE
      - name: Prepare production artifact
        if: github.event_name != 'pull_request'
        env:
          CONFIGURED_API_URL: ${{ vars.CLOUD_RU_API_URL }}
          DEFAULT_API_URL: https://kgmu-calendar-api.containerapps.ru
          SITE_ORIGIN: https://gmarkov634-stack.github.io
        run: |
          CLOUD_RU_API_URL="${CONFIGURED_API_URL:-$DEFAULT_API_URL}"
          case "$CLOUD_RU_API_URL" in
            https://*) ;;
            *) echo "CLOUD_RU_API_URL must use https://" >&2; exit 2 ;;
          esac
          CLOUD_RU_API_URL="${CLOUD_RU_API_URL%/}"

          health="$(curl --fail --silent --show-error --max-time 20 "$CLOUD_RU_API_URL/health")"
          echo "$health" | grep -q '"status":"ok"' || {
            echo "Cloud.ru API health check failed: $health" >&2
            exit 2
          }

          cors_headers="$(curl --fail --silent --show-error --max-time 20 -D - -o /dev/null \
            -X OPTIONS \
            -H "Origin: $SITE_ORIGIN" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" \
            "$CLOUD_RU_API_URL/api/v2/payments" | tr -d '\r')"
          echo "$cors_headers" | grep -iq "^access-control-allow-origin: $SITE_ORIGIN$" || {
            echo "Cloud.ru API CORS check failed for $SITE_ORIGIN" >&2
            echo "$cors_headers" >&2
            exit 2
          }

          rm -rf dist/site
          mkdir -p dist/site/omgmu
          cp index.html styles.css landing-v1.css data.js app.js app-utils.js dist/site/
          cp -R site/omgmu/. dist/site/omgmu/
          touch dist/site/.nojekyll

          API_URL="$CLOUD_RU_API_URL" node - <<'NODE'
          const fs = require('fs');
          const apiUrl = process.env.API_URL;
          const targets = [
            {
              path: 'dist/site/data.js',
              pattern: /apiBase:\s*"https:\/\/[^\"]+"/,
              replacement: `apiBase: "${apiUrl}"`,
            },
            {
              path: 'dist/site/omgmu/config.js',
              pattern: /apiBaseUrl:\s*"https:\/\/[^\"]+"/,
              replacement: `apiBaseUrl: "${apiUrl}"`,
            },
          ];
          for (const target of targets) {
            const source = fs.readFileSync(target.path, 'utf8');
            if (!target.pattern.test(source)) throw new Error(`API base setting missing: ${target.path}`);
            fs.writeFileSync(target.path, source.replace(target.pattern, target.replacement));
          }
          NODE
          grep -q "apiBase: \"$CLOUD_RU_API_URL\"" dist/site/data.js
          grep -q "apiBaseUrl: \"$CLOUD_RU_API_URL\"" dist/site/omgmu/config.js
          ! grep -R "REPLACE_WITH_CLOUD_RU_API" dist/site
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
