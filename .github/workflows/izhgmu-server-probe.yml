name: Capture IzhGMU source through production server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru
      SOURCE_PATH: /images/avtors/ooupr/4_курс_л.ф._осень_2025-2026.xls
    steps:
      - name: Compare direct and production-server egress to IzhGMU
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          source="https://www.igma.ru${SOURCE_PATH}"
          encoded="$(SOURCE="$source" python3 - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ['SOURCE'], safe=''))
          PY
          )"

          direct_code="$(curl --max-time 25 --location --silent --show-error \
            --output direct-www.bin --write-out '%{http_code}' "$source" || true)"
          echo "DIRECT_WWW_HTTP=$direct_code"
          if [ -s direct-www.bin ]; then
            python3 - <<'PY'
          from pathlib import Path
          data=Path('direct-www.bin').read_bytes()
          print('DIRECT_BYTES', len(data), 'MAGIC', data[:8].hex())
          PY
          fi

          probe_url="${PRODUCTION_BASE_URL}/api/v1/admin/izhgmu/source-probe?url=${encoded}"
          server_code="$(curl --max-time 35 --location --silent --show-error \
            --dump-header probe-www.headers.txt \
            --output probe-www.json \
            --write-out '%{http_code}' "$probe_url" || true)"
          echo "SERVER_WWW_HTTP=$server_code"
          if [ -f probe-www.json ]; then cat probe-www.json; echo; fi
          if [ "$server_code" = "200" ]; then echo "working_source=$source" >> "$GITHUB_OUTPUT"; fi

      - name: Fetch verified spreadsheet bytes through production API
        if: steps.probe.outputs.working_source != ''
        env:
          WORKING_SOURCE: ${{ steps.probe.outputs.working_source }}
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(python3 - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ['WORKING_SOURCE'], safe=''))
          PY
          )"
          curl --max-time 35 --fail-with-body --location --silent --show-error \
            --dump-header izhgmu-source.headers.txt \
            --output izhgmu-source.xls \
            "${PRODUCTION_BASE_URL}/api/v1/admin/izhgmu/source-probe?url=${encoded}&format=file"
          sha256sum izhgmu-source.xls | tee izhgmu-source.sha256

      - name: Upload diagnostics and any captured source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izhgmu-server-source
          path: |
            direct-www.bin
            probe-www.json
            probe-www.headers.txt
            izhgmu-source.xls
            izhgmu-source.headers.txt
            izhgmu-source.sha256
          if-no-files-found: error
          retention-days: 7
