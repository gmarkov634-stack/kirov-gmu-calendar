name: Capture IzhGMU source through production server

on:
  push:
    paths:
      - .github/workflows/izhgmu-server-probe.yml
  workflow_run:
    workflows:
      - Deploy API to Cloud.ru
    types:
      - completed

permissions:
  contents: read

jobs:
  capture:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru
      SOURCE_PATH: /images/avtors/ooupr/4_курс_л.ф._осень_2025-2026.xls
    steps:
      - name: Compare direct and production-server egress to IzhGMU
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          working_source=""
          for host in www.igma.ru igma.ru; do
            if [ "$host" = "www.igma.ru" ]; then label="www"; else label="bare"; fi
            source="https://${host}${SOURCE_PATH}"
            encoded="$(SOURCE="$source" python3 - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ['SOURCE'], safe=''))
          PY
            )"

            direct_code="$(curl --max-time 25 --location --silent --show-error \
              --output "direct-${label}.bin" --write-out '%{http_code}' "$source" || true)"
            echo "DIRECT_${label^^}_HTTP=$direct_code"
            if [ -s "direct-${label}.bin" ]; then
              python3 - "$label" <<'PY'
          from pathlib import Path
          import sys
          p=Path(f'direct-{sys.argv[1]}.bin')
          data=p.read_bytes()
          print('DIRECT_BYTES', len(data), 'MAGIC', data[:8].hex())
          PY
            fi

            probe_url="${PRODUCTION_BASE_URL}/api/v1/admin/izhgmu/source-probe?url=${encoded}"
            server_code="$(curl --max-time 35 --location --silent --show-error \
              --dump-header "probe-${label}.headers.txt" \
              --output "probe-${label}.json" \
              --write-out '%{http_code}' "$probe_url" || true)"
            echo "SERVER_${label^^}_HTTP=$server_code"
            if [ -f "probe-${label}.json" ]; then cat "probe-${label}.json"; echo; fi
            if [ "$server_code" = "200" ]; then working_source="$source"; fi
          done
          echo "working_source=$working_source" >> "$GITHUB_OUTPUT"

      - name: Fetch verified spreadsheet bytes through production API
        if: steps.probe.outputs.working_source != ''
        env:
          WORKING_SOURCE: ${{ steps.probe.outputs.working_source }}
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(python3 - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ['WORKING_SOURCE'], safe=''))
          PY
          )"
          curl --max-time 35 --fail-with-body --location --silent --show-error \
            --dump-header izhgmu-source.headers.txt \
            --output izhgmu-source.xls \
            "${PRODUCTION_BASE_URL}/api/v1/admin/izhgmu/source-probe?url=${encoded}&format=file"
          test -s izhgmu-source.xls
          python3 - <<'PY'
          from pathlib import Path
          data=Path('izhgmu-source.xls').read_bytes()
          ole=bytes.fromhex('d0cf11e0a1b11ae1')
          assert data.startswith(ole), f'unexpected magic: {data[:8].hex()}'
          print('IZHGMU_SERVER_FETCH_OK', {'bytes': len(data), 'magic': data[:8].hex()})
          PY
          sha256sum izhgmu-source.xls | tee izhgmu-source.sha256

      - name: Upload diagnostics and any captured source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izhgmu-server-source
          path: |
            direct-www.bin
            direct-bare.bin
            probe-www.json
            probe-www.headers.txt
            probe-bare.json
            probe-bare.headers.txt
            izhgmu-source.xls
            izhgmu-source.headers.txt
            izhgmu-source.sha256
          if-no-files-found: error
          retention-days: 7
