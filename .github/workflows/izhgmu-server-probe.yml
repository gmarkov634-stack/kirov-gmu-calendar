name: Capture IzhGMU source through production server

on:
  push:
    paths:
      - .github/workflows/izhgmu-server-probe.yml
  workflow_run:
    workflows:
      - Deploy API to Cloud.ru
    types:
      - completed

permissions:
  contents: read

jobs:
  capture:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru
      SOURCE_URL: https://www.igma.ru/images/avtors/ooupr/4_курс_л.ф._осень_2025-2026.xls
    steps:
      - name: Probe official IzhGMU spreadsheet through production API
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(python3 - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ['SOURCE_URL'], safe=''))
          PY
          )"
          probe_url="${PRODUCTION_BASE_URL}/api/v1/admin/izhgmu/source-probe?url=${encoded}"
          http_code="$(curl --location --silent --show-error \
            --dump-header izhgmu-probe.headers.txt \
            --output izhgmu-probe.json \
            --write-out '%{http_code}' \
            "$probe_url")"
          echo "PROBE_HTTP=$http_code"
          cat izhgmu-probe.json
          echo
          echo "http_code=$http_code" >> "$GITHUB_OUTPUT"

      - name: Fetch verified spreadsheet bytes through production API
        if: steps.probe.outputs.http_code == '200'
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(python3 - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ['SOURCE_URL'], safe=''))
          PY
          )"
          curl --fail-with-body --location --silent --show-error \
            --dump-header izhgmu-source.headers.txt \
            --output izhgmu-source.xls \
            "${PRODUCTION_BASE_URL}/api/v1/admin/izhgmu/source-probe?url=${encoded}&format=file"
          test -s izhgmu-source.xls
          python3 - <<'PY'
          from pathlib import Path
          data=Path('izhgmu-source.xls').read_bytes()
          ole=bytes.fromhex('d0cf11e0a1b11ae1')
          assert data.startswith(ole), f'unexpected magic: {data[:8].hex()}'
          print('IZHGMU_SERVER_FETCH_OK', {'bytes': len(data), 'magic': data[:8].hex()})
          PY
          sha256sum izhgmu-source.xls | tee izhgmu-source.sha256

      - name: Upload probe diagnostics and captured source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izhgmu-server-source
          path: |
            izhgmu-probe.json
            izhgmu-probe.headers.txt
            izhgmu-source.xls
            izhgmu-source.headers.txt
            izhgmu-source.sha256
          if-no-files-found: error
          retention-days: 7
