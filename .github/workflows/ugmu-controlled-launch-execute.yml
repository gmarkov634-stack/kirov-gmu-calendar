name: UGMU controlled launch execute

on:
  push:
    branches:
      - agent/ugmu-scaffold-20260820
    paths:
      - "universities/ugmu/controlled-launch-execute.json"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ugmu-controlled-production-launch
  cancel-in-progress: false

env:
  IMAGE: kgmu-calendar-api.cr.cloud.ru/api
  CONTAINER_NAME: kgmu-calendar-api
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru
  UGMU_SITE_URL: https://gmarkov634-stack.github.io/kirov-gmu-calendar/ugmu/
  UGMU_SOURCE_SHA: 34612248bba201096d6566cacb37c53be01d3f84eddc214bda2a594b46fb24f8
  YOOKASSA_SECRET_NAME: yookassa-secret-key

jobs:
  activate-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      target_image: ${{ steps.image.outputs.target_image }}
    steps:
      - name: Checkout authorized launch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify one-shot authority and approved scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          authority=json.load(open('universities/ugmu/controlled-launch-execute.json', encoding='utf-8'))
          plan=json.load(open('universities/ugmu/controlled-activation-plan.json', encoding='utf-8'))
          assert authority == {
              'version': 1,
              'kind': 'ugmu-controlled-launch-execute',
              'authorizedStep': 28,
              'authorizedBranch': 'agent/ugmu-scaffold-20260820',
              'preparedCodeHead': authority['preparedCodeHead'],
              'sourceSha256': '34612248bba201096d6566cacb37c53be01d3f84eddc214bda2a594b46fb24f8',
              'groups': [f'ОЛД {n}' for n in range(101,113)],
              'backendActivation': True,
              'pagesActivation': True,
              'ugmuSalesEnabled': True,
              'ugmuActive': True,
              'publicEndpointsEnabled': False,
              'publicIcsEnabled': False,
              'trialsEnabled': False,
              'globalSalesEnabled': False,
              'paymentMode': 'live',
              'automaticRollback': True,
              'userAuthorization': 'Далее',
          }
          prepared=authority['preparedCodeHead']
          assert isinstance(prepared,str) and len(prepared)==40 and all(c in '0123456789abcdef' for c in prepared)
          changed=subprocess.check_output(['git','diff','--name-only',prepared,'HEAD'], text=True).splitlines()
          assert changed == ['universities/ugmu/controlled-launch-execute.json'], changed
          assert plan['authority']['explicitLaunchAuthorizationReceived'] is True
          assert plan['nextRequiredBoundary'] == 'controlled-launch-activation'
          blocker={x['id']:x for x in plan['mandatoryPreactivationBlocks']}
          assert all(blocker[k]['state']=='completed' for k in (
              'stage-first-stream-production-schedules','isolate-global-sales-gate','wire-live-ugmu-landing','validate-live-yookassa-mode'))
          assert plan['scope']['sourceSha256'] == authority['sourceSha256']
          assert plan['scope']['groups'] == authority['groups']
          print('UGMU_LAUNCH_AUTHORITY_SAFE', {'preparedCodeHead':prepared,'groups':len(authority['groups']),'public':False,'trials':False})
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Run API regression before mutation
        working-directory: api
        run: |
          npm ci
          npm test

      - name: Setup Go for Secret Management preflight
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Log in to Cloud.ru Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: kgmu-calendar-api.cr.cloud.ru
          username: ${{ secrets.EVO_CR_LOGIN }}
          password: ${{ secrets.EVO_CR_PWD }}

      - name: Build and push immutable launch image
        shell: bash
        run: |
          set -euo pipefail
          docker build -t "${IMAGE}:${GITHUB_SHA}" ./api
          docker push "${IMAGE}:${GITHUB_SHA}"

      - name: Resolve immutable launch image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          inspect="$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}")"
          digest="$(printf '%s\n' "$inspect" | awk '/^Digest:/ {print $2; exit}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          target_image="${IMAGE}@${digest}"
          echo "TARGET_IMAGE_SAFE=$target_image"
          echo "target_image=$target_image" >> "$GITHUB_OUTPUT"

      - name: Live provider preflight and reversible backend activation
        id: activate
        env:
          CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
          CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
          TARGET_IMAGE: ${{ steps.image.outputs.target_image }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          auth_payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({'keyId':os.environ['CLOUDRU_KEY_ID'],'secret':os.environ['CLOUDRU_KEY_SECRET']}))
          PY
          )"
          test "$(curl --silent --show-error --output /tmp/cloud-token.json --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data "$auth_payload" 'https://iam.api.cloud.ru/api/v1/auth/token')" = "200"
          readarray -t auth < <(python3 - <<'PY'
          import base64,json
          body=json.load(open('/tmp/cloud-token.json',encoding='utf-8')); token=body['access_token']
          parts=token.split('.'); payload=parts[1]+'='*((4-len(parts[1])%4)%4); claims=json.loads(base64.urlsafe_b64decode(payload.encode()).decode())
          print(token); print(claims['project_id']); print(claims.get('sub_id') or claims['sub'])
          PY
          )
          token="${auth[0]}"; project_id="${auth[1]}"; subject_id="${auth[2]}"; rm -f /tmp/cloud-token.json
          echo "::add-mask::$token"
          get_url="https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$project_id"
          patch_url="https://containers.api.cloud.ru/v2/containers/${CONTAINER_NAME}?projectId=$project_id"

          permissions_url="https://iam.api.cloud.ru/api/v1/permissions?subjectId=$subject_id&resourceId=$project_id"
          test "$(curl --silent --show-error --output /tmp/permissions.json --write-out '%{http_code}' --header "Authorization: Bearer $token" "$permissions_url")" = "200"
          python3 - <<'PY'
          import json
          body=json.load(open('/tmp/permissions.json',encoding='utf-8')); rows=body if isinstance(body,list) else body.get('permissions') or body.get('data') or body.get('items') or []
          roles={r.get('role'):r.get('enabled') for r in rows if isinstance(r,dict)}
          assert roles.get('serverless-containers.admin') is True
          assert roles.get('scsm.user') is True
          print('CLOUD_RBAC_SAFE', {'serverless-containers.admin':True,'scsm.user':True})
          PY
          rm -f /tmp/permissions.json

          test "$(curl --silent --show-error --output /tmp/before.json --write-out '%{http_code}' --header "Authorization: Bearer $token" "$get_url")" = "200"
          python3 - <<'PY'
          import json
          app=json.load(open('/tmp/before.json',encoding='utf-8')); assert app.get('status')=='running'
          c=app['template']['containers'][0]; env={x.get('name'):x for x in c.get('env',[]) if isinstance(x,dict)}
          assert env.get('COMMERCIAL_SALES_ENABLED',{}).get('value') != 'true'
          assert env.get('UGMU_SALES_ENABLED',{}).get('value') != 'true'
          assert env.get('TRIALS_ENABLED',{}).get('value') != 'true'
          assert env.get('YOOKASSA_TEST_MODE',{}).get('value') == 'false'
          assert env.get('YOOKASSA_SECRET_KEY',{}).get('type') == 'secret'
          shop=str(env.get('YOOKASSA_SHOP_ID',{}).get('value') or ''); assert shop
          open('/tmp/shop','w',encoding='utf-8').write(shop)
          print('BACKEND_PREACTIVATION_SAFE', {'running':True,'globalSales':False,'ugmuSales':False,'trials':False,'paymentMode':'live','secretManaged':True})
          PY

          mkdir -p /tmp/provider && cd /tmp/provider
          cat > go.mod <<'EOF'
          module launchpreflight
          go 1.23.0
          require (
            github.com/cloudru-tech/secret-manager-sdk v1.1.1
            google.golang.org/grpc v1.70.0
          )
          EOF
          cat > main.go <<'EOF'
          package main
          import("context";"encoding/json";"fmt";"io";"net/http";"os";"strings";"time"; sm "github.com/cloudru-tech/secret-manager-sdk"; v2 "github.com/cloudru-tech/secret-manager-sdk/api/v2";"google.golang.org/grpc/metadata")
          func must(n string)string{v:=os.Getenv(n);if v==""{panic("missing env")};return v}
          func main(){cl,e:=sm.New(&sm.Config{Host:"secretmanager.api.cloud.ru:443"});if e!=nil{panic(e)};defer cl.Close();ctx,c:=context.WithTimeout(context.Background(),30*time.Second);defer c();ctx=metadata.AppendToOutgoingContext(ctx,"authorization","Bearer "+must("TOKEN"));sr,e:=cl.V2.SecretService.Search(ctx,&v2.SearchSecretRequest{ProjectId:must("PROJECT"),Depth:-1});if e!=nil{panic(e)};target:=must("SECRET");var matches []string;for _,s:=range sr.GetSecrets(){p:=s.GetPath();if p==target||strings.HasSuffix(p,"/"+target){matches=append(matches,p)}};if len(matches)!=1{panic("secret match count")};s,e:=cl.V2.SecretService.Access(ctx,&v2.AccessSecretRequest{ProjectId:must("PROJECT"),Path:matches[0]});if e!=nil{panic(e)};key:=s.GetPayload().GetValue();if len(key)==0{panic("empty secret")};req,_:=http.NewRequest(http.MethodGet,"https://api.yookassa.ru/v3/payments?limit=1",nil);req.SetBasicAuth(must("SHOP"),string(key));r,e:=(&http.Client{Timeout:20*time.Second}).Do(req);if e!=nil{panic(e)};defer r.Body.Close();raw,_:=io.ReadAll(io.LimitReader(r.Body,1<<20));var b map[string]any;_ =json.Unmarshal(raw,&b);items,_:=b["items"].([]any);live:=false;for _,x:=range items{if m,ok:=x.(map[string]any);ok{if f,ok:=m["test"].(bool);ok&&!f{live=true}}};safe:=map[string]any{"httpCode":r.StatusCode,"authenticated":r.StatusCode==200,"liveEvidence":live,"itemCount":len(items),"paymentCreated":false,"secretMatchCount":len(matches)};out,_:=json.Marshal(safe);fmt.Println("YOOKASSA_PREFLIGHT_SAFE",string(out));if r.StatusCode!=200||!live{os.Exit(4)}}
          EOF
          go mod tidy
          TOKEN="$token" PROJECT="$project_id" SECRET="$YOOKASSA_SECRET_NAME" SHOP="$(cat /tmp/shop)" go run .
          cd "$GITHUB_WORKSPACE"

          TARGET_IMAGE="$TARGET_IMAGE" UGMU_SITE_URL="$UGMU_SITE_URL" python3 - <<'PY'
          import json,os
          app=json.load(open('/tmp/before.json',encoding='utf-8')); c=app['template']['containers'][0]; c['image']=os.environ['TARGET_IMAGE']
          items=c.setdefault('env',[]); by={x.get('name'):x for x in items if isinstance(x,dict) and x.get('name')}
          def setv(name,value):
              if name in by:
                  by[name]['value']=value
                  if name not in ('YOOKASSA_SECRET_KEY',): by[name].pop('type',None)
              else:
                  x={'name':name,'value':value}; items.append(x); by[name]=x
          setv('UGMU_ACTIVE','true'); setv('UGMU_SALES_ENABLED','true'); setv('UGMU_SITE_URL',os.environ['UGMU_SITE_URL'])
          assert by.get('COMMERCIAL_SALES_ENABLED',{}).get('value') != 'true'
          assert by.get('TRIALS_ENABLED',{}).get('value') != 'true'
          assert by.get('YOOKASSA_TEST_MODE',{}).get('value') == 'false'
          json.dump(app,open('/tmp/launch.json','w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          PY

          rollback() {
            echo "BACKEND_ROLLBACK_START"
            curl --silent --show-error --fail --request PATCH --header "Authorization: Bearer $token" --header 'Content-Type: application/json' --data-binary @/tmp/before.json "$patch_url" >/tmp/rollback-response.json || true
            for attempt in $(seq 1 40); do
              code="$(curl --silent --show-error --output /tmp/rollback-current.json --write-out '%{http_code}' --header "Authorization: Bearer $token" "$get_url" || true)"
              if [ "$code" = 200 ] && python3 - <<'PY'
          import json,sys
          a=json.load(open('/tmp/before.json')); b=json.load(open('/tmp/rollback-current.json'))
          ca=a['template']['containers'][0]; cb=b['template']['containers'][0]
          ea={x.get('name'):x.get('value') for x in ca.get('env',[]) if isinstance(x,dict)}; eb={x.get('name'):x.get('value') for x in cb.get('env',[]) if isinstance(x,dict)}
          ok=b.get('status')=='running' and cb.get('image')==ca.get('image') and eb.get('UGMU_SALES_ENABLED')==ea.get('UGMU_SALES_ENABLED') and eb.get('UGMU_SITE_URL')==ea.get('UGMU_SITE_URL') and eb.get('UGMU_ACTIVE')==ea.get('UGMU_ACTIVE')
          sys.exit(0 if ok else 1)
          PY
              then echo "BACKEND_ROLLBACK_SAFE attempt=$attempt"; return 0; fi
              sleep 3
            done
            echo "BACKEND_ROLLBACK_FAILED" >&2; return 1
          }
          trap 'status=$?; if [ $status -ne 0 ]; then rollback || true; fi; exit $status' EXIT

          patch_code="$(curl --silent --show-error --output /tmp/patch-response.json --write-out '%{http_code}' --request PATCH --header "Authorization: Bearer $token" --header 'Content-Type: application/json' --data-binary @/tmp/launch.json "$patch_url")"
          test "$patch_code" = 200
          ready=false
          for attempt in $(seq 1 40); do
            code="$(curl --silent --show-error --output /tmp/after.json --write-out '%{http_code}' --header "Authorization: Bearer $token" "$get_url")"
            if [ "$code" = 200 ] && TARGET_IMAGE="$TARGET_IMAGE" UGMU_SITE_URL="$UGMU_SITE_URL" python3 - <<'PY'
          import json,os,sys
          app=json.load(open('/tmp/after.json')); c=app['template']['containers'][0]; env={x.get('name'):x for x in c.get('env',[]) if isinstance(x,dict)}
          ok=app.get('status')=='running' and c.get('image')==os.environ['TARGET_IMAGE'] and env.get('UGMU_ACTIVE',{}).get('value')=='true' and env.get('UGMU_SALES_ENABLED',{}).get('value')=='true' and env.get('UGMU_SITE_URL',{}).get('value')==os.environ['UGMU_SITE_URL'] and env.get('COMMERCIAL_SALES_ENABLED',{}).get('value')!='true' and env.get('TRIALS_ENABLED',{}).get('value')!='true' and env.get('YOOKASSA_TEST_MODE',{}).get('value')=='false' and env.get('YOOKASSA_SECRET_KEY',{}).get('type')=='secret'
          sys.exit(0 if ok else 1)
          PY
            then ready=true; echo "BACKEND_RUNNING_SAFE attempt=$attempt"; break; fi
            sleep 3
          done
          test "$ready" = true

          meta="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$PRODUCTION_BASE_URL/api/v2/meta")"
          health="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$PRODUCTION_BASE_URL/health")"
          python3 - "$health" "$meta" <<'PY'
          import json,sys
          h=json.loads(sys.argv[1]); m=json.loads(sys.argv[2]); assert h=={'status':'ok','service':'medical-calendar-api'}; assert m.get('sales')=='open'; assert m.get('trials')=='closed'; assert m.get('paymentMode')=='live'; print('BACKEND_META_LIVE_SAFE',{'sales':'open','trials':'closed','paymentMode':'live'})
          PY

          fake='{"university_id":"ugmu","program":"medicine","course":1,"stream":"1","groupCode":"ОЛД 999","groupId":"ugmu:medicine:1:stream-1:ОЛД 999","email":"launch-smoke@example.com","plan":"semester"}'
          fake_status="$(curl --silent --show-error --output /tmp/fake.json --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data "$fake" "$PRODUCTION_BASE_URL/api/v2/payments")"
          test "$fake_status" = 400
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/fake.json')) == {'error':'offer_not_found'}
          PY
          for tenant in kgmu omgmu izhgmu; do
            body="{\"university_id\":\"$tenant\",\"program\":\"medicine\",\"course\":1,\"groupCode\":\"launch-sentinel\",\"groupId\":\"$tenant:medicine:1:launch-sentinel\",\"email\":\"launch-smoke@example.com\",\"plan\":\"semester\"}"
            code="$(curl --silent --show-error --output /tmp/non-target.json --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data "$body" "$PRODUCTION_BASE_URL/api/v2/payments")"
            test "$code" = 409
            python3 - <<'PY'
          import json
          assert json.load(open('/tmp/non-target.json')) == {'error':'university_sales_not_open'}
          PY
          done
          group="$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote('ugmu:medicine:1:stream-1:ОЛД 101',safe=''))
          PY
          )"
          pub="$(curl --silent --show-error --output /tmp/public.json --write-out '%{http_code}' "$PRODUCTION_BASE_URL/api/v2/schedules/ugmu/medicine/1/$group/schedule?groupCode=%D0%9E%D0%9B%D0%94%20101&stream=1")"
          test "$pub" = 404
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/public.json')) == {'error':'schedule_not_published'}
          PY
          echo 'BACKEND_CHECKOUT_BOUNDARY_SAFE paymentCreated=false sentinelOnly=true'
          trap - EXIT

          python3 - <<'PY'
          import json,os
          after=json.load(open('/tmp/after.json')); c=after['template']['containers'][0]; env={x.get('name'):x for x in c.get('env',[]) if isinstance(x,dict)}
          report={'status':'PASS','backendActivated':True,'targetImage':c.get('image'),'ugmuActive':env.get('UGMU_ACTIVE',{}).get('value')=='true','ugmuSalesEnabled':env.get('UGMU_SALES_ENABLED',{}).get('value')=='true','globalSalesEnabled':env.get('COMMERCIAL_SALES_ENABLED',{}).get('value')=='true','trialsEnabled':env.get('TRIALS_ENABLED',{}).get('value')=='true','paymentMode':'live','publicScheduleEnabled':False,'paymentCreated':False,'rollbackPerformed':False}
          os.makedirs('launch-evidence',exist_ok=True); json.dump(report,open('launch-evidence/backend.json','w'),indent=2)
          PY

      - name: Upload backend launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-controlled-launch-backend-${{ github.sha }}
          path: launch-evidence/backend.json
          if-no-files-found: warn
          retention-days: 30

  deploy-site:
    needs: activate-backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout authorized launch commit
        uses: actions/checkout@v4

      - name: Build launch Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/site
          mkdir -p dist/site/omgmu dist/site/ugmu
          cp index.html styles.css landing-v1.css data.js app.js app-utils.js dist/site/
          cp -R site/omgmu/. dist/site/omgmu/
          cp -R site/ugmu/. dist/site/ugmu/
          touch dist/site/.nojekyll
          API_URL="$PRODUCTION_BASE_URL" python3 - <<'PY'
          import os,re
          from pathlib import Path
          api=os.environ['API_URL'].rstrip('/')
          targets=[('dist/site/data.js',r'apiBase:\s*"https://[^\"]+"',f'apiBase: "{api}"'),('dist/site/omgmu/config.js',r'apiBaseUrl:\s*"https://[^\"]+"',f'apiBaseUrl: "{api}"'),('dist/site/ugmu/config.js',r'apiBaseUrl:\s*"https://[^\"]+"',f'apiBaseUrl: "{api}"')]
          for name,pat,repl in targets:
              p=Path(name); text=p.read_text(); new,n=re.subn(pat,repl,text,count=1); assert n==1,(name,n); p.write_text(new)
          p=Path('dist/site/ugmu/index.html'); h=p.read_text()
          replacements={
            'name="robots" content="noindex,follow"':'name="robots" content="index,follow"',
            'Проверенное расписание УГМУ для ОЛД 101–112. Checkout подготовлен и откроется только после production-разрешения продаж и live-проверки ЮKassa.':'Проверенное расписание УГМУ для ОЛД 101–112. Оплата доступна через ЮKassa, после оплаты выдаётся персональная ссылка на календарь.',
            'можно будет подключить одной персональной ссылкой':'можно подключить одной персональной ссылкой',
            'продажи пока<br>закрыты':'оплата<br>доступна',
            'Предзапусковый режим':'Календарь доступен',
            'Интерфейс checkout уже подключён к production API, но сам сервер пока держит продажи УГМУ закрытыми. GitHub Pages на этом этапе не публикуется.':'Оплата для утверждённых групп ОЛД 101–112 доступна через ЮKassa. Публичное бесплатное расписание и trials остаются закрытыми.',
            '<span class="badge">Подготовлено</span>':'<span class="badge">Доступно</span>',
            'Форма уже работает с production API. Кнопка оплаты включится только когда сервер разрешит продажи УГМУ и ЮKassa будет подтверждена в live-режиме.':'Форма работает с production API и включает оплату только при подтверждённом live-режиме ЮKassa.',
            'Осталась live-проверка ЮKassa и финальная активация':'ЮKassa подтверждена в live-режиме; оплата доступна',
            'Независимый сервис · предзапусковая подготовка':'Независимый сервис электронных календарей',
          }
          for old,new in replacements.items():
              assert old in h,old; h=h.replace(old,new)
          p.write_text(h)
          assert 'name="robots" content="index,follow"' in h
          for forbidden in ('Предзапусковый режим','продажи пока','Осталась live-проверка','GitHub Pages на этом этапе не публикуется','можно будет подключить'):
              assert forbidden not in h, forbidden
          assert 'type="submit" disabled' in h
          app=Path('dist/site/ugmu/app.js').read_text(); assert 'runtime.sales === "open"' in app and 'runtime.paymentMode === "live"' in app
          assert '/api/v2/catalog/ugmu' not in app and '/api/v2/schedules/ugmu' not in app
          print('UGMU_LIVE_PAGES_ARTIFACT_SAFE')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live UGMU landing
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for attempt in $(seq 1 30); do
            url="${UGMU_SITE_URL}?launch=${GITHUB_SHA}&attempt=$attempt"
            code="$(curl --silent --show-error --output /tmp/ugmu-live.html --write-out '%{http_code}' --max-time 20 "$url" || true)"
            if [ "$code" = 200 ] && grep -q 'name="robots" content="index,follow"' /tmp/ugmu-live.html && grep -q 'Календарь доступен' /tmp/ugmu-live.html && ! grep -q 'Предзапусковый режим' /tmp/ugmu-live.html; then ok=true; echo "UGMU_PAGES_LIVE_SAFE attempt=$attempt"; break; fi
            sleep 5
          done
          test "$ok" = true

  post-launch:
    needs: [activate-backend, deploy-site]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Post-launch production smoke
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "$PRODUCTION_BASE_URL/health")"
          meta="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "$PRODUCTION_BASE_URL/api/v2/meta")"
          python3 - "$health" "$meta" <<'PY'
          import json,sys
          h=json.loads(sys.argv[1]);m=json.loads(sys.argv[2]);assert h.get('status')=='ok';assert m.get('sales')=='open';assert m.get('trials')=='closed';assert m.get('paymentMode')=='live';print('POST_LAUNCH_META_SAFE',{'sales':'open','trials':'closed','paymentMode':'live'})
          PY
          cors="$(curl --silent --show-error -D - -o /dev/null -X OPTIONS -H 'Origin: https://gmarkov634-stack.github.io' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' "$PRODUCTION_BASE_URL/api/v2/payments" | tr -d '\r')"
          echo "$cors" | grep -iq '^access-control-allow-origin: https://gmarkov634-stack.github.io$'
          trial="$(curl --silent --show-error --output /tmp/trial.json --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' "$PRODUCTION_BASE_URL/api/v2/trials")"; test "$trial" = 409
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/trial.json')) == {'error':'trials_not_open'}
          PY
          page="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "${UGMU_SITE_URL}?post=${GITHUB_SHA}")"
          printf '%s' "$page" | grep -q 'name="robots" content="index,follow"'
          printf '%s' "$page" | grep -q 'Календарь доступен'
          ! printf '%s' "$page" | grep -q 'Предзапусковый режим'
          echo 'UGMU_POST_LAUNCH_SAFE paymentCreated=false publicIcs=false trials=false'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Cross-university regression after launch
        working-directory: api
        run: |
          npm ci
          npm run regression:cross-university:historical

      - name: Record post-launch evidence
        shell: bash
        run: |
          mkdir -p launch-evidence
          printf '%s\n' '{"status":"PASS","launchCompleted":true,"sales":"open","paymentMode":"live","publicIcs":false,"trials":false,"paymentCreated":false,"crossUniversityRegression":"PASS"}' > launch-evidence/post-launch.json

      - name: Upload post-launch evidence
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-controlled-launch-post-${{ github.sha }}
          path: launch-evidence/post-launch.json
          retention-days: 30

  rollback-access:
    needs: [activate-backend, deploy-site, post-launch]
    if: ${{ always() && (needs.activate-backend.result == 'failure' || needs.deploy-site.result == 'failure' || needs.post-launch.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Close UGMU production access first
        env:
          CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
          CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
        shell: bash
        run: |
          set -euo pipefail
          auth_payload="$(python3 - <<'PY'
          import json,os
          print(json.dumps({'keyId':os.environ['CLOUDRU_KEY_ID'],'secret':os.environ['CLOUDRU_KEY_SECRET']}))
          PY
          )"
          test "$(curl -sS -o /tmp/t.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data "$auth_payload" https://iam.api.cloud.ru/api/v1/auth/token)" = 200
          readarray -t a < <(python3 - <<'PY'
          import base64,json
          t=json.load(open('/tmp/t.json'))['access_token'];p=t.split('.')[1];p+='='*((4-len(p)%4)%4);c=json.loads(base64.urlsafe_b64decode(p.encode()));print(t);print(c['project_id'])
          PY
          ); token="${a[0]}"; project_id="${a[1]}"; echo "::add-mask::$token"
          get="https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$project_id"; patch="https://containers.api.cloud.ru/v2/containers/${CONTAINER_NAME}?projectId=$project_id"
          test "$(curl -sS -o /tmp/current.json -w '%{http_code}' -H "Authorization: Bearer $token" "$get")" = 200
          python3 - <<'PY'
          import json
          app=json.load(open('/tmp/current.json'));c=app['template']['containers'][0];items=c.setdefault('env',[]);by={x.get('name'):x for x in items if isinstance(x,dict) and x.get('name')}
          for n,v in [('UGMU_SALES_ENABLED','false'),('UGMU_ACTIVE','false'),('UGMU_SITE_URL','')]:
              if n in by: by[n]['value']=v; by[n].pop('type',None)
              else: items.append({'name':n,'value':v})
          json.dump(app,open('/tmp/closed.json','w'),ensure_ascii=False,separators=(',',':'))
          PY
          test "$(curl -sS -o /tmp/r.json -w '%{http_code}' -X PATCH -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data-binary @/tmp/closed.json "$patch")" = 200
          for attempt in $(seq 1 40); do
            meta="$(curl -sS "$PRODUCTION_BASE_URL/api/v2/meta" || true)"
            if META="$meta" python3 - <<'PY'
          import json,os,sys
          try:m=json.loads(os.environ['META'])
          except:sys.exit(1)
          sys.exit(0 if m.get('sales')=='closed' and m.get('trials')=='closed' and m.get('paymentMode')=='live' else 1)
          PY
            then echo "UGMU_ROLLBACK_ACCESS_CLOSED_SAFE attempt=$attempt"; exit 0; fi
            sleep 3
          done
          exit 1

  rollback-site:
    needs: [rollback-access]
    if: ${{ always() && needs.rollback-access.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build fail-closed Pages artifact
        run: |
          rm -rf dist/site && mkdir -p dist/site/omgmu dist/site/ugmu
          cp index.html styles.css landing-v1.css data.js app.js app-utils.js dist/site/
          cp -R site/omgmu/. dist/site/omgmu/
          cp -R site/ugmu/. dist/site/ugmu/
          touch dist/site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirm fail-closed landing restored
        run: |
          sleep 5
          page="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "${UGMU_SITE_URL}?rollback=${GITHUB_SHA}")"
          printf '%s' "$page" | grep -q 'name="robots" content="noindex,follow"'
          printf '%s' "$page" | grep -q 'Предзапусковый режим'
          echo 'UGMU_ROLLBACK_SITE_SAFE'
