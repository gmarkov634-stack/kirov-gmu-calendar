name: Regenerate Dentistry course 4 date-only fix

on:
  push:
    branches:
      - fix/dentistry-course4-date-only-contract

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dentistry-course4-date-only-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate corrected Dentistry course 4 candidate
        run: python3 fixtures/tools/oneoff_fix_dentistry_491_494_date_only.py
      - name: Verify corrected candidate
        run: npm run check
      - name: Commit regenerated branch artifacts
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if git diff --cached --quiet; then
            echo '::error::Expected regenerated Dentistry course 4 changes were not produced.'
            exit 1
          fi
          git commit -m 'Fix Dentistry course 4 date-only event shape'
          git push origin HEAD:fix/dentistry-course4-date-only-contract
