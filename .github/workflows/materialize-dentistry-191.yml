name: Materialize dentistry 191 candidate

on:
  push:
    branches:
      - feat/dentistry-191-194-ingestion
    paths:
      - fixtures/2026-2027-semester-1/normalized/dentistry-191.normalized.compact.json.gz
      - .github/workflows/materialize-dentistry-191.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dentistry-191-194-ingestion
      - name: Verify and decompress candidate
        shell: bash
        run: |
          set -euo pipefail
          SRC='fixtures/2026-2027-semester-1/normalized/dentistry-191.normalized.compact.json.gz'
          DST='fixtures/2026-2027-semester-1/normalized/dentistry-191.normalized.compact.json'
          test "$(wc -c < "$SRC")" -eq 8295
          echo 'aaf6ca5f7dc653e60097abb6ba4a33eb29e0e8b57610f16886cb2555e2500074  '"$SRC" | sha256sum -c -
          gzip -dc "$SRC" > "$DST"
          test "$(wc -c < "$DST")" -eq 76462
          node - <<'NODE'
          const fs = require('fs');
          const p = 'fixtures/2026-2027-semester-1/normalized/dentistry-191.normalized.compact.json';
          const value = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (value.eventCount !== 340) throw new Error(`eventCount=${value.eventCount}`);
          if (value.candidateDigest !== 'sha256:d553c6a17ee97da4d90d4f060cee65a3db2e832c0bf4a5e1f304395f5f654c14') throw new Error('candidateDigest mismatch');
          if (!Array.isArray(value.events) || value.events.length !== 340) throw new Error('events length mismatch');
          NODE
      - name: Commit materialized JSON
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fixtures/2026-2027-semester-1/normalized/dentistry-191.normalized.compact.json
          if git diff --cached --quiet; then
            echo 'Already materialized'
            exit 0
          fi
          git commit -m 'Materialize dentistry 191 normalized JSON'
          git push origin HEAD:feat/dentistry-191-194-ingestion
