name: UGMU YooKassa test window close verify observe

on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/ugmu-yookassa-test-window-close-verify-observe.yml"]
permissions:
  contents: read
  actions: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ff8aefd9a28bd1d9322d4aa28a3b5939682b6817
      TARGET_WORKFLOW: UGMU YooKassa test window close verify
    steps:
      - name: Wait for exact verification run
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=50"
          run='';status='';conclusion=''
          for i in $(seq 1 200);do
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api" >/tmp/r.json
            readarray -t x < <(python3 - <<'PY'
          import json,os
          a=[r for r in json.load(open('/tmp/r.json')).get('workflow_runs',[]) if r.get('name')==os.environ['TARGET_WORKFLOW'] and r.get('head_sha')==os.environ['TARGET_SHA']]
          if a:r=a[0];print(r['id']);print(r.get('status',''));print(r.get('conclusion') or '')
          else:print('');print('');print('')
          PY
          );run="${x[0]}";status="${x[1]}";conclusion="${x[2]}";if [ -n "$run" ] && [ "$status" = completed ];then break;fi;sleep 5;done
          echo "UGMU_CLOSE_VERIFY_RUN_SAFE run=$run conclusion=$conclusion";test -n "$run";test "$conclusion" = success
