name: KGMU medicine course 6 source fetch

on:
  push:
    paths:
      - ".github/workflows/kgmu-stomat-source-bridge.yml"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download official medicine course 6 XLSX
        shell: bash
        run: |
          set -euo pipefail
          src='https://kirovgma.ru/sites/default/files/files/2026/01/13/1078/6_kurs_lechebnyy_fakultet-13-01-2026-08.xlsx'
          file='/tmp/6_kurs_lechebnyy_fakultet-13-01-2026-08.xlsx'
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$src" -o "$file"
          test -s "$file"
          sha256sum "$file"

      - name: Upload exact official XLSX
        uses: actions/upload-artifact@v4
        with:
          name: kgmu-medicine-course6-2025-26
          path: /tmp/6_kurs_lechebnyy_fakultet-13-01-2026-08.xlsx
          if-no-files-found: error
          retention-days: 7
