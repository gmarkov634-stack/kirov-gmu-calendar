name: KGMU dentistry source bridge

on:
  push:
    paths:
      - ".github/workflows/kgmu-stomat-source-bridge.yml"

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download official dentistry XLSX and ingest through production API
        env:
          KGMU_ADMIN_TOKEN: ${{ secrets.KGMU_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          src='https://kirovgma.ru/sites/default/files/files/2026/05/07/1097/2_stomat-07-05-2026-15.xlsx'
          base='https://kgmu-calendar-api.containerapps.ru'
          file='/tmp/2_stomat-07-05-2026-15.xlsx'
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
            -A 'medical-calendar-api/1.0 KGMU dentistry bridge' "$src" -o "$file"
          test -s "$file"
          sha256sum "$file"
          status=$(curl --silent --show-error --output /tmp/ingest.json --write-out '%{http_code}' \
            --request POST \
            --header "X-Admin-Token: $KGMU_ADMIN_TOKEN" \
            --data-binary @"$file" \
            "$base/api/v1/admin/kgmu/ingest?filename=2_stomat-07-05-2026-15.xlsx&program=dentistry&course=2&academicYear=2025%2F26&semester=2&groupRange=291-294&sourceUrl=$(python3 -c 'import urllib.parse; print(urllib.parse.quote("'"$src"'", safe=""))')")
          echo "HTTP $status"
          cat /tmp/ingest.json
          test "$status" = '202'

      - name: Upload exact official XLSX
        uses: actions/upload-artifact@v4
        with:
          name: kgmu-dentistry-course2-2025-26
          path: /tmp/2_stomat-07-05-2026-15.xlsx
          if-no-files-found: error
          retention-days: 7
