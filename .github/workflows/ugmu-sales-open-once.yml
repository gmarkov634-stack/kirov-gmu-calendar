name: UGMU sales open one-shot dispatcher

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ugmu-sales-open-once.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: ugmu-sales-open-dispatch-once
  cancel-in-progress: false

jobs:
  dispatch-and-verify:
    if: ${{ github.event.head_commit.message == 'Dispatch and verify UGMU sales opening' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch guarded workflow, wait, verify, record result
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru
        shell: bash
        run: |
          set -Eeuo pipefail
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ugmu-sales-open.yml/dispatches" \
            -f ref=main \
            -f 'inputs[confirm]=OPEN_UGMU_SALES'
          echo 'UGMU_SALES_OPEN_DISPATCHED_SAFE'

          run_id=''
          for attempt in $(seq 1 30); do
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ugmu-sales-open.yml/runs?event=workflow_dispatch&branch=main&per_page=10")"
            run_id="$(jq -r --arg started "$started_at" '[.workflow_runs[] | select(.created_at >= $started)] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
            if [ -n "$run_id" ]; then
              echo "UGMU_SALES_OPEN_RUN_FOUND_SAFE id=$run_id"
              break
            fi
            sleep 2
          done
          test -n "$run_id"

          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 5

          meta="$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 "$PRODUCTION_BASE_URL/api/v2/meta")"
          META="$meta" python3 - <<'PY'
          import json, os
          body=json.loads(os.environ['META'])
          assert body.get('sales') == 'open', body
          assert body.get('trials') == 'closed', body
          assert body.get('universityTrials',{}).get('ugmu') == 'open', body
          assert body.get('paymentMode') == 'live', body
          print('UGMU_SALES_OPEN_META_VERIFIED_SAFE')
          PY

          result="$(META="$meta" RUN_ID="$run_id" python3 - <<'PY'
          import json, os
          body=json.loads(os.environ['META'])
          print(json.dumps({
            'status':'success',
            'workflow':'UGMU sales open',
            'runId':int(os.environ['RUN_ID']),
            'sales':body.get('sales'),
            'globalTrials':body.get('trials'),
            'ugmuTrials':body.get('universityTrials',{}).get('ugmu'),
            'paymentMode':body.get('paymentMode'),
            'paymentCreated':False,
          }, separators=(',',':')))
          PY
          )"
          encoded="$(printf '%s\n' "$result" | base64 -w0)"
          gh api \
            --method PUT \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/contents/.ops/ugmu-sales-open-result.json" \
            -f message='Record UGMU sales opening result' \
            -f content="$encoded" \
            -f branch=main >/dev/null
          echo 'UGMU_SALES_OPEN_ONE_SHOT_COMPLETE_SAFE'
