name: UGMU one-shot sales opening dispatch

on:
  push:
    branches:
      - ops/ugmu-open-sales-once-20260822
    paths:
      - .github/workflows/ugmu-sales-open-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch guarded sales opening and verify completion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(
            --header "Authorization: Bearer $GH_TOKEN"
            --header 'Accept: application/vnd.github+json'
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )

          before="$(curl --silent --show-error "${headers[@]}" \
            "$api/actions/workflows/ugmu-sales-open.yml/runs?event=workflow_dispatch&branch=main&per_page=10")"
          before_id="$(BEFORE="$before" python3 - <<'PY'
          import json, os
          runs=json.loads(os.environ['BEFORE']).get('workflow_runs', [])
          print(max((int(r['id']) for r in runs), default=0))
          PY
          )"

          code="$(curl --silent --show-error --output /tmp/dispatch.out --write-out '%{http_code}' \
            --request POST "${headers[@]}" \
            --data '{"ref":"main","inputs":{"confirm":"OPEN_UGMU_SALES"}}' \
            "$api/actions/workflows/ugmu-sales-open.yml/dispatches")"
          if [ "$code" != '204' ]; then
            cat /tmp/dispatch.out
            exit 1
          fi
          rm -f /tmp/dispatch.out

          run_id=''
          for attempt in $(seq 1 30); do
            runs="$(curl --silent --show-error "${headers[@]}" \
              "$api/actions/workflows/ugmu-sales-open.yml/runs?event=workflow_dispatch&branch=main&per_page=10")"
            run_id="$(RUNS="$runs" BEFORE_ID="$before_id" python3 - <<'PY'
          import json, os
          before=int(os.environ['BEFORE_ID'])
          ids=[int(r['id']) for r in json.loads(os.environ['RUNS']).get('workflow_runs', []) if int(r['id']) > before]
          print(max(ids) if ids else '')
          PY
          )"
            [ -n "$run_id" ] && break
            sleep 2
          done
          test -n "$run_id"
          echo "UGMU_SALES_OPEN_DISPATCHED_SAFE run_id=$run_id"

          conclusion=''
          for attempt in $(seq 1 120); do
            run="$(curl --silent --show-error "${headers[@]}" "$api/actions/runs/$run_id")"
            readarray -t state < <(RUN="$run" python3 - <<'PY'
          import json, os
          r=json.loads(os.environ['RUN'])
          print(r.get('status') or '')
          print(r.get('conclusion') or '')
          PY
          )
            if [ "${state[0]}" = 'completed' ]; then
              conclusion="${state[1]}"
              break
            fi
            sleep 3
          done
          test "$conclusion" = 'success'

          meta="$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 \
            https://kgmu-calendar-api.containerapps.ru/api/v2/meta)"
          META="$meta" python3 - <<'PY'
          import json, os
          body=json.loads(os.environ['META'])
          assert body.get('sales') == 'open', body
          assert body.get('trials') == 'closed', body
          assert body.get('universityTrials',{}).get('ugmu') == 'open', body
          assert body.get('paymentMode') == 'live', body
          assert str(body.get('offers',{}).get('semester',{}).get('price')) == '299.00', body
          print('UGMU_SALES_PUBLIC_STATE_VERIFIED_SAFE', {
              'sales':'open',
              'globalTrials':'closed',
              'ugmuTrials':'open',
              'paymentMode':'live',
              'semesterPrice':'299.00',
              'paymentCreated':False,
          })
          PY

          echo "UGMU_SALES_OPEN_COMPLETED_SAFE run_id=$run_id conclusion=$conclusion"
