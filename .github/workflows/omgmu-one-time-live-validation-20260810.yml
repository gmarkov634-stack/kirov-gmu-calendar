name: One-time validate live ОмГМУ schedules

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/omgmu-one-time-live-validation-20260810.yml"

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'Validate live ОмГМУ schedules after S3 publication'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch live API and landing resources
        run: |
          mkdir -p live-check
          API_BASE="https://kgmu-calendar-api.containerapps.ru"
          SITE_BASE="https://gmarkov634-stack.github.io/kirov-gmu-calendar/omgmu"
          curl --fail-with-body --silent --show-error --max-time 30 "$API_BASE/health" -o live-check/health.json
          curl --fail-with-body --silent --show-error --max-time 30 \
            "$API_BASE/api/v2/schedules/omgmu/medicine-international/1/omgmu%3Amedicine-international%3A1%3Astream-1%3A1101/schedule?groupCode=1101&stream=1" \
            -o live-check/1101.json
          for spec in \
            "2113|2|omgmu%3Amedicine-international%3A2%3Astream-2%3A2113|2" \
            "2114|2|omgmu%3Amedicine-international%3A2%3Astream-2%3A2114|2" \
            "389|3|omgmu%3Amedicine-international%3A3%3A389|" \
            "393|3|omgmu%3Amedicine-international%3A3%3A393|"
          do
            IFS='|' read -r group course group_id stream <<< "$spec"
            url="$API_BASE/api/v2/schedules/omgmu/medicine-international/$course/$group_id/schedule?groupCode=$group"
            if [ -n "$stream" ]; then url="$url&stream=$stream"; fi
            status="$(curl --silent --show-error --max-time 30 -o "live-check/$group.json" -w '%{http_code}' "$url")"
            printf '%s' "$status" > "live-check/$group.status"
          done
          curl --fail-with-body --silent --show-error --max-time 30 "$SITE_BASE/config.js" -o live-check/config.js
          curl --fail-with-body --silent --show-error --max-time 30 "$SITE_BASE/groups.js" -o live-check/groups.js

      - name: Validate live data
        env:
          REPORT_PATH: ops/reports/omgmu-live-validation-20260810.json
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('live-check')
          errors = []
          health = json.loads((root / 'health.json').read_text(encoding='utf-8'))
          if health.get('status') != 'ok':
              errors.append(f"health status is {health.get('status')!r}")

          schedule = json.loads((root / '1101.json').read_text(encoding='utf-8'))
          events = schedule.get('events') if isinstance(schedule.get('events'), list) else []
          starts = sorted(str(item.get('start', '')) for item in events)
          dates = [value[:10] for value in starts if len(value) >= 10]
          if schedule.get('group', {}).get('code') != '1101':
              errors.append('live schedule has the wrong group code')
          if len(events) != 230:
              errors.append(f"group 1101 event count is {len(events)}, expected 230")
          first_date = min(dates) if dates else None
          last_date = max(dates) if dates else None
          if first_date != '2026-04-06':
              errors.append(f"group 1101 first date is {first_date}")
          if last_date != '2026-08-03':
              errors.append(f"group 1101 last date is {last_date}")

          ids = set()
          suspicious = []
          for event in events:
              event_id = str(event.get('id', ''))
              if not event_id or event_id in ids:
                  errors.append(f"missing or duplicate event id: {event_id!r}")
              ids.add(event_id)
              title = str(event.get('title', '')).strip()
              if not title or re.search(r'\b\d{1,2}[.:]\d{2}\b|РАСПИСАНИЕ|занятий\s+предусмотрены|сокращени', title, re.I):
                  suspicious.append(title)
              start = str(event.get('start', ''))
              end = str(event.get('end', ''))
              if not ('2026-01-01' <= start[:10] <= '2026-08-31') or end <= start:
                  errors.append(f"invalid event interval: {start} — {end}")
          if suspicious:
              errors.append(f"suspicious titles: {suspicious[:5]}")

          blocked_statuses = {}
          for group in ('2113', '2114', '389', '393'):
              status = (root / f'{group}.status').read_text(encoding='utf-8').strip()
              blocked_statuses[group] = int(status)
              if status != '404':
                  errors.append(f"blocked group {group} returned HTTP {status}")

          config_text = (root / 'config.js').read_text(encoding='utf-8')
          checkout_disabled = bool(re.search(r'checkoutEnabled\s*:\s*false', config_text))
          if not checkout_disabled:
              errors.append('checkoutEnabled is not false on the live landing')

          groups_text = (root / 'groups.js').read_text(encoding='utf-8')
          groups = sorted(set(re.findall(r'"(\d{3,4})"', groups_text)), key=int)
          if len(groups) != 39:
              errors.append(f"live landing exposes {len(groups)} groups, expected 39")
          for group in ('2113', '2114', '389', '393'):
              if group in groups:
                  errors.append(f"blocked group {group} is exposed on the live landing")
          for group in ('2108', '2111', '386'):
              if group not in groups:
                  errors.append(f"verified group {group} is missing from the live landing")

          report = {
              'version': 1,
              'university': 'omgmu',
              'operation': 'live-validation-after-s3-publication',
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'health': health,
              'group1101': {
                  'eventCount': len(events),
                  'firstDate': first_date,
                  'lastDate': last_date,
                  'uniqueEventIds': len(ids),
                  'suspiciousTitleCount': len(suspicious),
              },
              'blockedHttpStatuses': blocked_statuses,
              'landing': {
                  'checkoutEnabled': not checkout_disabled,
                  'checkoutDisabled': checkout_disabled,
                  'groupCount': len(groups),
                  'groups': groups,
              },
              'errors': errors,
              'validationStatus': 'success' if not errors else 'failure',
          }
          output = Path(os.environ['REPORT_PATH'])
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False))
          if errors:
              raise SystemExit(2)
          PY

      - name: Record live validation result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p ops/reports
          if [ ! -f ops/reports/omgmu-live-validation-20260810.json ]; then
            printf '{"version":1,"university":"omgmu","operation":"live-validation-after-s3-publication","validationStatus":"failure","errors":["validation report was not generated"]}\n' > ops/reports/omgmu-live-validation-20260810.json
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('ops/reports/omgmu-live-validation-20260810.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['jobStatus'] = os.environ['JOB_STATUS']
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/reports/omgmu-live-validation-20260810.json
          git commit -m "Record live ОмГМУ validation result" || true
          git push
