name: One-time validate actual live ОмГМУ paths

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/omgmu-one-time-live-validation-20260810.yml"

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'Validate actual live ОмГМУ landing paths'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch live resources
        run: |
          mkdir -p live-check
          API_BASE="https://kgmu-calendar-api.containerapps.ru"
          SITE_ROOT="https://gmarkov634-stack.github.io/kirov-gmu-calendar"
          fetch_resource() {
            name="$1"
            url="$2"
            status="$(curl --silent --show-error --location --max-time 30 \
              --output "live-check/$name.body" \
              --write-out '%{http_code}' \
              "$url" 2>"live-check/$name.stderr" || true)"
            printf '%s' "${status:-000}" > "live-check/$name.status"
            printf '%s' "$url" > "live-check/$name.url"
          }
          fetch_resource health "$API_BASE/health"
          fetch_resource 1101 "$API_BASE/api/v2/schedules/omgmu/medicine-international/1/omgmu%3Amedicine-international%3A1%3Astream-1%3A1101/schedule?groupCode=1101&stream=1"
          fetch_resource 2113 "$API_BASE/api/v2/schedules/omgmu/medicine-international/2/omgmu%3Amedicine-international%3A2%3Astream-2%3A2113/schedule?groupCode=2113&stream=2"
          fetch_resource 2114 "$API_BASE/api/v2/schedules/omgmu/medicine-international/2/omgmu%3Amedicine-international%3A2%3Astream-2%3A2114/schedule?groupCode=2114&stream=2"
          fetch_resource 389 "$API_BASE/api/v2/schedules/omgmu/medicine-international/3/omgmu%3Amedicine-international%3A3%3A389/schedule?groupCode=389"
          fetch_resource 393 "$API_BASE/api/v2/schedules/omgmu/medicine-international/3/omgmu%3Amedicine-international%3A3%3A393/schedule?groupCode=393"
          fetch_resource index "$SITE_ROOT/omgmu/"
          fetch_resource config "$SITE_ROOT/omgmu/config.js"
          fetch_resource groups "$SITE_ROOT/site/omgmu/groups.js"
          fetch_resource app "$SITE_ROOT/site/omgmu/app.js"

      - name: Validate live API and landing
        env:
          REPORT_PATH: ops/reports/omgmu-live-validation-20260810.json
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('live-check')
          errors = []
          resources = {}

          def get_status(name):
              try:
                  return int((root / f'{name}.status').read_text(encoding='utf-8').strip() or '0')
              except Exception:
                  return 0

          def get_body(name):
              path = root / f'{name}.body'
              return path.read_text(encoding='utf-8', errors='replace') if path.exists() else ''

          def get_json(name):
              try:
                  return json.loads(get_body(name))
              except Exception as exc:
                  errors.append(f'{name}: invalid JSON: {exc}')
                  return {}

          names = ('health', '1101', '2113', '2114', '389', '393', 'index', 'config', 'groups', 'app')
          for name in names:
              stderr_path = root / f'{name}.stderr'
              resources[name] = {
                  'url': (root / f'{name}.url').read_text(encoding='utf-8'),
                  'httpStatus': get_status(name),
                  'stderr': stderr_path.read_text(encoding='utf-8', errors='replace')[:500] if stderr_path.exists() else '',
                  'bodyPreview': get_body(name)[:500],
              }

          health = get_json('health') if get_status('health') == 200 else {}
          if get_status('health') != 200 or health.get('status') != 'ok':
              errors.append(f"health check failed: HTTP {get_status('health')}, body {health}")

          schedule = get_json('1101') if get_status('1101') == 200 else {}
          if get_status('1101') != 200:
              errors.append(f"group 1101 returned HTTP {get_status('1101')}")
          events = schedule.get('events') if isinstance(schedule.get('events'), list) else []
          starts = sorted(str(event.get('start', '')) for event in events)
          dates = [value[:10] for value in starts if len(value) >= 10]
          first_date = min(dates) if dates else None
          last_date = max(dates) if dates else None
          ids = set()
          suspicious = []
          for event in events:
              event_id = str(event.get('id', ''))
              if not event_id or event_id in ids:
                  errors.append(f"missing or duplicate event id: {event_id!r}")
              ids.add(event_id)
              title = str(event.get('title', '')).strip()
              if not title or re.search(r'\b\d{1,2}[.:]\d{2}\b|РАСПИСАНИЕ|занятий\s+предусмотрены|сокращени', title, re.I):
                  suspicious.append(title)
              start = str(event.get('start', ''))
              end = str(event.get('end', ''))
              if not ('2026-01-01' <= start[:10] <= '2026-08-31') or end <= start:
                  errors.append(f"invalid event interval: {start} — {end}")
          if schedule.get('group', {}).get('code') != '1101':
              errors.append('live schedule has the wrong group code')
          if len(events) != 230:
              errors.append(f"group 1101 event count is {len(events)}, expected 230")
          if first_date != '2026-04-06' or last_date != '2026-08-03':
              errors.append(f"group 1101 date range is {first_date} — {last_date}")
          if suspicious:
              errors.append(f"suspicious titles: {suspicious[:5]}")

          blocked_statuses = {group: get_status(group) for group in ('2113', '2114', '389', '393')}
          for group, value in blocked_statuses.items():
              if value != 404:
                  errors.append(f"blocked group {group} returned HTTP {value}")

          index_text = get_body('index')
          config_text = get_body('config')
          groups_text = get_body('groups')
          app_text = get_body('app')
          for name in ('index', 'config', 'groups', 'app'):
              if get_status(name) != 200:
                  errors.append(f"live {name} returned HTTP {get_status(name)}")

          checkout_disabled = bool(re.search(r'checkoutEnabled\s*:\s*false', config_text))
          if not checkout_disabled:
              errors.append('checkoutEnabled is not false on the live landing')
          if '../site/omgmu/groups.js' not in index_text or '../site/omgmu/app.js' not in index_text:
              errors.append('live index does not reference the expected shared ОмГМУ assets')
          if 'checkoutEnabled' not in app_text:
              errors.append('live app.js does not enforce the checkout switch')

          groups = sorted(set(re.findall(r'"(\d{3,4})"', groups_text)), key=int)
          if len(groups) != 39:
              errors.append(f"live landing exposes {len(groups)} groups, expected 39")
          for group in ('2113', '2114', '389', '393'):
              if group in groups:
                  errors.append(f"blocked group {group} is exposed on the live landing")
          for group in ('2108', '2111', '386'):
              if group not in groups:
                  errors.append(f"verified group {group} is missing from the live landing")

          report = {
              'version': 1,
              'university': 'omgmu',
              'operation': 'live-validation-after-s3-publication',
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'resources': resources,
              'health': health,
              'group1101': {
                  'eventCount': len(events),
                  'firstDate': first_date,
                  'lastDate': last_date,
                  'uniqueEventIds': len(ids),
                  'suspiciousTitleCount': len(suspicious),
              },
              'blockedHttpStatuses': blocked_statuses,
              'landing': {
                  'checkoutDisabled': checkout_disabled,
                  'apiPlaceholderPresent': 'REPLACE_WITH_CLOUD_RU_API' in config_text,
                  'groupCount': len(groups),
                  'groups': groups,
                  'assetMode': 'branch-relative-shared-assets',
              },
              'errors': errors,
              'validationStatus': 'success' if not errors else 'failure',
          }
          output = Path(os.environ['REPORT_PATH'])
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False))
          if errors:
              raise SystemExit(2)
          PY

      - name: Record validation result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p ops/reports
          if [ ! -f ops/reports/omgmu-live-validation-20260810.json ]; then
            printf '{"version":1,"university":"omgmu","operation":"live-validation-after-s3-publication","validationStatus":"failure","errors":["validation report was not generated"]}\n' > ops/reports/omgmu-live-validation-20260810.json
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('ops/reports/omgmu-live-validation-20260810.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['jobStatus'] = os.environ['JOB_STATUS']
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/reports/omgmu-live-validation-20260810.json
          git commit -m "Record final live ОмГМУ validation result" || true
          git push
