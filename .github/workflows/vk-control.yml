name: VK control

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "ops/vk/command.json"

permissions:
  contents: read
  id-token: write

jobs:
  execute:
    if: >-
      github.actor == 'gmarkov634-stack' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout command
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate command
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'ops/vk/command.json';
          const stat = fs.statSync(path);
          if (stat.size > 32768) throw new Error('VK command is too large');
          const command = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!command || typeof command !== 'object') throw new Error('Invalid VK command');
          if (typeof command.id !== 'string' || !command.id) throw new Error('Missing command id');
          if (typeof command.action !== 'string' || !command.action) throw new Error('Missing command action');
          NODE

      - name: Execute VK command
        env:
          VK_CONTROL_URL: https://kgmu-calendar-api.containerapps.ru/api/v1/vk/control
        run: |
          set -euo pipefail
          oidc_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kgmu-vk-control")"
          oidc_token="$(printf '%s' "$oidc_response" | node -e 'let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>{const v=JSON.parse(s).value;if(!v)process.exit(2);process.stdout.write(v);});')"

          response="$(curl --silent --show-error \
            -w '\n%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "Content-Type: application/json" \
            --data-binary @ops/vk/command.json \
            "$VK_CONTROL_URL")"
          status="${response##*$'\n'}"
          result="${response%$'\n'*}"

          echo "VK_CONTROL_RESULT_BEGIN"
          printf '%s' "$result" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{console.log(JSON.stringify(JSON.parse(s),null,2))}catch{console.log("{\"error\":\"non_json_response\"}")}});'
          echo "VK_CONTROL_RESULT_END"
          if [[ ! "$status" =~ ^2 ]]; then
            echo "VK control HTTP status: $status"
            exit 22
          fi
