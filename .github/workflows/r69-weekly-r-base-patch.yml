name: R69 weekly R base patch

on:
  push:
    branches:
      - fix/r69-weekly-r-base
    paths:
      - .github/workflows/r69-weekly-r-base-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r69-weekly-r-base
          fetch-depth: 0

      - name: Apply exact R69 parser change
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('api/src/adapters/kgmu/weekly-r-parser.mjs')
          text = path.read_text()
          old = "status:uncovered.length||extraLessonFailures.length||remainingOverlaps.length?'REVIEW_REQUIRED':'PASS'"
          new = "status:uncovered.length||extraLessonFailures.length?'REVIEW_REQUIRED':'PASS'"
          if old not in text:
              raise SystemExit('expected QA condition not found')
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one QA condition, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Add base parser regression
        run: |
          cat > api/test/kgmu-weekly-r-r69.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { parseWeeklyRWorkbook } from '../src/adapters/kgmu/weekly-r-parser.mjs';

          function overlapWorkbook() {
            return {
              sheets: [{
                name: 'generic-r',
                cells: [
                  { ref: 'B1', row: 1, col: 2, value: 'РАСПИСАНИЕ ЗАНЯТИЙ НА ПЕРВОЕ ПОЛУГОДИЕ 2026-2027 учебного года' },
                  { ref: 'B2', row: 2, col: 2, value: '01.09.2026 - 31.12.2026' },
                  { ref: 'B3', row: 3, col: 2, value: 'группа 101' },
                  { ref: 'C3', row: 3, col: 3, value: 'группа 102' },
                  { ref: 'A4', row: 4, col: 1, value: 'ВТ' },
                  { ref: 'B4', row: 4, col: 2, value: '09.00-11.00 Анатомия 01.09' },
                  { ref: 'C4', row: 4, col: 3, value: '09.00-10.00 Анатомия 01.09' },
                  { ref: 'A5', row: 5, col: 1, value: 'ВТ' },
                  { ref: 'B5', row: 5, col: 2, value: '10.00-12.00 Биология 01.09' },
                  { ref: 'C5', row: 5, col: 3, value: '10.00-11.00 Биология 01.09' },
                ],
                merges: [],
                styledCells: [],
                hiddenRows: [],
              }],
            };
          }

          test('base weekly R parser keeps temporal overlaps diagnostic-only under R69', () => {
            const result = parseWeeklyRWorkbook(overlapWorkbook(), {
              university: 'kgmu',
              program: 'medicine',
              course: 1,
              academicYear: '2026/27',
              semester: 1,
              scheduleEndRow: 5,
            });

            assert.equal(result.qa.uncovered.length, 0, JSON.stringify(result.qa, null, 2));
            assert.equal(result.qa.extraLessonFailures.length, 0, JSON.stringify(result.qa, null, 2));
            assert.ok(result.qa.remainingOverlaps.length > 0, JSON.stringify(result.qa, null, 2));
            assert.equal(result.qa.status, 'PASS', JSON.stringify(result.qa, null, 2));
            assert.equal(result.schedules.find((item) => item.group.code === '101').events.length, 2);
          });
          EOF

      - name: Remove one-shot workflow and commit result
        run: |
          rm .github/workflows/r69-weekly-r-base-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/src/adapters/kgmu/weekly-r-parser.mjs api/test/kgmu-weekly-r-r69.test.js .github/workflows/r69-weekly-r-base-patch.yml
          git commit -m 'fix: apply R69 to base weekly R parser'
          git push origin HEAD:fix/r69-weekly-r-base
