name: UGMU controlled launch retry

on:
  push:
    branches:
      - agent/ugmu-scaffold-20260820
    paths:
      - "universities/ugmu/controlled-launch-retry.json"

permissions:
  contents: read
  actions: write

concurrency:
  group: ugmu-controlled-production-launch
  cancel-in-progress: false

env:
  CONTAINER_NAME: kgmu-calendar-api
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru
  UGMU_SITE_URL: https://gmarkov634-stack.github.io/kirov-gmu-calendar/ugmu/
  UGMU_SOURCE_SHA: 34612248bba201096d6566cacb37c53be01d3f84eddc214bda2a594b46fb24f8
  PAGES_SOURCE_SHA: 11c37ac0a6513c6621c297aec5c6dbceb42ede3b
  EXPECTED_IMAGE: kgmu-calendar-api.cr.cloud.ru/api@sha256:67306e593288457f23233eca6f65e13edebd3cd26db579cc3c26834087fe8a1a
  YOOKASSA_SECRET_NAME: yookassa-secret-key
  PAGES_WORKFLOW: ugmu-controlled-pages-main-v2.yml

jobs:
  retry-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
      CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact authority commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify one-shot authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          a=json.load(open('universities/ugmu/controlled-launch-retry.json',encoding='utf-8'))
          assert a['version']==1
          assert a['kind']=='ugmu-controlled-launch-retry'
          assert a['boundary']=='controlled-launch-activation'
          assert a['authorizedBranch']=='agent/ugmu-scaffold-20260820'
          assert a['sourceSha256']=='34612248bba201096d6566cacb37c53be01d3f84eddc214bda2a594b46fb24f8'
          assert a['pagesSourceSha']=='11c37ac0a6513c6621c297aec5c6dbceb42ede3b'
          assert a['expectedImage']=='kgmu-calendar-api.cr.cloud.ru/api@sha256:67306e593288457f23233eca6f65e13edebd3cd26db579cc3c26834087fe8a1a'
          assert a['groups']==[f'ОЛД {n}' for n in range(101,113)]
          assert a['userAuthorization']=='Далее'
          assert a['automaticRollback'] is True
          prepared=a['preparedCodeHead']; assert len(prepared)==40
          changed=subprocess.check_output(['git','diff','--name-only',prepared,'HEAD'],text=True).splitlines()
          assert changed==['universities/ugmu/controlled-launch-retry.json'], changed
          print('UGMU_RETRY_AUTHORITY_SAFE',{'boundary':a['boundary'],'groups':12,'rollback':True})
          PY

      - name: Setup Go for read-only YooKassa preflight
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Authenticate Cloud.ru and verify closed preconditions
        id: cloud
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          auth_payload="$(python3 - <<'PY'
          import json,os
          print(json.dumps({'keyId':os.environ['CLOUDRU_KEY_ID'],'secret':os.environ['CLOUDRU_KEY_SECRET']}))
          PY
          )"
          test "$(curl -sS -o /tmp/cloud-token.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data "$auth_payload" https://iam.api.cloud.ru/api/v1/auth/token)" = 200
          readarray -t auth < <(python3 - <<'PY'
          import base64,json
          t=json.load(open('/tmp/cloud-token.json'))['access_token']; p=t.split('.')[1]; p+='='*((4-len(p)%4)%4); c=json.loads(base64.urlsafe_b64decode(p.encode()))
          print(t); print(c['project_id']); print(c.get('sub_id') or c['sub'])
          PY
          )
          token="${auth[0]}"; project_id="${auth[1]}"; subject_id="${auth[2]}"; rm -f /tmp/cloud-token.json
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
          get="https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$project_id"
          test "$(curl -sS -o /tmp/before.json -w '%{http_code}' -H "Authorization: Bearer $token" "$get")" = 200
          EXPECTED_IMAGE="$EXPECTED_IMAGE" python3 - <<'PY'
          import json,os
          app=json.load(open('/tmp/before.json')); assert app.get('status')=='running'
          c=app['template']['containers'][0]; assert c.get('image')==os.environ['EXPECTED_IMAGE'], c.get('image')
          env={x.get('name'):x for x in c.get('env',[]) if isinstance(x,dict)}
          assert env.get('COMMERCIAL_SALES_ENABLED',{}).get('value')!='true'
          assert env.get('UGMU_SALES_ENABLED',{}).get('value')!='true'
          assert env.get('UGMU_ACTIVE',{}).get('value')!='true'
          assert not (env.get('UGMU_SITE_URL',{}).get('value') or '')
          assert env.get('TRIALS_ENABLED',{}).get('value')!='true'
          assert env.get('YOOKASSA_TEST_MODE',{}).get('value')=='false'
          assert env.get('YOOKASSA_SECRET_KEY',{}).get('type')=='secret'
          shop=str(env.get('YOOKASSA_SHOP_ID',{}).get('value') or ''); assert shop
          open('/tmp/shop','w').write(shop)
          print('UGMU_RETRY_PRECONDITION_SAFE',{'running':True,'imageMatched':True,'salesClosed':True,'active':False,'trials':False,'paymentMode':'live'})
          PY
          meta="$(curl -fsS --retry 6 --retry-all-errors --retry-delay 2 "$PRODUCTION_BASE_URL/api/v2/meta")"
          python3 - "$meta" <<'PY'
          import json,sys
          m=json.loads(sys.argv[1]); assert m.get('sales')=='closed'; assert m.get('trials')=='closed'; assert m.get('paymentMode')=='live'
          print('UGMU_RETRY_META_PRE_SAFE',{'sales':'closed','trials':'closed','paymentMode':'live'})
          PY

      - name: Read-only YooKassa provider preflight
        env:
          TOKEN: ${{ steps.cloud.outputs.token }}
          PROJECT: ${{ steps.cloud.outputs.project_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/provider && cd /tmp/provider
          cat > go.mod <<'EOF'
          module ugmulaunchretry
          go 1.23.0
          require (
            github.com/cloudru-tech/secret-manager-sdk v1.1.1
            google.golang.org/grpc v1.70.0
          )
          EOF
          cat > main.go <<'EOF'
          package main
          import("context";"fmt";"io";"net/http";"os";"strings";"time"; sm "github.com/cloudru-tech/secret-manager-sdk"; v2 "github.com/cloudru-tech/secret-manager-sdk/api/v2";"google.golang.org/grpc/metadata")
          func must(n string)string{v:=os.Getenv(n);if v==""{panic("missing "+n)};return v}
          func main(){cl,e:=sm.New(&sm.Config{Host:"secretmanager.api.cloud.ru:443"});if e!=nil{panic(e)};defer cl.Close();ctx,c:=context.WithTimeout(context.Background(),30*time.Second);defer c();ctx=metadata.AppendToOutgoingContext(ctx,"authorization","Bearer "+must("TOKEN"));sr,e:=cl.V2.SecretService.Search(ctx,&v2.SearchSecretRequest{ProjectId:must("PROJECT"),Depth:-1});if e!=nil{panic(e)};target:=must("SECRET");var paths []string;for _,s:=range sr.GetSecrets(){p:=s.GetPath();if p==target||strings.HasSuffix(p,"/"+target){paths=append(paths,p)}};if len(paths)!=1{panic("secret match count")};s,e:=cl.V2.SecretService.Access(ctx,&v2.AccessSecretRequest{ProjectId:must("PROJECT"),Path:paths[0]});if e!=nil{panic(e)};key:=s.GetPayload().GetValue();if len(key)==0{panic("empty secret")};req,_:=http.NewRequest(http.MethodGet,"https://api.yookassa.ru/v3/payments?limit=1",nil);req.SetBasicAuth(must("SHOP"),string(key));r,e:=(&http.Client{Timeout:20*time.Second}).Do(req);if e!=nil{panic(e)};defer r.Body.Close();_,_=io.ReadAll(io.LimitReader(r.Body,1<<20));fmt.Printf("YOOKASSA_RETRY_PREFLIGHT_SAFE http=%d secretMatchCount=%d paymentCreated=false\n",r.StatusCode,len(paths));if r.StatusCode!=200{os.Exit(4)}}
          EOF
          go mod tidy
          SECRET="$YOOKASSA_SECRET_NAME" SHOP="$(cat /tmp/shop)" go run .

      - name: Activate UGMU backend only
        env:
          TOKEN: ${{ steps.cloud.outputs.token }}
          PROJECT: ${{ steps.cloud.outputs.project_id }}
        shell: bash
        run: |
          set -euo pipefail
          get="https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$PROJECT"
          patch="https://containers.api.cloud.ru/v2/containers/${CONTAINER_NAME}?projectId=$PROJECT"
          test "$(curl -sS -o /tmp/current.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$get")" = 200
          EXPECTED_IMAGE="$EXPECTED_IMAGE" UGMU_SITE_URL="$UGMU_SITE_URL" python3 - <<'PY'
          import json,os
          app=json.load(open('/tmp/current.json')); c=app['template']['containers'][0]; assert c['image']==os.environ['EXPECTED_IMAGE']
          items=c.setdefault('env',[]); by={x.get('name'):x for x in items if isinstance(x,dict) and x.get('name')}
          def setv(n,v):
            if n in by: by[n]['value']=v; by[n].pop('type',None)
            else: items.append({'name':n,'value':v}); by[n]=items[-1]
          assert by.get('COMMERCIAL_SALES_ENABLED',{}).get('value')!='true'
          assert by.get('TRIALS_ENABLED',{}).get('value')!='true'
          assert by.get('YOOKASSA_TEST_MODE',{}).get('value')=='false'
          setv('UGMU_ACTIVE','true'); setv('UGMU_SALES_ENABLED','true'); setv('UGMU_SITE_URL',os.environ['UGMU_SITE_URL'])
          json.dump(app,open('/tmp/open.json','w'),ensure_ascii=False,separators=(',',':'))
          PY
          test "$(curl -sS -o /tmp/patch.json -w '%{http_code}' -X PATCH -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/open.json "$patch")" = 200
          ok=false
          for attempt in $(seq 1 50); do
            meta="$(curl -sS "$PRODUCTION_BASE_URL/api/v2/meta" || true)"
            if META="$meta" python3 - <<'PY'
          import json,os,sys
          try:m=json.loads(os.environ['META'])
          except:sys.exit(1)
          sys.exit(0 if m.get('sales')=='open' and m.get('trials')=='closed' and m.get('paymentMode')=='live' else 1)
          PY
            then ok=true; break; fi
            sleep 3
          done
          test "$ok" = true
          echo 'UGMU_BACKEND_RETRY_OPEN_SAFE paymentCreated=false'

      - name: Dispatch main-only Pages launch and wait
        id: pages
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${PAGES_WORKFLOW}"
          before="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api/runs?event=workflow_dispatch&branch=main&per_page=20")"
          printf '%s' "$before" > /tmp/pages-before.json
          payload="$(python3 - <<'PY'
          import json,os
          print(json.dumps({'ref':'main','inputs':{'mode':'launch','source_sha':os.environ['PAGES_SOURCE_SHA']}}))
          PY
          )"
          test "$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' --data "$payload" "$api/dispatches")" = 204
          run_id=''
          for attempt in $(seq 1 30); do
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api/runs?event=workflow_dispatch&branch=main&per_page=20" > /tmp/pages-after.json
            run_id="$(python3 - <<'PY'
          import json
          b={r['id'] for r in json.load(open('/tmp/pages-before.json')).get('workflow_runs',[])}
          rows=json.load(open('/tmp/pages-after.json')).get('workflow_runs',[])
          n=[r for r in rows if r['id'] not in b]
          print(n[0]['id'] if n else '')
          PY
          )"
            [ -n "$run_id" ] && break
            sleep 2
          done
          test -n "$run_id"
          echo "PAGES_LAUNCH_RUN_ID=$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          conclusion=''
          for attempt in $(seq 1 120); do
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" > /tmp/pages-run.json
            readarray -t state < <(python3 - <<'PY'
          import json
          r=json.load(open('/tmp/pages-run.json')); print(r.get('status') or ''); print(r.get('conclusion') or '')
          PY
          )
            if [ "${state[0]}" = completed ]; then conclusion="${state[1]}"; break; fi
            sleep 5
          done
          test "$conclusion" = success
          echo "UGMU_MAIN_PAGES_LAUNCH_SAFE run=$run_id"

      - name: Post-launch smoke
        shell: bash
        run: |
          set -euo pipefail
          meta="$(curl -fsS --retry 8 --retry-all-errors --retry-delay 2 "$PRODUCTION_BASE_URL/api/v2/meta")"
          python3 - "$meta" <<'PY'
          import json,sys
          m=json.loads(sys.argv[1]); assert m.get('sales')=='open'; assert m.get('trials')=='closed'; assert m.get('paymentMode')=='live'
          print('UGMU_LAUNCH_META_SAFE',{'sales':'open','trials':'closed','paymentMode':'live'})
          PY
          page="$(curl -fsS --retry 10 --retry-all-errors --retry-delay 2 "${UGMU_SITE_URL}?launch-smoke=${GITHUB_RUN_ID}")"
          printf '%s' "$page" | grep -q 'name="robots" content="index,follow"'
          printf '%s' "$page" | grep -q 'Календарь доступен'
          ! printf '%s' "$page" | grep -q 'Предзапусковый режим'
          group="$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote('ugmu:medicine:1:stream-1:ОЛД 101',safe=''))
          PY
          )"
          code="$(curl -sS -o /tmp/schedule.json -w '%{http_code}' "$PRODUCTION_BASE_URL/api/v2/schedules/ugmu/medicine/1/$group/schedule?groupCode=%D0%9E%D0%9B%D0%94%20101&stream=1")"
          test "$code" = 404
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/schedule.json'))=={'error':'schedule_not_published'}
          PY
          echo 'UGMU_CONTROLLED_LAUNCH_PASS publicSchedule=false publicIcs=false trials=false paymentCreated=false'

      - name: Record success evidence
        if: success()
        env:
          PAGES_RUN_ID: ${{ steps.pages.outputs.run_id }}
        shell: bash
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import json,os
          json.dump({
            'status':'PASS','boundary':'controlled-launch-activation','backendRunId':int(os.environ['GITHUB_RUN_ID']),
            'pagesRunId':int(os.environ['PAGES_RUN_ID']),'image':os.environ['EXPECTED_IMAGE'],'pagesSourceSha':os.environ['PAGES_SOURCE_SHA'],
            'sourceSha256':os.environ['UGMU_SOURCE_SHA'],'sales':'open','trials':'closed','paymentMode':'live',
            'publicSchedule':False,'publicIcs':False,'paymentCreated':False
          },open('evidence/report.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ugmu-controlled-launch-retry-${{ github.run_id }}
          path: evidence/report.json
          retention-days: 30

      - name: Roll back backend and Pages on failure
        if: failure()
        env:
          TOKEN: ${{ steps.cloud.outputs.token }}
          PROJECT: ${{ steps.cloud.outputs.project_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${TOKEN:-}" ] && [ -n "${PROJECT:-}" ]; then
            get="https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$PROJECT"; patch="https://containers.api.cloud.ru/v2/containers/${CONTAINER_NAME}?projectId=$PROJECT"
            test "$(curl -sS -o /tmp/rb-current.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$get")" = 200
            python3 - <<'PY'
          import json
          app=json.load(open('/tmp/rb-current.json')); c=app['template']['containers'][0]; items=c.setdefault('env',[]); by={x.get('name'):x for x in items if isinstance(x,dict) and x.get('name')}
          for n,v in [('UGMU_SALES_ENABLED','false'),('UGMU_ACTIVE','false'),('UGMU_SITE_URL','')]:
            if n in by: by[n]['value']=v; by[n].pop('type',None)
            else: items.append({'name':n,'value':v})
          json.dump(app,open('/tmp/rb-closed.json','w'),ensure_ascii=False,separators=(',',':'))
          PY
            test "$(curl -sS -o /tmp/rb-patch.json -w '%{http_code}' -X PATCH -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/rb-closed.json "$patch")" = 200
            for attempt in $(seq 1 50); do
              meta="$(curl -sS "$PRODUCTION_BASE_URL/api/v2/meta" || true)"
              if META="$meta" python3 - <<'PY'
          import json,os,sys
          try:m=json.loads(os.environ['META'])
          except:sys.exit(1)
          sys.exit(0 if m.get('sales')=='closed' and m.get('trials')=='closed' and m.get('paymentMode')=='live' else 1)
          PY
              then echo "UGMU_BACKEND_ROLLBACK_SAFE attempt=$attempt"; break; fi
              sleep 3
            done
          fi
          payload="$(python3 - <<'PY'
          import json,os
          print(json.dumps({'ref':'main','inputs':{'mode':'prelaunch','source_sha':os.environ['PAGES_SOURCE_SHA']}}))
          PY
          )"
          code="$(curl -sS -o /tmp/rb-dispatch.out -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${PAGES_WORKFLOW}/dispatches" || true)"
          echo "UGMU_PAGES_ROLLBACK_DISPATCH_SAFE http=$code"
          test "$code" = 204
