name: UGMU S3 credential path diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/ugmu-s3-credential-path-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DIRECT_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
  DIRECT_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
  DIRECT_S3_BUCKET: ${{ secrets.S3_BUCKET }}
  DIRECT_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
  DIRECT_S3_REGION: ${{ secrets.S3_REGION }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report credential path metadata only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          def present(name):
              value=os.environ.get(name,'')
              return {'present': bool(value), 'lengthBucket': '0' if not value else ('1-15' if len(value)<16 else '16-31' if len(value)<32 else '32+')}
          result={
              'version':1,
              'directGitHubSecrets':{
                  'accessKeyId':present('DIRECT_S3_ACCESS_KEY_ID'),
                  'secretAccessKey':present('DIRECT_S3_SECRET_ACCESS_KEY'),
                  'bucket':present('DIRECT_S3_BUCKET'),
                  'endpoint':present('DIRECT_S3_ENDPOINT'),
                  'region':present('DIRECT_S3_REGION'),
              },
          }
          result['directCredentialsAvailable']=result['directGitHubSecrets']['accessKeyId']['present'] and result['directGitHubSecrets']['secretAccessKey']['present']
          print(json.dumps(result, ensure_ascii=False, indent=2))
          with open('/tmp/ugmu-s3-credential-path.json','w',encoding='utf-8') as f:
              json.dump(result,f,ensure_ascii=False,indent=2)
          PY

      - name: Upload diagnostic metadata
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-s3-credential-path-diagnostic
          path: /tmp/ugmu-s3-credential-path.json
          retention-days: 7
