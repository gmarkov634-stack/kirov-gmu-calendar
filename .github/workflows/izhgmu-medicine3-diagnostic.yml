name: IzhGMU medicine-3 diagnostic

on:
  push:
    branches:
      - agent/izhgmu-batch-acquisition
    paths:
      - "api/src/adapters/izhgmu/medicine3-composite.mjs"
      - "api/tools/izhgmu-diagnose-medicine3-legacy.py"
      - "api/tools/izhgmu-diagnose-medicine3-grid.py"
      - "api/tools/izhgmu-diagnose-medicine3-styles.py"
      - "api/tools/izhgmu-diagnose-medicine3-lecture.mjs"
      - "api/tools/izhgmu-parse-medicine3-legacy.py"
      - "api/tools/izhgmu-verify-medicine3-lecture-audience.mjs"
      - "api/tools/izhgmu-resolve-medicine3-times.mjs"
      - "api/tools/izhgmu-check-medicine3-canonical.mjs"
      - "api/tools/izhgmu-audit-medicine3-stomatology.py"
      - ".github/workflows/izhgmu-medicine3-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install Node dependencies
        working-directory: api
        run: npm ci
      - name: Install legacy XLS reader
        run: python3 -m pip install --disable-pip-version-check xlrd==2.0.1
      - name: Collect exact current official IzhGMU sources
        working-directory: api
        run: npm run collect:izhgmu -- --output /tmp/izhgmu-current --concurrency 4
      - name: Diagnose medicine course 3 legacy class XLS
        working-directory: api
        run: python3 tools/izhgmu-diagnose-medicine3-legacy.py --input-dir /tmp/izhgmu-current
      - name: Expose medicine course 3 cycle grid
        working-directory: api
        run: python3 tools/izhgmu-diagnose-medicine3-grid.py --input-dir /tmp/izhgmu-current
      - name: Inspect medicine course 3 color boundaries
        working-directory: api
        run: python3 tools/izhgmu-diagnose-medicine3-styles.py --input-dir /tmp/izhgmu-current
      - name: Recover medicine course 3 cycles from colors
        working-directory: api
        run: python3 tools/izhgmu-parse-medicine3-legacy.py --input-dir /tmp/izhgmu-current
      - name: Diagnose medicine course 3 lecture XLSX
        working-directory: api
        run: node tools/izhgmu-diagnose-medicine3-lecture.mjs --input-dir /tmp/izhgmu-current
      - name: Verify medicine course 3 lecture audience against cycles
        working-directory: api
        run: node tools/izhgmu-verify-medicine3-lecture-audience.mjs --input-dir /tmp/izhgmu-current
      - name: Resolve medicine course 3 practice times from lecture evidence
        working-directory: api
        run: node tools/izhgmu-resolve-medicine3-times.mjs --input-dir /tmp/izhgmu-current
      - name: Run medicine course 3 group 301 through shared canonical QA
        working-directory: api
        run: node tools/izhgmu-check-medicine3-canonical.mjs --input-dir /tmp/izhgmu-current --group 301
      - name: Audit medicine course 3 stomatology timing evidence
        working-directory: api
        run: python3 tools/izhgmu-audit-medicine3-stomatology.py --input-dir /tmp/izhgmu-current
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izhgmu-medicine3-diagnostic
          path: |
            /tmp/izhgmu-current/medicine3-legacy-diagnostic.json
            /tmp/izhgmu-current/medicine3-grid-diagnostic.json
            /tmp/izhgmu-current/medicine3-style-diagnostic.json
            /tmp/izhgmu-current/medicine3-legacy-cycle.json
            /tmp/izhgmu-current/medicine3-lecture-diagnostic.json
            /tmp/izhgmu-current/medicine3-lecture-audience.json
            /tmp/izhgmu-current/medicine3-time-resolution.json
            /tmp/izhgmu-current/medicine3-canonical-301.json
            /tmp/izhgmu-current/medicine3-stomatology-audit.json
          if-no-files-found: warn
          retention-days: 14
