name: Generate KGMU 101-110 golden fixture

on:
  push:
    branches:
      - kgmu-ingestion-fixture-foundation
    paths:
      - .github/workflows/generate-101-110-golden.yml
      - fixtures/tools/generate_medicine_101_110.py
      - fixtures/2026-2027-semester-1/medicine-101-110.source.json

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kgmu-ingestion-fixture-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Generate normalized golden fixture and QA evidence
        run: python fixtures/tools/generate_medicine_101_110.py
      - name: Commit generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures/2026-2027-semester-1/normalized qa/2026-2027-semester-1
          if git diff --cached --quiet; then
            echo "Generated files unchanged"
            exit 0
          fi
          git commit -m "Add normalized KGMU 101-110 golden fixture"
          git push origin HEAD:kgmu-ingestion-fixture-foundation
