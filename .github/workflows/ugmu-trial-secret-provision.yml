name: UGMU trial identity secret provision

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PROVISION_UGMU_TRIAL_SECRET to continue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kgmu-production-api-deploy
  cancel-in-progress: false

env:
  CONTAINER_NAME: kgmu-calendar-api

jobs:
  provision:
    if: ${{ inputs.confirm == 'PROVISION_UGMU_TRIAL_SECRET' }}
    runs-on: ubuntu-latest
    steps:
      - name: Provision HMAC secret while trial gates remain closed
        env:
          CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
          CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
        shell: bash
        run: |
          set -euo pipefail

          auth_payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({"keyId": os.environ["CLOUDRU_KEY_ID"], "secret": os.environ["CLOUDRU_KEY_SECRET"]}))
          PY
          )"
          test "$(curl --silent --show-error --output /tmp/token.json --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data "$auth_payload" \
            'https://iam.api.cloud.ru/api/v1/auth/token')" = "200"

          readarray -t auth < <(python3 - <<'PY'
          import base64, json
          body=json.load(open('/tmp/token.json', encoding='utf-8'))
          token=body.get('access_token')
          assert isinstance(token, str) and token
          parts=token.split('.')
          assert len(parts) == 3
          payload=parts[1] + '='*((4-len(parts[1])%4)%4)
          claims=json.loads(base64.urlsafe_b64decode(payload.encode()).decode())
          project_id=claims.get('project_id')
          assert isinstance(project_id, str) and project_id
          print(token)
          print(project_id)
          PY
          )
          token="${auth[0]}"
          project_id="${auth[1]}"
          rm -f /tmp/token.json
          echo "::add-mask::$token"

          get_url="https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$project_id"
          patch_url="https://containers.api.cloud.ru/v2/containers/${CONTAINER_NAME}?projectId=$project_id"

          test "$(curl --silent --show-error --output /tmp/current.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $token" --header 'Accept: application/json' "$get_url")" = "200"

          python3 - <<'PY'
          import json
          app=json.load(open('/tmp/current.json', encoding='utf-8'))
          assert app.get('name') == 'kgmu-calendar-api', app.get('name')
          assert app.get('status') == 'running', app.get('status')
          containers=app.get('template',{}).get('containers',[])
          assert len(containers) == 1, len(containers)
          env={item.get('name'):item.get('value') for item in containers[0].get('env',[]) if isinstance(item,dict)}
          assert env.get('TRIALS_ENABLED') != 'true', 'TRIALS_ENABLED must remain closed'
          assert env.get('UGMU_TRIALS_ENABLED') != 'true', 'UGMU_TRIALS_ENABLED must remain closed'
          PY

          secret="$(openssl rand -base64 48 | tr -d '\n')"
          test "${#secret}" -ge 32
          echo "::add-mask::$secret"

          TRIAL_SECRET="$secret" python3 - <<'PY'
          import json, os
          app=json.load(open('/tmp/current.json', encoding='utf-8'))
          container=app['template']['containers'][0]
          rows=[item for item in container.get('env',[]) if isinstance(item,dict)]
          rows=[item for item in rows if item.get('name') != 'TRIAL_IDENTITY_HMAC_SECRET']
          rows.append({'name':'TRIAL_IDENTITY_HMAC_SECRET','value':os.environ['TRIAL_SECRET']})
          container['env']=rows
          json.dump(app, open('/tmp/patch.json','w', encoding='utf-8'), ensure_ascii=False, separators=(',',':'))
          PY

          patch_code="$(curl --silent --show-error --output /tmp/patch-response.json --write-out '%{http_code}' \
            --request PATCH --header "Authorization: Bearer $token" --header 'Content-Type: application/json' \
            --data-binary @/tmp/patch.json "$patch_url")"
          test "$patch_code" = "200"
          rm -f /tmp/patch.json /tmp/patch-response.json

          ready='false'
          for attempt in $(seq 1 40); do
            current_code="$(curl --silent --show-error --output /tmp/after.json --write-out '%{http_code}' \
              --header "Authorization: Bearer $token" --header 'Accept: application/json' "$get_url")"
            if [ "$current_code" = "200" ] && python3 - <<'PY'
          import json, sys
          app=json.load(open('/tmp/after.json', encoding='utf-8'))
          containers=app.get('template',{}).get('containers',[])
          if app.get('status') != 'running' or len(containers) != 1:
              sys.exit(1)
          env={item.get('name'):item.get('value') for item in containers[0].get('env',[]) if isinstance(item,dict)}
          ok=(
              isinstance(env.get('TRIAL_IDENTITY_HMAC_SECRET'), str) and
              len(env['TRIAL_IDENTITY_HMAC_SECRET']) >= 32 and
              env.get('TRIALS_ENABLED') != 'true' and
              env.get('UGMU_TRIALS_ENABLED') != 'true'
          )
          sys.exit(0 if ok else 1)
          PY
            then
              ready='true'
              break
            fi
            sleep 3
          done
          test "$ready" = "true"
          rm -f /tmp/current.json /tmp/after.json
          echo "UGMU_TRIAL_SECRET_PROVISIONED_SAFE gates=closed"
