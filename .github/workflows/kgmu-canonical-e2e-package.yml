name: KGMU canonical E2E package

on:
  push:
    paths:
      - ".github/workflows/kgmu-canonical-e2e-package.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Prepare reviewed group 401
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const sourcePath = 'reviewed/kgmu/2025-26/2/medicine/4/146876a71f1ad8503593aeb82fcc72fef76022896b85d7f7dc61ca7ec97c0dae.json';
          const source = JSON.parse(fs.readFileSync(sourcePath, 'utf8'));
          if (!source.groups?.['401']) throw new Error('group 401 missing');
          const one = structuredClone(source);
          one.source.groupRange = '401-401';
          one.groups = { '401': source.groups['401'] };
          fs.writeFileSync('/tmp/reviewed-401.json', JSON.stringify(one));
          console.log(JSON.stringify({url:one.source.url,sha256:one.source.sha256,events:one.groups['401'].events.length}));
          NODE

      - name: Download exact official XLSX
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            -A 'medical-calendar-e2e/1.0' \
            'https://kirovgma.ru/sites/default/files/files/2026/02/02/1078/4_kurs_lechebnyy_fakultet-02-02-2026-14.xlsx' \
            -o /tmp/source.xlsx
          actual="$(sha256sum /tmp/source.xlsx | awk '{print $1}')"
          expected='146876a71f1ad8503593aeb82fcc72fef76022896b85d7f7dc61ca7ec97c0dae'
          test "$actual" = "$expected"
          echo "SOURCE_SHA256=$actual"

      - name: Inspect workbook date and week anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, zipfile
          from datetime import datetime, timedelta
          from xml.etree import ElementTree as ET

          NS = {'m':'http://schemas.openxmlformats.org/spreadsheetml/2006/main', 'r':'http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'pr':'http://schemas.openxmlformats.org/package/2006/relationships'}
          with zipfile.ZipFile('/tmp/source.xlsx') as z:
              shared = []
              if 'xl/sharedStrings.xml' in z.namelist():
                  root = ET.fromstring(z.read('xl/sharedStrings.xml'))
                  for si in root.findall('m:si', NS):
                      shared.append(''.join(t.text or '' for t in si.iter('{%s}t' % NS['m'])))
              custom = {}
              date_style_ids = set()
              root = ET.fromstring(z.read('xl/styles.xml'))
              numfmts = root.find('m:numFmts', NS)
              if numfmts is not None:
                  for n in numfmts.findall('m:numFmt', NS):
                      custom[int(n.attrib['numFmtId'])] = n.attrib.get('formatCode','')
              cellxfs = root.find('m:cellXfs', NS)
              built_in_dates = set(range(14,23)) | set(range(27,37)) | set(range(45,48)) | set(range(50,59))
              if cellxfs is not None:
                  for i, xf in enumerate(cellxfs.findall('m:xf', NS)):
                      num_id = int(xf.attrib.get('numFmtId','0'))
                      fmt = custom.get(num_id,'').lower()
                      fmt_clean = re.sub(r'"[^"]*"|\\.|\[[^\]]*\]', '', fmt)
                      if num_id in built_in_dates or (('d' in fmt_clean or 'm' in fmt_clean) and 'y' in fmt_clean):
                          date_style_ids.add(i)
              wb = ET.fromstring(z.read('xl/workbook.xml'))
              rels = ET.fromstring(z.read('xl/_rels/workbook.xml.rels'))
              relmap = {r.attrib['Id']: r.attrib['Target'] for r in rels.findall('pr:Relationship', NS)}
              sheets = []
              for sh in wb.find('m:sheets', NS).findall('m:sheet', NS):
                  target = relmap[sh.attrib['{%s}id' % NS['r']]]
                  sheets.append((sh.attrib['name'], target.lstrip('/') if target.startswith('/') else 'xl/' + target.lstrip('/')))
              date_cells, text_hits = [], []
              for sheet_name, sheet_path in sheets:
                  root = ET.fromstring(z.read(sheet_path))
                  for c in root.findall('.//m:c', NS):
                      ref, t, s = c.attrib.get('r'), c.attrib.get('t'), int(c.attrib.get('s','0'))
                      v = c.find('m:v', NS)
                      text = None
                      if t == 's' and v is not None:
                          idx = int(v.text); text = shared[idx] if 0 <= idx < len(shared) else ''
                      elif t == 'inlineStr':
                          isel = c.find('m:is', NS); text = ''.join(x.text or '' for x in isel.iter('{%s}t' % NS['m'])) if isel is not None else ''
                      elif t == 'str' and v is not None:
                          text = v.text or ''
                      if text:
                          cleaned = ' '.join(text.split())
                          if re.search(r'недел|02[.\-/]02|2026', cleaned, re.I):
                              text_hits.append({'sheet':sheet_name,'cell':ref,'text':cleaned[:500]})
                      if v is not None and s in date_style_ids and t not in ('s','inlineStr','str'):
                          try:
                              dt = datetime(1899,12,30) + timedelta(days=float(v.text))
                              if datetime(2025,1,1) <= dt <= datetime(2027,12,31):
                                  date_cells.append({'sheet':sheet_name,'cell':ref,'date':dt.date().isoformat()})
                          except Exception:
                              pass
          dates = sorted(date_cells, key=lambda x:(x['date'],x['sheet'],x['cell']))
          explicit = sorted(set(x['date'] for x in dates))
          result = {
              'source_sha256':'146876a71f1ad8503593aeb82fcc72fef76022896b85d7f7dc61ca7ec97c0dae',
              'sheets':[name for name,_ in sheets],
              'earliest_date_cells':dates[:40],
              'near_start_date_cells':[x for x in dates if '2026-01-15' <= x['date'] <= '2026-02-15'][:120],
              'text_hits':text_hits[:120],
              'explicit_dates_first_40':explicit[:40],
              'week1_start_date':'2026-02-02',
              'week1_confirmed_in_workbook':'2026-02-02' in explicit or any('02.02' in h['text'] for h in text_hits),
          }
          if not result['week1_confirmed_in_workbook']:
              raise SystemExit('2026-02-02 is not explicitly represented in source workbook')
          with open('/tmp/source-inspection.json','w',encoding='utf8') as f:
              json.dump(result,f,ensure_ascii=False,indent=2)
          print('SOURCE_INSPECTION_BEGIN')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          print('SOURCE_INSPECTION_END')
          PY

      - name: Build canonical review command
        shell: bash
        run: |
          set -euo pipefail
          node api/tools/kgmu-legacy-reviewed-to-canonical.mjs \
            --input /tmp/reviewed-401.json \
            --group 401 \
            --week1-start 2026-02-02 \
            --output /tmp/canonical-401.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validateScheduleBatch } from './api/src/schedule/validate.js';
          const pkg = JSON.parse(fs.readFileSync('/tmp/canonical-401.json','utf8'));
          const qa = validateScheduleBatch(pkg.batches[0]);
          if (!qa.publishable || qa.errors.length || qa.warnings.length) throw new Error(JSON.stringify(qa));
          const command = {
            id: `kgmu-e2e-401-${process.env.GITHUB_RUN_ID}`,
            action: 'review.submit_publish',
            reviewId: '2bd45e02-0ffe-49ee-95d5-5f5fcfc361eb',
            createdAt: new Date().toISOString(),
            package: pkg,
          };
          fs.mkdirSync('/tmp/artifact',{recursive:true});
          fs.writeFileSync('/tmp/artifact/command.json', JSON.stringify(command,null,2));
          fs.copyFileSync('/tmp/source-inspection.json','/tmp/artifact/source-inspection.json');
          console.log(JSON.stringify({reviewId:command.reviewId,action:command.action,events:pkg.batches[0].events.length,qa:qa.stats}));
          NODE

      - name: Upload command artifact
        uses: actions/upload-artifact@v4
        with:
          name: kgmu-canonical-e2e-401
          path: /tmp/artifact
          retention-days: 1
