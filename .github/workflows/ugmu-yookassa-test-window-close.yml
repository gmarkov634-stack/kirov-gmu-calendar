name: UGMU YooKassa test window close

on:
  push:
    branches: [agent/ugmu-scaffold-20260820]
    paths: ["universities/ugmu/yookassa-test-window-close.json"]

permissions:
  contents: read

env:
  CONTAINER_NAME: kgmu-calendar-api
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru
  UGMU_SITE_URL: https://gmarkov634-stack.github.io/kirov-gmu-calendar/ugmu/
  TEST_SHOP_ID: "1259975"
  LIVE_SHOP_ID: "1258890"
  TEST_SECRET: yookassa-test-secret-key
  LIVE_SECRET: yookassa-secret-key
  EXPECTED_IMAGE: kgmu-calendar-api.cr.cloud.ru/api@sha256:1eb443926c40e705ee8d758d8479552576deb735d54fe86a18ec300895929829

jobs:
  restore-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
      CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify one-shot authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          p='universities/ugmu/yookassa-test-window-close.json'
          a=json.load(open(p,encoding='utf-8'))
          assert a['version']==1
          assert a['kind']=='ugmu-yookassa-test-window-close'
          assert a['boundary']=='temporary-yookassa-test-window'
          assert a['liveShopId']=='1258890'
          assert a['liveSecretPath']=='yookassa-secret-key'
          assert a['restoreLive'] is True
          assert a['paymentCreationAllowed'] is False
          prepared=a['preparedWorkflowHead']; assert len(prepared)==40
          changed=subprocess.check_output(['git','diff','--name-only',prepared,'HEAD'],text=True).splitlines()
          assert changed==[p], changed
          print('UGMU_TEST_WINDOW_CLOSE_AUTHORITY_SAFE',{'liveShopId':'1258890','paymentCreationAllowed':False})
          PY

      - name: Setup Go for Secret Management preflight
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache: false

      - name: Preflight live provider and current test state
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          auth_payload="$(python3 - <<'PY'
          import json,os
          print(json.dumps({'keyId':os.environ['CLOUDRU_KEY_ID'],'secret':os.environ['CLOUDRU_KEY_SECRET']}))
          PY
          )"
          test "$(curl -sS -o /tmp/cloud-token.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data "$auth_payload" https://iam.api.cloud.ru/api/v1/auth/token)" = 200
          readarray -t auth < <(python3 - <<'PY'
          import base64,json
          t=json.load(open('/tmp/cloud-token.json'))['access_token'];p=t.split('.')[1];p+='='*((4-len(p)%4)%4);c=json.loads(base64.urlsafe_b64decode(p.encode()));print(t);print(c['project_id'])
          PY
          )
          token="${auth[0]}"; project="${auth[1]}"; rm -f /tmp/cloud-token.json; echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "project=$project" >> "$GITHUB_OUTPUT"

          get="https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$project"
          test "$(curl -sS -o /tmp/before.json -w '%{http_code}' -H "Authorization: Bearer $token" "$get")" = 200
          EXPECTED_IMAGE="$EXPECTED_IMAGE" TEST_SHOP_ID="$TEST_SHOP_ID" TEST_SECRET="$TEST_SECRET" python3 - <<'PY'
          import json,os
          a=json.load(open('/tmp/before.json')); assert a.get('status')=='running'
          c=a['template']['containers'][0]; assert c.get('image')==os.environ['EXPECTED_IMAGE']
          e={x.get('name'):x for x in c.get('env',[]) if isinstance(x,dict)}
          assert e.get('COMMERCIAL_SALES_ENABLED',{}).get('value')!='true'
          assert e.get('UGMU_SALES_ENABLED',{}).get('value')=='true'
          assert e.get('UGMU_ACTIVE',{}).get('value')=='true'
          assert e.get('TRIALS_ENABLED',{}).get('value')!='true'
          assert e.get('YOOKASSA_TEST_MODE',{}).get('value')=='true'
          assert e.get('YOOKASSA_SHOP_ID',{}).get('value')==os.environ['TEST_SHOP_ID']
          s=e.get('YOOKASSA_SECRET_KEY',{}); assert s.get('type')=='secret' and s.get('value')==os.environ['TEST_SECRET']
          print('UGMU_TEST_WINDOW_CLOSE_PRESTATE_SAFE',{'running':True,'globalSales':False,'ugmuSales':True,'active':True,'trials':False,'paymentMode':'test','testShopMatched':True})
          PY

          mkdir -p /tmp/livepre && cd /tmp/livepre
          cat > go.mod <<'EOF'
          module ugmulivepreflight
          go 1.23.0
          require github.com/cloudru-tech/secret-manager-sdk v1.1.1
          require google.golang.org/grpc v1.70.0
          EOF
          cat > main.go <<'EOF'
          package main
          import("context";"encoding/json";"fmt";"io";"net/http";"os";"strings";"time";sm "github.com/cloudru-tech/secret-manager-sdk";v2 "github.com/cloudru-tech/secret-manager-sdk/api/v2";"google.golang.org/grpc/metadata")
          func m(n string)string{v:=os.Getenv(n);if v==""{panic(n)};return v}
          func main(){cl,e:=sm.New(&sm.Config{Host:"secretmanager.api.cloud.ru:443"});if e!=nil{panic(e)};defer cl.Close();ctx,c:=context.WithTimeout(context.Background(),30*time.Second);defer c();ctx=metadata.AppendToOutgoingContext(ctx,"authorization","Bearer "+m("TOKEN"));sr,e:=cl.V2.SecretService.Search(ctx,&v2.SearchSecretRequest{ProjectId:m("PROJECT"),Depth:-1});if e!=nil{panic(e)};target:=m("SECRET");paths:=[]string{};for _,s:=range sr.GetSecrets(){p:=s.GetPath();if p==target||strings.HasSuffix(p,"/"+target){paths=append(paths,p)}};if len(paths)!=1{panic("secret match count")};sec,e:=cl.V2.SecretService.Access(ctx,&v2.AccessSecretRequest{ProjectId:m("PROJECT"),Path:paths[0]});if e!=nil{panic(e)};req,_:=http.NewRequest(http.MethodGet,"https://api.yookassa.ru/v3/payments?limit=10",nil);req.SetBasicAuth(m("SHOP"),string(sec.GetPayload().GetValue()));r,e:=(&http.Client{Timeout:20*time.Second}).Do(req);if e!=nil{panic(e)};defer r.Body.Close();b,_:=io.ReadAll(io.LimitReader(r.Body,2<<20));if r.StatusCode!=200{panic(fmt.Sprintf("provider http %d",r.StatusCode))};var x struct{Type string `json:"type"`;Items []struct{Test bool `json:"test"`} `json:"items"`};if e=json.Unmarshal(b,&x);e!=nil{panic(e)};live,test:=0,0;for _,p:=range x.Items{if p.Test{test++}else{live++}};fmt.Printf("UGMU_TEST_WINDOW_CLOSE_PROVIDER_PRE_SAFE http=200 type=%s items=%d liveItems=%d testItems=%d paymentCreated=false\n",x.Type,len(x.Items),live,test);if x.Type!="list"||len(x.Items)==0||live==0||test!=0{os.Exit(4)}}
          EOF
          go mod tidy
          TOKEN="$token" PROJECT="$project" SECRET="$LIVE_SECRET" SHOP="$LIVE_SHOP_ID" go run .
          cd "$GITHUB_WORKSPACE"; rm -rf /tmp/livepre

      - name: Restore live YooKassa configuration atomically
        shell: bash
        env:
          TOKEN: ${{ steps.preflight.outputs.token }}
          PROJECT: ${{ steps.preflight.outputs.project }}
        run: |
          set -euo pipefail
          umask 077
          patch="https://containers.api.cloud.ru/v2/containers/${CONTAINER_NAME}?projectId=$PROJECT"
          LIVE_SHOP_ID="$LIVE_SHOP_ID" LIVE_SECRET="$LIVE_SECRET" python3 - <<'PY'
          import json,os
          a=json.load(open('/tmp/before.json'));c=a['template']['containers'][0];items=c.setdefault('env',[]);by={x.get('name'):x for x in items if isinstance(x,dict) and x.get('name')}
          def plain(n,v):
            if n in by: by[n]['value']=v;by[n].pop('type',None)
            else: items.append({'name':n,'value':v});by[n]=items[-1]
          plain('YOOKASSA_SHOP_ID',os.environ['LIVE_SHOP_ID']);plain('YOOKASSA_TEST_MODE','false')
          if 'YOOKASSA_SECRET_KEY' not in by:items.append({'name':'YOOKASSA_SECRET_KEY','value':os.environ['LIVE_SECRET'],'type':'secret'});by['YOOKASSA_SECRET_KEY']=items[-1]
          else:by['YOOKASSA_SECRET_KEY']['value']=os.environ['LIVE_SECRET'];by['YOOKASSA_SECRET_KEY']['type']='secret'
          assert by.get('COMMERCIAL_SALES_ENABLED',{}).get('value')!='true';assert by.get('UGMU_SALES_ENABLED',{}).get('value')=='true';assert by.get('UGMU_ACTIVE',{}).get('value')=='true';assert by.get('TRIALS_ENABLED',{}).get('value')!='true'
          json.dump(a,open('/tmp/live.json','w'),ensure_ascii=False,separators=(',',':'))
          PY
          test "$(curl -sS -o /tmp/patch.json -w '%{http_code}' -X PATCH -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/live.json "$patch")" = 200

          ok=false
          for i in $(seq 1 60);do
            m="$(curl -sS "$PRODUCTION_BASE_URL/api/v2/meta" || true)"
            if META="$m" python3 - <<'PY'
          import json,os,sys
          try:m=json.loads(os.environ['META'])
          except:sys.exit(1)
          sys.exit(0 if m.get('sales')=='open' and m.get('trials')=='closed' and m.get('paymentMode')=='live' else 1)
          PY
            then ok=true;break;fi;sleep 3;done
          test "$ok" = true

      - name: Verify restored live state
        shell: bash
        env:
          TOKEN: ${{ steps.preflight.outputs.token }}
          PROJECT: ${{ steps.preflight.outputs.project }}
        run: |
          set -euo pipefail
          get="https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$PROJECT"
          test "$(curl -sS -o /tmp/after.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$get")" = 200
          EXPECTED_IMAGE="$EXPECTED_IMAGE" LIVE_SHOP_ID="$LIVE_SHOP_ID" LIVE_SECRET="$LIVE_SECRET" python3 - <<'PY'
          import json,os
          a=json.load(open('/tmp/after.json'));assert a.get('status')=='running';c=a['template']['containers'][0];assert c.get('image')==os.environ['EXPECTED_IMAGE'];e={x.get('name'):x for x in c.get('env',[]) if isinstance(x,dict)}
          assert e.get('COMMERCIAL_SALES_ENABLED',{}).get('value')!='true';assert e.get('UGMU_SALES_ENABLED',{}).get('value')=='true';assert e.get('UGMU_ACTIVE',{}).get('value')=='true';assert e.get('TRIALS_ENABLED',{}).get('value')!='true';assert e.get('YOOKASSA_TEST_MODE',{}).get('value')=='false';assert e.get('YOOKASSA_SHOP_ID',{}).get('value')==os.environ['LIVE_SHOP_ID'];s=e.get('YOOKASSA_SECRET_KEY',{});assert s.get('type')=='secret' and s.get('value')==os.environ['LIVE_SECRET']
          print('UGMU_TEST_WINDOW_CLOSE_RUNTIME_SAFE',{'running':True,'imageUnchanged':True,'globalSales':False,'ugmuSales':True,'active':True,'trials':False,'paymentMode':'live','liveShopMatched':True,'liveSecretRefMatched':True})
          PY
          sched="$(curl -sS -o /tmp/schedule.json -w '%{http_code}' "$PRODUCTION_BASE_URL/api/v2/schedules/ugmu/medicine/1/2026-2027/semester-1/ugmu%3Amedicine%3A1%3Astream-1%3A%D0%9E%D0%9B%D0%94%20101")"
          ics="$(curl -sS -o /tmp/public.ics -w '%{http_code}' "$PRODUCTION_BASE_URL/api/v2/schedules/ugmu/medicine/1/2026-2027/semester-1/ugmu%3Amedicine%3A1%3Astream-1%3A%D0%9E%D0%9B%D0%94%20101/calendar.ics")"
          test "$sched" = 404; test "$ics" = 404
          page="$(curl -fsS "$UGMU_SITE_URL")"; printf '%s' "$page" | grep -q 'Календарь доступен'; printf '%s' "$page" | grep -q 'index,follow'
          echo "UGMU_TEST_WINDOW_CLOSE_PASS schedule=$sched publicIcs=$ics paymentCreated=false productionMutation=true"

      - name: Evidence
        shell: bash
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import json
          json.dump({'status':'PASS','boundary':'temporary-yookassa-test-window','testShopId':'1259975','liveShopId':'1258890','liveSecretPath':'yookassa-secret-key','paymentMode':'live','globalSalesEnabled':False,'ugmuSalesEnabled':True,'ugmuActive':True,'trialsEnabled':False,'publicScheduleStatus':404,'publicIcsStatus':404,'paymentCreated':False,'productionMutationPerformed':True,'testWindowClosed':True,'nextFormalBoundary':'post-launch-ci-mode-transition'},open('evidence/report.json','w'),indent=2,ensure_ascii=False)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ugmu-yookassa-test-window-close-${{ github.run_id }}
          path: evidence/report.json
          retention-days: 90
