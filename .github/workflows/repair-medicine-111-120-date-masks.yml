name: Repair medicine 111-120 date masks

on:
  push:
    branches:
      - feat/medicine-111-120
    paths:
      - .github/workflows/repair-medicine-111-120-date-masks.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/medicine-111-120
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply checksum-bound reviewed mask encoding
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, zlib
          from pathlib import Path

          encoded = ''
          raw = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest() == '945203ed7ea21479f24d10dfc8cf1fb1a17b2787176ac095c1168a86de01c497'
          payload = json.loads(raw)
          assert len(payload['dates']) == 110
          assert len(payload['masks']) == 189

          path = Path('fixtures/2026-2027-semester-1/medicine-111-120.decisions.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          assert len(manifest['decisions']) == 189
          assert manifest['candidateDigest'] == 'sha256:4fad86fe6535d51733432da0e5ff760ec4c7e9eb9ee3a1b678309aa8c10b0838'
          manifest['dateTable'] = payload['dates']
          for decision, mask in zip(manifest['decisions'], payload['masks']):
              decision[2] = mask
          manifest['candidateDigest'] = 'sha256:28356b9ed1d15678252842e7ebee5c19ddd66b8221b6382e09322db0eea6aa71'
          path.write_text(json.dumps(manifest, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY
      - name: Verify complete repository
        run: npm run check
      - name: Commit repaired encoding
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures/2026-2027-semester-1/medicine-111-120.decisions.json
          git diff --cached --quiet && exit 0
          git commit -m "Repair medicine 111-120 date mask encoding"
          git push origin HEAD:feat/medicine-111-120
