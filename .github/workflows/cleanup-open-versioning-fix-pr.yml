name: Clean and open versioning fix PR
on:
  push:
    paths: ['.github/workflows/cleanup-open-versioning-fix-pr.yml']
permissions:
  contents: write
  pull-requests: write
jobs:
  prepare-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/versioning-exact-fingerprint-31711500563
          fetch-depth: 0
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch ops/versioning-fix-note.txt ops/versioning-fix-pr-ready.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove temporary versioning fix markers'
            git push origin HEAD:fix/versioning-exact-fingerprint-31711500563
          fi
          if ! gh pr view fix/versioning-exact-fingerprint-31711500563 --json number >/tmp/pr.json 2>/dev/null; then
            gh pr create \
              --base main \
              --head fix/versioning-exact-fingerprint-31711500563 \
              --title 'Fix canonical event identity drift' \
              --body 'Production subscription E2E exposed event identity drift across repeated A→B→A updates. Pair unique exact semantic fingerprints before broader occurrence/source anchors and add regression coverage for A→B→A→B.'
          else
            cat /tmp/pr.json
          fi
