name: UGMU post-launch production verify

on:
  push:
    branches:
      - agent/ugmu-scaffold-20260820
    paths:
      - "universities/ugmu/post-launch-production-verify.json"

permissions:
  contents: read
  actions: read

env:
  CONTAINER_NAME: kgmu-calendar-api
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru
  UGMU_SITE_URL: https://gmarkov634-stack.github.io/kirov-gmu-calendar/ugmu/
  EXPECTED_IMAGE: kgmu-calendar-api.cr.cloud.ru/api@sha256:1eb443926c40e705ee8d758d8479552576deb735d54fe86a18ec300895929829
  SOURCE_SHA256: 34612248bba201096d6566cacb37c53be01d3f84eddc214bda2a594b46fb24f8
  APPROVED_MANIFEST_RUN: "32418787126"
  APPROVED_MANIFEST_SHA256: 2d8103b1c0a873c8cd52cc569426338342f2671ce0d740db6f3f0482590262e5
  YOOKASSA_SECRET_NAME: yookassa-secret-key
  S3_BUCKET: kgmu-calendar-data-gmarkov634
  S3_ENDPOINT: https://s3.cloud.ru
  S3_REGION: ru-central-1

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
      CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
      DIRECT_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      DIRECT_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact authority commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify one-shot read-only authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          a=json.load(open('universities/ugmu/post-launch-production-verify.json',encoding='utf-8'))
          assert a['version']==1
          assert a['kind']=='ugmu-post-launch-production-verify'
          assert a['boundary']=='post-launch-production-verification'
          assert a['authorizedBranch']=='agent/ugmu-scaffold-20260820'
          assert a['sourceSha256']=='34612248bba201096d6566cacb37c53be01d3f84eddc214bda2a594b46fb24f8'
          assert a['expectedImage']=='kgmu-calendar-api.cr.cloud.ru/api@sha256:1eb443926c40e705ee8d758d8479552576deb735d54fe86a18ec300895929829'
          assert a['groups']==[f'ОЛД {n}' for n in range(101,113)]
          assert a['userAuthorization']=='Далее'
          assert a['readOnly'] is True
          assert a['paymentCreationAllowed'] is False
          prepared=a['preparedWorkflowHead']; assert len(prepared)==40
          changed=subprocess.check_output(['git','diff','--name-only',prepared,'HEAD'],text=True).splitlines()
          assert changed==['universities/ugmu/post-launch-production-verify.json'], changed
          print('UGMU_POST_LAUNCH_AUTHORITY_SAFE',{'boundary':a['boundary'],'groups':12,'readOnly':True,'paymentCreationAllowed':False})
          PY

      - name: Verify workflow safety contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          t=Path('.github/workflows/ugmu-post-launch-production-verify.yml').read_text(encoding='utf-8')
          forbidden=[
            '--request '+'PATCH', 'containers.api.cloud.ru/'+'v2/',
            'Put'+'ObjectCommand', 'Delete'+'ObjectCommand', 'aws '+'s3 cp', 'aws '+'s3 rm',
            'http.Method'+'Post,"https://api.yookassa.ru',
            'POST /api/v2/payments',
          ]
          for x in forbidden: assert x not in t, x
          assert 'http.MethodGet' in t
          assert 'GetObjectCommand' in t
          print('UGMU_POST_LAUNCH_READ_ONLY_CONTRACT_SAFE')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Download exact approved production manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ugmu-manifest && mkdir -p /tmp/ugmu-manifest
          gh run download "$APPROVED_MANIFEST_RUN" --repo "$GITHUB_REPOSITORY" --name ugmu-preactivation-production-dry-run --dir /tmp/ugmu-manifest
          manifest="$(find /tmp/ugmu-manifest -path '*/ugmu-preactivation-dry-run/manifest.json' -print -quit)"
          test -n "$manifest"
          test "$(sha256sum "$manifest" | cut -d' ' -f1)" = "$APPROVED_MANIFEST_SHA256"
          cp "$manifest" /tmp/approved-manifest.json
          echo 'UGMU_POST_LAUNCH_MANIFEST_SAFE'

      - name: Read Cloud.ru production state
        id: cloud
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          auth_payload="$(python3 - <<'PY'
          import json,os
          print(json.dumps({'keyId':os.environ['CLOUDRU_KEY_ID'],'secret':os.environ['CLOUDRU_KEY_SECRET']}))
          PY
          )"
          test "$(curl -sS -o /tmp/cloud-token.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data "$auth_payload" https://iam.api.cloud.ru/api/v1/auth/token)" = 200
          readarray -t a < <(python3 - <<'PY'
          import base64,json
          t=json.load(open('/tmp/cloud-token.json'))['access_token']; p=t.split('.')[1]; p+='='*((4-len(p)%4)%4); c=json.loads(base64.urlsafe_b64decode(p.encode())); print(t); print(c['project_id'])
          PY
          )
          token="${a[0]}"; project="${a[1]}"; rm -f /tmp/cloud-token.json
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "project=$project" >> "$GITHUB_OUTPUT"
          test "$(curl -sS -o /tmp/container.json -w '%{http_code}' -H "Authorization: Bearer $token" "https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$project")" = 200
          EXPECTED_IMAGE="$EXPECTED_IMAGE" UGMU_SITE_URL="$UGMU_SITE_URL" python3 - <<'PY'
          import json,os
          a=json.load(open('/tmp/container.json')); assert a.get('status')=='running'
          c=a['template']['containers'][0]; assert c.get('image')==os.environ['EXPECTED_IMAGE'],c.get('image')
          e={x.get('name'):x for x in c.get('env',[]) if isinstance(x,dict) and x.get('name')}
          state={
            'containerRunning':True,
            'image':c.get('image'),
            'globalSalesEnabled':e.get('COMMERCIAL_SALES_ENABLED',{}).get('value')=='true',
            'ugmuSalesEnabled':e.get('UGMU_SALES_ENABLED',{}).get('value')=='true',
            'ugmuActive':e.get('UGMU_ACTIVE',{}).get('value')=='true',
            'ugmuSiteUrl':e.get('UGMU_SITE_URL',{}).get('value') or '',
            'trialsEnabled':e.get('TRIALS_ENABLED',{}).get('value')=='true',
            'testModeEnv':e.get('YOOKASSA_TEST_MODE',{}).get('value'),
            'shopIdPresent':bool(e.get('YOOKASSA_SHOP_ID',{}).get('value')),
            'secretType':e.get('YOOKASSA_SECRET_KEY',{}).get('type'),
          }
          assert state['globalSalesEnabled'] is False
          assert state['ugmuSalesEnabled'] is True
          assert state['ugmuActive'] is True
          assert state['ugmuSiteUrl']==os.environ['UGMU_SITE_URL']
          assert state['trialsEnabled'] is False
          assert state['testModeEnv']=='false'
          assert state['shopIdPresent'] is True
          assert state['secretType']=='secret'
          json.dump(state,open('/tmp/cloud-state.json','w'),ensure_ascii=False)
          open('/tmp/shop','w').write(str(e['YOOKASSA_SHOP_ID']['value']))
          print('UGMU_POST_LAUNCH_CLOUD_SAFE',{'running':True,'globalSales':False,'ugmuSales':True,'ugmuActive':True,'trials':False,'paymentMode':'live'})
          PY
          rm -f /tmp/container.json

      - name: Read-only YooKassa provider verification
        env:
          TOKEN: ${{ steps.cloud.outputs.token }}
          PROJECT: ${{ steps.cloud.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/provider && cd /tmp/provider
          cat > go.mod <<'EOF'
          module ugmupostlaunch
          go 1.23.0
          require (
            github.com/cloudru-tech/secret-manager-sdk v1.1.1
            google.golang.org/grpc v1.70.0
          )
          EOF
          cat > main.go <<'EOF'
          package main
          import("context";"encoding/json";"fmt";"io";"net/http";"os";"strings";"time";sm "github.com/cloudru-tech/secret-manager-sdk";v2 "github.com/cloudru-tech/secret-manager-sdk/api/v2";"google.golang.org/grpc/metadata")
          func must(n string)string{v:=os.Getenv(n);if v==""{panic("missing "+n)};return v}
          func main(){cl,e:=sm.New(&sm.Config{Host:"secretmanager.api.cloud.ru:443"});if e!=nil{panic(e)};defer cl.Close();ctx,c:=context.WithTimeout(context.Background(),30*time.Second);defer c();ctx=metadata.AppendToOutgoingContext(ctx,"authorization","Bearer "+must("TOKEN"));sr,e:=cl.V2.SecretService.Search(ctx,&v2.SearchSecretRequest{ProjectId:must("PROJECT"),Depth:-1});if e!=nil{panic(e)};target:=must("SECRET");var paths []string;for _,s:=range sr.GetSecrets(){p:=s.GetPath();if p==target||strings.HasSuffix(p,"/"+target){paths=append(paths,p)}};if len(paths)!=1{panic("secret match count")};s,e:=cl.V2.SecretService.Access(ctx,&v2.AccessSecretRequest{ProjectId:must("PROJECT"),Path:paths[0]});if e!=nil{panic(e)};key:=s.GetPayload().GetValue();if len(key)==0{panic("empty secret")};req,_:=http.NewRequest(http.MethodGet,"https://api.yookassa.ru/v3/payments?limit=1",nil);req.SetBasicAuth(must("SHOP"),string(key));r,e:=(&http.Client{Timeout:20*time.Second}).Do(req);if e!=nil{panic(e)};defer r.Body.Close();raw,_:=io.ReadAll(io.LimitReader(r.Body,1<<20));var b map[string]any;_ = json.Unmarshal(raw,&b);items,_:=b["items"].([]any);testFalse:=0;testTrue:=0;for _,x:=range items{if m,ok:=x.(map[string]any);ok{if f,ok:=m["test"].(bool);ok{if f{testTrue++}else{testFalse++}}}};safe:=map[string]any{"httpCode":r.StatusCode,"authenticated":r.StatusCode==200,"secretMatchCount":len(paths),"itemCount":len(items),"testFalseItems":testFalse,"testTrueItems":testTrue,"paymentCreated":false};out,_:=json.Marshal(safe);os.WriteFile("/tmp/provider-state.json",out,0600);fmt.Println("UGMU_POST_LAUNCH_YOOKASSA_SAFE",string(out));if r.StatusCode!=200{os.Exit(4)}}
          EOF
          go mod tidy
          TOKEN="$TOKEN" PROJECT="$PROJECT" SECRET="$YOOKASSA_SECRET_NAME" SHOP="$(cat /tmp/shop)" go run .
          rm -rf /tmp/provider /tmp/shop

      - name: Verify live HTTP boundaries and landing
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -fsS --retry 5 --retry-all-errors --retry-delay 2 "$PRODUCTION_BASE_URL/health")"
          meta="$(curl -fsS --retry 5 --retry-all-errors --retry-delay 2 "$PRODUCTION_BASE_URL/api/v2/meta")"
          python3 - "$health" "$meta" <<'PY'
          import json,sys
          h=json.loads(sys.argv[1]);m=json.loads(sys.argv[2])
          assert h.get('status')=='ok'
          assert m.get('sales')=='open';assert m.get('trials')=='closed';assert m.get('paymentMode')=='live'
          json.dump({'health':h.get('status'),'sales':m.get('sales'),'trials':m.get('trials'),'paymentMode':m.get('paymentMode')},open('/tmp/http-state.json','w'))
          print('UGMU_POST_LAUNCH_META_SAFE',{'sales':'open','trials':'closed','paymentMode':'live'})
          PY
          page="$(curl -fsS --retry 8 --retry-all-errors --retry-delay 2 "${UGMU_SITE_URL}?post-launch=${GITHUB_RUN_ID}")"
          printf '%s' "$page" | grep -q 'name="robots" content="index,follow"'
          printf '%s' "$page" | grep -q 'Календарь доступен'
          ! printf '%s' "$page" | grep -q 'Предзапусковый режим'
          group="$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote('ugmu:medicine:1:stream-1:ОЛД 101',safe=''))
          PY
          )"
          code="$(curl -sS -o /tmp/public-schedule.json -w '%{http_code}' "$PRODUCTION_BASE_URL/api/v2/schedules/ugmu/medicine/1/$group/schedule?groupCode=%D0%9E%D0%9B%D0%94%20101&stream=1")"
          test "$code" = 404
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/public-schedule.json'))=={'error':'schedule_not_published'}
          print('UGMU_POST_LAUNCH_PUBLIC_BOUNDARY_SAFE scheduleHttp=404 publicSchedule=false publicIcs=false')
          PY

      - name: Verify all 12 production schedule objects read-only
        working-directory: api
        env:
          S3_ACCESS_KEY_ID: ${{ env.DIRECT_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ env.DIRECT_S3_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$S3_ACCESS_KEY_ID"; test -n "$S3_SECRET_ACCESS_KEY"
          echo "::add-mask::$S3_ACCESS_KEY_ID"; echo "::add-mask::$S3_SECRET_ACCESS_KEY"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {S3Client,GetObjectCommand} from '@aws-sdk/client-s3';
          const manifestText=fs.readFileSync('/tmp/approved-manifest.json','utf8');
          const manifest=JSON.parse(manifestText);
          const sha=b=>createHash('sha256').update(b).digest('hex');
          if(sha(Buffer.from(manifestText))!==process.env.APPROVED_MANIFEST_SHA256) throw new Error('manifest sha mismatch');
          const s3=new S3Client({endpoint:process.env.S3_ENDPOINT,region:process.env.S3_REGION,forcePathStyle:true,credentials:{accessKeyId:process.env.S3_ACCESS_KEY_ID,secretAccessKey:process.env.S3_SECRET_ACCESS_KEY}});
          async function get(key){const r=await s3.send(new GetObjectCommand({Bucket:process.env.S3_BUCKET,Key:key}));return Buffer.from(await r.Body.transformToByteArray())}
          let present=0,matched=0,snapshots=0,events=0;
          for(const g of manifest.groups){const b=await get(g.storageKey);present++;if(sha(b)===g.hashes.scheduleSha256)matched++;await get(g.rollback.snapshotKey);snapshots++;events+=g.eventCount}
          const state={groups:manifest.groups.length,events,schedulesPresent:present,hashesMatched:matched,rollbackSnapshotsPresent:snapshots,mutationPerformed:false};
          if(state.groups!==12||state.events!==4286||present!==12||matched!==12||snapshots!==12) throw new Error(JSON.stringify(state));
          fs.writeFileSync('/tmp/storage-state.json',JSON.stringify(state));
          console.log('UGMU_POST_LAUNCH_STORAGE_SAFE',state);
          NODE

      - name: Build evidence report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import json,os
          cloud=json.load(open('/tmp/cloud-state.json'))
          provider=json.load(open('/tmp/provider-state.json'))
          http=json.load(open('/tmp/http-state.json'))
          storage=json.load(open('/tmp/storage-state.json'))
          checks={
            'containerRunning':cloud['containerRunning'] is True,
            'imageMatched':cloud['image']==os.environ['EXPECTED_IMAGE'],
            'globalSalesClosed':cloud['globalSalesEnabled'] is False,
            'ugmuSalesOpen':cloud['ugmuSalesEnabled'] is True,
            'ugmuActive':cloud['ugmuActive'] is True,
            'ugmuSiteUrl':cloud['ugmuSiteUrl']==os.environ['UGMU_SITE_URL'],
            'trialsClosed':cloud['trialsEnabled'] is False,
            'livePaymentEnv':cloud['testModeEnv']=='false',
            'providerAuthenticated':provider['authenticated'] is True and provider['httpCode']==200,
            'metaOpenLive':http=={'health':'ok','sales':'open','trials':'closed','paymentMode':'live'},
            'storage12':storage['schedulesPresent']==12,
            'storageHashes12':storage['hashesMatched']==12,
            'rollbackSnapshots12':storage['rollbackSnapshotsPresent']==12,
            'events4286':storage['events']==4286,
          }
          passed=all(checks.values())
          report={
            'version':1,'university':'ugmu','boundary':'post-launch-production-verification',
            'status':'PASS' if passed else 'FAIL','passed':passed,'runId':int(os.environ['GITHUB_RUN_ID']),
            'sourceSha256':os.environ['SOURCE_SHA256'],'image':cloud['image'],
            'runtime':{'globalSalesEnabled':cloud['globalSalesEnabled'],'ugmuSalesEnabled':cloud['ugmuSalesEnabled'],'ugmuActive':cloud['ugmuActive'],'trialsEnabled':cloud['trialsEnabled'],'paymentMode':http['paymentMode']},
            'provider':provider,'storage':storage,
            'publicBoundary':{'landingLaunchMode':True,'publicSchedule':False,'publicIcs':False},
            'checks':checks,'productionMutationPerformed':False,'paymentCreated':False,
            'nextRequiredBoundary':'real-paid-purchase-canary' if passed else 'post-launch-recovery'
          }
          json.dump(report,open('evidence/report.json','w'),ensure_ascii=False,indent=2)
          print('UGMU_POST_LAUNCH_PRODUCTION_VERIFY',{'status':report['status'],'sales':'open','paymentMode':'live','schedules':'12/12','hashes':'12/12','paymentCreated':False,'productionMutationPerformed':False})
          assert passed,report
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-post-launch-production-verify-${{ github.run_id }}
          path: evidence/report.json
          retention-days: 90
