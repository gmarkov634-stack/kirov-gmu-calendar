name: UGMU Pages deployment diagnostic

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ugmu-pages-deployment-diagnostic.yml"

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect Pages workflow and deployment ordering read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import json, os, subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          workflows=[
            'ugmu-controlled-pages-main-v2.yml',
            'ugmu-controlled-pages-main.yml',
            'omgmu-pages.yml',
          ]
          out={'workflows':{},'deployments':[]}
          for wf in workflows:
            raw=subprocess.check_output(['gh','api',f'repos/{repo}/actions/workflows/{wf}/runs','-f','branch=main','-f','per_page=10','--method','GET'],text=True)
            rows=json.loads(raw).get('workflow_runs',[])
            out['workflows'][wf]=[{
              'id':r.get('id'),'event':r.get('event'),'headSha':r.get('head_sha'),'status':r.get('status'),'conclusion':r.get('conclusion'),
              'createdAt':r.get('created_at'),'updatedAt':r.get('updated_at'),'runNumber':r.get('run_number')
            } for r in rows]
          raw=subprocess.check_output(['gh','api',f'repos/{repo}/deployments','-f','environment=github-pages','-f','per_page=20','--method','GET'],text=True)
          for d in json.loads(raw):
            item={'id':d.get('id'),'sha':d.get('sha'),'createdAt':d.get('created_at'),'updatedAt':d.get('updated_at'),'ref':d.get('ref'),'task':d.get('task')}
            try:
              sraw=subprocess.check_output(['gh','api',f"repos/{repo}/deployments/{d['id']}/statuses",'-f','per_page=5','--method','GET'],text=True)
              sts=json.loads(sraw)
              item['statuses']=[{'state':s.get('state'),'createdAt':s.get('created_at'),'updatedAt':s.get('updated_at'),'environmentUrl':s.get('environment_url')} for s in sts[:5]]
            except subprocess.CalledProcessError as e:
              item['statusReadError']=e.returncode
            out['deployments'].append(item)
          open('evidence/pages-ordering.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Probe current Pages paths
        shell: bash
        run: |
          set -euo pipefail
          for p in / /omgmu/ /ugmu/; do
            code="$(curl -sS -o /tmp/page -w '%{http_code}' --max-time 20 "https://gmarkov634-stack.github.io/kirov-gmu-calendar${p}?diag=${GITHUB_RUN_ID}")"
            echo "PAGES_PATH_SAFE path=$p code=$code bytes=$(wc -c </tmp/page)"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ugmu-pages-deployment-diagnostic
          path: evidence/pages-ordering.json
          retention-days: 14
