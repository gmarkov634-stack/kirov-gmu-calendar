name: Temporary fetch dentistry source

on:
  push:
    branches:
      - feat/dentistry-191-194-ingestion

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current official 191-194 XLSX
        run: |
          python3 - <<'PY'
          import hashlib
          import html.parser
          import json
          import re
          import urllib.parse
          import urllib.request
          import zipfile
          from pathlib import Path

          PAGE = 'https://kirovgma.ru/raspisanie-stomatologicheskiy-fakultet'

          class Parser(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.href = None
                  self.text = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      self.href = dict(attrs).get('href')
                      self.text = []
              def handle_data(self, data):
                  if self.href is not None:
                      self.text.append(data)
              def handle_endtag(self, tag):
                  if tag == 'a' and self.href is not None:
                      self.links.append((self.href, ''.join(self.text).strip()))
                      self.href = None
                      self.text = []

          req = urllib.request.Request(PAGE, headers={'User-Agent':'medical-calendar-source-fetch/1.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              html = r.read().decode('utf-8', errors='replace')
          p = Parser(); p.feed(html)
          candidates = []
          for href, text in p.links:
              full = urllib.parse.urljoin(PAGE, href)
              if '191-194' in text and full.lower().endswith('.xlsx'):
                  candidates.append((full, text))
          if len(candidates) != 1:
              raise SystemExit(f'expected exactly one 191-194 xlsx link, found {candidates!r}')
          url, label = candidates[0]
          req = urllib.request.Request(url, headers={'User-Agent':'medical-calendar-source-fetch/1.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              data = r.read()
          out = Path('dentistry-191-194.xlsx')
          out.write_bytes(data)
          sha = hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(out) as z:
              worksheet_parts = sorted(n for n in z.namelist() if n.startswith('xl/worksheets/sheet') and n.endswith('.xml'))
              valid = '[Content_Types].xml' in z.namelist()
          meta = {
              'page': PAGE,
              'label': label,
              'url': url,
              'sha256': sha,
              'byteLength': len(data),
              'validXlsxContainer': valid,
              'worksheetParts': worksheet_parts,
          }
          Path('dentistry-191-194.source-live.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(meta, ensure_ascii=False))
          PY
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: dentistry-191-194-live-source
          path: |
            dentistry-191-194.xlsx
            dentistry-191-194.source-live.json
          if-no-files-found: error
          retention-days: 1
