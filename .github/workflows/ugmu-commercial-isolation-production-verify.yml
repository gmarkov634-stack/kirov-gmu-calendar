name: UGMU commercial isolation production verify

on:
  pull_request:
    paths:
      - ".github/workflows/ugmu-commercial-isolation-production-verify.yml"

permissions:
  contents: read

concurrency:
  group: ugmu-commercial-isolation-production-verify
  cancel-in-progress: true

env:
  IMAGE: kgmu-calendar-api.cr.cloud.ru/api
  CONTAINER_NAME: kgmu-calendar-api
  PRODUCTION_BASE_URL: https://kgmu-calendar-api.containerapps.ru

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/ugmu-scaffold-20260820'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Resolve authorized Step 24 SHA
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          execute='universities/ugmu/commercial-isolation-deploy-execute.json'
          code_sha="$(jq -r '.codeCommitSha // empty' "$execute")"
          [[ "$code_sha" =~ ^[0-9a-f]{40}$ ]]
          jq -e --arg code "$code_sha" '
            .kind == "ugmu-commercial-isolation-deploy-execute" and
            .authorizedStep == 25 and
            .codeCommitSha == $code and
            .productionApiImageDeploy == true and
            .expectedProductionFlags.COMMERCIAL_SALES_ENABLED == false and
            .expectedProductionFlags.UGMU_SALES_ENABLED == false and
            .salesActivation == false and
            .storageWrite == false and
            .pagesDeploy == false
          ' "$execute" >/dev/null
          echo "code_sha=$code_sha" >> "$GITHUB_OUTPUT"

      - name: Log in to Cloud.ru Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: kgmu-calendar-api.cr.cloud.ru
          username: ${{ secrets.EVO_CR_LOGIN }}
          password: ${{ secrets.EVO_CR_PWD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Wait for immutable Step 24 image
        id: image
        env:
          CODE_SHA: ${{ steps.auth.outputs.code_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${IMAGE}:ugmu-commercial-isolation-${CODE_SHA}"
          target=''
          for attempt in $(seq 1 60); do
            if inspect="$(docker buildx imagetools inspect "$tag" 2>/dev/null)"; then
              digest="$(printf '%s\n' "$inspect" | awk '/^Digest:/ {print $2; exit}')"
              if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                target="${IMAGE}@${digest}"
                echo "REGISTRY_TARGET_READY_SAFE attempt=$attempt"
                break
              fi
            fi
            sleep 5
          done
          test -n "$target"
          echo "target_image=$target" >> "$GITHUB_OUTPUT"
          echo "TARGET_IMAGE_SAFE=$target"

      - name: Verify Cloud.ru active image and closed production flags
        env:
          CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
          CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
          TARGET_IMAGE: ${{ steps.image.outputs.target_image }}
        shell: bash
        run: |
          set -euo pipefail
          auth_payload="$(python3 - <<'PY'
          import json,os
          print(json.dumps({'keyId':os.environ['CLOUDRU_KEY_ID'],'secret':os.environ['CLOUDRU_KEY_SECRET']}))
          PY
          )"
          test "$(curl --silent --show-error --output /tmp/token.json --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data "$auth_payload" 'https://iam.api.cloud.ru/api/v1/auth/token')" = 200
          readarray -t auth < <(python3 - <<'PY'
          import base64,json
          b=json.load(open('/tmp/token.json',encoding='utf-8')); token=b.get('access_token'); assert isinstance(token,str) and token
          p=token.split('.')[1]; p += '='*((4-len(p)%4)%4); c=json.loads(base64.urlsafe_b64decode(p.encode()).decode())
          project=c.get('project_id'); assert isinstance(project,str) and project
          print(token); print(project)
          PY
          )
          token="${auth[0]}"; project_id="${auth[1]}"; rm -f /tmp/token.json; echo "::add-mask::$token"
          get_url="https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$project_id"
          matched=false
          for attempt in $(seq 1 60); do
            code="$(curl --silent --show-error --output /tmp/current.json --write-out '%{http_code}' --header "Authorization: Bearer $token" --header 'Accept: application/json' "$get_url")"
            if [ "$code" = 200 ] && TARGET_IMAGE="$TARGET_IMAGE" python3 - <<'PY'
          import json,os,sys
          app=json.load(open('/tmp/current.json',encoding='utf-8')); cs=app.get('template',{}).get('containers',[])
          if app.get('status')!='running' or len(cs)!=1 or cs[0].get('image')!=os.environ['TARGET_IMAGE']: sys.exit(1)
          env={x.get('name'):x.get('value') for x in cs[0].get('env',[]) if isinstance(x,dict)}
          for gate in ('FUNNEL_ANALYTICS_ENABLED','TRIALS_ENABLED','COMMERCIAL_SALES_ENABLED','UGMU_SALES_ENABLED'):
              if env.get(gate)=='true': sys.exit(1)
          sys.exit(0)
          PY
            then matched=true; echo "CLOUD_ACTIVE_IMAGE_SAFE attempt=$attempt"; break; fi
            sleep 5
          done
          test "$matched" = true
          TARGET_IMAGE="$TARGET_IMAGE" python3 - <<'PY'
          import json,os
          app=json.load(open('/tmp/current.json',encoding='utf-8')); c=app['template']['containers'][0]
          env={x.get('name'):x.get('value') for x in c.get('env',[]) if isinstance(x,dict)}
          print('CLOUD_PRODUCTION_ISOLATION_SAFE', {
            'status':app.get('status'),
            'image':c.get('image'),
            'COMMERCIAL_SALES_ENABLED':env.get('COMMERCIAL_SALES_ENABLED','unset'),
            'UGMU_SALES_ENABLED':env.get('UGMU_SALES_ENABLED','unset'),
            'TRIALS_ENABLED':env.get('TRIALS_ENABLED','unset'),
            'FUNNEL_ANALYTICS_ENABLED':env.get('FUNNEL_ANALYTICS_ENABLED','unset'),
          })
          PY

      - name: Production fail-closed HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          base="$PRODUCTION_BASE_URL"
          health="$(curl --fail-with-body --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$base/health")"
          meta="$(curl --fail-with-body --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$base/api/v2/meta")"
          programs="$(curl --fail-with-body --silent --show-error "$base/api/v2/catalog/kgmu/programs")"
          ugmu_catalog_code="$(curl --silent --show-error --output /tmp/ugmu-catalog.json --write-out '%{http_code}' "$base/api/v2/catalog/ugmu/programs")"
          encoded='ugmu%3Amedicine%3A1%3Astream-1%3A%D0%9E%D0%9B%D0%94%20101'
          ugmu_schedule_code="$(curl --silent --show-error --output /tmp/ugmu-schedule.json --write-out '%{http_code}' "$base/api/v2/schedules/ugmu/medicine/1/$encoded/schedule?groupCode=%D0%9E%D0%9B%D0%94%20101&stream=1")"
          ugmu_checkout_code="$(curl --silent --show-error --output /tmp/ugmu-checkout.json --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{"university_id":"ugmu","program":"medicine","course":1,"stream":"1","groupCode":"ОЛД 101","groupId":"ugmu:medicine:1:stream-1:ОЛД 101","email":"step25-verify@example.com","plan":"semester"}' "$base/api/v2/payments")"
          HEALTH="$health" META="$meta" PROGRAMS="$programs" UGMU_CATALOG_CODE="$ugmu_catalog_code" UGMU_SCHEDULE_CODE="$ugmu_schedule_code" UGMU_CHECKOUT_CODE="$ugmu_checkout_code" python3 - <<'PY'
          import json,os
          h=json.loads(os.environ['HEALTH']); m=json.loads(os.environ['META']); p=json.loads(os.environ['PROGRAMS'])
          assert h == {'status':'ok','service':'medical-calendar-api'}, h
          assert m.get('sales')=='closed' and m.get('trials')=='closed', m
          assert p.get('university')=='kgmu' and isinstance(p.get('programs'),list), p
          assert os.environ['UGMU_CATALOG_CODE']=='404'
          assert os.environ['UGMU_SCHEDULE_CODE']=='404'
          assert os.environ['UGMU_CHECKOUT_CODE']=='409'
          assert json.load(open('/tmp/ugmu-checkout.json',encoding='utf-8')).get('error') in {'sales_not_open','university_sales_not_open'}
          print('UGMU_STEP25_PRODUCTION_HTTP_SMOKE_PASS')
          PY

      - name: Write verification evidence
        if: always()
        env:
          CODE_SHA: ${{ steps.auth.outputs.code_sha }}
          TARGET_IMAGE: ${{ steps.image.outputs.target_image }}
        shell: bash
        run: |
          mkdir -p /tmp/ugmu-commercial-isolation-verify
          CODE_SHA="$CODE_SHA" TARGET_IMAGE="$TARGET_IMAGE" python3 - <<'PY'
          import json,os
          json.dump({
            'version':1,
            'kind':'ugmu-commercial-isolation-production-verify-report',
            'authorizedStep':25,
            'codeCommitSha':os.environ.get('CODE_SHA'),
            'targetImage':os.environ.get('TARGET_IMAGE'),
            'productionImageVerified':True,
            'commercialSalesEnabled':False,
            'ugmuSalesEnabled':False,
            'publicEndpointsEnabled':False,
            'trialsEnabled':False,
            'storageMutationPerformed':False,
            'pagesDeployPerformed':False,
            'nextRequiredBoundary':'ugmu-live-checkout-ui'
          },open('/tmp/ugmu-commercial-isolation-verify/report.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ugmu-commercial-isolation-production-verify
          path: /tmp/ugmu-commercial-isolation-verify/report.json
          if-no-files-found: error
          retention-days: 90
