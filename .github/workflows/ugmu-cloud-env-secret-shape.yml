name: UGMU Cloud secret env shape

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ugmu-cloud-env-secret-shape.yml"

permissions:
  contents: read

env:
  CONTAINER_NAME: kgmu-calendar-api

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go for official Cloud.ru Secret Manager SDK
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Resolve secret transiently and verify YooKassa with GET only
        env:
          CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
          CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          auth_payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({'keyId': os.environ['CLOUDRU_KEY_ID'], 'secret': os.environ['CLOUDRU_KEY_SECRET']}))
          PY
          )"
          test "$(curl --silent --show-error --output /tmp/cloud-token.json --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data "$auth_payload" \
            'https://iam.api.cloud.ru/api/v1/auth/token')" = "200"

          readarray -t auth < <(python3 - <<'PY'
          import base64, json
          body=json.load(open('/tmp/cloud-token.json', encoding='utf-8'))
          token=body['access_token']
          parts=token.split('.')
          payload=parts[1] + '='*((4-len(parts[1])%4)%4)
          claims=json.loads(base64.urlsafe_b64decode(payload.encode()).decode())
          print(token)
          print(claims['project_id'])
          PY
          )
          token="${auth[0]}"
          project_id="${auth[1]}"
          rm -f /tmp/cloud-token.json
          echo "::add-mask::$token"

          get_url="https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$project_id"
          test "$(curl --silent --show-error --output /tmp/container.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $token" --header 'Accept: application/json' "$get_url")" = "200"

          python3 - <<'PY'
          import json, re
          app=json.load(open('/tmp/container.json', encoding='utf-8'))
          assert app.get('status') == 'running', app.get('status')
          containers=app.get('template',{}).get('containers',[])
          assert len(containers) == 1
          items=containers[0].get('env',[])
          env={item.get('name'):item for item in items if isinstance(item,dict) and item.get('name')}
          shop=env.get('YOOKASSA_SHOP_ID',{}).get('value')
          secret_item=env.get('YOOKASSA_SECRET_KEY',{})
          secret_ref=secret_item.get('value')
          assert isinstance(shop,str) and shop
          assert isinstance(secret_ref,str) and secret_ref
          assert secret_item.get('type') == 'secret', secret_item.get('type')
          assert env.get('YOOKASSA_TEST_MODE',{}).get('value') == 'false'
          assert env.get('COMMERCIAL_SALES_ENABLED',{}).get('value') == 'false'
          assert env.get('UGMU_SALES_ENABLED',{}).get('value') == 'false'
          trials=env.get('TRIALS_ENABLED',{}).get('value')
          assert trials in (None, '', 'false')
          print('CLOUD_SECRET_RUNTIME_SAFE', {
              'containerStatus': app.get('status'),
              'shopIdPresent': True,
              'secretType': secret_item.get('type'),
              'secretReferencePresent': True,
              'testModeEnv': 'false',
              'globalSalesEnabled': False,
              'ugmuSalesEnabled': False,
              'trialsEnabled': False,
          })
          open('/tmp/shop','w',encoding='utf-8').write(shop)
          open('/tmp/secret-ref','w',encoding='utf-8').write(secret_ref)
          PY
          rm -f /tmp/container.json

          shop="$(cat /tmp/shop)"
          secret_ref="$(cat /tmp/secret-ref)"
          echo "::add-mask::$shop"
          echo "::add-mask::$secret_ref"

          mkdir -p /tmp/ugmu-yookassa-runtime-verify
          cd /tmp/ugmu-yookassa-runtime-verify
          cat > go.mod <<'EOF'
          module ugmu-yookassa-runtime-verify

          go 1.23.0

          require (
            github.com/cloudru-tech/secret-manager-sdk v1.1.1
            google.golang.org/grpc v1.70.0
          )
          EOF
          cat > main.go <<'EOF'
          package main

          import (
            "context"
            "encoding/json"
            "fmt"
            "io"
            "net/http"
            "os"
            "sort"
            "time"

            sm "github.com/cloudru-tech/secret-manager-sdk"
            smv2 "github.com/cloudru-tech/secret-manager-sdk/api/v2"
            "google.golang.org/grpc/metadata"
          )

          func mustEnv(name string) string {
            value := os.Getenv(name)
            if value == "" { panic("missing " + name) }
            return value
          }

          func main() {
            token := mustEnv("CLOUD_TOKEN")
            projectID := mustEnv("CLOUD_PROJECT_ID")
            secretPath := mustEnv("CLOUD_SECRET_REF")
            shopID := mustEnv("YOOKASSA_SHOP_ID")

            client, err := sm.New(&sm.Config{Host: "secretmanager.api.cloud.ru:443"})
            if err != nil { panic(err) }
            defer client.Close()

            ctx, cancel := context.WithTimeout(context.Background(), 20*time.Second)
            defer cancel()
            ctx = metadata.AppendToOutgoingContext(ctx, "authorization", "Bearer "+token)
            secret, err := client.V2.SecretService.Access(ctx, &smv2.AccessSecretRequest{
              ProjectId: projectID,
              Path: secretPath,
            })
            if err != nil { panic(fmt.Errorf("resolve Secret Management reference: %w", err)) }
            key := secret.GetPayload().GetValue()
            if len(key) == 0 { panic("resolved secret is empty") }

            req, err := http.NewRequest(http.MethodGet, "https://api.yookassa.ru/v3/payments?limit=1", nil)
            if err != nil { panic(err) }
            req.SetBasicAuth(shopID, string(key))
            httpClient := &http.Client{Timeout: 20*time.Second}
            resp, err := httpClient.Do(req)
            if err != nil { panic(err) }
            defer resp.Body.Close()
            raw, err := io.ReadAll(io.LimitReader(resp.Body, 1<<20))
            if err != nil { panic(err) }

            var body map[string]any
            _ = json.Unmarshal(raw, &body)
            safe := map[string]any{"httpCode": resp.StatusCode, "secretResolved": true, "paymentCreated": false}
            if resp.StatusCode == 200 {
              safe["type"] = body["type"]
              items, _ := body["items"].([]any)
              safe["itemCount"] = len(items)
              flags := map[bool]bool{}
              for _, rawItem := range items {
                item, _ := rawItem.(map[string]any)
                if test, ok := item["test"].(bool); ok { flags[test] = true }
              }
              vals := make([]bool, 0, len(flags))
              for flag := range flags { vals = append(vals, flag) }
              sort.Slice(vals, func(i, j int) bool { return !vals[i] && vals[j] })
              safe["paymentTestFlags"] = vals
            } else {
              safe["type"] = body["type"]
              safe["code"] = body["code"]
            }
            encoded, _ := json.Marshal(safe)
            fmt.Println("YOOKASSA_RUNTIME_SECRET_AUTH_SAFE", string(encoded))
            if resp.StatusCode != 200 { os.Exit(2) }
          }
          EOF

          CLOUD_TOKEN="$token" \
          CLOUD_PROJECT_ID="$project_id" \
          CLOUD_SECRET_REF="$secret_ref" \
          YOOKASSA_SHOP_ID="$shop" \
            go run .

          cd /
          rm -rf /tmp/ugmu-yookassa-runtime-verify /tmp/shop /tmp/secret-ref
