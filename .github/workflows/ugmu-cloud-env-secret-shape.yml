name: UGMU Cloud secret env shape

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ugmu-cloud-env-secret-shape.yml"

permissions:
  contents: read

env:
  CONTAINER_NAME: kgmu-calendar-api

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Cloud.ru env metadata without exposing values
        env:
          CLOUDRU_KEY_ID: ${{ secrets.EVO_CR_LOGIN }}
          CLOUDRU_KEY_SECRET: ${{ secrets.EVO_CR_PWD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          auth_payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({'keyId': os.environ['CLOUDRU_KEY_ID'], 'secret': os.environ['CLOUDRU_KEY_SECRET']}))
          PY
          )"
          test "$(curl --silent --show-error --output /tmp/cloud-token.json --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data "$auth_payload" \
            'https://iam.api.cloud.ru/api/v1/auth/token')" = "200"

          readarray -t auth < <(python3 - <<'PY'
          import base64, json
          body=json.load(open('/tmp/cloud-token.json', encoding='utf-8'))
          token=body['access_token']
          parts=token.split('.')
          payload=parts[1] + '='*((4-len(parts[1])%4)%4)
          claims=json.loads(base64.urlsafe_b64decode(payload.encode()).decode())
          print(token)
          print(claims['project_id'])
          PY
          )
          token="${auth[0]}"
          project_id="${auth[1]}"
          rm -f /tmp/cloud-token.json
          echo "::add-mask::$token"

          get_url="https://containers.api.cloud.ru/v1/containers/${CONTAINER_NAME}?projectId=$project_id"
          test "$(curl --silent --show-error --output /tmp/container.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $token" --header 'Accept: application/json' "$get_url")" = "200"

          python3 - <<'PY'
          import json, re
          app=json.load(open('/tmp/container.json', encoding='utf-8'))
          containers=app.get('template',{}).get('containers',[])
          assert len(containers) == 1
          items=containers[0].get('env',[])
          wanted={'YOOKASSA_SHOP_ID','YOOKASSA_SECRET_KEY','YOOKASSA_TEST_MODE','COMMERCIAL_SALES_ENABLED','UGMU_SALES_ENABLED','TRIALS_ENABLED'}
          for item in items:
              if not isinstance(item,dict) or item.get('name') not in wanted:
                  continue
              name=item.get('name')
              value=item.get('value')
              meta={k:type(v).__name__ for k,v in item.items() if k not in {'name','value'}}
              if name == 'YOOKASSA_SECRET_KEY':
                  type_value=item.get('type') if isinstance(item.get('type'),str) else None
                  if value is None or value == '':
                      kind='no-direct-value'
                      shape='empty'
                  elif not isinstance(value,str):
                      kind='non-string-value'
                      shape=type(value).__name__
                  else:
                      low=value.lower()
                      if value.strip('*') == '' or any(marker in low for marker in ('secret://','secretmanager','secret-ref','secretref','${secret','vault://')):
                          kind='masked-or-reference'
                      else:
                          kind='opaque-string-returned-by-api'
                      if re.fullmatch(r'[0-9a-fA-F-]{20,}', value):
                          shape='id-like'
                      elif '/' in value and len(value) < 300:
                          shape='path-like'
                      elif len(value) < 16:
                          shape='short-opaque'
                      else:
                          shape='long-opaque'
                  print('SECRET_ENV_SAFE', {
                      'name':name,
                      'keys':sorted(item.keys()),
                      'metadataTypes':meta,
                      'typeValue':type_value,
                      'valueKind':kind,
                      'valueShape':shape,
                  })
              else:
                  safe_value=value if name in {'YOOKASSA_TEST_MODE','COMMERCIAL_SALES_ENABLED','UGMU_SALES_ENABLED','TRIALS_ENABLED'} else ('present' if value else 'absent')
                  print('ENV_SAFE', {'name':name,'keys':sorted(item.keys()),'metadataTypes':meta,'safeValue':safe_value})
          secretish={k:type(v).__name__ for k,v in app.items() if 'secret' in str(k).lower()}
          print('TOP_LEVEL_SECRET_FIELDS_SAFE', secretish)
          PY
          rm -f /tmp/container.json
