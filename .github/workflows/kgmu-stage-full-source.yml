name: KGMU stage full reviewed source

on:
  push:
    paths:
      - ".github/workflows/kgmu-stage-full-source.yml"

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download, verify and stage official XLSX
        env:
          KGMU_ADMIN_TOKEN: ${{ secrets.KGMU_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          source='reviewed/kgmu/2025-26/2/medicine/4/146876a71f1ad8503593aeb82fcc72fef76022896b85d7f7dc61ca7ec97c0dae.json'
          base='https://kgmu-calendar-api.containerapps.ru'
          test -n "$KGMU_ADMIN_TOKEN"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync('reviewed/kgmu/2025-26/2/medicine/4/146876a71f1ad8503593aeb82fcc72fef76022896b85d7f7dc61ca7ec97c0dae.json','utf8'));
          fs.writeFileSync('/tmp/source-meta.json',JSON.stringify({
            filename:data.source.filename,
            sha256:data.source.sha256,
            url:data.source.url,
            program:data.program,
            course:data.course,
            academicYear:data.academicYear,
            semester:data.semester,
            groupRange:data.source.groupRange,
          }));
          NODE

          url="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/source-meta.json','utf8')).url")"
          expected="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/source-meta.json','utf8')).sha256")"
          curl --fail-with-body --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 "$url" -o /tmp/source.xlsx
          actual="$(sha256sum /tmp/source.xlsx | cut -d' ' -f1)"
          test "$actual" = "$expected"
          echo "SOURCE_SHA_OK=$actual"

          ingest_url="$(python3 - "$base" <<'PY'
          import json, sys, urllib.parse
          base=sys.argv[1]
          with open('/tmp/source-meta.json',encoding='utf-8') as f: m=json.load(f)
          params={
            'filename':m['filename'], 'program':m['program'], 'course':m['course'],
            'academicYear':m['academicYear'], 'semester':m['semester'],
            'groupRange':m['groupRange'], 'sourceUrl':m['url'],
          }
          print(base+'/api/v1/admin/kgmu/ingest?'+urllib.parse.urlencode(params))
          PY
          )"

          status="$(curl --silent --show-error --output /tmp/response.json --write-out '%{http_code}' \
            -X POST \
            -H "X-Admin-Token: $KGMU_ADMIN_TOKEN" \
            -H 'Content-Type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' \
            --data-binary @/tmp/source.xlsx \
            "$ingest_url")"
          echo "INGEST_HTTP_STATUS=$status"
          cat /tmp/response.json | python3 -m json.tool
          test "$status" = '202'

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('/tmp/response.json','utf8'));
          const expected='146876a71f1ad8503593aeb82fcc72fef76022896b85d7f7dc61ca7ec97c0dae';
          if (!r.reviewId || r.status !== 'REVIEW_REQUIRED' || r.reason !== 'MANUAL_NORMALIZATION_REQUIRED') throw new Error(`unexpected review: ${JSON.stringify(r)}`);
          if (r.sourceSha256 !== expected) throw new Error(`SHA mismatch: ${r.sourceSha256}`);
          if (r.metadata?.groupRange !== '401-420') throw new Error(`group range mismatch: ${r.metadata?.groupRange}`);
          if (!r.sourceKey) throw new Error('staged review has no sourceKey');
          console.log('FULL_SOURCE_STAGED');
          console.log(JSON.stringify({reviewId:r.reviewId,status:r.status,sourceSha256:r.sourceSha256,sourceKey:r.sourceKey,groupRange:r.metadata.groupRange},null,2));
          NODE
