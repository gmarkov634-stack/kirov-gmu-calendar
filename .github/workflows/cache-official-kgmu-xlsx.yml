name: Cache official KGMU XLSX

on:
  push:
    paths:
      - '.github/workflows/cache-official-kgmu-xlsx.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download official 4th-year medicine XLSX
        shell: bash
        run: |
          set -euo pipefail
          url='https://kirovgma.ru/sites/default/files/files/2026/02/02/1078/4_kurs_lechebnyy_fakultet-02-02-2026-14.xlsx'
          base='source-cache/kgmu/2025-26/2/medicine/4'
          mkdir -p "$base/parts"
          rm -f "$base"/parts/part*.txt
          curl --fail-with-body --location --silent --show-error \
            --user-agent 'kgmu-calendar-source-cache/1.0' \
            "$url" \
            --output /tmp/source.xlsx
          sha="$(sha256sum /tmp/source.xlsx | awk '{print $1}')"
          file="$base/${sha}.xlsx"
          cp /tmp/source.xlsx "$file"
          printf '%s\n' "$sha" > "$base/current.sha256"
          printf '%s\n' "$url" > "$base/current.url"
          base64 -w 0 /tmp/source.xlsx > /tmp/source.b64
          split -b 3500 -d -a 3 --additional-suffix=.txt /tmp/source.b64 "$base/parts/part"
      - name: Dump workbook cells and reviewed block transcription
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { readKgmuXlsxStructure } from './api/src/adapters/kgmu/xlsx-reader.mjs';
          const base = 'source-cache/kgmu/2025-26/2/medicine/4';
          const source = fs.readFileSync('/tmp/source.xlsx');
          const structure = await readKgmuXlsxStructure(source);
          const lines = [];
          for (const sheet of structure.sheets) {
            lines.push(['SHEET', sheet.name].join('\t'));
            for (const cell of sheet.cells) lines.push(['CELL', cell.ref, cell.row, cell.col, JSON.stringify(cell.value)].join('\t'));
            for (const merge of sheet.merges) lines.push(['MERGE', merge.ref, merge.startRow, merge.endRow, merge.startCol, merge.endCol].join('\t'));
            for (const row of sheet.hiddenRows || []) lines.push(['HIDDEN_ROW', row].join('\t'));
            for (const cell of sheet.styledCells || []) lines.push(['STYLE', cell.ref, cell.styleId, cell.fillId, JSON.stringify(cell.value)].join('\t'));
          }
          fs.writeFileSync(`${base}/structure.tsv`, lines.join('\n') + '\n');

          const sheet = structure.sheets[0];
          const cellsByRef = new Map(sheet.cells.map((cell) => [cell.ref, cell]));
          const mergeByStart = new Map(sheet.merges.map((merge) => [merge.startRef, merge]));
          const monthStarts = [
            { col: 3, month: 2 }, { col: 26, month: 3 }, { col: 51, month: 4 },
            { col: 77, month: 5 }, { col: 101, month: 6 },
          ];
          function monthForCol(col) {
            let month = null;
            for (const item of monthStarts) if (col >= item.col) month = item.month;
            return month;
          }
          function colLetters(n) {
            let s = '';
            while (n > 0) { n -= 1; s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26); }
            return s;
          }
          const dateLines = [];
          for (let col = 3; col <= 106; col += 1) {
            const ref = `${colLetters(col)}11`;
            const day = cellsByRef.get(ref)?.value;
            if (!Number.isInteger(day)) continue;
            const month = monthForCol(col);
            const iso = `2026-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            dateLines.push([col, colLetters(col), iso].join('\t'));
          }
          fs.writeFileSync(`${base}/date-map.tsv`, dateLines.join('\n') + '\n');

          const blockLines = ['group\trow\tstartCol\tendCol\tstartRef\tsourceRange\trawTitle'];
          for (let row = 13; row <= 32; row += 1) {
            const group = cellsByRef.get(`B${row}`)?.value;
            if (!Number.isInteger(group)) throw new Error(`Missing group at row ${row}`);
            const starts = sheet.cells.filter((cell) => cell.row === row && cell.col >= 3 && cell.col <= 106);
            for (const cell of starts) {
              const merge = mergeByStart.get(cell.ref);
              const endCol = merge?.endCol || cell.col;
              const sourceRange = merge?.ref || cell.ref;
              blockLines.push([group, row, cell.col, endCol, cell.ref, sourceRange, JSON.stringify(String(cell.value))].join('\t'));
            }
          }
          fs.writeFileSync(`${base}/blocks.tsv`, blockLines.join('\n') + '\n');
          NODE
      - name: Preserve reviewed transcription data
        shell: bash
        run: |
          set -euo pipefail
          dest='reviewed/kgmu/recipes/medicine4_2025_26_data'
          mkdir -p "$dest"
          cp source-cache/kgmu/2025-26/2/medicine/4/blocks.tsv "$dest/blocks.txt"
          cp source-cache/kgmu/2025-26/2/medicine/4/date-map.tsv "$dest/date-map.txt"
      - name: Commit source cache and reviewed transcription
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-cache/kgmu/2025-26/2/medicine/4 reviewed/kgmu/recipes/medicine4_2025_26_data
          if git diff --cached --quiet; then
            echo 'Source and transcription already cached.'
            exit 0
          fi
          git commit -m 'Preserve KGMU medicine course 4 reviewed transcription'
          git push origin HEAD:main
