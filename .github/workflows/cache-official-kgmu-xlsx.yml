name: Cache official KGMU XLSX

on:
  push:
    paths:
      - '.github/workflows/cache-official-kgmu-xlsx.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download official 4th-year medicine XLSX
        shell: bash
        run: |
          set -euo pipefail
          url='https://kirovgma.ru/sites/default/files/files/2026/02/02/1078/4_kurs_lechebnyy_fakultet-02-02-2026-14.xlsx'
          base='source-cache/kgmu/2025-26/2/medicine/4'
          mkdir -p "$base/parts"
          rm -f "$base"/parts/part*.txt
          curl --fail-with-body --location --silent --show-error \
            --user-agent 'kgmu-calendar-source-cache/1.0' \
            "$url" \
            --output /tmp/source.xlsx
          sha="$(sha256sum /tmp/source.xlsx | awk '{print $1}')"
          file="$base/${sha}.xlsx"
          cp /tmp/source.xlsx "$file"
          printf '%s\n' "$sha" > "$base/current.sha256"
          printf '%s\n' "$url" > "$base/current.url"
          base64 -w 0 /tmp/source.xlsx > /tmp/source.b64
          split -b 3500 -d -a 3 --additional-suffix=.txt /tmp/source.b64 "$base/parts/part"
      - name: Dump workbook cells and merges
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { readKgmuXlsxStructure } from './api/src/adapters/kgmu/xlsx-reader.mjs';
          const base = 'source-cache/kgmu/2025-26/2/medicine/4';
          const source = fs.readFileSync('/tmp/source.xlsx');
          const structure = await readKgmuXlsxStructure(source);
          const lines = [];
          for (const sheet of structure.sheets) {
            lines.push(['SHEET', sheet.name].join('\t'));
            for (const cell of sheet.cells) {
              lines.push(['CELL', cell.ref, cell.row, cell.col, JSON.stringify(cell.value)].join('\t'));
            }
            for (const merge of sheet.merges) {
              lines.push(['MERGE', merge.ref, merge.startRow, merge.endRow, merge.startCol, merge.endCol].join('\t'));
            }
            for (const row of sheet.hiddenRows || []) lines.push(['HIDDEN_ROW', row].join('\t'));
            for (const cell of sheet.styledCells || []) {
              lines.push(['STYLE', cell.ref, cell.styleId, cell.fillId, JSON.stringify(cell.value)].join('\t'));
            }
          }
          fs.writeFileSync(`${base}/structure.tsv`, lines.join('\n') + '\n');
          NODE
      - name: Commit source cache
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-cache/kgmu/2025-26/2/medicine/4
          if git diff --cached --quiet; then
            echo 'Source already cached.'
            exit 0
          fi
          git commit -m 'Dump official KGMU medicine course 4 XLSX structure'
          git push origin HEAD:main
