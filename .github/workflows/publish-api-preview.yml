name: Publish API preview image

on:
  push:
    branches:
      - feature/multi-university-subscriptions
    paths:
      - "api/**"
      - ".github/workflows/publish-api-preview.yml"
  workflow_dispatch:

env:
  IMAGE: kgmu-calendar-api.cr.cloud.ru/api

jobs:
  test-and-publish-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        working-directory: api
        run: npm ci
      - name: Test
        working-directory: api
        run: npm test
      - name: Log in to Cloud.ru Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: kgmu-calendar-api.cr.cloud.ru
          username: ${{ secrets.EVO_CR_LOGIN }}
          password: ${{ secrets.EVO_CR_PWD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push preview linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:preview-${{ github.sha }}
